<style>
/* Design : sobre, vert profond, grandes zones tactiles. Sur téléphone : navigation en bas, tableaux en cartes, fenêtres en feuille basse. */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --line:#e1e7e4; --ink:#14201b; --muted:#5f6e67;
  --accent:#0b6e5b; --accent-ink:#ffffff; --accent-soft:#dff1ec; --ochre:#b06a00;
  --ok:#1b7a47; --ok-soft:#e1f3e8; --warn:#92580a; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#fbe7e4;
  --r:14px; --shadow:0 1px 2px rgba(20,32,27,.05),0 4px 14px rgba(20,32,27,.04);
  --f-display:"Bricolage Grotesque", system-ui, sans-serif; --f-body:"Instrument Sans", system-ui, sans-serif; --f-mono:"Instrument Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1512; --surface:#151f1b; --line:#25332d; --ink:#e7efeb; --muted:#9bada5;
  --accent:#4fd1b0; --accent-ink:#06231c; --accent-soft:#143229; --ochre:#e3a94f;
  --ok:#5cc58c; --ok-soft:#163324; --warn:#e7b04f; --warn-soft:#3a2c12; --bad:#f0857c; --bad-soft:#3d1a18; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1512; --surface:#151f1b; --line:#25332d; --ink:#e7efeb; --muted:#9bada5;
  --accent:#4fd1b0; --accent-ink:#06231c; --accent-soft:#143229; --ochre:#e3a94f;
  --ok:#5cc58c; --ok-soft:#163324; --warn:#e7b04f; --warn-soft:#3a2c12; --bad:#f0857c; --bad-soft:#3d1a18; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}

.brand{display:flex;align-items:center;gap:10px;font:700 18px var(--f-display);letter-spacing:-.01em}
.brand img.blogo{width:34px;height:34px;border-radius:10px;object-fit:contain;background:#fff;flex:none}
.brand i{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 17px var(--f-display);font-style:normal}
.brand small{display:block;font:400 12px var(--f-body);color:var(--muted);letter-spacing:0}
.burger{display:none;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);cursor:pointer;flex:0 0 auto;padding:0}
.scrim,nav.tabs .drawer-top{display:none}
.menu{margin-left:auto;position:relative}
.menu summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:5px 6px 5px 5px;border-radius:99px;border:1px solid var(--line)}
.menu summary::-webkit-details-marker{display:none}
.menu .av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 13px var(--f-body)}
.menu .nm{font-size:13px;font-weight:500;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px}
.menu .pop{position:absolute;right:0;top:calc(100% + 8px);width:min(280px,86vw);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 32px rgba(10,20,15,.18);padding:12px;display:flex;flex-direction:column;gap:8px;z-index:8}
.menu .pop p{margin:0 0 4px;font-size:13px;color:var(--muted)}

.yr{display:none}
.hdrfac{margin-left:auto;margin-right:10px}.hdrfac select{padding:6px 28px 6px 10px;font:600 13px var(--f-body);border-radius:10px;min-height:0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  nav.tabs .drawer-top{display:block;padding:2px 8px 16px;margin-bottom:10px;border-bottom:1px solid var(--line)}
  nav.tabs .drawer-top .brand{font-size:17px}

  nav.tabs button{width:100%;text-align:left;border-radius:12px;padding:11px 12px;font-size:14.5px;white-space:normal;position:relative}
  nav.tabs button[aria-selected="true"]::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}

}

.ld{padding:8px 0;border-bottom:1px solid var(--line,#e3e8e6)}.ld:last-child{border:0}.ld-t{display:flex;justify-content:space-between;gap:8px;font-size:14px}
@media(max-width:1399px){.asg-layout{grid-template-columns:1fr}.asg-load{position:static;max-height:none}}
#aTable select{min-width:150px;max-width:100%}#aTable td{vertical-align:top}.lnk{border:0;background:none;color:var(--accent);font:600 13px var(--f-body);padding:4px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.panel.tbl:has(#aTable){overflow-x:auto}
.ttseg{display:inline-grid;max-width:100%;overflow-x:auto}
.tt-ev.cancel{opacity:.6;background:repeating-linear-gradient(135deg,var(--surface) 0 6px,color-mix(in srgb,var(--bad) 8%,var(--surface)) 6px 12px)!important;border-left-color:var(--bad)!important}.tt-ev.cancel b,.tt-ev.cancel .tt-n{text-decoration:line-through}
.ovwrap{overflow-x:auto;padding:0}
table.ov{width:100%;border-collapse:collapse;min-width:760px}table.ov th,table.ov td{border-bottom:1px solid var(--line,#e3e8e6);border-right:1px solid var(--line,#e3e8e6);vertical-align:top;padding:8px;text-align:left}
table.ov thead th{font-size:13px;color:var(--muted);background:var(--bg)}table.ov thead small{font-weight:500}table.ov tbody th{width:110px;background:var(--bg);position:sticky;left:0;z-index:1}
.ovc{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;border:0;border-left:4px solid var(--c);border-radius:8px;background:color-mix(in srgb,var(--c) 10%,var(--surface));padding:5px 7px;margin-bottom:5px;font:inherit;font-size:12px;color:inherit;cursor:pointer}
.ovc b{font-size:13px}.ovc .mono{font-size:11px;color:var(--muted)}.ovc.draft{border-style:dashed;border-left-style:solid;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 6%,var(--surface)) 0 6px,var(--surface) 6px 12px)}
.ovc.conf{box-shadow:0 0 0 2px var(--bad)}.ovc.cancel{opacity:.6;border-left-color:var(--bad)}.ovc.cancel b{text-decoration:line-through}.ovn{color:var(--muted);font-size:12px}
ul.chk{list-style:none;margin:0;padding:0;display:grid;gap:6px}ul.chk li{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:8px 10px;border-radius:10px;background:var(--bg)}
ul.chk i{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px;color:#fff}
ul.chk .ok i{background:var(--ok)}ul.chk .warn i{background:var(--warn)}ul.chk .bad i{background:var(--bad)}ul.chk .info i{background:var(--muted)}ul.chk .bad{color:var(--bad);font-weight:600}
.gtwrap{overflow-x:auto}table.gt{width:100%;border-collapse:separate;border-spacing:4px;min-width:420px}
table.gt th{font-weight:600;padding:0}table.gt th button{width:100%;border:0;background:var(--accent);color:#fff;border-radius:9px;padding:7px 4px;font:600 13px var(--f-body);cursor:pointer;white-space:nowrap}

table.gt td{padding:0}.gc{width:100%;height:34px;border-radius:9px;border:1px solid transparent;background:var(--accent-soft);cursor:pointer}
.gc[aria-pressed="false"]{background:repeating-linear-gradient(135deg,var(--surface) 0 5px,var(--bg) 5px 10px);border-color:var(--line,#e3e8e6)}

.dhgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}.dh{display:grid;gap:4px}
.dh button{border:1px solid var(--line,#e3e8e6);background:var(--surface);color:var(--muted);border-radius:10px;padding:7px 4px;font:600 13px var(--f-body);cursor:pointer}
.dh .dh-d{font-size:13px}.dh .dh-h{font-size:12px;font-weight:500}
.dh button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.dh .dh-h[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}

@media(max-width:560px){.dhgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pwwrap{position:relative;display:block}.pwwrap input{width:100%;padding-right:48px!important}.pweye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--muted);display:grid;place-items:center;border-radius:10px;cursor:pointer}.pweye:hover{color:var(--accent);background:var(--accent-soft)}
.pw{padding:16px 18px}.pw-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.pw-r{display:grid;gap:4px;font-size:14px}

.pbar{height:5px;border-radius:9px;background:var(--line,#e3e8e6);overflow:hidden;margin-top:5px;min-width:70px}.pbar i{display:block;height:100%;background:var(--accent)}
.weeknav{display:flex;align-items:center;gap:10px;background:var(--surface,#fff);border:1px solid var(--line,#e3e8e6);border-radius:16px;padding:8px;margin:4px 0 18px}

.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}

<script id="pdf-builder">
/* Bulletin PDF : construit uniquement à partir de la version figée (snapshot) du bulletin */
function makePayslipPdf(jsPDF, slip, payments, detailed){
  const sn=slip.snapshot, E=sn.enseignant, P=sn.periode;
  const money=n=>Math.round(n||0).toLocaleString("fr-FR").replace(/[  ]/g," ")+" FCFA";
  const d=s=>{const [y,m,j]=String(s).slice(0,10).split("-");return j+"/"+m+"/"+y};
  const h=m=>{const H=Math.floor(m/60),M=m%60;return H+" h"+(M?" "+String(M).padStart(2,"0"):"")};
  const ink=[22,32,46], muted=[93,104,121], accent=[11,110,91], line=[221,225,232];
  const doc=new jsPDF({unit:"mm",format:"a4"}); const W=210, L=16, R=W-16;

  doc.setFillColor(...accent); doc.rect(0,0,W,4,"F");
  const LX=pdfLogo(doc,L,9,16)?L+19:L;
  doc.setFont("helvetica","bold"); doc.setFontSize(18); doc.setTextColor(...ink); doc.text(APPN(),LX,18);
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...muted);
  doc.text((pdfHead()?pdfHead()+" · ":"")+"Service financier",LX,23.5);
  doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(...ink);
  doc.text(detailed?"Relevé détaillé des heures":"Bulletin de rémunération",R,16,{align:"right"});
  doc.setFont("courier","normal"); doc.setFontSize(10); doc.text(slip.number,R,22,{align:"right"});

  doc.setDrawColor(...line); doc.line(L,29,R,29);
  const block=(x,title,rows)=>{doc.setFont("helvetica","bold");doc.setFontSize(8);doc.setTextColor(...muted);doc.text(title.toUpperCase(),x,36);
    rows.forEach(([k,v],i)=>{const y=42+i*5.4;doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(...muted);doc.text(k,x,y);
      doc.setTextColor(...ink);doc.text(String(v||"-"),x+27,y)})};
  block(L,"Enseignant",[["Nom",E.nom],["Statut",E.statut],["Département",E.departement],["E-mail",E.email]]);
  block(112,"Période",[["Libellé",P.nom],["Du",d(P.debut)],["Au",d(P.fin)],["Approuvé le",d(sn.approuve_le)]]);

  /* bulletin : un résumé par tarif horaire ; relevé détaillé : chaque séance */
  let lines,head;
  if(detailed){head=[["Date","Cours","Groupe","Durée","Tarif horaire","Montant"]];
    lines=sn.lignes.map(l=>[d(l.date)+(l.rattrapage?" (rattrapage)":""),l.cours,l.groupe,h(l.minutes),money(l.tarif)+(l.source==="individuel"?" *":""),money(l.montant)]);
    lines.push([{content:"Total ("+sn.lignes.length+" séances)",colSpan:3,styles:{fontStyle:"bold"}},{content:h(slip.total_minutes),styles:{fontStyle:"bold"}},"",{content:money(slip.gross_fcfa),styles:{fontStyle:"bold"}}])}
  else{const g={};sn.lignes.forEach(l=>{const k=l.tarif+"|"+(l.rattrapage?1:0);(g[k]??={t:l.tarif,r:l.rattrapage,m:0,a:0,i:l.source==="individuel"});g[k].m+=l.minutes;g[k].a+=l.montant});
    head=[["Désignation","Heures","Tarif horaire","Montant"]];
    lines=Object.values(g).sort((a,b)=>a.r-b.r||b.t-a.t).map(x=>[(x.r?"Heures antérieures régularisées":"Enseignements du "+d(P.debut)+" au "+d(P.fin)),h(x.m),money(x.t)+(x.i?" *":""),money(x.a)])}
  doc.autoTable({startY:68,head,body:lines,
    theme:"plain",margin:{left:L,right:16},
    styles:{font:"helvetica",fontSize:8.5,textColor:ink,cellPadding:{top:2,bottom:2,left:2,right:2},lineColor:line,lineWidth:{bottom:0.2}},
    headStyles:{fontStyle:"bold",textColor:muted,fontSize:7.5,lineWidth:{bottom:0.4},lineColor:ink},
    columnStyles:detailed?{0:{cellWidth:30},2:{cellWidth:22},3:{halign:"right",cellWidth:16},4:{halign:"right",cellWidth:30},5:{halign:"right",cellWidth:28}}:{1:{halign:"right",cellWidth:22},2:{halign:"right",cellWidth:34},3:{halign:"right",cellWidth:32}}});

  let y=doc.lastAutoTable.finalY+8;
  if(detailed){doc.setFontSize(8);doc.setTextColor(...muted);
    doc.text("Relevé joint au bulletin "+slip.number+". Il reprend chaque séance émargée et validée prise en compte dans ce bulletin.",L,y);
    doc.setFontSize(7.5);doc.text("* Tarif individuel. Édité le "+new Date().toLocaleDateString("fr-FR")+" · "+slip.number,L,285);
    return doc}
  if(!detailed){doc.setFontSize(8);doc.setTextColor(...muted);doc.text("Le détail des séances figure dans le relevé détaillé des heures, disponible sur demande ou dans l'application.",L,y-2);y+=4}
  if(y>230){doc.addPage();y=20}
  const paid=(payments||[]).reduce((s,p)=>s+p.amount_fcfa,0);
  const tot=[["Heures payables",h(slip.total_minutes)],["Rémunération brute",money(slip.gross_fcfa)],["Primes",money(0)],
    ["Retenues et cotisations",money(slip.deductions_fcfa)]];
  const x0=112;
  tot.forEach(([k,v],i)=>{doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(...muted);doc.text(k,x0,y+i*6);doc.setTextColor(...ink);doc.text(v,R,y+i*6,{align:"right"})});
  y+=tot.length*6;
  doc.setFillColor(223,241,236); doc.rect(x0-3,y-4.5,R-x0+5,10,"F");
  doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(...accent);
  doc.text("Net à payer",x0,y+2); doc.text(money(slip.net_fcfa),R,y+2,{align:"right"});
  y+=13;
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...muted);
  doc.text("Réglé à ce jour",x0,y); doc.setTextColor(...ink); doc.text(money(paid),R,y,{align:"right"});
  doc.setTextColor(...muted); doc.text("Reste dû",x0,y+6); doc.setTextColor(...ink); doc.text(money(slip.net_fcfa-paid),R,y+6,{align:"right"});

  if((payments||[]).length){doc.setFontSize(8);doc.setTextColor(...muted);
    doc.text("Règlements : "+payments.map(p=>d(p.paid_on)+" "+p.method+" "+money(p.amount_fcfa)+(p.reference?" ("+p.reference+")":"")).join(" ; "),L,y+16,{maxWidth:R-L})}

  doc.setFontSize(7.5); doc.setTextColor(...muted);
  const foot=["Montant = heures retenues × tarif horaire en vigueur à la date de chaque séance. * Tarif individuel.",
    "Aucune retenue ni cotisation n'est appliquée selon les règles actuelles de l'établissement.",
    "Bulletin approuvé par "+(sn.approuve_par||"le service financier")+". Ce document ne vaut pas preuve de paiement.",
    "Édité le "+new Date().toLocaleDateString("fr-FR")+" · "+slip.number];
  foot.forEach((t,i)=>doc.text(t,L,282+i*3.6-(foot.length-1)*3.6));
  return doc;
}
</script>

async function loadSchedule(){
  try{const r=await q(sb.from("school_schedule").select("*").eq("faculty_id",S.fac).maybeSingle());
    S.sched=r?{days:[...r.days].sort(),start:hm(r.day_start),end:hm(r.day_end),len:r.slot_minutes,lunchFrom:r.lunch_start?hm(r.lunch_start):"",lunchTo:r.lunch_end?hm(r.lunch_end):"",groupMax:Number(r.group_max_hours)||8,teacherMax:Number(r.teacher_max_hours)||6}:{...SCHED_DEFAULT}}
  catch(e){S.sched={...SCHED_DEFAULT}}
  return S.sched;
}
/* ---------- calendrier : jours ou demi-journées sans cours (fériés, vacances, examens, événements) ---------- */
const CLOSE_KIND={ferie:"Jour férié",vacances:"Vacances",examens:"Examens",evenement:"Événement"};
const CLOSE_PART={jour:"Toute la journée",matin:"Matin",apres_midi:"Après-midi"};
async function loadClosures(){try{S.closures=await q(sb.from("calendar_closures").select("*").order("date_from"))}catch(e){S.closures=S.closures||[]}return S.closures}
function closuresOn(d){return (S.closures||[]).filter(c=>c.date_from<=d&&c.date_to>=d&&(c.faculty_id==null||c.faculty_id===S.fac))}
function lunchBounds(){const sc=S.sched||SCHED_DEFAULT;return[sc.lunchFrom?hmin(sc.lunchFrom):780,sc.lunchTo?hmin(sc.lunchTo):780]}
/* fermeture qui touche ce créneau (minutes depuis minuit), ou null */
function closureAt(d,st,en){const [lf,lt]=lunchBounds();return closuresOn(d).find(c=>c.part==="jour"||(c.part==="matin"&&st<lf)||(c.part==="apres_midi"&&en>lt))||null}
/* nombre de semaines de cours réellement ouvertes entre deux dates (les fermetures sont retirées) */
function openWeeks(from,to){const sc=S.sched||SCHED_DEFAULT;let n=0;
  for(let d=new Date(from+"T12:00:00"),e=new Date(to+"T12:00:00");d<=e;d=addDays(d,1)){const w=d.getDay()||7;if(!sc.days.includes(w))continue;
    const cs=closuresOn(iso(d));if(cs.some(c=>c.part==="jour"))continue;n+=cs.length?0.5:1}
  return n/Math.max(1,sc.days.length)}

/* débuts des créneaux d'une journée : on avance de « durée » en « durée » ; un créneau qui toucherait la pause repart à la fin de la pause */
function dayStarts(st,en,len,lf,lt){const out=[];let t=st;
  while(t+len<=en){if(lf!=null&&lt!=null&&t<lt&&lf<t+len){if(t+len<=lf){out.push(t);t+=len;continue}t=Math.max(t,lt);continue}out.push(t);t+=len}
  return out}
/* tronc commun : groupe principal + groupes réunis d'une affectation */
function grpIds(ta){return ta?[ta.group_id,...(ta.assignment_groups||[]).map(x=>x.group_id)]:[]}
function grpLabel(ta,code){const ex=(ta?.assignment_groups||[]).map(x=>x.student_groups?.code).filter(Boolean);return [code,...ex].filter(Boolean).join(" + ")}
function decorateTA(ta){if(!ta||ta._g)return ta;ta._g=grpIds(ta);if(ta.student_groups)ta.student_groups={...ta.student_groups,code:grpLabel(ta,ta.student_groups.code)};return ta}

function availableTabs(){

  if(reader)t.push({id:"suividg",label:"Suivi des enseignements",fn:viewDgSuivi});

  if(has("planificateur")||has("responsable")||has("finance"))t.push({id:"dashboard",label:"Tableau de bord",fn:viewDashboard});
  else if(has("admin"))t.push({id:"admindash",label:"Tableau de bord",fn:viewAdminDash});
  if(isProf())t.push({id:"accueil",label:"Aujourd'hui",fn:viewHome,me:1});

  if(isProf())t.push({id:"bulletins",label:"Heures et paiements",fn:viewMyPayslips,me:1});
  if(has("responsable")||has("chef_departement"))t.push({id:"controle",label:"Contrôle",fn:viewReview});
  if(has("planificateur"))t.push({id:"affect",label:"Affectations",fn:viewAssign});
  if(has("planificateur"))t.push({id:"planning",label:"Emplois du temps",fn:viewPlanning});
  if(has("finance")||reader||has("caissier"))t.push({id:"paie",label:has("caissier")&&!has("finance")&&!reader?"Paiements":"Paie",fn:viewPayroll});
  if(has("finance")||reader){t.push({id:"tarifs",label:"Tarifs",fn:viewRates});t.push({id:"budget",label:"Budget",fn:viewBudget})}
  if(has("planificateur"))t.push({id:"referentiel",label:"Référentiel",fn:v=>viewRef(v,"ref")});
  if(has("admin"))t.push({id:"comptes",label:"Comptes",fn:v=>viewRef(v,"comptes")});
  if(isCentral()&&!has("planificateur"))t.push({id:"calendrier",label:"Jours sans cours",fn:v=>{S._univ=true;return viewClosures(v).finally(()=>{S._univ=false})}});
  if(has("admin"))t.push(isCentral()?{id:"etab",label:"Établissement",fn:viewEtab}:{id:"etab",label:"Ma faculté",fn:viewEtabFac});

  /* quelqu'un qui gère et enseigne : la gestion d'abord, puis « Mon enseignement » */
  const me=t.filter(x=>x.me),other=t.filter(x=>!x.me);
  return other.length&&me.length?[...other,...me]:t;
}

/* ---------- dialogue ---------- */
function openDialog(html,onSubmit){
  const dlg=document.getElementById("dlg"),f=document.getElementById("dlgForm");
  f.innerHTML=html+`<div class="err" id="dlgErr"></div>`;
  f.onsubmit=async ev=>{
    const btn=ev.submitter;if(btn&&btn.value==="cancel")return;
    ev.preventDefault();
    try{btn&&(btn.disabled=true);const r=await onSubmit(btn?btn.value:null,f);if(r!=="keep")dlg.close();}
    catch(e){document.getElementById("dlgErr").textContent=errMsg(e);btn&&(btn.disabled=false)}
  };
  if(!dlg.open)dlg.showModal();
  f.focus({preventScroll:true});f.scrollTop=0;dlg.scrollTop=0;
  if(!dlg._out){dlg._out=1;let down=false;
    /* toucher en dehors du cadre de la fenêtre la ferme (test par coordonnées : fiable sur iPad) */
    const outside=e=>{if(e.target!==dlg)return false;const r=dlg.getBoundingClientRect();return e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom};
    dlg.addEventListener("pointerdown",e=>{down=outside(e)});
    dlg.addEventListener("pointerup",e=>{if(down&&outside(e))dlg.close();down=false});
    dlg.addEventListener("click",e=>{if(outside(e))dlg.close()});}
}

      <button class="wbtn" id="wNext" aria-label="Semaine suivante"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>

function emargeDialog(s){
  const a=s.attendance_records;
  openDialog(`<h3>Émarger la séance</h3>
    <dl class="kv"><dt>Cours</dt><dd>${sessionLabel(s)}</dd><dt>Date</dt><dd>${fdate(s.session_date)}</dd>
      <dt>Prévu</dt><dd class="mono">${hm(s.start_time)}–${hm(s.end_time)}</dd><dt>Groupe</dt><dd>${esc(s.student_groups?.name)}</dd></dl>
    ${a?.review_reason?`<p class="sub" style="margin:0">Demande du responsable : ${esc(a.review_reason)}</p>`:""}
    <div class="row"><label>Début réel<input id="eStart" type="time" required value="${hm(a?.declared_start||s.start_time)}"></label>
    <label>Fin réelle<input id="eEnd" type="time" required value="${hm(a?.declared_end||s.end_time)}"></label></div>
    <label>Commentaire (obligatoire si la durée diffère)<textarea id="eCom">${esc(a?.teacher_comment||"")}</textarea></label>
    <p class="sub" style="margin:0">Je confirme avoir dispensé ce cours. La déclaration est horodatée et conservée.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Soumettre l'émargement</button></div>`,
  async()=>{
    const st=eStart.value,en=eEnd.value,com=eCom.value.trim();
    const planned=(toMin(s.end_time)-toMin(s.start_time)),decl=toMin(en)-toMin(st);
    if(decl<=0)throw new Error("L'heure de fin doit être après l'heure de début.");
    if(decl!==planned&&!com)throw new Error("La durée déclarée diffère de la durée prévue : ajoutez un commentaire.");
    await q(sb.rpc("submit_attendance",{p_session_id:s.id,p_start:st,p_end:en,p_comment:com||null}));
    toast("Émargement soumis");rerender();
  });
}
function toMin(t){const [h,m]=t.split(":").map(Number);return h*60+m}

/* ---------- professeur : écran « Aujourd'hui », émargement rapide, demandes d'absence ---------- */
const ABS_ST={en_attente:["Demande envoyée","p-warn"],annulee:["Séance annulée","p-mute"],reportee:["Séance reportée","p-info"],refusee:["Demande refusée","p-bad"],retiree:["Demande retirée","p-mute"]};
const sEnd=s=>new Date(s.session_date+"T"+String(s.end_time).slice(0,5)+":00");
const sStart=s=>new Date(s.session_date+"T"+String(s.start_time).slice(0,5)+":00");
const dayWord=d=>{const t=iso(new Date()),tm=iso(addDays(new Date(),1));if(d===t)return"Aujourd'hui";if(d===tm)return"Demain";const x=new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});return x.charAt(0).toUpperCase()+x.slice(1)};
/* « J'ai fait ce cours » : émargement aux horaires prévus, en un geste */
async function quickEmarge(list){let ok=0;const errs=[];
  for(const s of list){try{await q(sb.rpc("submit_attendance",{p_session_id:s.id,p_start:hm(s.start_time),p_end:hm(s.end_time),p_comment:null}));ok++}catch(e){errs.push(errMsg(e))}}
  toast(ok?(ok>1?`${ok} séances émargées`:"Séance émargée")+(errs.length?` · ${errs.length} refusée(s) : ${errs[0]}`:""):errs[0]||"Rien à émarger",errs.length>0);rerender()}
function bulkEmargeDialog(list){
  openDialog(`<h3>Émarger ${list.length} séances</h3>
    <p style="margin:0">Chaque séance sera déclarée aux horaires prévus. Si une séance s'est déroulée autrement, émargez-la seule avec « Autre horaire ».</p>
    <div class="rl">${list.map(s=>`<div class="rlrow"><b>${fdate(s.session_date)} · ${hm(s.start_time)}–${hm(s.end_time)}</b><span class="sub">${sessionLabel(s)} · ${esc(grpLabel(s.teaching_assignments,s.student_groups?.code))}</span></div>`).join("")}</div>
    <p class="sub" style="margin:0">Je confirme avoir dispensé ces cours. Chaque déclaration est horodatée et conservée.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Émarger les ${list.length} séances</button></div>`,
  async()=>{await quickEmarge(list)})}

    q(sb.from("schedule_sessions").select(SESSION_SEL).eq("teacher_id",T.id).gte("session_date",iso(addDays(now,-60))).lte("session_date",iso(addDays(now,14))).order("session_date").order("start_time")),

      <section class="panel hcard"><h2 style="margin:0 0 6px">${FIXED?"Disponibilités du semestre"+(semL?" "+esc(semL):""):"Disponibilités · semaine du "+weekRange(nextW)}</h2>

/* ---------- directeur : demandes d'absence des professeurs ---------- */
async function absenceCard(el){
  let reqs=[];try{reqs=await q(sb.from("absence_requests").select("id,session_id,reason,proposal,created_at,teacher_id,teachers(first_name,last_name,phone),schedule_sessions(id,session_date,start_time,end_time,status,teaching_assignments(courses(code,name),assignment_groups(group_id,student_groups(code))),student_groups(code),rooms(code))").eq("status","en_attente").order("created_at"))}catch(e){el.innerHTML="";return}
  if(!reqs.length){el.innerHTML="";return}
  el.innerHTML=`<div class="panel" style="padding:14px 16px;border-color:var(--warn)"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Demandes d'absence</h2><span class="pill p-warn">${reqs.length} en attente</span></div>
    <div class="hlist" style="margin-top:8px">${reqs.map(r=>{const s=r.schedule_sessions;return `<div class="hrow"><div><b>${esc(r.teachers.first_name+" "+r.teachers.last_name)} · ${fdate(s.session_date)} ${hm(s.start_time)}–${hm(s.end_time)}</b>
      <div class="sub">${sessionLabel(s)} · ${esc(grpLabel(s.teaching_assignments,s.student_groups?.code))} · ${esc(s.rooms?.code||"")}</div><div class="sub">Motif : ${esc(r.reason)}${r.proposal?" · Proposition : "+esc(r.proposal):""}</div></div>
      <button class="btn sm primary" data-ab="${r.id}">Traiter</button></div>`}).join("")}</div></div>`;
  el.querySelectorAll("[data-ab]").forEach(b=>b.onclick=()=>{const r=reqs.find(x=>x.id==b.dataset.ab),s=r.schedule_sessions,t=r.teachers;
    const lbl=`${s.teaching_assignments?.courses?.code||""} (${grpLabel(s.teaching_assignments,s.student_groups?.code)}) du ${fdl(s.session_date)} à ${hm(s.start_time)}`;
    openDialog(`<h3>Demande de ${esc(t.first_name+" "+t.last_name)}</h3>
      <dl class="kv"><dt>Séance</dt><dd>${sessionLabel(s)}</dd><dt>Quand</dt><dd>${fdate(s.session_date)} · ${hm(s.start_time)}–${hm(s.end_time)}</dd><dt>Motif</dt><dd>${esc(r.reason)}</dd>${r.proposal?`<dt>Proposition</dt><dd>${esc(r.proposal)}</dd>`:""}</dl>
      <label>Réponse au professeur (facultatif pour annuler, utile pour refuser)<input id="abA" maxlength="200"></label>
      <p class="sub" style="margin:0">Pour <b>reporter</b>, ouvrez l'emploi du temps, touchez le cours puis « Reporter » : la demande se règle toute seule.</p>
      <div class="row" style="justify-content:flex-end;flex-wrap:wrap"><button class="btn" value="cancel" formnovalidate>Plus tard</button><button class="btn danger" value="refuse" formnovalidate>Refuser</button><button class="btn" value="report" formnovalidate>Reporter…</button><button class="btn primary" value="annul" formnovalidate>Annuler la séance</button></div>`,
    async(act)=>{const a=abA.value.trim();
      if(act==="refuse"){await q(sb.rpc("refuse_absence",{p_id:r.id,p_answer:a||null}));toast("Demande refusée");rerender();
        offerNotify(()=>notifyDialog({title:"Prévenir le professeur",intro:"Il voit la réponse dans l'application. Vous pouvez aussi la lui envoyer.",items:[{t,msg:`Bonjour ${t.first_name} ${t.last_name}, votre demande d'absence pour le cours ${lbl} n'a pas pu être acceptée${a?" : "+a:""}. Le cours est maintenu. Cordialement, ${sig()}.`}]}),"Prévenir le professeur ?");return}
      if(act==="report"){S.ttWeek=mondayOf(new Date(s.session_date+"T12:00:00"));S.ttTab="grille";S.planView="teacher";S.planId=r.teacher_id;S.tab="planning";try{history.replaceState(null,"","#planning")}catch(e){}renderShell();setTimeout(()=>toast("Touchez le cours, puis « Reporter »."),500);return}
      if(act==="annul"){await q(sb.from("schedule_sessions").update({status:"annulee",note:"Annulé : "+(a||"absence du professeur ("+r.reason+")")}).eq("id",s.id));toast("Séance annulée");rerender();
        offerNotify(()=>notifyDialog({title:"Prévenir le professeur",intro:"La séance apparaît annulée dans son emploi du temps. Vous pouvez aussi le lui confirmer.",items:[{t,msg:`Bonjour ${t.first_name} ${t.last_name}, suite à votre demande, le cours ${lbl} est annulé${a?" : "+a:""}. Cordialement, ${sig()}.`}]}),"Prévenir le professeur ?")}})});
}
