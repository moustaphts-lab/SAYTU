    async()=>{
      const offL=[...document.querySelectorAll("#gGrid [data-gc]")].filter(b=>b.getAttribute("aria-pressed")!=="true").map(b=>b.dataset.gc);
      cfg={...cfg,days:SD.filter(d=>!ST.every(t=>offL.includes(d+"|"+t))),off:offL,
        maxTeacher:Number(gMaxT.value)||6,maxDays:Math.max(0,Math.floor(Number(gMaxD.value)||0)),compact:gCp.checked,useAvail:gAv.checked,replace:cfg.replace};
      if(!cfg.days.length)throw new Error("Tous les créneaux sont marqués sans cours : il n'y a rien à générer.");
      try{localStorage.setItem("ucab_gen",JSON.stringify({maxGroup:cfg.maxGroup,maxTeacher:cfg.maxTeacher,maxDays:cfg.maxDays,maxCourse:cfg.maxCourse,compact:cfg.compact,useAvail:cfg.useAvail}))}catch(e){}
      const B=base();
      const res=generateTimetable(cfg,{week:iso(ctx.week)+"T12:00:00",assigns:ctx.assigns,slots:B.slots,rooms:ctx.rooms,groups:ctx.groups,avails:ctx.avails,declared:ctx.declared,remaining:B.remaining});
      preview(res);return "keep"});
    const cells=[...document.querySelectorAll("#gGrid [data-gc]")],isOn=b=>b.getAttribute("aria-pressed")==="true";
    const offTxt=()=>{const L=[];SD.forEach(d=>{const c=cells.filter(b=>b.dataset.gc.startsWith(d+"|")),off=c.filter(b=>!isOn(b));
        document.querySelector(`[data-gd="${d}"]`).classList.toggle("off",off.length===c.length);
        if(off.length===c.length)L.push(DAYS[d]+" "+dayDate(ctx.week,d));else if(off.length)L.push(DAYS[d]+" "+off.map(b=>b.dataset.gc.split("|")[1]).join(", "))});
      ST.forEach(t=>{const c=cells.filter(b=>b.dataset.gc.endsWith("|"+t));document.querySelector(`[data-gt="${t}"]`).classList.toggle("off",c.every(b=>!isOn(b)))});
      gOffTxt.textContent=L.length?"Sans cours : "+L.join(" · "):"Tous les créneaux sont ouverts."};
    const flip=list=>{const v=!list.some(isOn);list.forEach(b=>b.setAttribute("aria-pressed",String(v)));offTxt()};
    cells.forEach(b=>b.onclick=()=>flip([b]));
    document.querySelectorAll("#gGrid [data-gd]").forEach(h=>h.onclick=()=>flip(cells.filter(b=>b.dataset.gc.startsWith(h.dataset.gd+"|"))));
    document.querySelectorAll("#gGrid [data-gt]").forEach(h=>h.onclick=()=>flip(cells.filter(b=>b.dataset.gc.endsWith("|"+h.dataset.gt))));
    offTxt();
    document.querySelectorAll("[data-rep]").forEach(b=>b.onclick=()=>{cfg.replace=b.dataset.rep==="1";document.querySelectorAll("[data-rep]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)))});
  };
  const tsum=P=>{const m={};
    base().slots.filter(x=>x.teaching_assignments&&ctx.assigns.some(a=>a.id===x.assignment_id)).forEach(x=>{const a=ctx.assigns.find(y=>y.id===x.assignment_id);((m[a.teacher_id]??={name:a.teachers.last_name,d:{}}).d[x.day_of_week]=(m[a.teacher_id].d[x.day_of_week]||0)+toMin(x.end_time)-toMin(x.start_time))});
    P.forEach(x=>{const t=x.a.teacher_id;((m[t]??={name:x.a.teachers.last_name,d:{}}).d[x.day_of_week]=(m[t].d[x.day_of_week]||0)+toMin(x.end_time)-toMin(x.start_time))});
    return Object.values(m).sort((a,b)=>a.name.localeCompare(b.name)).map(t=>`<span class="pill p-info" title="${Object.keys(t.d).sort().map(d=>DAYS[d]+" "+hrs(t.d[d])).join(" · ")}">${esc(t.name)} · ${Object.keys(t.d).length} j · ${hrs(Object.values(t.d).reduce((a,b)=>a+b,0))}</span>`).join("")};
  const preview=res=>{
    const P=res.placed.slice().sort((x,y)=>x.day_of_week-y.day_of_week||x.start_time.localeCompare(y.start_time));
    openDialog(`<h3>Proposition</h3>
      <div class="stats" style="margin:0"><div class="stat"><b style="color:var(--ok)">${P.length}</b><span>Créneaux proposés</span></div><div class="stat"><b style="color:${res.unplaced.length?"var(--warn)":"inherit"}">${res.unplaced.reduce((s,u)=>s+u.missing,0)}</b><span>En retard sur le rythme</span></div></div>
      ${res.unplaced.length?`<div><div class="sub" style="margin-bottom:6px">Matières en retard sur le rythme du semestre (heures restantes ÷ semaines restantes) : à placer à la main ou après avoir ajusté les réglages</div>${res.unplaced.map(u=>`<div class="gpwarn"><b>${esc(u.a.courses.code)} · ${esc(u.a.student_groups.code)} · ${esc(u.a.teachers.last_name)}</b> : ${u.missing} créneau${u.missing>1?"x":""} manquant${u.missing>1?"s":""}. Raison la plus fréquente : ${esc(u.reason)}.</div>`).join("")}</div>`:""}
      ${P.length?`<div><div class="sub" style="margin-bottom:6px">Présence par professeur (avec les créneaux déjà enregistrés)</div><div class="chips">${tsum(P)}</div></div>`:""}
      ${P.length?`<div class="gplist">${P.map(x=>`<div class="gp"><span class="gp-t"><b>${DAYS[x.day_of_week]}</b><span class="mono">${x.start_time}–${x.end_time}</span></span><span class="gp-c"><span><b>${esc(x.a.courses.code)}</b> · ${esc(x.a.student_groups.code)}</span><span class="sub">${esc(x.a.teachers.last_name)} · salle ${esc(x.room_code)}</span></span></div>`).join("")}</div>
      ${cfg.replace&&!ctx.published&&drafts.length?`<div class="gpwarn">En enregistrant, les <b>${drafts.length} cours en brouillon</b> de la semaine sont remplacés par cette proposition.</div>`:""}
      <p class="sub" style="margin:0">${ctx.published?"Cette semaine est déjà publiée : les créneaux enregistrés sont <b>publiés immédiatement</b> et les professeurs les voient.":"Les créneaux sont enregistrés en <b>brouillon</b> : les professeurs ne voient rien tant que vous ne publiez pas la semaine. Vous pouvez ensuite modifier ou supprimer chaque créneau."}</p>`:`<p class="empty">${res.finished===ctx.assigns.length?"Toutes les matières ont atteint leur volume prévu.":res.skipped===ctx.assigns.length?"Toutes les matières ont déjà leurs heures de la semaine ou sont terminées.":"Aucun créneau n'a pu être placé avec ces réglages."}</p>`}
      <div class="row" style="justify-content:flex-end"><button class="btn" value="back" formnovalidate>← Modifier les réglages</button>${P.length||(cfg.replace&&drafts.length&&!ctx.published)?`<button class="btn primary" value="save">${ctx.published?"Enregistrer et publier":cfg.replace&&drafts.length?"Remplacer par":"Enregistrer"} ${P.length} créneau${P.length>1?"x":""}</button>`:""}</div>`,
    async(act)=>{
      if(act==="back"){settings();return "keep"}
      const rows=P.map(x=>({week_start:iso(ctx.week),assignment_id:x.assignment_id,day_of_week:x.day_of_week,start_time:x.start_time,end_time:x.end_time,room_id:x.room_id,published:false}));
      let ok=0,ko=0;
      if(cfg.replace&&!ctx.published&&drafts.length)await q(sb.from("timetable_slots").delete().eq("week_start",iso(ctx.week)).eq("published",false));
      if(rows.length)try{await q(sb.from("timetable_slots").insert(rows));ok=rows.length}
      catch(e){for(const r of rows){try{await q(sb.from("timetable_slots").insert(r));ok++}catch(e2){ko++}}}
      toast(`${ok} créneau${ok>1?"x":""} enregistré${ok>1?"s":""}${ctx.published?" et publié"+(ok>1?"s":""):" en brouillon"}`+(ko?` · ${ko} refusé${ko>1?"s":""} (conflit)`:""),ko>0);ctx.rerender()});
  };
  settings();
}

/* ---------- exports Excel et PDF ---------- */
function slug(s){return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-|-$/g,"").toLowerCase()}
const nf=n=>Number(n).toLocaleString("fr-FR").replace(/[  ]/g," ");
const dh=min=>Math.round((min||0)/60*100)/100; /* minutes -> heures décimales (calculables dans Excel) */
const DLI=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>`;
function xbar(id){return `<div class="xbar" id="${id}"><button class="btn sm" type="button" data-x="xlsx" aria-label="Exporter en Excel">${DLI}Excel</button><button class="btn sm" type="button" data-x="pdf" aria-label="Exporter en PDF">${DLI}PDF</button></div>`}
function wireExport(id,build){
  const host=document.getElementById(id);if(!host)return;
  host.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{
    try{const d=await build();if(b.dataset.x==="xlsx")exportExcel(d.file,d.sheets);else exportPdf(d.file,d.title,d.subtitle,d.sheets,d.landscape)}
    catch(e){toast(errMsg(e),true)}});
}
function exportExcel(file,sheets){
  try{
    if(!window.XLSX)throw new Error("Le module Excel n'a pas pu être chargé. Vérifiez la connexion et rechargez la page.");
    const wb=XLSX.utils.book_new();
    sheets.forEach(s=>{
      const ws=XLSX.utils.aoa_to_sheet([[s.title||s.name],[s.subtitle||""],[],s.head,...s.rows]);
      ws["!cols"]=s.head.map((h,c)=>({wch:Math.min(42,Math.max(String(h).length,...s.rows.map(r=>String(r[c]??"").length))+2)}));
      XLSX.utils.book_append_sheet(wb,ws,String(s.name).replace(/[\\\/?*\[\]:]/g,"-").slice(0,31));
    });
    XLSX.writeFile(wb,file+".xlsx");
  }catch(e){toast(errMsg(e),true)}
}
function exportPdf(file,title,subtitle,sheets,landscape){
  try{
    if(!window.jspdf)throw new Error("Le module PDF n'a pas pu être chargé. Vérifiez la connexion et rechargez la page.");
    const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:landscape?"landscape":"portrait"});
    const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
    doc.setFillColor(11,110,91);doc.rect(0,0,W,3,"F");
    doc.setFont("helvetica","bold");doc.setFontSize(16);doc.setTextColor(22,32,46);doc.text("UCAB Touba",14,16);
    doc.setFontSize(12);doc.text(title,14,23);
    doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(93,104,121);
    doc.text(subtitle+" · Édité le "+new Date().toLocaleDateString("fr-FR"),14,29);
    let y=36;
    sheets.forEach(s=>{
      if(!s.rows.length&&!s.keepEmpty)return;
      if(y>H-40){doc.addPage();y=18}
      if(s.title){doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(22,32,46);doc.text(s.title,14,y);y+=2}
      doc.autoTable({startY:y+2,head:[s.head],body:s.rows.map(r=>r.map(c=>typeof c==="number"?nf(c):String(c??""))),
        theme:"striped",margin:{left:14,right:14,bottom:16},styles:{font:"helvetica",fontSize:8,cellPadding:2,textColor:[22,32,46]},
        headStyles:{fillColor:[11,110,91],textColor:255,fontStyle:"bold"},alternateRowStyles:{fillColor:[243,246,244]}});
      y=doc.lastAutoTable.finalY+9;
    });
    const n=doc.internal.getNumberOfPages();
    for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(93,104,121);doc.text(`Page ${i} / ${n}`,W-14,H-8,{align:"right"})}
    doc.save(file+".pdf");
  }catch(e){toast(errMsg(e),true)}
}
async function qAll(make){let all=[],from=0;for(;;){const d=await q(make().range(from,from+999));all=all.concat(d);if(d.length<1000)return all;from+=1000}}

/* ---------- tableau de bord ---------- */
function rateClass(p){return p>=90?"p-ok":p>=70?"p-warn":"p-bad"}
const DPRESETS=[["semaine","Semaine"],["mois","Mois"],["semestre","Semestre"],["perso","Perso."]];
function trendChart(buckets){
  /* courbe : heures prévues (pointillés) et heures validées (aire) par semaine ou par jour */
  const wide=window.innerWidth>720,W=wide?1040:360,H=wide?250:210,L=wide?44:34,R=14,T=14,B=30,n=buckets.length;
  const maxH=Math.max(1,Math.ceil(Math.max(...buckets.map(b=>Math.max(b.prev,b.val)))/60));
  const X=i=>n===1?L+(W-L-R)/2:L+i*(W-L-R)/(n-1),Y=h=>T+(H-T-B)*(1-h/maxH);
  const pts=k=>buckets.map((b,i)=>`${X(i).toFixed(1)},${Y(b[k]/60).toFixed(1)}`).join(" ");
  const step=Math.ceil(n/(wide?10:4));
  const area=n>1?`<polygon points="${X(0).toFixed(1)},${Y(0)} ${pts("val")} ${X(n-1).toFixed(1)},${Y(0)}" fill="var(--accent)" fill-opacity=".14"/>`:"";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Heures prévues et validées par ${buckets[0]?.unit||"semaine"}" style="width:100%;height:auto;display:block">
    ${[0,.5,1].map(f=>{const h=maxH*f;return `<line x1="${L}" x2="${W-R}" y1="${Y(h)}" y2="${Y(h)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(h)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${Math.round(h)} h</text>`}).join("")}
    ${area}${n>1?`<polyline points="${pts("prev")}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/><polyline points="${pts("val")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`:""}
    ${buckets.map((b,i)=>`<circle cx="${X(i)}" cy="${Y(b.val/60)}" r="4" fill="var(--accent)"><title>${b.label} : ${hrs(b.val)} validées sur ${hrs(b.prev)} prévues</title></circle>${n===1?`<circle cx="${X(i)}" cy="${Y(b.prev/60)}" r="4" fill="none" stroke="var(--muted)"/>`:""}${i%step===0||i===n-1?`<text x="${X(i)}" y="${H-8}" text-anchor="${i===0&&n>1?"start":i===n-1&&n>1?"end":"middle"}" font-size="12" fill="var(--muted)">${b.label}</text>`:""}`).join("")}
  </svg>`;
}
async function viewDashboard(v){
  const today=iso(new Date()),now=new Date();
  let sems=[];try{sems=await q(sb.from("semesters").select("label,start_date,end_date").order("start_date"))}catch(e){}
  const sem=sems.find(s=>s.start_date<=today&&today<=s.end_date)||sems[sems.length-1];
  S.dPreset=S.dPreset||"mois";
  if(S.dPreset==="semestre"&&!sem)S.dPreset="mois";
  if(S.dPreset==="semaine"){S.dFrom=iso(mondayOf(now));S.dTo=iso(addDays(mondayOf(now),6))}
  else if(S.dPreset==="mois"){S.dFrom=iso(new Date(now.getFullYear(),now.getMonth(),1));S.dTo=iso(new Date(now.getFullYear(),now.getMonth()+1,0))}
  else if(S.dPreset==="semestre"){S.dFrom=sem.start_date;S.dTo=sem.end_date}
  else if(!S.dFrom){S.dFrom=iso(new Date(now.getFullYear(),now.getMonth(),1));S.dTo=today}
  const presets=DPRESETS.filter(([k])=>k!=="semestre"||sem);
  v.innerHTML=`<h1>Tableau de bord</h1>
    <p class="lead">${fdl(S.dFrom)} au ${fdl(S.dTo)}${S.dPreset==="semestre"&&sem?" · "+esc(sem.label):""}</p>
    <div class="dtools" style="margin-bottom:${S.dPreset==="perso"?"10":"18"}px">
      <div class="seg" role="group" aria-label="Période">${presets.map(([k,l])=>`<button data-pre="${k}" aria-pressed="${S.dPreset===k}">${l}</button>`).join("")}</div>
      ${xbar("dX")}</div>
    ${S.dPreset==="perso"?`<div class="row" style="margin-bottom:18px"><label>Du<input id="dF" type="date" value="${S.dFrom}"></label><label>Au<input id="dT" type="date" value="${S.dTo}"></label><button class="btn" id="dOk">Afficher</button></div>`:""}
    <div id="dBody"><p class="empty">Chargement…</p></div>`;
  v.querySelectorAll("[data-pre]").forEach(b=>b.onclick=()=>{S.dPreset=b.dataset.pre;rerender()});
  if(S.dPreset==="perso")dOk.onclick=()=>{if(dT.value<dF.value){toast("La date de fin doit être après la date de début.",true);return}S.dFrom=dF.value;S.dTo=dT.value;rerender()};

  const sess=await qAll(()=>sb.from("schedule_sessions").select("id,session_date,start_time,end_time,status,teacher_id,teachers(first_name,last_name,departments(code)),teaching_assignments(courses(code,name,departments(code))),student_groups(code),attendance_records(status,retained_minutes,declared_minutes,entered_for_teacher)").gte("session_date",S.dFrom).lte("session_date",S.dTo).order("session_date"));
  const due=sess.filter(s=>s.status!=="annulee"&&s.session_date<=today);
  const K={prevues:due.length,annulees:sess.filter(s=>s.status==="annulee").length,emargees:0,valid:0,wait:0,corr:0,rej:0,deleg:0,minPrev:0,minVal:0,minWait:0};
  const dep={},tea={},sans=[],bk={};
  const span=(new Date(S.dTo)-new Date(S.dFrom))/864e5,byDay=span<=14;
  due.forEach(s=>{
    const a=s.attendance_records,pm=toMin(s.end_time)-toMin(s.start_time);
    const dc=s.teaching_assignments?.courses?.departments?.code||"—";
    const d=dep[dc]??={code:dc,prev:0,em:0,minPrev:0,minVal:0,minWait:0};
    const t=tea[s.teacher_id]??={name:s.teachers?(s.teachers.last_name+" "+s.teachers.first_name):"—",dep:s.teachers?.departments?.code||"—",prev:0,em:0,minVal:0,minWait:0};
    const key=byDay?s.session_date:iso(mondayOf(new Date(s.session_date+"T12:00:00")));
    const b=bk[key]??={key,prev:0,val:0};
    K.minPrev+=pm;d.prev++;d.minPrev+=pm;t.prev++;b.prev+=pm;
    if(!a){sans.push(s);return}
    K.emargees++;d.em++;t.em++;
    if(a.entered_for_teacher)K.deleg++;
    if(a.status==="valide"){const m=a.retained_minutes||0;K.valid++;K.minVal+=m;d.minVal+=m;t.minVal+=m;b.val+=m}
    else if(a.status==="soumis"){const m=a.declared_minutes||0;K.wait++;K.minWait+=m;d.minWait+=m;t.minWait+=m}
    else if(a.status==="correction_demandee")K.corr++;
    else if(a.status==="rejete")K.rej++;
  });
  const pct=(a,b)=>b?Math.round(a/b*100):0;
  const rate=pct(K.emargees,K.prevues);
  const deps=Object.values(dep).sort((a,b)=>b.minPrev-a.minPrev);
  const teas=Object.values(tea).sort((a,b)=>pct(a.em,a.prev)-pct(b.em,b.prev)||a.name.localeCompare(b.name));
  const sansSorted=sans.slice().sort((a,b)=>a.session_date.localeCompare(b.session_date));
  const buckets=Object.values(bk).sort((a,b)=>a.key.localeCompare(b.key)).map(b=>({...b,unit:byDay?"jour":"semaine",label:new Date(b.key+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}));
  let pay=null;
  if(has("finance")||has("direction")){
    try{
      const [slips,pays,open]=await Promise.all([qAll(()=>sb.from("payslips").select("id,net_fcfa")),qAll(()=>sb.from("payments").select("amount_fcfa")),
        qAll(()=>sb.from("attendance_records").select("retained_minutes").eq("status","valide").is("pay_period_id",null))]);
      const net=slips.reduce((s,x)=>s+x.net_fcfa,0),paid=pays.reduce((s,x)=>s+x.amount_fcfa,0);
      pay={net,paid,due:net-paid,openMin:open.reduce((s,x)=>s+(x.retained_minutes||0),0)};
    }catch(e){pay=null}
  }
  const ringColor=rate>=90?"var(--ok)":rate>=70?"var(--warn)":"var(--bad)",C=2*Math.PI*52;
  const late=sans.length;
  const headline=K.prevues?`${K.emargees} séance${K.emargees>1?"s":""} émargée${K.emargees>1?"s":""} sur ${K.prevues}`:"Aucune séance prévue sur cette période";
  const hero=`<div class="panel hero">
    <svg class="ring" viewBox="0 0 120 120" role="img" aria-label="Taux d'émargement : ${rate} %"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="12"/>
      <circle cx="60" cy="60" r="52" fill="none" stroke="${ringColor}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(C*rate/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 60 60)"/>
      <text x="60" y="68" text-anchor="middle" font-size="26" font-weight="700" fill="var(--ink)">${rate} %</text></svg>
    <div class="herotxt"><div class="sub">Taux d'émargement</div><div class="bigline">${headline}</div>
      <div class="${late?"late":"sub"}">${K.prevues?(late?`${late} séance${late>1?"s":""} sans émargement`:"Aucun retard : toutes les séances sont émargées"):""}</div>
      <div class="mini"><div><b>${hrs(K.minVal)}</b><span>validées</span></div><div><b>${hrs(K.minPrev)}</b><span>prévues</span></div><div><b>${hrs(K.minWait)}</b><span>à valider</span></div><div><b>${K.deleg}</b><span>par délégation</span></div></div></div></div>`;
  const cards={
    val:K.wait?`<div class="panel act"><div class="sub">À valider</div><div class="actn" style="color:var(--warn)">${K.wait}</div><div class="sub">émargement${K.wait>1?"s":""} en attente · ${hrs(K.minWait)}</div>${has("responsable")?`<button class="btn primary" id="goCtl">Valider maintenant</button>`:""}</div>`:"",
    sans:late?`<div class="panel act"><div class="sub">Sans émargement</div><div class="actn" style="color:var(--bad)">${late}</div><div class="sub">séance${late>1?"s":""} passée${late>1?"s":""} à relancer</div><button class="btn" id="goSans">Voir la liste</button></div>`:"",
    pay:pay?`<div class="panel act"><div class="sub">Reste dû sur les paies approuvées</div><div class="actn">${fcfa(pay.due)}</div>
      <div class="hbar" style="width:100%"><i style="width:${pct(pay.paid,pay.net)}%"></i></div><div class="sub">${fcfa(pay.paid)} réglés sur ${fcfa(pay.net)} · ${hrs(pay.openMin)} validées pas encore payées</div><button class="btn" id="goPay">Ouvrir la paie</button></div>`:""};
  const onlyFin=has("finance")&&!has("planificateur")&&!has("responsable"),onlyVal=has("responsable")&&!has("planificateur")&&!has("finance");
  const order=onlyFin?["pay","val","sans"]:onlyVal?["val","sans","pay"]:["sans","val","pay"];
  const acts=order.map(k=>cards[k]).filter(Boolean).join("");
  const seg=(d)=>{const p1=pct(d.minVal,d.minPrev),p2=pct(d.minWait,d.minPrev);return `<div class="stack" title="${hrs(d.minVal)} validées · ${hrs(d.minWait)} en attente · ${hrs(Math.max(0,d.minPrev-d.minVal-d.minWait))} manquantes"><i style="width:${p1}%;background:var(--accent)"></i><i style="width:${Math.min(p2,100-p1)}%;background:var(--ochre)"></i></div>`};
  const maxPrev=Math.max(1,...deps.map(d=>d.minPrev));
  document.getElementById("dBody").innerHTML=`${hero}
    ${acts?`<div class="acts">${acts}</div>`:""}
    <h2>Heures validées et prévues</h2>
    <div class="panel" style="padding:16px 18px">${buckets.length?`${trendChart(buckets)}<div class="legend"><span><i style="background:var(--accent)"></i>Validées</span><span><i class="dash"></i>Prévues</span><span class="sub">par ${byDay?"jour":"semaine"}</span></div>`:`<p class="empty">Aucune séance sur cette période.</p>`}</div>
    ${deps.length?`<h2>Par département</h2><div class="panel" style="padding:6px 18px 12px">${deps.map(d=>`<div class="drow"><div class="dname">${esc(d.code)}</div><div class="dbars"><div style="width:${Math.max(4,pct(d.minPrev,maxPrev))}%">${seg(d)}</div>
      <div class="sub">${hrs(d.minVal)} validées${d.minWait?` · ${hrs(d.minWait)} en attente`:""} sur ${hrs(d.minPrev)} prévues · émargement ${pct(d.em,d.prev)} %</div></div></div>`).join("")}
      <div class="legend"><span><i style="background:var(--accent)"></i>Validées</span><span><i style="background:var(--ochre)"></i>En attente</span><span><i style="background:var(--accent-soft)"></i>Reste prévu</span></div></div>`:""}
    ${teas.length?`<h2>Émargement par enseignant</h2><div class="panel" style="padding:4px 18px">${teas.map(t=>{const p=pct(t.em,t.prev),c=p>=90?"var(--ok)":p>=70?"var(--warn)":"var(--bad)";return `<div class="rank"><div><b>${esc(t.name)}</b><div class="sub">${esc(t.dep)} · ${hrs(t.minVal)} validées${t.minWait?` · ${hrs(t.minWait)} en attente`:""}</div></div>
      <div class="rbar"><div class="hbar" style="width:100%"><i style="width:${p}%;background:${c}"></i></div></div><div class="rpct" style="color:${c}">${p} %</div></div>`}).join("")}</div>`:""}
    ${sansSorted.length?`<h2 id="sansList">Séances sans émargement</h2><div class="panel tbl"><table><thead><tr><th>Date</th><th>Enseignant</th><th>Cours</th><th>Groupe</th></tr></thead><tbody>

  const go=(id,tab)=>{const b=document.getElementById(id);if(b)b.onclick=()=>{S.tab=tab;S.filter="soumis";try{history.replaceState(null,"","#"+tab)}catch(e){}renderShell()}};
  go("goCtl","controle");go("goPay","paie");
  const gs=document.getElementById("goSans");if(gs)gs.onclick=()=>document.getElementById("sansList").scrollIntoView({behavior:"smooth",block:"start"});
  wireExport("dX",()=>({file:"tableau-de-bord_"+S.dFrom+"_"+S.dTo,title:"Tableau de bord",subtitle:"Du "+fdl(S.dFrom)+" au "+fdl(S.dTo),sheets:[

      ["Séances prévues (jusqu'à aujourd'hui)",K.prevues],["Séances annulées",K.annulees],["Séances émargées",K.emargees],["Taux d'émargement (%)",rate],
      ["Heures prévues",dh(K.minPrev)],["Heures validées",dh(K.minVal)],["Heures en attente de validation",dh(K.minWait)],["Émargements validés",K.valid],["Émargements en attente",K.wait],
      ["Corrections demandées",K.corr],["Émargements rejetés",K.rej],["Saisis par délégation",K.deleg],["Séances sans émargement",sans.length],
      ...(pay?[["Reste dû sur les paies approuvées (FCFA)",pay.due],["Heures validées pas encore payées",dh(pay.openMin)]]:[])]},

async function viewSummary(v){
  const rows=await q(sb.from("attendance_records").select("status,retained_minutes,declared_minutes,teacher_id,teachers(first_name,last_name,teacher_statuses(label),departments(code))"));
  const by={};
  rows.forEach(a=>{const k=a.teacher_id;by[k]??={t:a.teachers,val:0,wait:0,n:0,rej:0};const o=by[k];o.n++;
    if(a.status==="valide")o.val+=a.retained_minutes; if(a.status==="soumis")o.wait+=a.declared_minutes; if(a.status==="rejete")o.rej++});
  const list=Object.values(by).sort((a,b)=>b.val-a.val);

    ${list.map(o=>`<tr><td>${esc(o.t.first_name+" "+o.t.last_name)}</td><td>${esc(o.t.departments?.code)}</td><td>${esc(o.t.teacher_statuses?.label)}</td>

  wireExport("sX",()=>({file:"heures-validees_"+iso(new Date()),title:"Heures validées",subtitle:"Situation au "+fdl(iso(new Date())),sheets:[

  if(f.t==="select")return `<label>${f.l}<select id="${id}" ${f.req?"required":""}>${f.req?"":'<option value="">—</option>'}${f.opt.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(val)?"selected":""}>${esc(l)}</option>`).join("")}</select></label>`;
  if(f.t==="bool")return `<label style="flex-direction:row;align-items:center;gap:8px;align-self:end"><input id="${id}" type="checkbox" ${val?"checked":""}> ${f.l}</label>`;
  if(f.t==="multi"){const set=new Set((val||[]).map(String));return `<div style="grid-column:1/-1"><div class="sub" style="margin-bottom:6px">${f.l}</div><div class="chips" id="${id}">${f.opt.map(([v,l])=>`<button type="button" data-v="${esc(v)}" aria-pressed="${set.has(String(v))}" onclick="this.setAttribute('aria-pressed',this.getAttribute('aria-pressed')!=='true')">${esc(l)}</button>`).join("")}</div>${f.hint?`<div class="sub" style="margin-top:4px">${f.hint}</div>`:""}</div>`}
  return `<label>${f.l}<input id="${id}" type="${f.t||"text"}" ${f.req?"required":""} ${f.min!=null?`min="${f.min}"`:""} ${f.step?`step="${f.step}"`:""} value="${esc(val??"")}"></label>`;
}
function readFields(fields){
  const o={};
  fields.forEach(f=>{const el=document.getElementById("f_"+f.k);let v;
    if(f.t==="bool")v=el.checked;
    else if(f.t==="multi")v=[...el.querySelectorAll("[aria-pressed=true]")].map(b=>Number(b.dataset.v));
    else{v=el.value.trim();
      if(f.t==="number")v=v===""?null:Number(v);
      else if(f.t==="select"&&f.num)v=v===""?null:Number(v);
      else if(v==="")v=null}
    o[f.k]=v});
  return o;
}

const TRASH=`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></svg>`;
async function renderBlock(def,el){

    <div class="panel rlist">${rows.length?rows.map(item).join(""):`<div class="rempty"><p class="empty" style="padding:22px 12px 10px">Rien pour l'instant.</p><div style="text-align:center;padding-bottom:20px"><button class="btn primary" data-add>+ Ajouter ${/^(filière|matière|salle|année)/.test(def.one)?"une":"un"} ${esc(def.one)}</button></div></div>`}</div>`;
  el.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>formDialog(def,null));
  el.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>formDialog(def,rows[b.dataset.e]));
  el.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>deleteDialog(def,rows[b.dataset.d]));
  const si=document.getElementById("s_"+def.table);

const NEED={department_id:"Créez d'abord un département (onglet Structure).",program_id:"Créez d'abord une filière (onglet Structure).",academic_year_id:"Créez d'abord une année universitaire (onglet Années et semestres).",status_id:"Aucun statut d'enseignant : ajoutez-en un dans « Statuts des enseignants »."};
function formDialog(def,row){
  const vals=row||def.defaults||{};
  const missing=def.fields.filter(f=>f.t==="select"&&f.req&&!f.opt.length);
  openDialog(`<h3>${row?"Modifier":"Ajouter"} : ${esc(def.one)}</h3>
    ${missing.length?`<div class="gpwarn">${missing.map(f=>esc(NEED[f.k]||"Aucun choix disponible pour « "+f.l+" ».")).join(" ")}</div>`:""}
    <div class="grid2">${def.fields.map(f=>fieldHtml(f,f.get?f.get(vals):vals[f.k])).join("")}</div>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok" ${missing.length?"disabled":""}>Enregistrer</button></div>`,
  async()=>{
    let o=readFields(def.fields);
    if(def.normalize)o=def.normalize(o);
    if(def.check)def.check(o);
    if(def.before)await def.before(o,row);
    const virt={};def.fields.filter(f=>f.virtual).forEach(f=>{virt[f.k]=o[f.k];delete o[f.k]});
    let saved=row;
    if(row)await q(sb.from(def.table).update(o).eq("id",row.id));
    else if(def.after)saved=await q(sb.from(def.table).insert(o).select().single());
    else await q(sb.from(def.table).insert(o));
    if(def.after)await def.after(o,saved,virt,row);
    toast("Enregistré");rerender();
  });
}
function deleteDialog(def,row){
  const nm=(def.name||(r=>r.name||r.label||r.code||("n° "+r.id)))(row);
  openDialog(`<h3>Supprimer « ${esc(nm)} » ?</h3>
    <p style="margin:0">La suppression est définitive. Si cet élément est déjà utilisé (séances, affectations, bulletins), elle sera refusée.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn danger" value="ok">Supprimer</button></div>`,
  async()=>{const r=await q(sb.from(def.table).delete().eq("id",row.id).select());
    if(!r.length)throw new Error("Suppression refusée.");toast("Supprimé");rerender()});
}

async function viewRef(v){
  const allowed=Object.keys(SEC_LABEL).filter(k=>k==="comptes"?has("admin"):has("planificateur"));
  const sec=allowed.includes(S.refSec)?S.refSec:allowed[0];S.refSec=sec;
  const isPl=has("planificateur");
  let counts=null;
  if(isPl)try{counts=await Promise.all(SETUP_STEPS.map(([,t])=>q(sb.from(t).select("id")).then(r=>r.length)))}catch(e){counts=null}
  const nextIdx=counts?counts.findIndex(n=>!n):-1,doneN=counts?counts.filter(n=>n>0).length:0;
  v.innerHTML=`<h1>Référentiel</h1>
    <p class="lead">Les données de l'université. Chaque changement est enregistré dans le journal. Les affectations et les créneaux se saisissent dans « Emplois du temps ».</p>
    ${counts?`<div class="panel setup"><div class="su-top"><div><b>Mise en place</b><div class="sub">${doneN===SETUP_STEPS.length?"Tout est renseigné.":"Suivez l'ordre : chaque étape dépend de la précédente."}</div></div><span class="su-n">${doneN}/${SETUP_STEPS.length}</span></div>
      <div class="hbar" style="width:100%;height:8px;margin:12px 0 ${doneN===SETUP_STEPS.length?0:12}px"><i style="width:${Math.round(doneN/SETUP_STEPS.length*100)}%"></i></div>
      ${doneN===SETUP_STEPS.length?"":`<div class="su-steps">${SETUP_STEPS.map(([l,,sc],i)=>`<button type="button" class="su ${counts[i]?"done":""} ${i===nextIdx?"next":""}" data-su="${sc}"><span class="su-i">${counts[i]?"✓":i+1}</span><span class="su-l">${l}</span><span class="su-c">${counts[i]||""}</span></button>`).join("")}</div>`}</div>`:""}
    <div class="chips secnav">${allowed.length>1?allowed.map(k=>`<button data-sec="${k}" aria-pressed="${k===sec}">${SEC_LABEL[k]}</button>`).join(""):""}</div>
    <div id="refBody"></div>`;
  v.querySelectorAll("[data-su]").forEach(b=>b.onclick=()=>{S.refSec=b.dataset.su;rerender()});
  v.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{S.refSec=b.dataset.sec;rerender()});
  const body=document.getElementById("refBody");
  if(sec==="comptes"){await viewAccounts(body);return}
  if(sec==="horaires"){await viewSchedule(body);return}
  const defs=refDefs(await refLookups());
  body.innerHTML=BLOCKS_BY_SEC[sec].map(k=>`<div id="blk-${k}"></div>`).join("");
  await Promise.all(BLOCKS_BY_SEC[sec].map(k=>renderBlock(defs[k],document.getElementById("blk-"+k))));
}


/* ---------- jours et horaires (réglage unique pour toute l'université) ---------- */
function slotsOf(sc){const out=[];const len=sc.len,st=hmin(sc.start),en=hmin(sc.end),lf=sc.lunchFrom?hmin(sc.lunchFrom):null,lt=sc.lunchTo?hmin(sc.lunchTo):null;
  const F=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
  dayStarts(st,en,len,lf,lt).forEach(t=>out.push(F(t)+"–"+F(t+len)));return out}
async function viewSchedule(el){
  const sc=await loadSchedule();
  el.innerHTML=`<div class="sechead"><h2>Jours et horaires</h2></div>
    <p class="sub" style="margin:-4px 0 12px">Définissez la semaine type de l'université. Ces réglages s'appliquent à la grille de disponibilités des professeurs, à la grille de l'emploi du temps et au générateur automatique.</p>
    <div class="panel" style="padding:20px"><form id="schForm" style="display:grid;gap:16px">
      <div><div class="sub" style="margin-bottom:6px">Jours de cours</div><div class="chips" id="shDays">${[1,2,3,4,5,6].map(d=>`<button type="button" data-d="${d}" aria-pressed="${sc.days.includes(d)}">${DAYS[d]}</button>`).join("")}</div></div>
      <div class="grid2"><label>Début de journée<input id="shStart" type="time" required value="${sc.start}"></label><label>Fin de journée<input id="shEnd" type="time" required value="${sc.end}"></label>
        <label>Durée d'un créneau<select id="shLen">${[...new Set([60,90,120,150,180,240,sc.len])].sort((a,b)=>a-b).map(m=>`<option value="${m}" ${m===sc.len?"selected":""}>${m%60?Math.floor(m/60)+" h "+(m%60):m/60+" h"}</option>`).join("")}</select></label><span></span>
        <label>Pause : de<input id="shLf" type="time" value="${sc.lunchFrom}"></label><label>Pause : à<input id="shLt" type="time" value="${sc.lunchTo}"></label></div>
      <div><div class="sub" style="margin-bottom:6px">Créneaux d'une journée</div><div class="chips" id="shPrev"></div></div>
      <div class="err" id="shErr"></div>
      <div class="row" style="justify-content:flex-end"><button class="btn primary" type="submit">Enregistrer</button></div></form></div>
    <p class="sub">Une journée ou un créneau sans cours (jour férié, activité) se marque semaine par semaine, dans « Générer la semaine ».</p>`;
  const read=()=>({days:[...document.querySelectorAll("#shDays [aria-pressed=true]")].map(b=>Number(b.dataset.d)),start:shStart.value,end:shEnd.value,len:Number(shLen.value),lunchFrom:shLf.value,lunchTo:shLt.value});
  const prev=()=>{const c=read();shPrev.innerHTML=(c.start&&c.end&&c.end>c.start?slotsOf(c):[]).map(x=>`<span class="pill p-info">${x}</span>`).join("")||'<span class="sub">Aucun créneau avec ces réglages.</span>'};
  document.querySelectorAll("#shDays button").forEach(b=>b.onclick=()=>{b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true")});
  ["shStart","shEnd","shLen","shLf","shLt"].forEach(i=>document.getElementById(i).oninput=prev);prev();
  schForm.onsubmit=async ev=>{ev.preventDefault();shErr.textContent="";
    try{const c=read();
      if(!c.days.length)throw new Error("Choisissez au moins un jour.");
      if(c.end<=c.start)throw new Error("La fin de journée doit être après le début.");
      if(!!c.lunchFrom!==!!c.lunchTo||(c.lunchFrom&&c.lunchTo<=c.lunchFrom))throw new Error("Pause : indiquez une heure de début et de fin (ou laissez les deux vides).");
      if(hmin(c.end)-hmin(c.start)<c.len)throw new Error("La journée est plus courte qu'un créneau.");
      const r=await q(sb.from("school_schedule").update({days:c.days.sort(),day_start:c.start,day_end:c.end,slot_minutes:c.len,lunch_start:c.lunchFrom||null,lunch_end:c.lunchTo||null,updated_at:new Date().toISOString()}).eq("id",1).select());
      if(!r.length)throw new Error("Enregistrement refusé.");
      await loadSchedule();toast("Jours et horaires enregistrés")}
    catch(e){shErr.textContent=errMsg(e)}};
}

async function callUsers(body){

async function viewAccounts(el){
  const [profiles,roles,teachers,deps]=await Promise.all([
    q(sb.from("profiles").select("id,full_name,email,active").order("full_name")),
    q(sb.from("user_roles").select("id,user_id,role,department_id")),

  });
  el.querySelectorAll("[data-ac]").forEach(b=>b.onclick=()=>{

    async()=>{await callUsers({action:"set_active",user_id:u.id,active:to});toast(to?"Compte réactivé":"Compte désactivé");rerender()});
  });
}

    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Changer</button></div>`,
  async()=>{if(pw1.value!==pw2.value)throw new Error("Les deux mots de passe ne sont pas identiques.");
    const {error}=await sb.auth.updateUser({password:pw1.value});if(error)throw error;toast("Mot de passe modifié")});
}

/* ---------- paie ---------- */
const PER={ouverte:["Ouverte","p-mute"],en_verification:["Calculée, à vérifier","p-warn"],approuvee:["Approuvée","p-info"],payee:["Payée","p-ok"]};
const SLIP={approuve:["À payer","p-warn"],partiellement_paye:["Partiellement payé","p-info"],paye:["Payé","p-ok"]};
const pct=(a,b)=>b?Math.round(a/b*100):0;
function ppill(map,st){const [l,c]=map[st]||[st,"p-mute"];return `<span class="pill ${c}">${l}</span>`}
function fcfa(n){return Math.round(n||0).toLocaleString("fr-FR").replace(/[  ]/g," ")+" FCFA"}
function fdl(s){if(!s)return "—";const [y,m,d]=String(s).slice(0,10).split("-");return `${d}/${m}/${y}`}
function canPay(){return has("finance")}

async function viewPayroll(v){
  const periods=await q(sb.from("pay_periods").select("*").order("start_date",{ascending:false}));
  const totals=await q(sb.from("payslips").select("pay_period_id,net_fcfa"));
  const items=await q(sb.from("payroll_items").select("pay_period_id,amount_fcfa"));
  const sum=(arr,id)=>arr.filter(x=>x.pay_period_id===id).reduce((s,x)=>s+(x.net_fcfa??x.amount_fcfa),0);
  if(!periods.some(p=>p.id===S.periodId))S.periodId=(periods.find(p=>p.status==="ouverte"||p.status==="en_verification")||periods[0])?.id;
  const p=periods.find(x=>x.id===S.periodId);
  v.innerHTML=`<h1>Paie</h1>
    <p class="lead">Rémunération à l'heure, calculée uniquement sur les heures validées. Une fois la période approuvée, les bulletins sont figés.</p>
    <div class="sechead"><h2>Périodes de rémunération</h2>${canPay()?`<button class="btn sm primary" id="newP">+ Nouvelle période</button>`:""}</div>
    ${periods.length?`<div class="plist">${periods.map(x=>{const amt=x.status==="ouverte"?null:["approuvee","payee"].includes(x.status)?sum(totals,x.id):sum(items,x.id);
      return `<button type="button" class="pcard" data-p="${x.id}" aria-pressed="${x.id===S.periodId}"><span class="pc-top"><b>${esc(x.name)}</b>${ppill(PER,x.status)}</span>
      <span class="pc-dates">Du ${fdl(x.start_date)} au ${fdl(x.end_date)}</span>
      <span class="pc-bot"><span class="sub">${x.attendance_deadline?"Émargement avant le "+fdl(x.attendance_deadline):"Sans limite d'émargement"}</span><span class="pc-amt">${amt==null?"—":fcfa(amt)}</span></span></button>`}).join("")}</div>`:`<div class="panel"><p class="empty">Aucune période. Créez la première période de rémunération.</p></div>`}
    <div id="pDetail"></div>`;
  v.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{S.periodId=Number(b.dataset.p);rerender();setTimeout(()=>document.getElementById("pDetail")?.scrollIntoView({behavior:"smooth",block:"start"}),60)});
  if(canPay()&&document.getElementById("newP"))newP.onclick=periodDialog;
  if(p)await periodDetail(document.getElementById("pDetail"),p);
}

function periodDialog(){
  openDialog(`<h3>Nouvelle période de rémunération</h3>
    <label>Nom<input id="nN" required placeholder="Ex. : Novembre 2026"></label>
    <div class="row"><label>Du<input id="nS" type="date" required></label><label>Au<input id="nE" type="date" required></label></div>
    <div class="row"><label>Limite d'émargement<input id="nD" type="date"></label><label>Échéance de régularisation<input id="nR" type="date"></label></div>
    <p class="sub" style="margin:0">La période peut durer un mois, une quinzaine, un semestre ou toute autre durée.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Créer la période</button></div>`,
  async()=>{
    if(nE.value<nS.value)throw new Error("La date de fin doit être postérieure à la date de début.");
    const r=await q(sb.from("pay_periods").insert({name:nN.value.trim(),start_date:nS.value,end_date:nE.value,attendance_deadline:nD.value||null,regularization_deadline:nR.value||null,manager_id:S.user.id}).select().single());
    S.periodId=r.id;toast("Période créée");rerender();
  });
}

async function periodDetail(el,p){
  const frozen=["approuvee","payee"].includes(p.status);
  if(!frozen){
    const [items,pending]=await Promise.all([
      q(sb.from("payroll_items").select("*,teachers(first_name,last_name,teacher_statuses(label))").eq("pay_period_id",p.id).order("session_date")),
      q(sb.from("attendance_records").select("id,status,schedule_sessions!inner(session_date)").in("status",["soumis","correction_demandee"]).gte("schedule_sessions.session_date",p.start_date).lte("schedule_sessions.session_date",p.end_date))]);
    const by=groupBy(items);
    const tot=items.reduce((s,i)=>s+i.amount_fcfa,0);
    el.innerHTML=`<div class="panel phead"><div class="ph-top"><div><div class="sub">Période sélectionnée</div><h2>${esc(p.name)}</h2><div class="sub">Du ${fdl(p.start_date)} au ${fdl(p.end_date)}</div></div>${ppill(PER,p.status)}</div>
      ${canPay()?`<div class="ph-act"><button class="btn ${p.status==="ouverte"?"primary":""}" id="calc">${p.status==="ouverte"?"Calculer la paie":"Recalculer"}</button>
        ${p.status==="en_verification"&&items.length?`<button class="btn primary" id="appr">Approuver et générer les bulletins</button>`:""}
        ${p.status==="ouverte"?`<button class="btn danger" id="delP">Supprimer</button>`:""}</div>`:""}
      ${items.length?`<div class="ph-x">${xbar("pX")}</div>`:""}</div>
      ${pending.length?`<p class="pill p-warn" style="display:inline-block;margin:0 0 12px">${pending.length} émargement(s) de la période ne sont pas encore validés : ils ne seront pas payés dans cette période.</p>`:""}
      ${p.status==="en_verification"?`<p class="sub" style="margin:0 0 12px">Dernier calcul : ${new Date(p.calculated_at).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"})}. Recalculez si de nouveaux émargements ont été validés depuis.</p>`:""}
      ${items.length?`<div class="stats"><div class="stat big"><b>${fcfa(tot)}</b><span>Total à payer (brut = net)</span></div><div class="stat"><b>${by.length}</b><span>Enseignants</span></div><div class="stat"><b>${items.length}</b><span>Séances payables</span></div></div>
      <div class="sechead"><h2>Enseignants</h2><span class="sub" id="tCount">${by.length}</span></div>${searchBox("tSearch","Rechercher un enseignant…")}<div id="tList">${teacherTable(by)}</div>`:`<div class="panel"><p class="empty">${p.status==="ouverte"?"Lancez le calcul pour obtenir les montants de la période.":"Aucune heure validée payable dans cette période."}</p></div>`}`;
    if(canPay()){
      calc.onclick=async()=>{try{const r=await q(sb.rpc("calculate_payroll",{p_period:p.id}));
        toast(`${r.lignes} séance(s) payable(s) · ${fcfa(r.total_fcfa)}`+(r.sans_tarif?` · ${r.sans_tarif} sans tarif défini`:""),r.sans_tarif>0);rerender()}catch(e){toast(errMsg(e),true)}};
      document.getElementById("appr")&&(appr.onclick=()=>openDialog(`<h3>Approuver la période ?</h3>
        <p style="margin:0">${by.length} bulletin(s) pour un total de <b>${fcfa(tot)}</b> vont être générés. Après approbation, les montants sont figés et ces séances ne pourront plus être payées dans une autre période.</p>
        ${pending.length?`<p class="sub" style="margin:0">${pending.length} émargement(s) non validé(s) restent en dehors de cette paie.</p>`:""}
        <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Approuver</button></div>`,
        async()=>{const n=await q(sb.rpc("approve_payroll",{p_period:p.id}));toast(`${n} bulletin(s) générés`);rerender()}));
      document.getElementById("delP")&&(delP.onclick=()=>openDialog(`<h3>Supprimer « ${esc(p.name)} » ?</h3><p style="margin:0">La période n'a pas encore été approuvée. Aucune donnée d'émargement ne sera perdue.</p>
        <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn danger" value="ok">Supprimer</button></div>`,
        async()=>{await q(sb.from("pay_periods").delete().eq("id",p.id));S.periodId=null;toast("Période supprimée");rerender()}));
    }
    const wireDt=()=>el.querySelectorAll("[data-dt]").forEach(b=>b.onclick=()=>linesDialog(by.find(o=>o.id==b.dataset.dt)));
    wireDt();
    const ts=document.getElementById("tSearch");
    if(ts)ts.oninput=()=>{const k=norm(ts.value.trim()),f=by.filter(o=>norm(o.t.first_name+" "+o.t.last_name+" "+o.t.last_name+" "+o.t.first_name).includes(k));
      document.getElementById("tList").innerHTML=f.length?teacherTable(f):`<div class="panel"><p class="empty">Aucun enseignant ne correspond à « ${esc(ts.value)} ».</p></div>`;
      document.getElementById("tCount").textContent=f.length===by.length?by.length:f.length+" sur "+by.length;wireDt()};
    wireExport("pX",()=>({file:"paie_"+slug(p.name)+"_provisoire",title:"Paie : "+p.name+" (calcul provisoire)",subtitle:"Du "+fdl(p.start_date)+" au "+fdl(p.end_date),landscape:true,sheets:[
      {name:"Par enseignant",title:"Total par enseignant (FCFA)",head:["Enseignant","Statut","Séances","Heures","Montant (FCFA)"],
       rows:by.map(o=>[o.t.last_name+" "+o.t.first_name,o.t.teacher_statuses?.label||"",o.lines.length,dh(o.min),o.amt]).concat([["Total","",items.length,dh(by.reduce((s,o)=>s+o.min,0)),tot]])},
      {name:"Détail des séances",title:"Détail des séances",head:["Enseignant","Date","Cours","Groupe","Heures","Tarif (FCFA/h)","Montant (FCFA)","Rattrapage"],
       rows:by.flatMap(o=>o.lines.map(l=>[o.t.last_name+" "+o.t.first_name,fdl(l.session_date),l.course_label,l.group_code,dh(l.minutes),l.rate_fcfa,l.amount_fcfa,l.is_catch_up?"Oui":""]))}]}));
    return;
  }
  const [slips,pays]=await Promise.all([
    q(sb.from("payslips").select("*").eq("pay_period_id",p.id).order("number")),
    q(sb.from("payments").select("*,payslips!inner(pay_period_id)").eq("payslips.pay_period_id",p.id).order("paid_on"))]);
  const paid=id=>pays.filter(x=>x.payslip_id===id).reduce((s,x)=>s+x.amount_fcfa,0);
  const tot=slips.reduce((s,x)=>s+x.net_fcfa,0),tp=slips.reduce((s,x)=>s+paid(x.id),0);
  const slipRows=list=>list.map(s=>{const pd=paid(s.id),du=s.net_fcfa-pd;return `<div class="slip"><div class="sl-main"><b>${esc(s.snapshot.enseignant.nom)}</b><div class="sub">${esc(s.snapshot.enseignant.statut||"")} · ${hrs(s.total_minutes)} · <span class="mono">${esc(s.number)}</span></div></div>
      <div class="sl-amt"><div class="sl-net">${fcfa(s.net_fcfa)}</div><div class="hbar"><i style="width:${pct(pd,s.net_fcfa)}%;background:${du?"var(--accent)":"var(--ok)"}"></i></div><div class="sub">${du?`Réglé ${fcfa(pd)} · reste ${fcfa(du)}`:"Entièrement réglé"}</div></div>
      <div class="sl-act">${ppill(SLIP,s.status)}<button class="btn sm" data-pdf="${s.id}">PDF</button>${canPay()&&s.status!=="paye"?`<button class="btn primary sm" data-pay="${s.id}">Payer</button>`:""}</div></div>`}).join("");
  el.innerHTML=`<div class="panel phead"><div class="ph-top"><div><div class="sub">Période sélectionnée</div><h2>${esc(p.name)}</h2><div class="sub">Du ${fdl(p.start_date)} au ${fdl(p.end_date)} · approuvée le ${new Date(p.approved_at).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})}</div></div>${ppill(PER,p.status)}</div>
      <div class="ph-prog"><div class="hbar"><i style="width:${pct(tp,tot)}%;background:${tot-tp?"var(--accent)":"var(--ok)"}"></i></div><div class="sub">${pct(tp,tot)} % réglé · ${slips.length} bulletin${slips.length>1?"s":""} figé${slips.length>1?"s":""}</div></div>
      ${slips.length?`<div class="ph-x">${xbar("pX")}</div>`:""}</div>
    <div class="stats"><div class="stat"><b>${fcfa(tot)}</b><span>Net à payer</span></div><div class="stat"><b>${fcfa(tp)}</b><span>Réglé</span></div>
      <div class="stat"><b style="color:${tot-tp?"var(--warn)":"var(--ok)"}">${fcfa(tot-tp)}</b><span>Reste dû</span></div></div>
    <div class="sechead"><h2>Bulletins</h2><span class="sub" id="sCount">${slips.length}</span></div>${searchBox("sSearch","Rechercher un enseignant ou un n° de bulletin…")}<div class="panel slips" id="sList"></div>
    ${pays.length?`<h2>Règlements enregistrés</h2><div class="panel tbl"><table><thead><tr><th>Date</th><th>Bulletin</th><th>Mode</th><th>Référence</th><th>Montant</th></tr></thead><tbody>
    ${pays.map(x=>`<tr><td class="mono">${fdl(x.paid_on)}</td><td class="mono">${esc(slips.find(s=>s.id===x.payslip_id)?.number)}</td><td>${esc(x.method)}</td><td class="mono">${esc(x.reference||"—")}</td><td class="num">${fcfa(x.amount_fcfa)}</td></tr>`).join("")}</tbody></table></div>`:""}`;
  const wireSlips=()=>{el.querySelectorAll("[data-pdf]").forEach(b=>b.onclick=()=>downloadSlip(slips.find(s=>s.id==b.dataset.pdf),pays));
  wireExport("pX",()=>({file:"paie_"+slug(p.name),title:"État de paie : "+p.name,subtitle:"Du "+fdl(p.start_date)+" au "+fdl(p.end_date)+" · approuvée le "+fdl(p.approved_at),landscape:true,sheets:[
    {name:"Bulletins",title:"Bulletins (FCFA)",head:["Bulletin","Enseignant","Statut","Heures","Net à payer (FCFA)","Réglé (FCFA)","Reste dû (FCFA)","État"],
     rows:slips.map(s=>[s.number,s.snapshot.enseignant.nom,s.snapshot.enseignant.statut||"",dh(s.total_minutes),s.net_fcfa,paid(s.id),s.net_fcfa-paid(s.id),s.status])
       .concat([["Total","","",dh(slips.reduce((a,s)=>a+s.total_minutes,0)),tot,tp,tot-tp,""]])},
    {name:"Règlements",title:"Règlements enregistrés",head:["Date","Bulletin","Mode","Référence","Montant (FCFA)"],
     rows:pays.map(x=>[fdl(x.paid_on),slips.find(s=>s.id===x.payslip_id)?.number||"",x.method,x.reference||"",x.amount_fcfa])}]}));
  el.querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>{const s=slips.find(x=>x.id==b.dataset.pay);const due=s.net_fcfa-paid(s.id);
    openDialog(`<h3>Enregistrer un paiement</h3>
      <dl class="kv"><dt>Bulletin</dt><dd class="mono">${esc(s.number)}</dd><dt>Enseignant</dt><dd>${esc(s.snapshot.enseignant.nom)}</dd><dt>Reste dû</dt><dd class="mono">${fcfa(due)}</dd></dl>
      <div class="row"><label>Montant (FCFA)<input id="pA" type="number" min="1" max="${due}" required value="${due}"></label><label>Date<input id="pD" type="date" required value="${iso(new Date())}"></label></div>
      <div class="row"><label>Mode<select id="pM"><option>virement</option><option>Wave</option><option>Orange Money</option><option>chèque</option><option>espèces</option></select></label><label>Référence<input id="pR" placeholder="N° de virement, de transaction…"></label></div>
      <p class="sub" style="margin:0">Le paiement est enregistré par le service financier. Il n'exécute aucun virement.</p>
      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Enregistrer</button></div>`,
    async()=>{await q(sb.rpc("record_payment",{p_payslip:s.id,p_amount:Number(pA.value),p_paid_on:pD.value,p_method:pM.value,p_reference:pR.value.trim()||null}));toast("Paiement enregistré");rerender()})})};
  const sl=document.getElementById("sList");
  const showSlips=k=>{const f=slips.filter(x=>norm(x.snapshot.enseignant.nom+" "+x.number).includes(k));sl.innerHTML=f.length?slipRows(f):`<p class="empty">Aucun bulletin ne correspond à cette recherche.</p>`;document.getElementById("sCount").textContent=f.length===slips.length?slips.length:f.length+" sur "+slips.length;wireSlips()};
  showSlips("");const ss=document.getElementById("sSearch");if(ss)ss.oninput=()=>showSlips(norm(ss.value.trim()));
}

const norm=t=>String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const searchBox=(id,ph)=>`<label class="searchbox"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="${id}" type="search" placeholder="${ph}" autocomplete="off"></label>`;
function groupBy(items){
  const m={};items.forEach(i=>{m[i.teacher_id]??={id:i.teacher_id,t:i.teachers,lines:[],min:0,amt:0};const o=m[i.teacher_id];o.lines.push(i);o.min+=i.minutes;o.amt+=i.amount_fcfa});
  return Object.values(m).sort((a,b)=>a.t.last_name.localeCompare(b.t.last_name));
}
function teacherTable(by){
  return `<div class="panel tbl"><table><thead><tr><th>Enseignant</th><th>Statut</th><th>Séances</th><th>Heures</th><th>Tarif(s)</th><th>Montant</th><th></th></tr></thead><tbody>
  ${by.map(o=>{const rates=[...new Set(o.lines.map(l=>l.rate_fcfa+(l.rate_source==="individuel"?" (indiv.)":"")))];const catchUp=o.lines.some(l=>l.is_catch_up);
    return `<tr><td>${esc(o.t.first_name+" "+o.t.last_name)}${catchUp?`<div><span class="pill p-info">Rattrapage inclus</span></div>`:""}</td><td>${esc(o.t.teacher_statuses?.label)}</td>
    <td class="num">${o.lines.length}</td><td class="num">${hrs(o.min)}</td><td class="mono">${rates.map(esc).join(" / ")}</td><td class="num"><b>${fcfa(o.amt)}</b></td>
    <td><button class="btn sm" data-dt="${o.id}">Détail</button></td></tr>`}).join("")}</tbody></table></div>`;
}
function linesDialog(o){
  openDialog(`<h3>${esc(o.t.first_name+" "+o.t.last_name)}</h3>
    <div class="tbl"><table><thead><tr><th>Date</th><th>Cours</th><th>Durée</th><th>Tarif</th><th>Montant</th></tr></thead><tbody>
    ${o.lines.map(l=>`<tr><td class="mono">${fdl(l.session_date)}${l.is_catch_up?' <span class="pill p-info">rattrapage</span>':""}</td><td>${esc(l.course_label)}<div class="sub">${esc(l.group_code)}</div></td><td class="num">${hrs(l.minutes)}</td><td class="num">${l.rate_fcfa}${l.rate_source==="individuel"?"*":""}</td><td class="num">${fcfa(l.amount_fcfa)}</td></tr>`).join("")}
    </tbody></table></div><p class="sub" style="margin:0">Montant = durée retenue × tarif horaire en vigueur à la date de la séance. * tarif individuel.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Fermer</button></div>`,async()=>{});
}

function downloadSlip(slip,payments){
  try{
    if(!window.jspdf)throw new Error("Le module PDF n'a pas pu être chargé. Vérifiez la connexion et rechargez la page.");
    const doc=makePayslipPdf(window.jspdf.jsPDF,slip,payments.filter(p=>p.payslip_id===slip.id));
    doc.save(`${slip.number}_${slip.snapshot.enseignant.nom.replace(/\s+/g,"-")}.pdf`);
  }catch(e){toast(errMsg(e),true)}
}

/* ---------- tarifs ---------- */
async function viewRates(v){
  const [statuses,rates,teachers,used]=await Promise.all([
    q(sb.from("teacher_statuses").select("id,code,label").order("id")),
    q(sb.from("hourly_rates").select("*").order("effective_from",{ascending:false})),
    q(sb.from("teachers").select("id,first_name,last_name,status_id").order("last_name")),
    q(sb.from("payroll_items").select("rate_id"))]);
  const usedIds=new Set(used.map(u=>u.rate_id));
  const today=iso(new Date());
  const current=(list)=>list.filter(r=>r.effective_from<=today).sort((a,b)=>b.effective_from.localeCompare(a.effective_from))[0];
  const target=r=>r.status_id?statuses.find(s=>s.id===r.status_id)?.label:(()=>{const t=teachers.find(t=>t.id===r.teacher_id);return t?t.first_name+" "+t.last_name:"?"})();
  const indiv=teachers.filter(t=>rates.some(r=>r.teacher_id===t.id));
  v.innerHTML=`<h1>Tarifs horaires</h1>
    <p class="lead">Le tarif dépend du statut de l'enseignant. Une exception individuelle remplace le tarif du statut. Pour changer un tarif, ajoutez-en un nouveau avec sa date d'effet : l'ancien reste appliqué aux séances antérieures.</p>
    <div class="row" style="justify-content:space-between"><h2 style="margin-top:0">Tarifs en vigueur au ${fdl(today)}</h2>${canPay()?`<button class="btn sm primary" id="addRate">Nouveau tarif</button>`:""}</div>
    <div class="panel tbl"><table><thead><tr><th>Statut</th><th>Tarif horaire</th><th>Depuis le</th><th>Enseignants</th></tr></thead><tbody>
    ${statuses.map(s=>{const c=current(rates.filter(r=>r.status_id===s.id));const next=rates.filter(r=>r.status_id===s.id&&r.effective_from>today).at(-1);
      return `<tr><td>${esc(s.label)}</td><td class="num"><b>${c?fcfa(c.rate_fcfa):"Non défini"}</b>${next?`<div class="sub">${fcfa(next.rate_fcfa)} à partir du ${fdl(next.effective_from)}</div>`:""}</td><td class="mono">${c?fdl(c.effective_from):"—"}</td><td class="num">${teachers.filter(t=>t.status_id===s.id).length}</td></tr>`}).join("")}
    ${indiv.map(t=>{const c=current(rates.filter(r=>r.teacher_id===t.id));return `<tr><td>${esc(t.first_name+" "+t.last_name)} <span class="pill p-info">Individuel</span></td><td class="num"><b>${c?fcfa(c.rate_fcfa):"pas encore en vigueur"}</b></td><td class="mono">${c?fdl(c.effective_from):"—"}</td><td></td></tr>`}).join("")}
    </tbody></table></div>
    <h2>Historique</h2>
    <div class="panel tbl"><table><thead><tr><th>Date d'effet</th><th>S'applique à</th><th>Tarif</th><th>Note</th><th></th></tr></thead><tbody>
    ${rates.map(r=>`<tr><td class="mono">${fdl(r.effective_from)}</td><td>${esc(target(r))}${r.teacher_id?' <span class="pill p-info">Individuel</span>':""}</td><td class="num">${fcfa(r.rate_fcfa)}</td><td class="sub">${esc(r.note||"")}</td>
      <td>${usedIds.has(r.id)?`<span class="sub">Utilisé en paie</span>`:canPay()?`<button class="btn sm danger" data-del="${r.id}">Supprimer</button>`:""}</td></tr>`).join("")}</tbody></table></div>`;
  if(!canPay())return;
  addRate.onclick=()=>openDialog(`<h3>Nouveau tarif horaire</h3>
    <label>S'applique à<select id="rTg"><optgroup label="Statut">${statuses.map(s=>`<option value="s${s.id}">${esc(s.label)}</option>`).join("")}</optgroup>
      <optgroup label="Exception individuelle">${teachers.map(t=>`<option value="t${t.id}">${esc(t.first_name+" "+t.last_name)}</option>`).join("")}</optgroup></select></label>
    <div class="row"><label>Tarif horaire (FCFA)<input id="rAmt" type="number" min="1" step="500" required></label><label>Date d'effet<input id="rFrom" type="date" required value="${today}"></label></div>
    <label>Note<input id="rNote" placeholder="Ex. : décision du conseil du 12/10/2026"></label>
    <p class="sub" style="margin:0">Les séances déjà payées ne sont jamais recalculées.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Enregistrer</button></div>`,
    async()=>{const tg=rTg.value,id=Number(tg.slice(1));
      await q(sb.from("hourly_rates").insert({status_id:tg[0]==="s"?id:null,teacher_id:tg[0]==="t"?id:null,rate_fcfa:Number(rAmt.value),effective_from:rFrom.value,note:rNote.value.trim()||null}));
      toast("Tarif enregistré");rerender()});
  v.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{try{const r=await q(sb.from("hourly_rates").delete().eq("id",b.dataset.del).select());
    if(!r.length)throw new Error("Ce tarif a déjà servi au calcul d'une paie : il ne peut pas être supprimé.");toast("Tarif supprimé");rerender()}catch(e){toast(errMsg(e),true)}});
}

/* ---------- mes bulletins ---------- */
async function viewMyPayslips(v){
  const [slips,pays,unpaid]=await Promise.all([
    q(sb.from("payslips").select("*").eq("teacher_id",S.teacher.id).order("generated_at",{ascending:false})),
    q(sb.from("payments").select("*")),
    q(sb.from("attendance_records").select("retained_minutes").eq("teacher_id",S.teacher.id).eq("status","valide").is("pay_period_id",null))]);
  const paid=id=>pays.filter(x=>x.payslip_id===id).reduce((s,x)=>s+x.amount_fcfa,0);
  const waiting=unpaid.reduce((s,a)=>s+a.retained_minutes,0);
  v.innerHTML=`<h1>Mes bulletins</h1>
    <p class="lead">Vos bulletins de rémunération approuvés. Ils ne sont visibles que par vous et par le service financier.</p>
    <div class="stats"><div class="stat"><b>${slips.length}</b><span>Bulletins</span></div>
      <div class="stat"><b>${fcfa(slips.reduce((s,x)=>s+x.net_fcfa,0))}</b><span>Total net</span></div>
      <div class="stat"><b>${hrs(waiting)}</b><span>Heures validées pas encore payées</span></div></div>
    <div class="panel tbl">${slips.length?`<table><thead><tr><th>Bulletin</th><th>Période</th><th>Heures</th><th>Net à payer</th><th>Réglé</th><th>État</th><th></th></tr></thead><tbody>
    ${slips.map(s=>`<tr><td class="mono">${esc(s.number)}</td><td>${esc(s.snapshot.periode.nom)}<div class="sub mono">${fdl(s.snapshot.periode.debut)} au ${fdl(s.snapshot.periode.fin)}</div></td>
      <td class="num">${hrs(s.total_minutes)}</td><td class="num"><b>${fcfa(s.net_fcfa)}</b></td><td class="num">${fcfa(paid(s.id))}</td><td>${ppill(SLIP,s.status)}</td>
      <td><button class="btn sm primary" data-pdf="${s.id}">Télécharger le PDF</button></td></tr>`).join("")}</tbody></table>`:`<p class="empty">Aucun bulletin pour l'instant. Il apparaîtra ici dès que le service financier aura approuvé une période.</p>`}</div>`;
  v.querySelectorAll("[data-pdf]").forEach(b=>b.onclick=()=>downloadSlip(slips.find(s=>s.id==b.dataset.pdf),pays));
}

/* ---------- journal ---------- */
async function viewAudit(v){
  const rows=await q(sb.from("audit_logs").select("*").order("occurred_at",{ascending:false}).limit(200));
  const ids=[...new Set(rows.map(r=>r.actor).filter(Boolean))];
  const people=ids.length?await q(sb.from("profiles").select("id,full_name").in("id",ids)):[];
  const nm=id=>people.find(p=>p.id===id)?.full_name||"Système";
  const OP={INSERT:"Création",UPDATE:"Modification",DELETE:"Suppression"};
  const TB={attendance_records:"Émargement",schedule_sessions:"Séance",timetable_slots:"Créneau",teaching_assignments:"Affectation",user_roles:"Rôle",teachers:"Enseignant",profiles:"Profil",hourly_rates:"Tarif",pay_periods:"Période de paie",payslips:"Bulletin",payments:"Paiement",teacher_statuses:"Statut"};
  const detail=r=>{if(r.table_name==="attendance_records"&&r.new_data){const o=r.old_data?.status,n=r.new_data.status;return o&&o!==n?`${ATT[o]?.[0]||o} → ${ATT[n]?.[0]||n}`:(ATT[n]?.[0]||"")}
    if(r.table_name==="schedule_sessions"&&r.new_data)return `${r.new_data.session_date} ${hm(r.new_data.start_time)} · ${r.new_data.status}`;
    if(r.table_name==="pay_periods"&&r.new_data)return `${r.new_data.name} · ${PER[r.new_data.status]?.[0]||r.new_data.status}`;
    if(r.table_name==="payslips"&&r.new_data)return `${r.new_data.number} · ${fcfa(r.new_data.net_fcfa)}`;
    if(r.table_name==="payments"&&r.new_data)return `${fcfa(r.new_data.amount_fcfa)} · ${r.new_data.method}`;
    if(r.table_name==="hourly_rates"&&r.new_data)return `${fcfa(r.new_data.rate_fcfa)} dès le ${fdl(r.new_data.effective_from)}`;
    return ""};
  v.innerHTML=`<h1>Journal des opérations</h1><p class="lead">Chaque création, modification ou suppression sensible est enregistrée avec son auteur et l'heure.</p>
    <div class="panel tbl">${rows.length?`<table><thead><tr><th>Date</th><th>Auteur</th><th>Opération</th><th>Élément</th><th>Détail</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td class="mono">${new Date(r.occurred_at).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"})}</td><td>${esc(nm(r.actor))}</td><td>${OP[r.action]||r.action}</td><td>${TB[r.table_name]||r.table_name} <span class="sub mono">#${esc(r.record_id)}</span></td><td>${esc(detail(r))}</td></tr>`).join("")}
    </tbody></table>`:`<p class="empty">Aucune opération enregistrée pour l'instant. Les émargements et validations apparaîtront ici.</p>`}</div>`;
}

sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_OUT")renderLogin()});
boot();
</script>
