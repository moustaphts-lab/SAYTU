<style>
/* Design : sobre, vert profond, grandes zones tactiles. Sur téléphone : navigation en bas, tableaux en cartes, fenêtres en feuille basse. */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --line:#e1e7e4; --ink:#14201b; --muted:#5f6e67;
  --accent:#0b6e5b; --accent-ink:#ffffff; --accent-soft:#dff1ec; --ochre:#b06a00;
  --ok:#1b7a47; --ok-soft:#e1f3e8; --warn:#92580a; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#fbe7e4;
  --r:14px; --shadow:0 1px 2px rgba(20,32,27,.05),0 4px 14px rgba(20,32,27,.04);
  --f-display:"Bricolage Grotesque", system-ui, sans-serif; --f-body:"Instrument Sans", system-ui, sans-serif; --f-mono:"Instrument Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1512; --surface:#151f1b; --line:#25332d; --ink:#e7efeb; --muted:#9bada5;
  --accent:#4fd1b0; --accent-ink:#06231c; --accent-soft:#143229; --ochre:#e3a94f;
  --ok:#5cc58c; --ok-soft:#163324; --warn:#e7b04f; --warn-soft:#3a2c12; --bad:#f0857c; --bad-soft:#3d1a18; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1512; --surface:#151f1b; --line:#25332d; --ink:#e7efeb; --muted:#9bada5;
  --accent:#4fd1b0; --accent-ink:#06231c; --accent-soft:#143229; --ochre:#e3a94f;
  --ok:#5cc58c; --ok-soft:#163324; --warn:#e7b04f; --warn-soft:#3a2c12; --bad:#f0857c; --bad-soft:#3d1a18; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top .bar{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font:700 18px var(--f-display);letter-spacing:-.01em}
.brand i{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 17px var(--f-display);font-style:normal}
.brand small{display:block;font:400 12px var(--f-body);color:var(--muted);letter-spacing:0}
.menu{margin-left:auto;position:relative}
.menu summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:5px 6px 5px 5px;border-radius:99px;border:1px solid var(--line)}
.menu summary::-webkit-details-marker{display:none}
.menu .av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 13px var(--f-body)}
.menu .nm{font-size:13px;font-weight:500;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px}
.menu .pop{position:absolute;right:0;top:calc(100% + 8px);width:min(280px,86vw);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 32px rgba(10,20,15,.18);padding:12px;display:flex;flex-direction:column;gap:8px;z-index:8}
.menu .pop p{margin:0 0 4px;font-size:13px;color:var(--muted)}
.menu .pop p b{display:block;color:var(--ink);font-size:14px;overflow-wrap:anywhere}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-radius:99px;padding:8px 14px;font:500 14px var(--f-body);color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button:hover{background:var(--bg)}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
main{padding-block:26px 64px}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.02em;line-height:1.15;margin:0 0 6px;text-wrap:balance}

.lead{color:var(--muted);margin:0 0 20px;max-width:68ch}

table{width:100%;border-collapse:collapse;font-size:14px}

.p-mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.gap{color:var(--ochre);font-weight:600}
button.btn,.btn{font:600 14px var(--f-body);border-radius:10px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.btn.danger{color:var(--bad)}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted)}

textarea{min-height:76px;resize:vertical}

.login .panel{padding:24px;display:flex;flex-direction:column;gap:14px}

.toast.bad{background:var(--bad);color:#fff}
dialog{border:0;border-radius:18px;background:var(--surface);color:var(--ink);padding:0;width:min(540px,94vw);max-height:90dvh;box-shadow:0 24px 60px rgba(10,20,15,.3)}
dialog::backdrop{background:rgba(8,16,12,.5)}
dialog form{padding:22px;display:flex;flex-direction:column;gap:14px}
dialog h3{margin:0;font:700 20px var(--f-display);letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.week{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:10px;overflow-x:auto}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-height:120px}
.day h4{margin:0;padding:10px 12px;font:600 13px var(--f-body);color:var(--muted);border-bottom:1px solid var(--line)}
.slot{margin:8px;padding:9px 10px;border-radius:10px;background:var(--accent-soft);font-size:13px}
.slot.conf{background:var(--bad-soft)}
.slot b{display:block}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:7px 14px;font:500 13.5px var(--f-body);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.xbar{display:flex;gap:8px;flex-wrap:wrap}
.bar{height:10px;border-radius:99px;background:var(--accent-soft);overflow:hidden;min-width:8px}

@media (max-width:720px){
  .xbar{width:100%}.xbar .btn{flex:1}

  .menu .nm{display:none}.menu summary{padding:3px}
  .brand small{display:none}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));gap:2px}
  nav.tabs button{flex:0 0 auto;min-width:84px;padding:9px 12px;font-size:13px;border-radius:12px}
  header.top .wrap:last-child{padding:0}
  input,select,textarea{font-size:16px;min-height:46px}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script id="pdf-builder">
/* Bulletin PDF : construit uniquement à partir de la version figée (snapshot) du bulletin */
function makePayslipPdf(jsPDF, slip, payments){
  const sn=slip.snapshot, E=sn.enseignant, P=sn.periode;
  const money=n=>Math.round(n||0).toLocaleString("fr-FR").replace(/[  ]/g," ")+" FCFA";
  const d=s=>{const [y,m,j]=String(s).slice(0,10).split("-");return j+"/"+m+"/"+y};
  const h=m=>{const H=Math.floor(m/60),M=m%60;return H+" h"+(M?" "+String(M).padStart(2,"0"):"")};
  const ink=[22,32,46], muted=[93,104,121], accent=[11,110,91], line=[221,225,232];
  const doc=new jsPDF({unit:"mm",format:"a4"}); const W=210, L=16, R=W-16;

  doc.setFillColor(...accent); doc.rect(0,0,W,4,"F");
  doc.setFont("helvetica","bold"); doc.setFontSize(18); doc.setTextColor(...ink); doc.text("UCAB Touba",L,18);
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...muted);
  doc.text("Service financier",L,23.5);
  doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(...ink);
  doc.text("Bulletin de rémunération",R,16,{align:"right"});
  doc.setFont("courier","normal"); doc.setFontSize(10); doc.text(slip.number,R,22,{align:"right"});

  doc.setDrawColor(...line); doc.line(L,29,R,29);
  const block=(x,title,rows)=>{doc.setFont("helvetica","bold");doc.setFontSize(8);doc.setTextColor(...muted);doc.text(title.toUpperCase(),x,36);
    rows.forEach(([k,v],i)=>{const y=42+i*5.4;doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(...muted);doc.text(k,x,y);
      doc.setTextColor(...ink);doc.text(String(v||"-"),x+27,y)})};
  block(L,"Enseignant",[["Nom",E.nom],["Statut",E.statut],["Département",E.departement],["E-mail",E.email]]);
  block(112,"Période",[["Libellé",P.nom],["Du",d(P.debut)],["Au",d(P.fin)],["Approuvé le",d(sn.approuve_le)]]);

  const lines=sn.lignes.map(l=>[d(l.date)+(l.rattrapage?" (rattrapage)":""),l.cours,l.groupe,h(l.minutes),
    money(l.tarif)+(l.source==="individuel"?" *":""),money(l.montant)]);
  doc.autoTable({startY:68,head:[["Date","Cours","Groupe","Durée","Tarif horaire","Montant"]],body:lines,
    theme:"plain",margin:{left:L,right:16},
    styles:{font:"helvetica",fontSize:8.5,textColor:ink,cellPadding:{top:2,bottom:2,left:2,right:2},lineColor:line,lineWidth:{bottom:0.2}},
    headStyles:{fontStyle:"bold",textColor:muted,fontSize:7.5,lineWidth:{bottom:0.4},lineColor:ink},
    columnStyles:{0:{cellWidth:30},2:{cellWidth:22},3:{halign:"right",cellWidth:16},4:{halign:"right",cellWidth:30},5:{halign:"right",cellWidth:28}}});

  let y=doc.lastAutoTable.finalY+8;
  if(y>230){doc.addPage();y=20}
  const paid=(payments||[]).reduce((s,p)=>s+p.amount_fcfa,0);
  const tot=[["Heures payables",h(slip.total_minutes)],["Rémunération brute",money(slip.gross_fcfa)],["Primes",money(0)],
    ["Retenues et cotisations",money(slip.deductions_fcfa)]];
  const x0=112;
  tot.forEach(([k,v],i)=>{doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(...muted);doc.text(k,x0,y+i*6);doc.setTextColor(...ink);doc.text(v,R,y+i*6,{align:"right"})});
  y+=tot.length*6;
  doc.setFillColor(223,241,236); doc.rect(x0-3,y-4.5,R-x0+5,10,"F");
  doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(...accent);
  doc.text("Net à payer",x0,y+2); doc.text(money(slip.net_fcfa),R,y+2,{align:"right"});
  y+=13;
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...muted);
  doc.text("Réglé à ce jour",x0,y); doc.setTextColor(...ink); doc.text(money(paid),R,y,{align:"right"});
  doc.setTextColor(...muted); doc.text("Reste dû",x0,y+6); doc.setTextColor(...ink); doc.text(money(slip.net_fcfa-paid),R,y+6,{align:"right"});

  if((payments||[]).length){doc.setFontSize(8);doc.setTextColor(...muted);
    doc.text("Règlements : "+payments.map(p=>d(p.paid_on)+" "+p.method+" "+money(p.amount_fcfa)+(p.reference?" ("+p.reference+")":"")).join(" ; "),L,y+16,{maxWidth:R-L})}

  doc.setFontSize(7.5); doc.setTextColor(...muted);
  const foot=["Montant = durée retenue × tarif horaire en vigueur à la date de la séance. * Tarif individuel.",
    "Aucune retenue ni cotisation n'est appliquée selon les règles actuelles de l'établissement.",
    "Bulletin approuvé par "+(sn.approuve_par||"le service financier")+". Ce document ne vaut pas preuve de paiement.",
    "Édité le "+new Date().toLocaleDateString("fr-FR")+" · "+slip.number];
  foot.forEach((t,i)=>doc.text(t,L,282+i*3.6-(foot.length-1)*3.6));
  return doc;
}
</script>

/* ---------- utilitaires ---------- */
function esc(v){return String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pad(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function fdate(s){const [y,m,d]=s.split("-").map(Number);const x=new Date(y,m-1,d);return x.toLocaleDateString("fr-FR",{weekday:"short",day:"2-digit",month:"short"})}
function hm(t){return (t||"").slice(0,5)}
function hrs(min){if(min==null)return "—";const h=Math.floor(min/60),m=min%60;return h+" h"+(m?" "+pad(m):"")}
function has(r){return S.roles.some(x=>x.role===r)}
function pill(st){const [l,c]=ATT[st]||["Non émargé","p-mute"];return `<span class="pill ${c}">${l}</span>`}
function toast(msg,bad){const t=document.createElement("div");t.className="toast"+(bad?" bad":"");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),bad?6000:3000)}
function errMsg(e){let m=e?.message||String(e);
  if(m.includes("no_room_overlap"))m="Conflit : la salle est déjà occupée sur ce créneau.";
  if(m.includes("no_teacher_overlap"))m="Conflit : le professeur a déjà un cours sur ce créneau.";
  if(m.includes("no_group_overlap"))m="Conflit : le groupe a déjà un cours sur ce créneau.";
  if(m.includes("Invalid login"))m="Adresse ou mot de passe incorrect.";
  if(m.includes("duplicate key"))m="Cet enregistrement existe déjà (même code, même adresse ou même affectation).";
  if(m.includes("foreign key"))m="Opération impossible : cet élément est utilisé ailleurs (séances, affectations, bulletins…).";
  if(m.includes("check constraint"))m="Valeurs invalides : vérifiez les dates, les durées et les montants.";
  if(m.includes("Failed to send a request to the Edge Function"))m="Le service de gestion des comptes est injoignable. Réessayez dans un instant.";
  return m}
async function q(p){const {data,error}=await p;if(error)throw error;return data}
function sessionLabel(s){const c=s.teaching_assignments?.courses;return `${esc(c?.code)} · ${esc(c?.name)}`}

/* ---------- connexion ---------- */
function renderLogin(msg){
  $app.innerHTML=`<div class="wrap"><div class="login">

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){renderLogin();return}
  S.user=session.user;
  try{
    S.roles=await q(sb.rpc("my_roles"));
    const t=await q(sb.from("teachers").select("id,first_name,last_name").eq("profile_id",S.user.id).maybeSingle());
    S.teacher=t;
    try{const y=await q(sb.from("academic_years").select("label").eq("is_current",true).maybeSingle());S.year=y?y.label:""}catch(e){S.year=""}
  }catch(e){toast(errMsg(e),true)}
  const tabs=availableTabs();
  if(!tabs.length){$app.innerHTML=`<div class="wrap"><p class="empty">Aucun rôle n'est attribué à ce compte. Contactez l'administrateur.</p></div>`;return}
  let h=location.hash.slice(1);
  S.tab=tabs.find(t=>t.id===h)?h:tabs[0].id;
  renderShell();
}

function availableTabs(){
  const t=[];
  if(has("planificateur")||has("responsable")||has("finance")||has("direction"))t.push({id:"dashboard",label:"Tableau de bord",fn:viewDashboard});
  if(S.teacher)t.push({id:"seances",label:"Mes séances",fn:viewTeacher});
  if(S.teacher)t.push({id:"bulletins",label:"Mes bulletins",fn:viewMyPayslips});
  if(has("responsable"))t.push({id:"controle",label:"Contrôle",fn:viewReview});
  if(has("planificateur"))t.push({id:"planning",label:"Emplois du temps",fn:viewPlanning});
  if(has("finance")||has("direction")){
    t.push({id:"paie",label:"Paie",fn:viewPayroll});
    t.push({id:"tarifs",label:"Tarifs",fn:viewRates});}
  if(has("finance")||has("direction")||has("planificateur")||has("responsable"))t.push({id:"synthese",label:"Heures validées",fn:viewSummary});
  if(has("planificateur")||has("admin"))t.push({id:"referentiel",label:has("planificateur")?"Référentiel":"Comptes",fn:viewRef});
  if(has("admin")||has("direction")||has("finance"))t.push({id:"journal",label:"Journal",fn:viewAudit});
  return t;
}

/* Tableaux en cartes sur téléphone : chaque cellule reprend le titre de sa colonne */
function labelTables(root){root.querySelectorAll("table").forEach(tb=>{const hs=[...tb.querySelectorAll("thead th")].map(h=>h.textContent.trim());
  if(!hs.length)return;tb.querySelectorAll("tbody tr").forEach(tr=>[...tr.children].forEach((td,i)=>{if(hs[i]&&!td.dataset.label){td.dataset.label=hs[i];const w=document.createElement('div');w.className='cv';while(td.firstChild)w.appendChild(td.firstChild);td.appendChild(w)}}))})}
let _lt=0;new MutationObserver(()=>{cancelAnimationFrame(_lt);_lt=requestAnimationFrame(()=>labelTables(document))}).observe(document.body,{childList:true,subtree:true});

/* ---------- dialogue ---------- */
function openDialog(html,onSubmit){
  const dlg=document.getElementById("dlg"),f=document.getElementById("dlgForm");
  f.innerHTML=html+`<div class="err" id="dlgErr"></div>`;
  f.onsubmit=async ev=>{
    const btn=ev.submitter;if(btn&&btn.value==="cancel")return;
    ev.preventDefault();
    try{btn&&(btn.disabled=true);const r=await onSubmit(btn?btn.value:null,f);if(r!=="keep")dlg.close();}
    catch(e){document.getElementById("dlgErr").textContent=errMsg(e);btn&&(btn.disabled=false)}
  };
  dlg.showModal();
}

function emargeDialog(s){

  async()=>{

    q(sb.from("semesters").select("id,label,start_date,end_date,academic_years(label)").order("start_date"))]);
  const lists={group:groups.map(g=>[g.id,g.code]),teacher:teachers.map(t=>[t.id,t.first_name+" "+t.last_name]),room:rooms.map(r=>[r.id,r.code])};
  if(!S.planId||!lists[S.planView].some(x=>x[0]==S.planId))S.planId=lists[S.planView][0]?.[0];
  const key={group:s=>s.teaching_assignments.group_id,teacher:s=>s.teaching_assignments.teacher_id,room:s=>s.room_id}[S.planView];
  const mine=slots.filter(s=>key(s)==S.planId);
  const confIds=new Set(conf.flatMap(c=>[c.slot_a,c.slot_b]));
  const today=iso(new Date()),in4=iso(addDays(new Date(),28));
  const drafts=slots.filter(s=>!s.published).length;

  const weekly={};slots.forEach(s=>{weekly[s.assignment_id]=(weekly[s.assignment_id]||0)+(toMin(s.end_time)-toMin(s.start_time))/60});
  const weeksOf=sem=>Math.max(1,Math.ceil(((new Date(sem.end_date)-new Date(sem.start_date))/86400000+1)/7));
  const num=n=>Number(Number(n).toFixed(2));

  v.innerHTML=`<h1>Emplois du temps</h1>

    <div class="stats"><div class="stat"><b>${slots.length}</b><span>Créneaux hebdomadaires</span></div>
      <div class="stat"><b style="color:${drafts?"var(--warn)":"inherit"}">${drafts}</b><span>Brouillons</span></div>
      <div class="stat"><b style="color:${unplaced?"var(--warn)":"inherit"}">${unplaced}</b><span>Affectations non placées</span></div>
      <div class="stat"><b style="color:${conf.length?"var(--bad)":"var(--ok)"}">${conf.length}</b><span>Conflits détectés</span></div></div>
    <div class="row" style="margin-bottom:12px">
      <label>Afficher par<select id="pView"><option value="group">Groupe</option><option value="teacher">Professeur</option><option value="room">Salle</option></select></label>
      <label>&nbsp;<select id="pId">${lists[S.planView].map(([id,l])=>`<option value="${id}" ${id==S.planId?"selected":""}>${esc(l)}</option>`).join("")}</select></label>
      <button class="btn primary" id="addSlot" ${assigns.length?"":"disabled"}>Ajouter un créneau</button>
      ${drafts?`<button class="btn" id="pubAll">Publier les ${drafts} brouillon(s)</button>`:""}

    <div class="week">${[1,2,3,4,5,6].map(d=>`<div class="day"><h4>${DAYS[d]}</h4>${mine.filter(s=>s.day_of_week===d).map(s=>`<div class="slot ${confIds.has(s.id)?"conf":""}">
      <span class="mono">${hm(s.start_time)}–${hm(s.end_time)}</span><b>${esc(s.teaching_assignments.courses.code)} ${esc(s.teaching_assignments.courses.name)}</b>
      <span class="sub">${esc(s.teaching_assignments.teachers.last_name)} · ${esc(s.teaching_assignments.student_groups.code)} · ${esc(s.rooms.code)}</span>
      <div class="row" style="gap:6px;margin-top:6px">${s.published?"":`<span class="pill p-mute">Brouillon</span>`}<button class="btn sm" data-es="${s.id}">Modifier</button><button class="btn sm danger" data-ds="${s.id}">Supprimer</button></div></div>`).join("")}</div>`).join("")}</div>
    ${conf.length?`<h2>Conflits</h2><div class="panel tbl"><table><thead><tr><th>Jour</th><th>Type</th><th>Créneaux</th></tr></thead><tbody>${conf.map(c=>{const a=slots.find(s=>s.id===c.slot_a),b=slots.find(s=>s.id===c.slot_b);return `<tr><td>${DAYS[c.day_of_week]}</td><td><span class="pill p-bad">${esc(c.conflict_type)}</span></td><td>${esc(a?.teaching_assignments.courses.code)} ${hm(a?.start_time)} / ${esc(b?.teaching_assignments.courses.code)} ${hm(b?.start_time)}</td></tr>`}).join("")}</tbody></table></div>`:""}

    <div class="row" style="justify-content:space-between"><h2>Affectations · ${assigns.length}</h2><button class="btn sm" id="addAsg">Ajouter une affectation</button></div>
    <p class="sub" style="margin:0 0 10px">Une affectation relie un professeur, une matière et un groupe, avec le volume d'heures prévu sur le semestre. La colonne « Placé » compare les créneaux de la semaine à ce volume.</p>
    <div class="panel tbl">${assigns.length?`<table><thead><tr><th>Matière</th><th>Groupe</th><th>Professeur</th><th>Semestre</th><th>Prévu</th><th>Placé</th><th>État</th><th></th></tr></thead><tbody>
    ${assigns.map(a=>{const w=weekly[a.id]||0,wk=weeksOf(a.semesters);
      const st=!w?'<span class="pill p-warn">Non placé</span>':(w*wk<a.planned_hours?'<span class="pill p-bad">Volume insuffisant</span>':'<span class="pill p-ok">Placé</span>');
      return `<tr><td>${esc(a.courses.code)}<div class="sub">${esc(a.courses.name)}</div></td><td>${esc(a.student_groups.code)}</td><td>${esc(a.teachers.first_name+" "+a.teachers.last_name)}</td><td>${esc(a.semesters.label)}</td>
      <td class="num">${num(a.planned_hours)} h</td><td class="num">${num(w)} h/sem × ${wk} sem = ${num(w*wk)} h</td><td>${st}</td>

    <h2>Créer les séances datées</h2>
    <div class="panel" style="padding:16px"><form class="row" id="genForm">
      <label>Du<input id="gFrom" type="date" required value="${today}"></label>
      <label>Au<input id="gTo" type="date" required value="${in4}"></label>

  pView.value=S.planView;
  pView.onchange=()=>{S.planView=pView.value;S.planId=null;rerender()};
  pId.onchange=()=>{S.planId=pId.value;rerender()};
  genForm.onsubmit=async ev=>{ev.preventDefault();
    try{const r=(await q(sb.rpc("generate_sessions",{p_from:gFrom.value,p_to:gTo.value})))[0];
      toast(`${r.created} séance(s) créée(s)`+(r.conflicts.length?` · ${r.conflicts.length} non placée(s) pour conflit`:""),r.conflicts.length>0)}
    catch(e){toast(errMsg(e),true)}};
  const pa=document.getElementById("pubAll");
  if(pa)pa.onclick=async()=>{try{await q(sb.from("timetable_slots").update({published:true}).eq("published",false));toast("Créneaux publiés");rerender()}catch(e){toast(errMsg(e),true)}};

  /* créneaux */
  const aLabel=a=>`${a.courses.code} · ${a.student_groups.code} · ${a.teachers.last_name}`;
  const slotFields=()=>[
    {k:"assignment_id",l:"Affectation",t:"select",num:1,opt:assigns.map(a=>[a.id,aLabel(a)]),req:1},
    {k:"day_of_week",l:"Jour",t:"select",num:1,opt:[1,2,3,4,5,6].map(d=>[d,DAYS[d]]),req:1},
    {k:"start_time",l:"Début",t:"time",req:1},{k:"end_time",l:"Fin",t:"time",req:1},
    {k:"room_id",l:"Salle",t:"select",num:1,opt:rooms.map(r=>[r.id,r.code+" · "+r.capacity+" places"]),req:1},
    {k:"published",l:"Publier ce créneau",t:"bool"}];
  const slotDialog=row=>{
    const f=slotFields();
    const vals=row?{...row,start_time:hm(row.start_time),end_time:hm(row.end_time)}:{day_of_week:1,start_time:"08:00",end_time:"10:00",published:false};
    openDialog(`<h3>${row?"Modifier le créneau":"Ajouter un créneau"}</h3>
      <div class="grid2">${f.map(x=>fieldHtml(x,vals[x.k])).join("")}</div>
      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Enregistrer</button></div>`,
    async()=>{const o=readFields(f);
      if(o.end_time<=o.start_time)throw new Error("L'heure de fin doit être après l'heure de début.");
      if(row)await q(sb.from("timetable_slots").update(o).eq("id",row.id));else await q(sb.from("timetable_slots").insert(o));
      toast(row?"Créneau modifié":"Créneau ajouté");rerender()});
  };
  addSlot.onclick=()=>slotDialog(null);
  v.querySelectorAll("[data-es]").forEach(b=>b.onclick=()=>slotDialog(slots.find(s=>s.id==b.dataset.es)));
  v.querySelectorAll("[data-ds]").forEach(b=>b.onclick=()=>{const s=slots.find(x=>x.id==b.dataset.ds);
    openDialog(`<h3>Supprimer ce créneau ?</h3><p style="margin:0">${esc(s.teaching_assignments.courses.code)}, ${DAYS[s.day_of_week]} ${hm(s.start_time)}–${hm(s.end_time)}. Les séances à venir de ce créneau qui n'ont pas encore été émargées seront supprimées. Les séances passées sont conservées.</p>
      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn danger" value="ok">Supprimer</button></div>`,
    async()=>{const r=await q(sb.from("timetable_slots").delete().eq("id",s.id).select());if(!r.length)throw new Error("Suppression refusée.");toast("Créneau supprimé");rerender()})});

  /* affectations */
  const asgFields=()=>[
    {k:"semester_id",l:"Semestre",t:"select",num:1,opt:sems.map(s=>[s.id,s.academic_years.label+" · "+s.label]),req:1},
    {k:"course_id",l:"Matière",t:"select",num:1,opt:courses.map(c=>[c.id,c.code+" · "+c.name]),req:1},
    {k:"group_id",l:"Groupe",t:"select",num:1,opt:groups.map(g=>[g.id,g.code]),req:1},
    {k:"teacher_id",l:"Professeur",t:"select",num:1,opt:teachers.map(t=>[t.id,t.first_name+" "+t.last_name]),req:1},
    {k:"planned_hours",l:"Volume prévu (h)",t:"number",min:0.5,step:"0.5",req:1}];
  const asgDialog=row=>{
    const f=asgFields();
    openDialog(`<h3>${row?"Modifier l'affectation":"Ajouter une affectation"}</h3>
      <div class="grid2">${f.map(x=>fieldHtml(x,row?row[x.k]:undefined)).join("")}</div>
      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Enregistrer</button></div>`,
    async()=>{const o=readFields(f);
      if(row)await q(sb.from("teaching_assignments").update(o).eq("id",row.id));else await q(sb.from("teaching_assignments").insert(o));
      toast("Affectation enregistrée");rerender()});
  };
  addAsg.onclick=()=>asgDialog(null);
  v.querySelectorAll("[data-ea]").forEach(b=>b.onclick=()=>asgDialog(assigns.find(a=>a.id==b.dataset.ea)));
  v.querySelectorAll("[data-da]").forEach(b=>b.onclick=()=>{const a=assigns.find(x=>x.id==b.dataset.da);
    openDialog(`<h3>Supprimer l'affectation ?</h3><p style="margin:0">${esc(aLabel(a))}. Ses créneaux hebdomadaires seront supprimés aussi. Si des séances existent déjà pour cette affectation, la suppression sera refusée.</p>
      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn danger" value="ok">Supprimer</button></div>`,
    async()=>{const r=await q(sb.from("teaching_assignments").delete().eq("id",a.id).select());if(!r.length)throw new Error("Suppression refusée.");toast("Affectation supprimée");rerender()})});
}

/* ---------- exports Excel et PDF ---------- */
function slug(s){return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-|-$/g,"").toLowerCase()}
const nf=n=>Number(n).toLocaleString("fr-FR").replace(/[  ]/g," ");
const dh=min=>Math.round((min||0)/60*100)/100; /* minutes -> heures décimales (calculables dans Excel) */
function xbar(id){return `<div class="xbar" id="${id}"><button class="btn sm" type="button" data-x="xlsx">Exporter Excel</button><button class="btn sm" type="button" data-x="pdf">Exporter PDF</button></div>`}
function wireExport(id,build){
  const host=document.getElementById(id);if(!host)return;
  host.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{
    try{const d=await build();if(b.dataset.x==="xlsx")exportExcel(d.file,d.sheets);else exportPdf(d.file,d.title,d.subtitle,d.sheets,d.landscape)}
    catch(e){toast(errMsg(e),true)}});
}
function exportExcel(file,sheets){
  try{
    if(!window.XLSX)throw new Error("Le module Excel n'a pas pu être chargé. Vérifiez la connexion et rechargez la page.");
    const wb=XLSX.utils.book_new();
    sheets.forEach(s=>{
      const ws=XLSX.utils.aoa_to_sheet([[s.title||s.name],[s.subtitle||""],[],s.head,...s.rows]);
      ws["!cols"]=s.head.map((h,c)=>({wch:Math.min(42,Math.max(String(h).length,...s.rows.map(r=>String(r[c]??"").length))+2)}));
      XLSX.utils.book_append_sheet(wb,ws,String(s.name).replace(/[\\\/?*\[\]:]/g,"-").slice(0,31));
    });
    XLSX.writeFile(wb,file+".xlsx");
  }catch(e){toast(errMsg(e),true)}
}
function exportPdf(file,title,subtitle,sheets,landscape){
  try{
    if(!window.jspdf)throw new Error("Le module PDF n'a pas pu être chargé. Vérifiez la connexion et rechargez la page.");
    const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:landscape?"landscape":"portrait"});
    const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
    doc.setFillColor(11,110,91);doc.rect(0,0,W,3,"F");
    doc.setFont("helvetica","bold");doc.setFontSize(16);doc.setTextColor(22,32,46);doc.text("UCAB Touba",14,16);
    doc.setFontSize(12);doc.text(title,14,23);
    doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(93,104,121);
    doc.text(subtitle+" · Édité le "+new Date().toLocaleDateString("fr-FR"),14,29);
    let y=36;
    sheets.forEach(s=>{
      if(!s.rows.length&&!s.keepEmpty)return;
      if(y>H-40){doc.addPage();y=18}
      if(s.title){doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(22,32,46);doc.text(s.title,14,y);y+=2}
      doc.autoTable({startY:y+2,head:[s.head],body:s.rows.map(r=>r.map(c=>typeof c==="number"?nf(c):String(c??""))),
        theme:"striped",margin:{left:14,right:14,bottom:16},styles:{font:"helvetica",fontSize:8,cellPadding:2,textColor:[22,32,46]},
        headStyles:{fillColor:[11,110,91],textColor:255,fontStyle:"bold"},alternateRowStyles:{fillColor:[243,246,244]}});
      y=doc.lastAutoTable.finalY+9;
    });
    const n=doc.internal.getNumberOfPages();
    for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(93,104,121);doc.text(`Page ${i} / ${n}`,W-14,H-8,{align:"right"})}
    doc.save(file+".pdf");
  }catch(e){toast(errMsg(e),true)}
}
async function qAll(make){let all=[],from=0;for(;;){const d=await q(make().range(from,from+999));all=all.concat(d);if(d.length<1000)return all;from+=1000}}

/* ---------- tableau de bord ---------- */
function rateClass(p){return p>=90?"p-ok":p>=70?"p-warn":"p-bad"}
async function viewDashboard(v){
  const today=iso(new Date());
  if(!S.dFrom){const d=new Date();S.dFrom=iso(new Date(d.getFullYear(),d.getMonth(),1));S.dTo=today}
  v.innerHTML=`<h1>Tableau de bord</h1>
    <p class="lead">Suivi des séances, des émargements et des heures validées sur la période choisie.</p>
    <div class="panel" style="padding:14px;margin-bottom:16px"><div class="row">
      <label>Du<input id="dF" type="date" value="${S.dFrom}"></label><label>Au<input id="dT" type="date" value="${S.dTo}"></label>
      <button class="btn" id="dOk">Afficher</button><span style="margin-left:auto">${xbar("dX")}</span></div></div>
    <div id="dBody"><p class="empty">Chargement…</p></div>`;
  dOk.onclick=()=>{if(dT.value<dF.value){toast("La date de fin doit être après la date de début.",true);return}S.dFrom=dF.value;S.dTo=dT.value;rerender()};
  const sess=await qAll(()=>sb.from("schedule_sessions").select("id,session_date,start_time,end_time,status,teacher_id,teachers(first_name,last_name,departments(code)),teaching_assignments(courses(code,name,departments(code))),student_groups(code),attendance_records(status,retained_minutes,declared_minutes,entered_for_teacher)").gte("session_date",S.dFrom).lte("session_date",S.dTo).order("session_date"));
  const due=sess.filter(s=>s.status!=="annulee"&&s.session_date<=today);
  const K={prevues:due.length,annulees:sess.filter(s=>s.status==="annulee").length,emargees:0,valid:0,wait:0,corr:0,rej:0,deleg:0,minPrev:0,minVal:0,minWait:0};
  const dep={},tea={},sans=[];
  due.forEach(s=>{
    const a=s.attendance_records,pm=toMin(s.end_time)-toMin(s.start_time);
    const dc=s.teaching_assignments?.courses?.departments?.code||"—";
    const d=dep[dc]??={code:dc,prev:0,em:0,minPrev:0,minVal:0};
    const tk=s.teacher_id;const t=tea[tk]??={name:s.teachers?(s.teachers.last_name+" "+s.teachers.first_name):"—",dep:s.teachers?.departments?.code||"—",prev:0,em:0,minVal:0,minWait:0};
    K.minPrev+=pm;d.prev++;d.minPrev+=pm;t.prev++;
    if(!a){sans.push(s);return}
    K.emargees++;d.em++;t.em++;
    if(a.entered_for_teacher)K.deleg++;
    if(a.status==="valide"){K.valid++;K.minVal+=a.retained_minutes||0;d.minVal+=a.retained_minutes||0;t.minVal+=a.retained_minutes||0}
    else if(a.status==="soumis"){K.wait++;K.minWait+=a.declared_minutes||0;t.minWait+=a.declared_minutes||0}
    else if(a.status==="correction_demandee")K.corr++;
    else if(a.status==="rejete")K.rej++;
  });
  const pct=(a,b)=>b?Math.round(a/b*100):0;
  const rate=pct(K.emargees,K.prevues);
  const deps=Object.values(dep).sort((a,b)=>b.minPrev-a.minPrev),teas=Object.values(tea).sort((a,b)=>pct(a.em,a.prev)-pct(b.em,b.prev)||a.name.localeCompare(b.name));
  const sansSorted=sans.slice().sort((a,b)=>a.session_date.localeCompare(b.session_date));
  /* paie : seulement pour ceux qui y ont droit */
  let pay=null;
  if(has("finance")||has("direction")){
    try{
      const [slips,pays,open]=await Promise.all([qAll(()=>sb.from("payslips").select("id,net_fcfa")),qAll(()=>sb.from("payments").select("amount_fcfa")),
        qAll(()=>sb.from("attendance_records").select("retained_minutes").eq("status","valide").is("pay_period_id",null))]);
      const net=slips.reduce((s,x)=>s+x.net_fcfa,0),paid=pays.reduce((s,x)=>s+x.amount_fcfa,0);
      pay={net,paid,due:net-paid,openMin:open.reduce((s,x)=>s+(x.retained_minutes||0),0)};
    }catch(e){pay=null}
  }
  const barRow=(label,full,part,right)=>`<div style="display:grid;grid-template-columns:minmax(70px,110px) 1fr;gap:6px 12px;align-items:center;margin:10px 0"><span>${esc(label)}</span>
    <div><div class="bar" style="width:${full}%"><i style="width:${part}%"></i></div><div class="sub" style="margin-top:3px">${right}</div></div></div>`;
  const maxPrev=Math.max(1,...deps.map(d=>d.minPrev));
  const canReview=has("responsable");
  document.getElementById("dBody").innerHTML=`
    <div class="stats">
      <div class="stat"><b>${K.prevues}</b><span>Séances prévues (jusqu'à aujourd'hui)</span></div>
      <div class="stat"><b>${rate} %</b><span>Taux d'émargement (${K.emargees} sur ${K.prevues})</span></div>
      <div class="stat"><b>${hrs(K.minVal)}</b><span>Heures validées</span></div>
      <div class="stat"><b style="color:${K.wait?"var(--warn)":"inherit"}">${K.wait}</b><span>À valider (${hrs(K.minWait)})</span></div>
      <div class="stat"><b style="color:${sans.length?"var(--bad)":"inherit"}">${sans.length}</b><span>Séances sans émargement</span></div>
      <div class="stat"><b>${K.deleg}</b><span>Saisis par délégation</span></div>
      ${pay?`<div class="stat"><b>${fcfa(pay.due)}</b><span>Reste dû sur les paies approuvées</span></div><div class="stat"><b>${hrs(pay.openMin)}</b><span>Heures validées pas encore payées</span></div>`:""}
    </div>
    ${canReview&&K.wait?`<p style="margin:0 0 16px"><button class="btn primary" id="goCtl">Valider les ${K.wait} émargement(s) en attente</button></p>`:""}
    ${deps.length?`<h2>Heures par département</h2><div class="panel" style="padding:6px 16px 10px">${deps.map(d=>barRow(d.code,pct(d.minPrev,maxPrev),pct(d.minVal,d.minPrev),`${hrs(d.minVal)} validées sur ${hrs(d.minPrev)} prévues · émargement ${pct(d.em,d.prev)} %`)).join("")}</div>`:`<div class="panel"><p class="empty">Aucune séance sur cette période.</p></div>`}

function fieldHtml(f,val){
  const id="f_"+f.k;
  if(f.t==="select")return `<label>${f.l}<select id="${id}" ${f.req?"required":""}>${f.req?"":'<option value="">—</option>'}${f.opt.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(val)?"selected":""}>${esc(l)}</option>`).join("")}</select></label>`;
  if(f.t==="bool")return `<label style="flex-direction:row;align-items:center;gap:8px;align-self:end"><input id="${id}" type="checkbox" ${val?"checked":""}> ${f.l}</label>`;
  return `<label>${f.l}<input id="${id}" type="${f.t||"text"}" ${f.req?"required":""} ${f.min!=null?`min="${f.min}"`:""} ${f.step?`step="${f.step}"`:""} value="${esc(val??"")}"></label>`;
}
function readFields(fields){
  const o={};
  fields.forEach(f=>{const el=document.getElementById("f_"+f.k);let v;
    if(f.t==="bool")v=el.checked;
    else{v=el.value.trim();
      if(f.t==="number")v=v===""?null:Number(v);
      else if(f.t==="select"&&f.num)v=v===""?null:Number(v);
      else if(v==="")v=null}
    o[f.k]=v});
  return o;
}

async function renderBlock(def,el){
  const rows=await q(sb.from(def.table).select(def.select||"*").order(def.order||"id"));
  el.innerHTML=`<div class="row" style="justify-content:space-between"><h2>${esc(def.title)} · ${rows.length}</h2><button class="btn sm" data-add>Ajouter</button></div>
    <div class="panel tbl">${rows.length?`<table><thead><tr>${def.cols.map(c=>`<th>${c[0]}</th>`).join("")}<th></th></tr></thead><tbody>
    ${rows.map((r,i)=>`<tr>${def.cols.map(c=>`<td>${c[1](r)}</td>`).join("")}<td style="white-space:nowrap"><button class="btn sm" data-e="${i}">Modifier</button> <button class="btn sm danger" data-d="${i}">Supprimer</button></td></tr>`).join("")}</tbody></table>`:`<p class="empty">Rien pour l'instant. Utilisez « Ajouter » pour commencer.</p>`}</div>`;
  el.querySelector("[data-add]").onclick=()=>formDialog(def,null);
  el.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>formDialog(def,rows[b.dataset.e]));
  el.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>deleteDialog(def,rows[b.dataset.d]));
}

function formDialog(def,row){
  const vals=row||def.defaults||{};
  openDialog(`<h3>${row?"Modifier":"Ajouter"} : ${esc(def.one)}</h3>
    <div class="grid2">${def.fields.map(f=>fieldHtml(f,vals[f.k])).join("")}</div>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Enregistrer</button></div>`,
  async()=>{
    let o=readFields(def.fields);
    if(def.normalize)o=def.normalize(o);
    if(def.before)await def.before(o,row);
    if(row)await q(sb.from(def.table).update(o).eq("id",row.id));
    else await q(sb.from(def.table).insert(o));
    toast("Enregistré");rerender();
  });
}
function deleteDialog(def,row){
  const nm=(def.name||(r=>r.name||r.label||r.code||("n° "+r.id)))(row);
  openDialog(`<h3>Supprimer « ${esc(nm)} » ?</h3>
    <p style="margin:0">La suppression est définitive. Si cet élément est déjà utilisé (séances, affectations, bulletins), elle sera refusée.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn danger" value="ok">Supprimer</button></div>`,
  async()=>{const r=await q(sb.from(def.table).delete().eq("id",row.id).select());
    if(!r.length)throw new Error("Suppression refusée.");toast("Supprimé");rerender()});
}

  const saveRoles=async(userId,desired)=>{
    const mine=roles.filter(r=>r.user_id===userId);
    const key=r=>r.role+"|"+(r.department_id||"");
    const have=new Set(mine.map(key));
    if(userId===S.user.id&&mine.some(r=>r.role==="admin")&&!desired.has("admin|"))throw new Error("Vous ne pouvez pas retirer votre propre rôle d'administrateur.");
    for(const r of mine)if(!desired.has(key(r)))await q(sb.from("user_roles").delete().eq("id",r.id));
    for(const k of desired)if(!have.has(k)){const [role,dep]=k.split("|");await q(sb.from("user_roles").insert({user_id:userId,role,department_id:dep?Number(dep):null}))}
  };

  addAcc.onclick=()=>{
    const free=teachers.filter(t=>!t.profile_id);
    openDialog(`<h3>Créer un compte</h3>
      ${free.length?`<label>Enseignant sans compte (facultatif)<select id="aT"><option value="">—</option>${free.map(t=>`<option value="${t.id}">${esc(t.first_name+" "+t.last_name+" · "+t.email)}</option>`).join("")}</select></label>`:""}
      <div class="grid2"><label>Nom complet<input id="aN" required></label><label>Adresse e-mail<input id="aE" type="email" required></label></div>
      ${roleBoxes(deps,new Set())}
      <p class="sub" style="margin:0">Un mot de passe provisoire sera généré et affiché une seule fois.</p>
      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Créer le compte</button></div>`,
    async()=>{
      const desired=readRoleBoxes();
      const r=await callUsers({action:"create",email:aE.value,full_name:aN.value});
      try{await saveRoles(r.user_id,desired)}catch(e){toast("Compte créé, mais les rôles n'ont pas pu être enregistrés : "+errMsg(e),true)}
      showCredentials("Compte créé",r.email,r.temp_password);
      return "keep";
    });
    const sel=document.getElementById("aT");
    if(sel)sel.onchange=()=>{const t=free.find(x=>x.id==sel.value);if(!t)return;aN.value=t.first_name+" "+t.last_name;aE.value=t.email;
      const c=document.querySelector('#dlgForm input[data-role="professeur"]');if(c)c.checked=true};
  };
  el.querySelectorAll("[data-ro]").forEach(b=>b.onclick=()=>{
    const u=profiles.find(p=>p.id===b.dataset.ro);const cur=new Set(roles.filter(r=>r.user_id===u.id).map(r=>r.role+"|"+(r.department_id||"")));
    openDialog(`<h3>Rôles de ${esc(u.full_name)}</h3>${roleBoxes(deps,cur)}
      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Enregistrer</button></div>`,
    async()=>{await saveRoles(u.id,readRoleBoxes());toast("Rôles enregistrés");rerender()});
  });
  el.querySelectorAll("[data-pw]").forEach(b=>b.onclick=()=>{
    const u=profiles.find(p=>p.id===b.dataset.pw);
    openDialog(`<h3>Réinitialiser le mot de passe</h3><p style="margin:0">Un nouveau mot de passe provisoire sera créé pour <b>${esc(u.full_name)}</b>. L'ancien ne fonctionnera plus.</p>
      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Réinitialiser</button></div>`,
    async()=>{const r=await callUsers({action:"reset_password",user_id:u.id});showCredentials("Nouveau mot de passe",u.email,r.temp_password);return "keep"});
  });
  el.querySelectorAll("[data-ac]").forEach(b=>b.onclick=()=>{
    const u=profiles.find(p=>p.id===b.dataset.ac);const to=u.active===false;
    openDialog(`<h3>${to?"Réactiver":"Désactiver"} le compte ?</h3><p style="margin:0">${to?"La personne pourra de nouveau se connecter.":"La personne ne pourra plus se connecter. Ses données et son historique sont conservés."}</p>
      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn ${to?"primary":"danger"}" value="ok">${to?"Réactiver":"Désactiver"}</button></div>`,
    async()=>{await callUsers({action:"set_active",user_id:u.id,active:to});toast(to?"Compte réactivé":"Compte désactivé");rerender()});
  });
}

/* ---------- paie ---------- */
const PER={ouverte:["Ouverte","p-mute"],en_verification:["Calculée, à vérifier","p-warn"],approuvee:["Approuvée","p-info"],payee:["Payée","p-ok"]};
const SLIP={approuve:["À payer","p-warn"],partiellement_paye:["Partiellement payé","p-info"],paye:["Payé","p-ok"]};
function ppill(map,st){const [l,c]=map[st]||[st,"p-mute"];return `<span class="pill ${c}">${l}</span>`}
function fcfa(n){return Math.round(n||0).toLocaleString("fr-FR").replace(/[  ]/g," ")+" FCFA"}
function fdl(s){if(!s)return "—";const [y,m,d]=String(s).slice(0,10).split("-");return `${d}/${m}/${y}`}
function canPay(){return has("finance")}

async function viewPayroll(v){
  const periods=await q(sb.from("pay_periods").select("*").order("start_date",{ascending:false}));
  const totals=await q(sb.from("payslips").select("pay_period_id,net_fcfa"));
  const items=await q(sb.from("payroll_items").select("pay_period_id,amount_fcfa"));
  const sum=(arr,id)=>arr.filter(x=>x.pay_period_id===id).reduce((s,x)=>s+(x.net_fcfa??x.amount_fcfa),0);
  if(!periods.some(p=>p.id===S.periodId))S.periodId=(periods.find(p=>p.status==="ouverte"||p.status==="en_verification")||periods[0])?.id;
  const p=periods.find(x=>x.id===S.periodId);
  v.innerHTML=`<h1>Paie</h1>
    <p class="lead">Rémunération à l'heure, calculée uniquement sur les heures validées. Une fois la période approuvée, les bulletins sont figés et chaque séance payée ne peut plus être reprise dans une autre période.</p>
    <div class="row" style="justify-content:space-between"><h2 style="margin-top:0">Périodes de rémunération</h2>${canPay()?`<button class="btn sm" id="newP">Nouvelle période</button>`:""}</div>
    <div class="panel tbl">${periods.length?`<table><thead><tr><th>Période</th><th>Du</th><th>Au</th><th>Limite d'émargement</th><th>État</th><th>Montant</th><th></th></tr></thead><tbody>
    ${periods.map(x=>`<tr ${x.id===S.periodId?'style="background:var(--accent-soft)"':""}><td><b>${esc(x.name)}</b></td><td class="mono">${fdl(x.start_date)}</td><td class="mono">${fdl(x.end_date)}</td><td class="mono">${fdl(x.attendance_deadline)}</td>
      <td>${ppill(PER,x.status)}</td><td class="num">${x.status==="ouverte"?"—":fcfa(["approuvee","payee"].includes(x.status)?sum(totals,x.id):sum(items,x.id))}</td>
      <td><button class="btn sm" data-p="${x.id}">Ouvrir</button></td></tr>`).join("")}</tbody></table>`:`<p class="empty">Aucune période. Créez la première période de rémunération.</p>`}</div>
    <div id="pDetail"></div>`;
  v.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{S.periodId=Number(b.dataset.p);rerender()});
  if(canPay())newP.onclick=periodDialog;
  if(p)await periodDetail(document.getElementById("pDetail"),p);
}

function periodDialog(){
  openDialog(`<h3>Nouvelle période de rémunération</h3>
    <label>Nom<input id="nN" required placeholder="Ex. : Novembre 2026"></label>
    <div class="row"><label>Du<input id="nS" type="date" required></label><label>Au<input id="nE" type="date" required></label></div>
    <div class="row"><label>Limite d'émargement<input id="nD" type="date"></label><label>Échéance de régularisation<input id="nR" type="date"></label></div>
    <p class="sub" style="margin:0">La période peut durer un mois, une quinzaine, un semestre ou toute autre durée.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Créer la période</button></div>`,
  async()=>{
    if(nE.value<nS.value)throw new Error("La date de fin doit être postérieure à la date de début.");
    const r=await q(sb.from("pay_periods").insert({name:nN.value.trim(),start_date:nS.value,end_date:nE.value,attendance_deadline:nD.value||null,regularization_deadline:nR.value||null,manager_id:S.user.id}).select().single());
    S.periodId=r.id;toast("Période créée");rerender();
  });
}

async function periodDetail(el,p){
  const frozen=["approuvee","payee"].includes(p.status);
  if(!frozen){
    const [items,pending]=await Promise.all([
      q(sb.from("payroll_items").select("*,teachers(first_name,last_name,teacher_statuses(label))").eq("pay_period_id",p.id).order("session_date")),
      q(sb.from("attendance_records").select("id,status,schedule_sessions!inner(session_date)").in("status",["soumis","correction_demandee"]).gte("schedule_sessions.session_date",p.start_date).lte("schedule_sessions.session_date",p.end_date))]);
    const by=groupBy(items);
    const tot=items.reduce((s,i)=>s+i.amount_fcfa,0);
    el.innerHTML=`<div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0 0 12px">${esc(p.name)}</h2>${items.length?xbar("pX"):""}</div>
      ${pending.length?`<p class="pill p-warn" style="display:inline-block;margin:0 0 12px">${pending.length} émargement(s) de la période ne sont pas encore validés : ils ne seront pas payés dans cette période.</p>`:""}
      ${p.status==="en_verification"?`<p class="sub" style="margin:0 0 12px">Dernier calcul : ${new Date(p.calculated_at).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"})}. Recalculez si de nouveaux émargements ont été validés depuis.</p>`:""}
      ${canPay()?`<div class="row" style="margin-bottom:12px"><button class="btn ${p.status==="ouverte"?"primary":""}" id="calc">${p.status==="ouverte"?"Calculer la paie":"Recalculer"}</button>
        ${p.status==="en_verification"&&items.length?`<button class="btn primary" id="appr">Approuver et générer les bulletins</button>`:""}
        ${p.status==="ouverte"?`<button class="btn danger" id="delP">Supprimer la période</button>`:""}</div>`:""}
      ${items.length?`<div class="stats"><div class="stat"><b>${fcfa(tot)}</b><span>Total brut = net</span></div><div class="stat"><b>${by.length}</b><span>Enseignants</span></div><div class="stat"><b>${items.length}</b><span>Séances payables</span></div></div>
      ${teacherTable(by,false)}`:`<div class="panel"><p class="empty">${p.status==="ouverte"?"Lancez le calcul pour obtenir les montants de la période.":"Aucune heure validée payable dans cette période."}</p></div>`}`;
    if(canPay()){
      calc.onclick=async()=>{try{const r=await q(sb.rpc("calculate_payroll",{p_period:p.id}));
        toast(`${r.lignes} séance(s) payable(s) · ${fcfa(r.total_fcfa)}`+(r.sans_tarif?` · ${r.sans_tarif} sans tarif défini`:""),r.sans_tarif>0);rerender()}catch(e){toast(errMsg(e),true)}};
      document.getElementById("appr")&&(appr.onclick=()=>openDialog(`<h3>Approuver la période ?</h3>
        <p style="margin:0">${by.length} bulletin(s) pour un total de <b>${fcfa(tot)}</b> vont être générés. Après approbation, les montants sont figés et ces séances ne pourront plus être payées dans une autre période.</p>
        ${pending.length?`<p class="sub" style="margin:0">${pending.length} émargement(s) non validé(s) restent en dehors de cette paie.</p>`:""}
        <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Approuver</button></div>`,
        async()=>{const n=await q(sb.rpc("approve_payroll",{p_period:p.id}));toast(`${n} bulletin(s) générés`);rerender()}));
      document.getElementById("delP")&&(delP.onclick=()=>openDialog(`<h3>Supprimer « ${esc(p.name)} » ?</h3><p style="margin:0">La période n'a pas encore été approuvée. Aucune donnée d'émargement ne sera perdue.</p>
        <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn danger" value="ok">Supprimer</button></div>`,
        async()=>{await q(sb.from("pay_periods").delete().eq("id",p.id));S.periodId=null;toast("Période supprimée");rerender()}));
    }
    el.querySelectorAll("[data-dt]").forEach(b=>b.onclick=()=>linesDialog(by.find(o=>o.id==b.dataset.dt)));
    wireExport("pX",()=>({file:"paie_"+slug(p.name)+"_provisoire",title:"Paie : "+p.name+" (calcul provisoire)",subtitle:"Du "+fdl(p.start_date)+" au "+fdl(p.end_date),landscape:true,sheets:[
      {name:"Par enseignant",title:"Total par enseignant (FCFA)",head:["Enseignant","Statut","Séances","Heures","Montant (FCFA)"],
       rows:by.map(o=>[o.t.last_name+" "+o.t.first_name,o.t.teacher_statuses?.label||"",o.lines.length,dh(o.min),o.amt]).concat([["Total","",items.length,dh(by.reduce((s,o)=>s+o.min,0)),tot]])},
      {name:"Détail des séances",title:"Détail des séances",head:["Enseignant","Date","Cours","Groupe","Heures","Tarif (FCFA/h)","Montant (FCFA)","Rattrapage"],
       rows:by.flatMap(o=>o.lines.map(l=>[o.t.last_name+" "+o.t.first_name,fdl(l.session_date),l.course_label,l.group_code,dh(l.minutes),l.rate_fcfa,l.amount_fcfa,l.is_catch_up?"Oui":""]))}]}));
    return;
  }
  const [slips,pays]=await Promise.all([
    q(sb.from("payslips").select("*").eq("pay_period_id",p.id).order("number")),
    q(sb.from("payments").select("*,payslips!inner(pay_period_id)").eq("payslips.pay_period_id",p.id).order("paid_on"))]);
  const paid=id=>pays.filter(x=>x.payslip_id===id).reduce((s,x)=>s+x.amount_fcfa,0);
  const tot=slips.reduce((s,x)=>s+x.net_fcfa,0),tp=slips.reduce((s,x)=>s+paid(x.id),0);
  el.innerHTML=`<div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0 0 12px">${esc(p.name)}</h2>${slips.length?xbar("pX"):""}</div>
    <p class="sub" style="margin:0 0 12px">Approuvée le ${new Date(p.approved_at).toLocaleString("fr-FR",{dateStyle:"long",timeStyle:"short"})}. Les bulletins ci-dessous sont la version de référence.</p>
    <div class="stats"><div class="stat"><b>${fcfa(tot)}</b><span>Net à payer</span></div><div class="stat"><b>${fcfa(tp)}</b><span>Réglé</span></div>
      <div class="stat"><b style="color:${tot-tp?"var(--warn)":"var(--ok)"}">${fcfa(tot-tp)}</b><span>Reste dû</span></div></div>
    <div class="panel tbl"><table><thead><tr><th>Bulletin</th><th>Enseignant</th><th>Heures</th><th>Net</th><th>Réglé</th><th>État</th><th></th></tr></thead><tbody>
    ${slips.map(s=>`<tr><td class="mono">${esc(s.number)}</td><td>${esc(s.snapshot.enseignant.nom)}<div class="sub">${esc(s.snapshot.enseignant.statut)}</div></td>
      <td class="num">${hrs(s.total_minutes)}</td><td class="num">${fcfa(s.net_fcfa)}</td><td class="num">${fcfa(paid(s.id))}</td><td>${ppill(SLIP,s.status)}</td>
      <td><div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm" data-pdf="${s.id}">PDF</button>${canPay()&&s.status!=="paye"?`<button class="btn primary sm" data-pay="${s.id}">Paiement</button>`:""}</div></td></tr>`).join("")}
    </tbody></table></div>
    ${pays.length?`<h2>Règlements enregistrés</h2><div class="panel tbl"><table><thead><tr><th>Date</th><th>Bulletin</th><th>Mode</th><th>Référence</th><th>Montant</th></tr></thead><tbody>
    ${pays.map(x=>`<tr><td class="mono">${fdl(x.paid_on)}</td><td class="mono">${esc(slips.find(s=>s.id===x.payslip_id)?.number)}</td><td>${esc(x.method)}</td><td class="mono">${esc(x.reference||"—")}</td><td class="num">${fcfa(x.amount_fcfa)}</td></tr>`).join("")}</tbody></table></div>`:""}`;
  el.querySelectorAll("[data-pdf]").forEach(b=>b.onclick=()=>downloadSlip(slips.find(s=>s.id==b.dataset.pdf),pays));
  wireExport("pX",()=>({file:"paie_"+slug(p.name),title:"État de paie : "+p.name,subtitle:"Du "+fdl(p.start_date)+" au "+fdl(p.end_date)+" · approuvée le "+fdl(p.approved_at),landscape:true,sheets:[
    {name:"Bulletins",title:"Bulletins (FCFA)",head:["Bulletin","Enseignant","Statut","Heures","Net à payer (FCFA)","Réglé (FCFA)","Reste dû (FCFA)","État"],
     rows:slips.map(s=>[s.number,s.snapshot.enseignant.nom,s.snapshot.enseignant.statut||"",dh(s.total_minutes),s.net_fcfa,paid(s.id),s.net_fcfa-paid(s.id),s.status])
       .concat([["Total","","",dh(slips.reduce((a,s)=>a+s.total_minutes,0)),tot,tp,tot-tp,""]])},
    {name:"Règlements",title:"Règlements enregistrés",head:["Date","Bulletin","Mode","Référence","Montant (FCFA)"],
     rows:pays.map(x=>[fdl(x.paid_on),slips.find(s=>s.id===x.payslip_id)?.number||"",x.method,x.reference||"",x.amount_fcfa])}]}));
  el.querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>{const s=slips.find(x=>x.id==b.dataset.pay);const due=s.net_fcfa-paid(s.id);
    openDialog(`<h3>Enregistrer un paiement</h3>
      <dl class="kv"><dt>Bulletin</dt><dd class="mono">${esc(s.number)}</dd><dt>Enseignant</dt><dd>${esc(s.snapshot.enseignant.nom)}</dd><dt>Reste dû</dt><dd class="mono">${fcfa(due)}</dd></dl>
      <div class="row"><label>Montant (FCFA)<input id="pA" type="number" min="1" max="${due}" required value="${due}"></label><label>Date<input id="pD" type="date" required value="${iso(new Date())}"></label></div>
      <div class="row"><label>Mode<select id="pM"><option>virement</option><option>Wave</option><option>Orange Money</option><option>chèque</option><option>espèces</option></select></label><label>Référence<input id="pR" placeholder="N° de virement, de transaction…"></label></div>
      <p class="sub" style="margin:0">Le paiement est enregistré par le service financier. Il n'exécute aucun virement.</p>
      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Enregistrer</button></div>`,
    async()=>{await q(sb.rpc("record_payment",{p_payslip:s.id,p_amount:Number(pA.value),p_paid_on:pD.value,p_method:pM.value,p_reference:pR.value.trim()||null}));toast("Paiement enregistré");rerender()})});
}

function groupBy(items){
  const m={};items.forEach(i=>{m[i.teacher_id]??={id:i.teacher_id,t:i.teachers,lines:[],min:0,amt:0};const o=m[i.teacher_id];o.lines.push(i);o.min+=i.minutes;o.amt+=i.amount_fcfa});
  return Object.values(m).sort((a,b)=>a.t.last_name.localeCompare(b.t.last_name));
}
function teacherTable(by){
  return `<div class="panel tbl"><table><thead><tr><th>Enseignant</th><th>Statut</th><th>Séances</th><th>Heures</th><th>Tarif(s)</th><th>Montant</th><th></th></tr></thead><tbody>
  ${by.map(o=>{const rates=[...new Set(o.lines.map(l=>l.rate_fcfa+(l.rate_source==="individuel"?" (indiv.)":"")))];const catchUp=o.lines.some(l=>l.is_catch_up);
    return `<tr><td>${esc(o.t.first_name+" "+o.t.last_name)}${catchUp?`<div><span class="pill p-info">Rattrapage inclus</span></div>`:""}</td><td>${esc(o.t.teacher_statuses?.label)}</td>
    <td class="num">${o.lines.length}</td><td class="num">${hrs(o.min)}</td><td class="mono">${rates.map(esc).join(" / ")}</td><td class="num"><b>${fcfa(o.amt)}</b></td>
    <td><button class="btn sm" data-dt="${o.id}">Détail</button></td></tr>`}).join("")}</tbody></table></div>`;
}
function linesDialog(o){
  openDialog(`<h3>${esc(o.t.first_name+" "+o.t.last_name)}</h3>
    <div class="tbl"><table><thead><tr><th>Date</th><th>Cours</th><th>Durée</th><th>Tarif</th><th>Montant</th></tr></thead><tbody>
    ${o.lines.map(l=>`<tr><td class="mono">${fdl(l.session_date)}${l.is_catch_up?' <span class="pill p-info">rattrapage</span>':""}</td><td>${esc(l.course_label)}<div class="sub">${esc(l.group_code)}</div></td><td class="num">${hrs(l.minutes)}</td><td class="num">${l.rate_fcfa}${l.rate_source==="individuel"?"*":""}</td><td class="num">${fcfa(l.amount_fcfa)}</td></tr>`).join("")}
    </tbody></table></div><p class="sub" style="margin:0">Montant = durée retenue × tarif horaire en vigueur à la date de la séance. * tarif individuel.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Fermer</button></div>`,async()=>{});
}

function downloadSlip(slip,payments){
  try{
    if(!window.jspdf)throw new Error("Le module PDF n'a pas pu être chargé. Vérifiez la connexion et rechargez la page.");
    const doc=makePayslipPdf(window.jspdf.jsPDF,slip,payments.filter(p=>p.payslip_id===slip.id));
    doc.save(`${slip.number}_${slip.snapshot.enseignant.nom.replace(/\s+/g,"-")}.pdf`);
  }catch(e){toast(errMsg(e),true)}
}

/* ---------- tarifs ---------- */
async function viewRates(v){
  const [statuses,rates,teachers,used]=await Promise.all([
    q(sb.from("teacher_statuses").select("id,code,label").order("id")),
    q(sb.from("hourly_rates").select("*").order("effective_from",{ascending:false})),
    q(sb.from("teachers").select("id,first_name,last_name,status_id").order("last_name")),
    q(sb.from("payroll_items").select("rate_id"))]);
  const usedIds=new Set(used.map(u=>u.rate_id));
  const today=iso(new Date());
  const current=(list)=>list.filter(r=>r.effective_from<=today).sort((a,b)=>b.effective_from.localeCompare(a.effective_from))[0];
  const target=r=>r.status_id?statuses.find(s=>s.id===r.status_id)?.label:(()=>{const t=teachers.find(t=>t.id===r.teacher_id);return t?t.first_name+" "+t.last_name:"?"})();
  const indiv=teachers.filter(t=>rates.some(r=>r.teacher_id===t.id));
  v.innerHTML=`<h1>Tarifs horaires</h1>
    <p class="lead">Le tarif dépend du statut de l'enseignant. Une exception individuelle remplace le tarif du statut. Pour changer un tarif, ajoutez-en un nouveau avec sa date d'effet : l'ancien reste appliqué aux séances antérieures.</p>
    <div class="row" style="justify-content:space-between"><h2 style="margin-top:0">Tarifs en vigueur au ${fdl(today)}</h2>${canPay()?`<button class="btn sm primary" id="addRate">Nouveau tarif</button>`:""}</div>
    <div class="panel tbl"><table><thead><tr><th>Statut</th><th>Tarif horaire</th><th>Depuis le</th><th>Enseignants</th></tr></thead><tbody>
    ${statuses.map(s=>{const c=current(rates.filter(r=>r.status_id===s.id));const next=rates.filter(r=>r.status_id===s.id&&r.effective_from>today).at(-1);
      return `<tr><td>${esc(s.label)}</td><td class="num"><b>${c?fcfa(c.rate_fcfa):"Non défini"}</b>${next?`<div class="sub">${fcfa(next.rate_fcfa)} à partir du ${fdl(next.effective_from)}</div>`:""}</td><td class="mono">${c?fdl(c.effective_from):"—"}</td><td class="num">${teachers.filter(t=>t.status_id===s.id).length}</td></tr>`}).join("")}
    ${indiv.map(t=>{const c=current(rates.filter(r=>r.teacher_id===t.id));return `<tr><td>${esc(t.first_name+" "+t.last_name)} <span class="pill p-info">Individuel</span></td><td class="num"><b>${c?fcfa(c.rate_fcfa):"pas encore en vigueur"}</b></td><td class="mono">${c?fdl(c.effective_from):"—"}</td><td></td></tr>`}).join("")}
    </tbody></table></div>
    <h2>Historique</h2>
    <div class="panel tbl"><table><thead><tr><th>Date d'effet</th><th>S'applique à</th><th>Tarif</th><th>Note</th><th></th></tr></thead><tbody>
    ${rates.map(r=>`<tr><td class="mono">${fdl(r.effective_from)}</td><td>${esc(target(r))}${r.teacher_id?' <span class="pill p-info">Individuel</span>':""}</td><td class="num">${fcfa(r.rate_fcfa)}</td><td class="sub">${esc(r.note||"")}</td>
      <td>${usedIds.has(r.id)?`<span class="sub">Utilisé en paie</span>`:canPay()?`<button class="btn sm danger" data-del="${r.id}">Supprimer</button>`:""}</td></tr>`).join("")}</tbody></table></div>`;
  if(!canPay())return;
  addRate.onclick=()=>openDialog(`<h3>Nouveau tarif horaire</h3>
    <label>S'applique à<select id="rTg"><optgroup label="Statut">${statuses.map(s=>`<option value="s${s.id}">${esc(s.label)}</option>`).join("")}</optgroup>
      <optgroup label="Exception individuelle">${teachers.map(t=>`<option value="t${t.id}">${esc(t.first_name+" "+t.last_name)}</option>`).join("")}</optgroup></select></label>
    <div class="row"><label>Tarif horaire (FCFA)<input id="rAmt" type="number" min="1" step="500" required></label><label>Date d'effet<input id="rFrom" type="date" required value="${today}"></label></div>
    <label>Note<input id="rNote" placeholder="Ex. : décision du conseil du 12/10/2026"></label>
    <p class="sub" style="margin:0">Les séances déjà payées ne sont jamais recalculées.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Enregistrer</button></div>`,
    async()=>{const tg=rTg.value,id=Number(tg.slice(1));
      await q(sb.from("hourly_rates").insert({status_id:tg[0]==="s"?id:null,teacher_id:tg[0]==="t"?id:null,rate_fcfa:Number(rAmt.value),effective_from:rFrom.value,note:rNote.value.trim()||null}));
      toast("Tarif enregistré");rerender()});
  v.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{try{const r=await q(sb.from("hourly_rates").delete().eq("id",b.dataset.del).select());
    if(!r.length)throw new Error("Ce tarif a déjà servi au calcul d'une paie : il ne peut pas être supprimé.");toast("Tarif supprimé");rerender()}catch(e){toast(errMsg(e),true)}});
}

/* ---------- mes bulletins ---------- */
async function viewMyPayslips(v){
  const [slips,pays,unpaid]=await Promise.all([
    q(sb.from("payslips").select("*").eq("teacher_id",S.teacher.id).order("generated_at",{ascending:false})),
    q(sb.from("payments").select("*")),
    q(sb.from("attendance_records").select("retained_minutes").eq("teacher_id",S.teacher.id).eq("status","valide").is("pay_period_id",null))]);
  const paid=id=>pays.filter(x=>x.payslip_id===id).reduce((s,x)=>s+x.amount_fcfa,0);
  const waiting=unpaid.reduce((s,a)=>s+a.retained_minutes,0);
  v.innerHTML=`<h1>Mes bulletins</h1>
    <p class="lead">Vos bulletins de rémunération approuvés. Ils ne sont visibles que par vous et par le service financier.</p>
    <div class="stats"><div class="stat"><b>${slips.length}</b><span>Bulletins</span></div>
      <div class="stat"><b>${fcfa(slips.reduce((s,x)=>s+x.net_fcfa,0))}</b><span>Total net</span></div>
      <div class="stat"><b>${hrs(waiting)}</b><span>Heures validées pas encore payées</span></div></div>
    <div class="panel tbl">${slips.length?`<table><thead><tr><th>Bulletin</th><th>Période</th><th>Heures</th><th>Net à payer</th><th>Réglé</th><th>État</th><th></th></tr></thead><tbody>
    ${slips.map(s=>`<tr><td class="mono">${esc(s.number)}</td><td>${esc(s.snapshot.periode.nom)}<div class="sub mono">${fdl(s.snapshot.periode.debut)} au ${fdl(s.snapshot.periode.fin)}</div></td>
      <td class="num">${hrs(s.total_minutes)}</td><td class="num"><b>${fcfa(s.net_fcfa)}</b></td><td class="num">${fcfa(paid(s.id))}</td><td>${ppill(SLIP,s.status)}</td>
      <td><button class="btn sm primary" data-pdf="${s.id}">Télécharger le PDF</button></td></tr>`).join("")}</tbody></table>`:`<p class="empty">Aucun bulletin pour l'instant. Il apparaîtra ici dès que le service financier aura approuvé une période.</p>`}</div>`;
  v.querySelectorAll("[data-pdf]").forEach(b=>b.onclick=()=>downloadSlip(slips.find(s=>s.id==b.dataset.pdf),pays));
}

/* ---------- journal ---------- */
async function viewAudit(v){
  const rows=await q(sb.from("audit_logs").select("*").order("occurred_at",{ascending:false}).limit(200));
  const ids=[...new Set(rows.map(r=>r.actor).filter(Boolean))];
  const people=ids.length?await q(sb.from("profiles").select("id,full_name").in("id",ids)):[];
  const nm=id=>people.find(p=>p.id===id)?.full_name||"Système";
  const OP={INSERT:"Création",UPDATE:"Modification",DELETE:"Suppression"};
  const TB={attendance_records:"Émargement",schedule_sessions:"Séance",timetable_slots:"Créneau",teaching_assignments:"Affectation",user_roles:"Rôle",teachers:"Enseignant",profiles:"Profil",hourly_rates:"Tarif",pay_periods:"Période de paie",payslips:"Bulletin",payments:"Paiement",teacher_statuses:"Statut"};
  const detail=r=>{if(r.table_name==="attendance_records"&&r.new_data){const o=r.old_data?.status,n=r.new_data.status;return o&&o!==n?`${ATT[o]?.[0]||o} → ${ATT[n]?.[0]||n}`:(ATT[n]?.[0]||"")}
    if(r.table_name==="schedule_sessions"&&r.new_data)return `${r.new_data.session_date} ${hm(r.new_data.start_time)} · ${r.new_data.status}`;
    if(r.table_name==="pay_periods"&&r.new_data)return `${r.new_data.name} · ${PER[r.new_data.status]?.[0]||r.new_data.status}`;
    if(r.table_name==="payslips"&&r.new_data)return `${r.new_data.number} · ${fcfa(r.new_data.net_fcfa)}`;
    if(r.table_name==="payments"&&r.new_data)return `${fcfa(r.new_data.amount_fcfa)} · ${r.new_data.method}`;
    if(r.table_name==="hourly_rates"&&r.new_data)return `${fcfa(r.new_data.rate_fcfa)} dès le ${fdl(r.new_data.effective_from)}`;
    return ""};
  v.innerHTML=`<h1>Journal des opérations</h1><p class="lead">Chaque création, modification ou suppression sensible est enregistrée avec son auteur et l'heure.</p>
    <div class="panel tbl">${rows.length?`<table><thead><tr><th>Date</th><th>Auteur</th><th>Opération</th><th>Élément</th><th>Détail</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td class="mono">${new Date(r.occurred_at).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"})}</td><td>${esc(nm(r.actor))}</td><td>${OP[r.action]||r.action}</td><td>${TB[r.table_name]||r.table_name} <span class="sub mono">#${esc(r.record_id)}</span></td><td>${esc(detail(r))}</td></tr>`).join("")}
    </tbody></table>`:`<p class="empty">Aucune opération enregistrée pour l'instant. Les émargements et validations apparaîtront ici.</p>`}</div>`;
}

sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_OUT")renderLogin()});
boot();
</script>
