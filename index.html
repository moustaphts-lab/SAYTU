<style>
/* Design : sobre, vert profond, grandes zones tactiles. Sur téléphone : navigation en bas, tableaux en cartes, fenêtres en feuille basse. */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --line:#e1e7e4; --ink:#14201b; --muted:#5f6e67;
  --accent:#0b6e5b; --accent-ink:#ffffff; --accent-soft:#dff1ec; --ochre:#b06a00;
  --ok:#1b7a47; --ok-soft:#e1f3e8; --warn:#92580a; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#fbe7e4;
  --r:14px; --shadow:0 1px 2px rgba(20,32,27,.05),0 4px 14px rgba(20,32,27,.04);
  --f-display:"Bricolage Grotesque", system-ui, sans-serif; --f-body:"Instrument Sans", system-ui, sans-serif; --f-mono:"Instrument Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1512; --surface:#151f1b; --line:#25332d; --ink:#e7efeb; --muted:#9bada5;
  --accent:#4fd1b0; --accent-ink:#06231c; --accent-soft:#143229; --ochre:#e3a94f;
  --ok:#5cc58c; --ok-soft:#163324; --warn:#e7b04f; --warn-soft:#3a2c12; --bad:#f0857c; --bad-soft:#3d1a18; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1512; --surface:#151f1b; --line:#25332d; --ink:#e7efeb; --muted:#9bada5;
  --accent:#4fd1b0; --accent-ink:#06231c; --accent-soft:#143229; --ochre:#e3a94f;
  --ok:#5cc58c; --ok-soft:#163324; --warn:#e7b04f; --warn-soft:#3a2c12; --bad:#f0857c; --bad-soft:#3d1a18; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top .bar{display:flex;align-items:center;gap:12px;padding-block:10px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;font:700 18px var(--f-display);letter-spacing:-.01em}
.brand i{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 17px var(--f-display);font-style:normal}
.brand small{display:block;font:400 12px var(--f-body);color:var(--muted);letter-spacing:0}
.burger{display:none;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);cursor:pointer;flex:0 0 auto;padding:0}
.scrim,nav.tabs .drawer-top{display:none}
.menu{margin-left:auto;position:relative}
.menu summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:5px 6px 5px 5px;border-radius:99px;border:1px solid var(--line)}
.menu summary::-webkit-details-marker{display:none}
.menu .av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 13px var(--f-body)}
.menu .nm{font-size:13px;font-weight:500;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px}
.menu .pop{position:absolute;right:0;top:calc(100% + 8px);width:min(280px,86vw);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 32px rgba(10,20,15,.18);padding:12px;display:flex;flex-direction:column;gap:8px;z-index:8}
.menu .pop p{margin:0 0 4px;font-size:13px;color:var(--muted)}
.menu .pop p b{display:block;color:var(--ink);font-size:14px;overflow-wrap:anywhere}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-radius:99px;padding:8px 14px;font:500 14px var(--f-body);color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button:hover{background:var(--bg)}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.tabs button{display:flex;align-items:center;gap:12px}

.yr{display:none}
@media (min-width:721px){
  :root{--sbw:224px}

  nav.tabs .drawer-top{display:block;padding:2px 8px 16px;margin-bottom:10px;border-bottom:1px solid var(--line)}
  nav.tabs .drawer-top .brand{font-size:17px}
  nav.tabs .drawer-top p{margin:12px 0 0;font-size:12.5px;line-height:1.45;color:var(--muted);overflow-wrap:anywhere}
  nav.tabs button{width:100%;text-align:left;border-radius:12px;padding:11px 12px;font-size:14.5px;white-space:normal;position:relative}
  nav.tabs button[aria-selected="true"]::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
  header.top .bar>.brand{display:none}
  .yr{display:block;font-size:13.5px;color:var(--muted)}
  header.top .bar{min-height:56px}
  header.top .wrap:last-child{padding:0;height:0}
  main.wrap{padding-inline:max(24px,env(safe-area-inset-right,0px)) 24px}
}
@media (min-width:1025px){:root{--sbw:264px}nav.tabs{padding:22px 16px 28px}}
main{padding-block:26px 64px}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.02em;line-height:1.15;margin:0 0 6px;text-wrap:balance}
h2{font:600 17px var(--f-display);margin:28px 0 10px}
.lead{color:var(--muted);margin:0 0 20px;max-width:68ch}
.asg-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}.asg-load{padding:14px;position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
.ld{padding:8px 0;border-bottom:1px solid var(--line,#e3e8e6)}.ld:last-child{border:0}.ld-t{display:flex;justify-content:space-between;gap:8px;font-size:14px}
@media(max-width:1024px){.asg-layout{grid-template-columns:1fr}.asg-load{position:static;max-height:none}}
#aTable select{min-width:170px}
.ttseg{display:inline-grid;max-width:100%;overflow-x:auto}
.tt-ev.cancel{opacity:.6;background:repeating-linear-gradient(135deg,var(--surface) 0 6px,color-mix(in srgb,var(--bad) 8%,var(--surface)) 6px 12px)!important;border-left-color:var(--bad)!important}.tt-ev.cancel b,.tt-ev.cancel .tt-n{text-decoration:line-through}
.ovwrap{overflow-x:auto;padding:0}
table.ov{width:100%;border-collapse:collapse;min-width:760px}table.ov th,table.ov td{border-bottom:1px solid var(--line,#e3e8e6);border-right:1px solid var(--line,#e3e8e6);vertical-align:top;padding:8px;text-align:left}
table.ov thead th{font-size:13px;color:var(--muted);background:var(--bg)}table.ov thead small{font-weight:500}table.ov tbody th{width:110px;background:var(--bg);position:sticky;left:0;z-index:1}
.ovc{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;border:0;border-left:4px solid var(--c);border-radius:8px;background:color-mix(in srgb,var(--c) 10%,var(--surface));padding:5px 7px;margin-bottom:5px;font:inherit;font-size:12px;color:inherit;cursor:pointer}
.ovc b{font-size:13px}.ovc .mono{font-size:11px;color:var(--muted)}.ovc.draft{border-style:dashed;border-left-style:solid;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 6%,var(--surface)) 0 6px,var(--surface) 6px 12px)}
.ovc.conf{box-shadow:0 0 0 2px var(--bad)}.ovc.cancel{opacity:.6;border-left-color:var(--bad)}.ovc.cancel b{text-decoration:line-through}.ovn{color:var(--muted);font-size:12px}
ul.chk{list-style:none;margin:0;padding:0;display:grid;gap:6px}ul.chk li{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:8px 10px;border-radius:10px;background:var(--bg)}
ul.chk i{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px;color:#fff}
ul.chk .ok i{background:var(--ok)}ul.chk .warn i{background:var(--warn)}ul.chk .bad i{background:var(--bad)}ul.chk .info i{background:var(--muted)}ul.chk .bad{color:var(--bad);font-weight:600}
.gtwrap{overflow-x:auto}table.gt{width:100%;border-collapse:separate;border-spacing:4px;min-width:420px}
table.gt th{font-weight:600;padding:0}table.gt th button{width:100%;border:0;background:var(--accent);color:#fff;border-radius:9px;padding:7px 4px;font:600 13px var(--f-body);cursor:pointer;white-space:nowrap}
table.gt tbody th button{background:var(--bg);color:var(--ink);font-weight:500;font-size:12px;font-family:var(--f-mono,inherit)}
table.gt th button.off{background:var(--bg);color:var(--muted);text-decoration:line-through}
table.gt td{padding:0}.gc{width:100%;height:34px;border-radius:9px;border:1px solid transparent;background:var(--accent-soft);cursor:pointer}
.gc[aria-pressed="false"]{background:repeating-linear-gradient(135deg,var(--surface) 0 5px,var(--bg) 5px 10px);border-color:var(--line,#e3e8e6)}
.gc[aria-pressed="false"]::after{content:"sans cours";font:500 10.5px var(--f-body);color:var(--muted)}
.dhgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}.dh{display:grid;gap:4px}
.dh button{border:1px solid var(--line,#e3e8e6);background:var(--surface);color:var(--muted);border-radius:10px;padding:7px 4px;font:600 13px var(--f-body);cursor:pointer}
.dh .dh-d{font-size:13px}.dh .dh-h{font-size:12px;font-weight:500}
.dh button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.dh .dh-h[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dh button[aria-pressed="false"]{text-decoration:line-through;background:repeating-linear-gradient(135deg,var(--surface) 0 5px,var(--bg) 5px 10px)}
@media(max-width:560px){.dhgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pwwrap{position:relative;display:block}.pwwrap input{width:100%;padding-right:48px!important}.pweye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--muted);display:grid;place-items:center;border-radius:10px;cursor:pointer}.pweye:hover{color:var(--accent);background:var(--accent-soft)}
.pbar{height:5px;border-radius:9px;background:var(--line,#e3e8e6);overflow:hidden;margin-top:5px;min-width:70px}.pbar i{display:block;height:100%;background:var(--accent)}
.weeknav{display:flex;align-items:center;gap:10px;background:var(--surface,#fff);border:1px solid var(--line,#e3e8e6);border-radius:16px;padding:8px;margin:4px 0 18px}
.weeknav .wbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line,#e3e8e6);background:var(--bg,#f3f5f4);color:inherit;display:grid;place-items:center;cursor:pointer;flex:none}
.weeknav .wbtn:active{transform:scale(.95)}
.weeknav .wmid{flex:1;text-align:center;line-height:1.15;min-width:0}
.weeknav .wmid small{display:block;font-size:12px;opacity:.65}
.weeknav .wmid b{font-size:17px}
.weeknav .wnow{border:0;background:var(--accent-soft,#dcefe9);color:var(--accent);font:inherit;font-weight:600;font-size:13px;padding:10px 14px;border-radius:12px;cursor:pointer;white-space:nowrap;flex:none}
@media(max-width:720px){.weeknav{display:grid;grid-template-columns:44px 1fr 44px;gap:8px 10px}.weeknav .wnow{grid-column:1/-1;text-align:center}}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font:700 26px var(--f-display);letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--muted)}
.stats.mini{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.stats.mini .stat{display:flex;align-items:baseline;gap:8px;padding:8px 14px;box-shadow:none;flex:1 1 auto}.stats.mini .stat b{display:inline;font-size:20px}.stats.mini .stat span{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;font-size:13px;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.num,.mono{font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:13px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--accent-soft);color:var(--accent)}
.p-mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.gap{color:var(--ochre);font-weight:600}
button.btn,.btn{font:600 14px var(--f-body);border-radius:10px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 11px;font-size:13px;min-height:34px}
.btn:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted)}
input,select,textarea{font:15px var(--f-body);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-height:42px;max-width:100%}
textarea{min-height:76px;resize:vertical}
input[type=checkbox]{min-height:0;width:18px;height:18px;padding:0;accent-color:var(--accent)}
.loginpage{min-height:100dvh;display:grid;place-items:center;padding-block:32px}
.login{width:100%;max-width:420px;margin:0 auto;text-align:center}
.login .brand{margin:0 auto 22px;justify-content:center;text-align:left}
.login h1{margin:0 0 6px}.login .lead{margin:0 0 22px}
.login .panel{padding:26px;display:flex;flex-direction:column;gap:16px;text-align:left;box-shadow:var(--shadow)}
.login .panel .btn{min-height:48px;font-size:16px}

.demo{margin-top:18px;font-size:13px}

.err{color:var(--bad);font-size:13px}

.toast.bad{background:var(--bad);color:#fff}
dialog{border:0;border-radius:18px;background:var(--surface);color:var(--ink);padding:0;width:min(540px,94vw);max-height:90dvh;box-shadow:0 24px 60px rgba(10,20,15,.3)}

.kv dt{color:var(--muted)} .kv dd{margin:0}
.tt-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}

/* ---------- disponibilités par semaine (professeur pour lui-même, ou directeur pour un professeur) ---------- */
async function viewAvailability(v,opt={}){
  const asPlanner=!!opt.teacherId;
  if(!S.avWeek)S.avWeek=nextMonday();
  const W=asPlanner&&opt.week?opt.week:S.avWeek,wk=iso(W),prevWk=iso(addDays(W,-7));
  const sch=S.sched||SCHED_DEFAULT,tid=asPlanner?opt.teacherId:S.teacher.id,H0=Math.floor(hmin(sch.start)/60),H1=Math.ceil(hmin(sch.end)/60),N=H1-H0,D=sch.days;
  const lf=sch.lunchFrom?hmin(sch.lunchFrom):null,lt=sch.lunchTo?hmin(sch.lunchTo):null;
  const pause=Array.from({length:N},(_,i)=>lf!=null&&lt!=null&&Math.min(lt,(H0+i+1)*60)-Math.max(lf,(H0+i)*60)>=30);
  const [rows,resp,prev,prevResp,pub,tch]=await Promise.all([
    q(sb.from("teacher_availability").select("day_of_week,start_time,end_time").eq("teacher_id",tid).eq("week_start",wk)),
    q(sb.from("availability_weeks").select("declared_at,by_planner").eq("teacher_id",tid).eq("week_start",wk).maybeSingle()),
    q(sb.from("teacher_availability").select("day_of_week,start_time,end_time").eq("teacher_id",tid).eq("week_start",prevWk)),
    q(sb.from("availability_weeks").select("teacher_id").eq("teacher_id",tid).eq("week_start",prevWk).maybeSingle()),
    q(sb.from("published_weeks").select("published_at").eq("week_start",wk).maybeSingle()),
    asPlanner?q(sb.from("teachers").select("first_name,last_name").eq("id",tid).single()):Promise.resolve(null)]);
  const locked=!!pub&&!asPlanner;
  const T=t=>{const [h,m]=String(t).slice(0,5).split(":").map(Number);return h*60+m};
  const F=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
  let declared=!!resp;
  const on={};
  const load=rs=>{D.forEach(d=>{on[d]=Array(N).fill(false)});D.forEach(d=>rs.filter(r=>r.day_of_week===d).forEach(r=>{for(let h=H0;h<H1;h++){const ov=Math.min(T(r.end_time),(h+1)*60)-Math.max(T(r.start_time),h*60);if(ov>=30&&!pause[h-H0])on[d][h-H0]=true}}))};
  load(rows);
  let tm=0,saving=Promise.resolve();
  const count=()=>D.reduce((a,d)=>a+on[d].filter(Boolean).length,0);
  const free=arr=>arr.every((x,i)=>x||pause[i]);
  const ranges=d=>{const out=[];let st=null;on[d].forEach((x,i)=>{if(x&&st==null)st=i;if((!x||i===N-1)&&st!=null){const en=x&&i===N-1?i+1:i;out.push([(H0+st)*60,(H0+en)*60]);st=null}});return out};
  const stateEl=()=>document.getElementById("avState");
  const args=x=>asPlanner?{...x,p_teacher:tid}:x;
  const flush=async()=>{
    const all=D.flatMap(d=>ranges(d).map(([x,y])=>({day:d,start:F(x),end:F(y)})));
    try{await q(sb.rpc("save_week_availability",args({p_week:wk,p_ranges:all})));declared=true;if(stateEl())stateEl().textContent="Enregistré ✓";draw()}
    catch(e){toast(/Could not find the function|PGRST202/.test(e.message||"")?"La base n'est pas à jour : le script « semaines_dispos.sql » doit être exécuté dans Supabase.":errMsg(e),true);rerender()}
  };
  const queue=()=>{if(stateEl())stateEl().textContent="Enregistrement…";clearTimeout(tm);tm=setTimeout(()=>{saving=saving.then(flush)},450)};
  const set=(d,h,val)=>{if(locked||pause[h]||on[d][h]===val)return;on[d][h]=val;queue()};
  const who=asPlanner?esc(tch.first_name+" "+tch.last_name):"Vous";
  const draw=()=>{
    const g=document.getElementById("avGrid"),n=count();
    g.innerHTML=`<div class="avg-c0"></div>${D.map(d=>`<button type="button" class="avg-h" data-day="${d}" ${locked?"disabled":""} aria-label="${DAYS[d]} : tout changer"><span class="full">${DAYS[d]} ${dayDate(W,d)}</span><span class="abbr">${DAYS[d].slice(0,3)}. ${dayDate(W,d)}</span></button>`).join("")}
      ${Array.from({length:N},(_,i)=>`<button type="button" class="avg-r" data-row="${i}" ${locked?"disabled":""} aria-label="${F((H0+i)*60)} : tout changer">${F((H0+i)*60)}</button>${D.map(d=>`<button type="button" class="avg-c ${pause[i]?"pause":on[d][i]?"on":"off"}" data-d="${d}" data-h="${i}" ${pause[i]||locked?"disabled":""} aria-pressed="${on[d][i]}" aria-label="${DAYS[d]} ${F((H0+i)*60)}–${F((H0+i+1)*60)}, ${pause[i]?"pause":on[d][i]?"disponible":"indisponible"}"></button>`).join("")}`).join("")}`;
    document.getElementById("avTotal").textContent=hrs(n*60);
    const nb=document.getElementById("avNote");nb.hidden=false;
    if(locked){nb.className="panel avnote";nb.innerHTML=`<b>L'emploi du temps de cette semaine est publié.</b> Vos disponibilités ne sont plus modifiables ici. Pour un changement, contactez le directeur des études.`}
    else if(!declared){nb.className="panel avnote";nb.innerHTML=`<b>${asPlanner?"Ce professeur n'a pas encore répondu pour cette semaine.":"Vous n'avez pas encore répondu pour cette semaine."}</b> Touchez les créneaux ${asPlanner?"où il est":"où vous êtes"} disponible, ou utilisez les boutons ci-dessous.`}
    else if(n===0){nb.className="panel avnote off";nb.innerHTML=`<b>${asPlanner?"Indiqué indisponible":"Vous avez indiqué être indisponible"} toute la semaine.</b> Aucun cours ne sera placé${asPlanner?" pour lui":" pour vous"} cette semaine.`}
    else nb.hidden=true;
    ["avAllOn","avAll","avCopy","avReset"].forEach(i=>{const b=document.getElementById(i);if(b)b.disabled=locked});
    if(!locked){document.getElementById("avAll").disabled=declared&&n===0;document.getElementById("avReset").disabled=!declared;document.getElementById("avCopy").disabled=!prevResp}
  };
  v.innerHTML=`${asPlanner?`<button class="btn sm" id="avBack" style="margin-bottom:10px">← Retour à l'emploi du temps</button>`:""}
    <h1>${asPlanner?"Disponibilités de "+who:"Mes disponibilités"}</h1>
    <p class="lead">${asPlanner?"Saisie par le directeur des études (par exemple pour des disponibilités données par téléphone).":"Indiquez chaque semaine quand vous êtes disponible, avant la publication de l'emploi du temps. Touchez un créneau, un jour (en haut) ou une heure (à gauche)."}</p>
    ${asPlanner?"":weekNavHtml(W,pub?'<span class="pill p-ok">Emploi du temps publié</span>':(declared?'<span class="pill p-info">Réponse envoyée</span>':'<span class="pill p-warn">Pas encore de réponse</span>'))}
    ${asPlanner?`<div class="panel" style="padding:10px 14px;margin-bottom:12px"><b>Semaine du ${weekRange(W)}</b>${pub?' · <span class="pill p-ok">publiée</span>':""}</div>`:""}
    <div class="panel avnote" id="avNote" hidden></div>
    <div class="avbar"><div class="stat"><b id="avTotal">—</b><span>disponible cette semaine</span></div><span class="sub" id="avState" aria-live="polite"></span>
      <div class="avbtns"><button class="btn sm" id="avCopy" title="Reprendre la grille de la semaine précédente">Copier la semaine précédente</button><button class="btn sm" id="avAllOn">Disponible toute la semaine</button><button class="btn sm" id="avAll">Indisponible toute la semaine</button><button class="btn sm" id="avReset">Effacer la réponse</button></div></div>
    <div class="avg-wrap"><div class="avg" id="avGrid" style="--n:${D.length}"></div></div>
    <div class="tt-leg"><span><i class="avl on"></i>Disponible</span><span><i class="avl off"></i>Indisponible</span><span class="sub">${asPlanner?"":"Vos disponibilités sont visibles par le directeur des études et la secrétaire."}</span></div>`;
  if(!asPlanner)wireWeekNav(v,()=>S.avWeek,w=>{S.avWeek=w});
  if(asPlanner)avBack.onclick=()=>{S.avFor=null;rerender()};
  draw();
  const grid=document.getElementById("avGrid");
  let paint=null,swallow=false;
  const cellOf=e=>e.target.closest("[data-d]");
  grid.addEventListener("pointerdown",e=>{const c=cellOf(e);if(!c||e.pointerType!=="mouse"||locked)return;
    const d=Number(c.dataset.d),h=Number(c.dataset.h);paint=!on[d][h];swallow=true;set(d,h,paint);draw()});
  grid.addEventListener("pointerover",e=>{if(paint==null||e.buttons!==1)return;const c=cellOf(e);if(!c)return;
    const d=Number(c.dataset.d),h=Number(c.dataset.h);if(on[d][h]!==paint){set(d,h,paint);draw()}});
  window.addEventListener("pointerup",()=>{paint=null});
  grid.addEventListener("click",e=>{if(locked)return;
    if(swallow){swallow=false;if(cellOf(e))return}
    const c=cellOf(e);
    if(c){const d=Number(c.dataset.d),h=Number(c.dataset.h);set(d,h,!on[d][h]);draw();return}
    const hd=e.target.closest("[data-day]");
    if(hd){const d=Number(hd.dataset.day),val=!free(on[d]);on[d].forEach((_,i)=>set(d,i,val));draw();return}
    const rw=e.target.closest("[data-row]");
    if(rw){const i=Number(rw.dataset.row);if(pause[i])return;const val=!D.every(d=>on[d][i]);D.forEach(d=>set(d,i,val));draw()}});
  const now=async()=>{clearTimeout(tm);await (saving=saving.then(flush))};
  avCopy.onclick=async()=>{load(prev);draw();await now();toast("Grille de la semaine précédente reprise")};
  avAllOn.onclick=async()=>{D.forEach(d=>on[d]=on[d].map((_,i)=>!pause[i]));draw();await now()};
  avAll.onclick=()=>openDialog(`<h3>Indisponible toute la semaine ?</h3><p style="margin:0">Aucun cours ne sera placé ${asPlanner?"pour ce professeur":"pour vous"} la semaine du ${weekRange(W)}.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn danger" value="ok">Confirmer</button></div>`,
    async()=>{D.forEach(d=>on[d].fill(false));draw();await now()});
  avReset.onclick=()=>openDialog(`<h3>Effacer la réponse de cette semaine ?</h3><p style="margin:0">La semaine repassera en « pas encore de réponse ». ${asPlanner?"":"Le directeur des études décidera alors pour vous."}</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Effacer</button></div>`,
    async()=>{await q(sb.rpc("clear_week_availability",args({p_week:wk})));toast("Réponse effacée");rerender()});
}

/* ---------- emplois du temps ---------- */
async function viewPlanning(v){
  if(S.avFor){await viewAvailability(v,{teacherId:S.avFor,week:S.ttWeek});return}
  if(!S.ttWeek)S.ttWeek=planDefaultWeek();
  if(!S.ttTab)S.ttTab="grille";
  const W=S.ttWeek,wk=iso(W),wEnd=iso(addDays(W,6)),prevWk=iso(addDays(W,-7));
  const sc=S.sched||SCHED_DEFAULT;
  const SLOTSEL="id,week_start,assignment_id,day_of_week,start_time,end_time,published,room_id,rooms(code),teaching_assignments(teacher_id,group_id,assignment_groups(group_id,student_groups(code)),courses(code,name),teachers(first_name,last_name),student_groups(code))";
  const [slots,allSlots,cancelled,sessW,conf,groups,teachers,rooms,assignsAll,sems,avails,answers,pub]=await Promise.all([
    q(sb.from("timetable_slots").select(SLOTSEL).eq("week_start",wk).order("start_time")),
    q(sb.from("timetable_slots").select("assignment_id,start_time,end_time,week_start")),
    q(sb.from("schedule_sessions").select("assignment_id,start_time,end_time").in("status",["annulee","reportee"])),
    q(sb.from("schedule_sessions").select("id,slot_id,status,note,session_date,start_time,attendance_records(id,status)").gte("session_date",wk).lte("session_date",wEnd)),
    q(sb.from("slot_conflicts").select("*").eq("week_start",wk)),
    q(sb.from("student_groups").select("id,code,name,size,programs(code,department_id,departments(code,name))").order("code")),
    q(sb.from("teachers").select("id,first_name,last_name,active").order("last_name")),
    q(sb.from("rooms").select("id,code,name,capacity").order("code")),
    q(sb.from("teaching_assignments").select("id,semester_id,teacher_id,course_id,group_id,planned_hours,assignment_groups(group_id,student_groups(code)),semesters(label,start_date,end_date),courses(code,name),teachers(first_name,last_name),student_groups(code)").order("id")),
    q(sb.from("semesters").select("id,label,start_date,end_date,academic_years(label)").order("start_date")),
    q(sb.from("teacher_availability").select("teacher_id,day_of_week,start_time,end_time").eq("week_start",wk)),
    q(sb.from("availability_weeks").select("teacher_id,by_planner").eq("week_start",wk)),
    q(sb.from("published_weeks").select("published_at").eq("week_start",wk).maybeSingle())]);
  const mins=x=>toMin(x.end_time)-toMin(x.start_time);
  slots.forEach(x=>decorateTA(x.teaching_assignments));assignsAll.forEach(decorateTA);
  const F=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
  const sessOf={};sessW.forEach(s=>{if(s.slot_id)sessOf[s.slot_id]=s});
  const isCancel=sl=>sessOf[sl.id]?.status==="annulee";
  const cancelIds=new Set(slots.filter(isCancel).map(s=>s.id));
  const live=slots.filter(s=>!isCancel(s));
  const semIds=new Set(sems.filter(x=>x.start_date<=wEnd&&x.end_date>=wk).map(x=>x.id));
  const assigns=assignsAll.filter(a=>semIds.has(a.semester_id));
  const done={};allSlots.forEach(x=>{done[x.assignment_id]=(done[x.assignment_id]||0)+mins(x)});
  cancelled.forEach(x=>{done[x.assignment_id]=(done[x.assignment_id]||0)-mins(x)});
  const remaining={};assignsAll.forEach(a=>{remaining[a.id]=a.planned_hours*60-(done[a.id]||0)});
  const declared=new Set(answers.map(a=>a.teacher_id));
  const lists={group:groups.map(g=>[g.id,g.code]),teacher:teachers.map(t=>[t.id,t.first_name+" "+t.last_name]),room:rooms.map(r=>[r.id,r.code])};
  if(!S.planId||!lists[S.planView].some(x=>x[0]==S.planId))S.planId=lists[S.planView][0]?.[0];
  const KEY={group:s=>s.teaching_assignments.group_id,teacher:s=>s.teaching_assignments.teacher_id,room:s=>s.room_id};
  const MATCH=(by,s,id)=>by==="group"?s.teaching_assignments._g.includes(Number(id)):KEY[by](s)==id;
  const mine=slots.filter(s=>MATCH(S.planView,s,S.planId));
  const confIds=new Set(conf.flatMap(c=>[c.slot_a,c.slot_b]));
  const drafts=slots.filter(s=>!s.published).length;
  const avOf=tid=>avails.filter(a=>a.teacher_id===tid);
  const outside=s=>{const tid=s.teaching_assignments.teacher_id;if(!declared.has(tid)||isCancel(s))return false;
    return !avOf(tid).some(a=>a.day_of_week===s.day_of_week&&a.start_time<=s.start_time&&a.end_time>=s.end_time)};
  const outCount=slots.filter(outside).length;
  const weekMin=live.reduce((a,x)=>a+mins(x),0);
  const num=n=>Number(Number(n).toFixed(2));
  const tIds=[...new Set(assigns.filter(a=>remaining[a.id]>0).map(a=>a.teacher_id))];
  const tList=teachers.filter(t=>tIds.includes(t.id));
  const answered=tList.filter(t=>declared.has(t.id)).length;
  const finished=assigns.filter(a=>remaining[a.id]<=0).length;
  const pubDate=pub?new Date(pub.published_at).toLocaleDateString("fr-FR",{day:"numeric",month:"long"}):"";
  const dayLong=d=>{const s=addDays(W,d-1).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});return s.charAt(0).toUpperCase()+s.slice(1)};
  const TABS=[["grille","Grille"],["ensemble","Vue d'ensemble"],["dispos",`Disponibilités · ${answered}/${tList.length}`],["avancement","Avancement"]];

  /* ----- contenu des onglets ----- */
  const tStatus=t=>{if(!declared.has(t.id))return '<span class="pill p-warn">Pas de réponse</span>';const m=avOf(t.id).reduce((a,x)=>a+mins(x),0);
    const by=answers.find(a=>a.teacher_id===t.id)?.by_planner;return (m?`<span class="pill p-ok">Disponible ${hrs(m)}</span>`:'<span class="pill p-mute">Indisponible</span>')+(by?' <span class="sub">saisi par le directeur</span>':"")};
  const tWeek=t=>{const m=live.filter(x=>x.teaching_assignments.teacher_id===t.id).reduce((a,x)=>a+mins(x),0);return m?hrs(m):"—"};
  const paneGrille=()=>`<div class="row" style="margin-bottom:12px">
      <label>Afficher par<select id="pView"><option value="group">Groupe</option><option value="teacher">Professeur</option><option value="room">Salle</option></select></label>
      <label>&nbsp;<select id="pId">${lists[S.planView].map(([id,l])=>`<option value="${id}" ${id==S.planId?"selected":""}>${esc(l)}</option>`).join("")}</select></label></div>
    ${S.planView==="teacher"&&!declared.has(Number(S.planId))?`<div class="gpwarn" style="margin-bottom:10px">Ce professeur n'a pas donné ses disponibilités pour cette semaine.</div>`:""}
    ${S.planView==="teacher"&&declared.has(Number(S.planId))&&!avOf(Number(S.planId)).length?`<div class="gpwarn" style="margin-bottom:10px">Ce professeur est <b>indisponible toute la semaine</b>.</div>`:""}
    ${timetableGrid({mine,conf:confIds,cancelled:cancelIds,view:S.planView,avOf,outside,teacherId:S.planId,week:W})}
    ${conf.length?`<h2>Conflits</h2><div class="panel tbl"><table><thead><tr><th>Jour</th><th>Type</th><th>Créneaux</th></tr></thead><tbody>${conf.map(c=>{const a=slots.find(s=>s.id===c.slot_a),b=slots.find(s=>s.id===c.slot_b);return `<tr><td>${DAYS[c.day_of_week]}</td><td><span class="pill p-bad">${esc(c.conflict_type)}</span></td><td>${esc(a?.teaching_assignments.courses.code)} ${hm(a?.start_time)} / ${esc(b?.teaching_assignments.courses.code)} ${hm(b?.start_time)}</td></tr>`}).join("")}</tbody></table></div>`:""}`;
  const deps=[...new Map(groups.filter(g=>g.programs?.departments).map(g=>[g.programs.department_id,g.programs.departments])).entries()];
  if(S.ovDep==null||(S.ovDep!=="all"&&!deps.some(([id])=>id==S.ovDep)))S.ovDep=deps[0]?.[0]??"all";
  const paneEnsemble=()=>{const gs=groups.filter(g=>S.ovDep==="all"||g.programs?.department_id==S.ovDep);
    const cell=(g,d)=>live.concat(slots.filter(isCancel)).filter(s=>s.teaching_assignments._g.includes(g.id)&&s.day_of_week===d).sort((a,b)=>a.start_time.localeCompare(b.start_time))
      .map(s=>`<button type="button" class="ovc ${isCancel(s)?"cancel":""} ${s.published?"":"draft"} ${confIds.has(s.id)?"conf":""}" data-sl="${s.id}" style="--c:${ttColor(s.teaching_assignments.courses.code)}"><span class="mono">${hm(s.start_time)}–${hm(s.end_time)}</span><b>${esc(s.teaching_assignments.courses.code)}</b><span>${esc(s.teaching_assignments.teachers.last_name)} · ${esc(s.rooms.code)}</span></button>`).join("")||'<span class="ovn">—</span>';
    return `<div class="row" style="margin-bottom:12px"><label>Département<select id="ovDep"><option value="all">Tous</option>${deps.map(([id,d])=>`<option value="${id}" ${id==S.ovDep?"selected":""}>${esc(d.name)}</option>`).join("")}</select></label></div>
    <div class="panel ovwrap"><table class="ov"><thead><tr><th>Groupe</th>${sc.days.map(d=>`<th>${DAYS[d]} <small>${dayDate(W,d)}</small></th>`).join("")}</tr></thead><tbody>
    ${gs.map(g=>{const m=live.filter(s=>s.teaching_assignments._g.includes(g.id)).reduce((a,x)=>a+mins(x),0);
      return `<tr><th><b>${esc(g.code)}</b><div class="sub">${m?hrs(m):"aucun cours"}</div></th>${sc.days.map(d=>`<td>${cell(g,d)}</td>`).join("")}</tr>`}).join("")||`<tr><td colspan="${sc.days.length+1}"><p class="empty">Aucun groupe.</p></td></tr>`}</tbody></table></div>
    <p class="sub">Touchez un cours pour le modifier, l'annuler ou le reporter. Cours barrés : annulés.</p>`};
  const paneDispos=()=>`<div class="panel tbl">${tList.length?`<table><thead><tr><th>Professeur</th><th>Réponse pour la semaine</th><th>Placé</th><th></th></tr></thead><tbody>
      ${tList.map(t=>`<tr><td>${esc(t.first_name+" "+t.last_name)}</td><td>${tStatus(t)}</td><td class="num">${tWeek(t)}</td>
        <td style="white-space:nowrap"><button class="btn sm" data-avf="${t.id}">${declared.has(t.id)?"Voir / modifier":"Saisir"}</button>${declared.has(t.id)?"":` <button class="btn sm" data-avall="${t.id}">Disponible toute la semaine</button>`}</td></tr>`).join("")}</tbody></table>`:'<p class="empty">Aucun professeur n\'a de matière en cours.</p>'}</div>
      <p class="sub">Un professeur sans réponse n'est pas placé par le générateur. Si ses disponibilités vous ont été données en dehors de la plateforme, saisissez-les ici.</p>`;
  const paneAvancement=()=>`${assigns.length>8?searchBox("asgSearch","Rechercher une matière, un groupe, un professeur…"):""}
    <div class="panel tbl">${assigns.length?`<table id="asgTable"><thead><tr><th>Matière</th><th>Groupe</th><th>Professeur</th><th>Programmé / prévu</th><th>Cette semaine</th><th>État</th></tr></thead><tbody>
    ${assigns.map(a=>{const d=Math.max(0,done[a.id]||0),p=a.planned_hours*60,w=live.filter(x=>x.assignment_id===a.id).reduce((s,x)=>s+mins(x),0);
      const st=d>=p?'<span class="pill p-ok">Terminée</span>':d>0?'<span class="pill p-info">En cours</span>':'<span class="pill p-mute">Pas commencée</span>';
      return `<tr><td>${esc(a.courses.code)}<div class="sub">${esc(a.courses.name)}</div></td><td>${esc(a.student_groups.code)}</td><td>${esc(a.teachers.first_name+" "+a.teachers.last_name)}</td>
      <td class="num">${hrs(d)} / ${num(a.planned_hours)} h<div class="pbar"><i style="width:${Math.min(100,Math.round(d/p*100))}%"></i></div></td><td class="num">${w?hrs(w):"—"}</td><td>${st}</td></tr>`}).join("")}</tbody></table>`:`<p class="empty">Aucune affectation pour le semestre de cette semaine.</p>`}</div>
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn sm" id="goAsg">Gérer les affectations →</button></div>`;
  const PANES={grille:paneGrille,ensemble:paneEnsemble,dispos:paneDispos,avancement:paneAvancement};

  v.innerHTML=`<h1>Emplois du temps</h1>
    ${weekNavHtml(W,pub?`<span class="pill p-ok">Publiée le ${pubDate}</span>`:(slots.length?'<span class="pill p-warn">Brouillon, non publiée</span>':'<span class="pill p-mute">Vide</span>'))}
    <div class="stats mini"><div class="stat"><b>${live.length}</b><span>Cours · ${hrs(weekMin)}</span></div>
      <div class="stat"><b style="color:${answered<tList.length?"var(--warn)":"var(--ok)"}">${answered}/${tList.length}</b><span>Professeurs ayant répondu</span></div>
      <div class="stat"><b style="color:${conf.length?"var(--bad)":"var(--ok)"}">${conf.length}</b><span>Conflits</span></div>
      <div class="stat"><b style="color:${outCount?"var(--warn)":"inherit"}">${outCount}</b><span>Hors disponibilités</span></div>
      <div class="stat"><b>${finished}/${assigns.length}</b><span>Matières terminées</span></div></div>
    <div class="row" style="margin-bottom:12px">
      <button class="btn primary" id="addSlot" ${assigns.length?"":"disabled"}>Ajouter un cours</button>
      <button class="btn" id="autoGen" ${assigns.length&&rooms.length?"":"disabled"}>✨ Générer la semaine</button>
      <button class="btn" id="copyPrev" ${assigns.length?"":"disabled"}>Copier la semaine précédente</button>
      <button class="btn" id="ttExport" ${slots.length?"":"disabled"}>${DLI}Imprimer / exporter</button>
      ${pub?(drafts?`<button class="btn primary" id="pubWeek">Publier ${drafts} cours en attente</button>`:""):`<button class="btn primary" id="pubWeek" ${slots.length?"":"disabled"}>Publier la semaine</button>`}
    </div>
    ${pub?`<div class="gpwarn" style="margin-bottom:10px;background:var(--ok-soft);border-color:var(--ok)">Semaine publiée : toute modification est visible tout de suite par les professeurs. Pour un empêchement, touchez le cours puis « Annuler » ou « Reporter » : le professeur voit le motif.</div>`:""}
    ${!assigns.length?`<div class="gpwarn" style="margin-bottom:10px">Aucune matière d'un semestre en cours cette semaine. Vérifiez les dates des semestres et les affectations.</div>`:""}
    <div class="seg ttseg" role="tablist" aria-label="Affichage">${TABS.map(([k,l])=>`<button role="tab" data-tt="${k}" aria-pressed="${S.ttTab===k}">${l}</button>`).join("")}</div>
    <div id="ttPane" style="margin-top:14px">${PANES[S.ttTab]()}</div>`;

  wireWeekNav(v,()=>S.ttWeek,w=>{S.ttWeek=w});
  v.querySelectorAll("[data-tt]").forEach(b=>b.onclick=()=>{S.ttTab=b.dataset.tt;rerender()});
  const pv=document.getElementById("pView");
  if(pv){pv.value=S.planView;pv.onchange=()=>{S.planView=pv.value;S.planId=null;rerender()};pId.onchange=()=>{S.planId=pId.value;rerender()}}
  const od=document.getElementById("ovDep");if(od)od.onchange=()=>{S.ovDep=od.value==="all"?"all":Number(od.value);rerender()};
  const as=document.getElementById("asgSearch");
  if(as)as.oninput=()=>{const k=norm(as.value.trim());document.querySelectorAll("#asgTable tbody tr").forEach(r=>r.hidden=!!k&&!norm(r.textContent).includes(k))};
  const ga=document.getElementById("goAsg");if(ga)ga.onclick=()=>{S.tab="affect";try{history.replaceState(null,"","#affect")}catch(e){}renderShell()};
  v.querySelectorAll("[data-avf]").forEach(b=>b.onclick=()=>{S.avFor=Number(b.dataset.avf);rerender()});
  v.querySelectorAll("[data-avall]").forEach(b=>b.onclick=async()=>{

    catch(e){toast(errMsg(e),true)}});

  /* ----- vérifications avant publication ----- */
  const checks=()=>{const L=[];
    L.push(conf.length?{k:"bad",t:`${conf.length} conflit(s) à corriger (bloquant)`}:{k:"ok",t:"Aucun conflit"});
    const noAns=[...new Set(live.map(s=>s.teaching_assignments.teacher_id))].filter(t=>!declared.has(t)).map(t=>teachers.find(x=>x.id===t)).filter(Boolean);

    L.push(outCount?{k:"warn",t:`${outCount} cours hors des disponibilités déclarées`}:{k:"ok",t:"Tous les cours respectent les disponibilités"});
    const gIds=[...new Set(assigns.filter(a=>remaining[a.id]>0).flatMap(a=>a._g))];
    const gm=gIds.map(id=>({g:groups.find(x=>x.id===id),m:live.filter(s=>s.teaching_assignments._g.includes(id)).reduce((a,x)=>a+mins(x),0)})).filter(x=>x.g);
    const nz=gm.map(x=>x.m).filter(Boolean).sort((a,b)=>a-b),med=nz.length?nz[Math.floor(nz.length/2)]:0;
    const empty=gm.filter(x=>!x.m),low=gm.filter(x=>x.m&&x.m<med/2);
    L.push(empty.length?{k:"warn",t:`Groupe(s) sans aucun cours : ${empty.map(x=>x.g.code).join(", ")}`}:{k:"ok",t:"Chaque groupe a des cours cette semaine"});
    if(low.length)L.push({k:"warn",t:`Peu d'heures pour : ${low.map(x=>x.g.code+" ("+hrs(x.m)+")").join(", ")} · la moitié des groupes a ${hrs(med)} ou plus`});
    const idle=assigns.filter(a=>remaining[a.id]>0&&!live.some(s=>s.assignment_id===a.id)).length;
    if(idle)L.push({k:"info",t:`${idle} matière(s) non terminée(s) sans cours cette semaine`});

  const ICON={ok:"✓",warn:"!",bad:"✕",info:"i"};
  const pw=document.getElementById("pubWeek");

    openDialog(`<h3>Publier la semaine du ${weekRange(W)} ?</h3>

      <ul class="chk">${L.map(x=>`<li class="${x.k}"><i>${ICON[x.k]}</i><span>${esc(x.t)}</span></li>`).join("")}</ul>
      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Revenir</button><button class="btn primary" value="ok" ${conf.length?"disabled":""}>Publier</button></div>`,
    async()=>{const n=await q(sb.rpc("publish_week",{p_week:wk}));toast(`Semaine publiée · ${n} cours transformé(s) en séances`);rerender()})};

  /* ----- copier la semaine précédente ----- */
  copyPrev.onclick=async()=>{
    const prev=await q(sb.from("timetable_slots").select("assignment_id,day_of_week,start_time,end_time,room_id").eq("week_start",prevWk));

      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok" ${keep.length?"":"disabled"}>Copier</button></div>`,
    async()=>{let ok=0,ko=0;for(const x of keep){try{await q(sb.from("timetable_slots").insert({...x,week_start:wk,published:false}));ok++}catch(e){ko++}}

  /* ----- export ----- */
  ttExport.onclick=()=>openDialog(`<h3>Imprimer / exporter la semaine</h3>

    async(act)=>{const by=xBy.value,who=xWho.value;
      let ents=lists[by].filter(([id])=>slots.some(s=>MATCH(by,s,id)));

      if(!ents.length)throw new Error(who==="cur"?"Choisissez d'abord, dans la grille, le même type d'affichage (groupe, professeur ou salle).":"Aucun cours à exporter.");
      ttExportWeek(act,by,ents,slots.filter(s=>true),{W,pub:!!pub,isCancel,KEY,MATCH})});

  /* ----- créneaux ----- */
  const aLabel=a=>`${a.courses.code} · ${a.student_groups.code} · ${a.teachers.last_name}`;
  const slotFields=()=>[
    {k:"assignment_id",l:"Affectation",t:"select",num:1,opt:assigns.map(a=>[a.id,aLabel(a)+(remaining[a.id]<=0?" (terminée)":"")]),req:1},
    {k:"day_of_week",l:"Jour",t:"select",num:1,opt:sc.days.map(d=>[d,DAYS[d]+" "+dayDate(W,d)]),req:1},
    {k:"start_time",l:"Début",t:"time",req:1},{k:"end_time",l:"Fin",t:"time",req:1},
    {k:"room_id",l:"Salle",t:"select",num:1,opt:rooms.map(r=>[r.id,r.code+" · "+r.capacity+" places"]),req:1}];
  const slotDialog=(row,report)=>{
    const f=slotFields();
    const vals=row?{...row,start_time:hm(row.start_time),end_time:hm(row.end_time)}:{day_of_week:sc.days[0],start_time:sc.start,end_time:""};
    openDialog(`<h3>${report?"Reporter le cours":row?"Modifier le cours":"Ajouter un cours"}</h3>
      <p class="sub" style="margin:0">Semaine du ${weekRange(W)}${pub?" · semaine publiée : le changement est visible tout de suite par le professeur":""}</p>
      <div class="grid2">${f.map(x=>fieldHtml(x,vals[x.k])).join("")}${report?`<label style="grid-column:1/-1">Motif du report (visible par le professeur)<input id="rpWhy" required placeholder="ex. professeur en mission"></label>`:""}</div>
      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">${report?"Reporter":"Enregistrer"}</button></div>`,
    async()=>{const o=readFields(f);
      if(!o.end_time||o.end_time<=o.start_time)throw new Error("L'heure de fin doit être après l'heure de début.");
      if(row)await q(sb.from("timetable_slots").update(o).eq("id",row.id));else await q(sb.from("timetable_slots").insert({...o,week_start:wk,published:false}));
      if(report){const s=sessOf[row.id];const why=document.getElementById("rpWhy").value.trim();
        if(s)await q(sb.from("schedule_sessions").update({status:"planifiee",note:`Reporté (prévu ${DAYS[row.day_of_week].toLowerCase()} ${dayDate(W,row.day_of_week)} à ${hm(row.start_time)}) : ${why}`}).eq("id",s.id))}
      const a=assigns.find(x=>x.id===o.assignment_id),av=a?avOf(a.teacher_id):[];
      const off=a&&declared.has(a.teacher_id)&&!av.some(x=>x.day_of_week===o.day_of_week&&hm(x.start_time)<=o.start_time&&hm(x.end_time)>=o.end_time);
      const noAns=a&&!declared.has(a.teacher_id);
      toast((report?"Cours reporté":row?"Cours modifié":"Cours ajouté")+(off?" · Attention : en dehors des disponibilités du professeur":noAns?" · Ce professeur n'a pas donné ses disponibilités":""),!!(off||noAns));rerender()});
  };
  addSlot.onclick=()=>slotDialog(null);
  autoGen.onclick=()=>genDialog({week:W,published:!!pub,slots:live,assigns,rooms,groups,avails,remaining,rerender,declared});
  const delSlot=sl=>openDialog(`<h3>Supprimer ce cours ?</h3><p style="margin:0">${esc(sl.teaching_assignments.courses.code)}, ${dayLong(sl.day_of_week)} ${hm(sl.start_time)}–${hm(sl.end_time)}.${sl.published?" Il disparaît de l'emploi du temps du professeur sans explication. Pour un empêchement, préférez « Annuler » : le professeur voit le motif.":""}</p>
      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Revenir</button><button class="btn danger" value="ok">Supprimer</button></div>`,
    async()=>{const r=await q(sb.from("timetable_slots").delete().eq("id",sl.id).select());if(!r.length)throw new Error("Suppression refusée.");toast("Cours supprimé");rerender()});
  const cancelSlot=sl=>{const s=sessOf[sl.id];
    openDialog(`<h3>Annuler ce cours ?</h3><p style="margin:0">${esc(sl.teaching_assignments.courses.code)} · ${esc(sl.teaching_assignments.student_groups.code)}, ${dayLong(sl.day_of_week)} ${hm(sl.start_time)}–${hm(sl.end_time)}. Le cours reste visible, barré, avec le motif. Ses heures ne sont pas comptées et l'horaire est libéré.</p>
      <label>Motif (visible par le professeur)<input id="cWhy" required placeholder="ex. jour férié, professeur malade"></label>
      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Revenir</button><button class="btn danger" value="ok">Annuler le cours</button></div>`,
    async()=>{await q(sb.from("schedule_sessions").update({status:"annulee",note:"Annulé : "+document.getElementById("cWhy").value.trim()}).eq("id",s.id));toast("Cours annulé");rerender()})};
  const restoreSlot=async sl=>{try{await q(sb.from("schedule_sessions").update({status:"planifiee",note:null}).eq("id",sessOf[sl.id].id));toast("Cours rétabli");rerender()}
    catch(e){toast(/overlap|exclu/i.test(e.message||"")?"Impossible de rétablir : l'horaire a été repris par un autre cours.":errMsg(e),true)}};
  v.querySelectorAll("[data-sl]").forEach(b=>b.onclick=()=>{if(b.dataset.dragged)return;const sl=slots.find(x=>x.id==b.dataset.sl),t=sl.teaching_assignments,s=sessOf[sl.id];
    const att=!!(s&&s.attendance_records&&(Array.isArray(s.attendance_records)?s.attendance_records.length:s.attendance_records.id));
    const can=sl.published&&s&&!att;
    openDialog(`<h3>${esc(t.courses.code)} · ${esc(t.courses.name)}</h3>
      <dl class="kv"><dt>Jour</dt><dd>${dayLong(sl.day_of_week)}</dd><dt>Horaire</dt><dd class="mono">${hm(sl.start_time)}–${hm(sl.end_time)}</dd><dt>Professeur</dt><dd>${esc(t.teachers.first_name+" "+t.teachers.last_name)}</dd><dt>Groupe</dt><dd>${esc(t.student_groups.code)}</dd><dt>Salle</dt><dd>${esc(sl.rooms.code)}</dd>${s?.note?`<dt>Note</dt><dd>${esc(s.note)}</dd>`:""}</dl>
      <div class="row" style="gap:6px">${isCancel(sl)?'<span class="pill p-bad">Annulé</span>':sl.published?'<span class="pill p-ok">Publié</span>':'<span class="pill p-mute">Brouillon</span>'}${att?'<span class="pill p-info">Émargé</span>':""}${confIds.has(sl.id)?'<span class="pill p-bad">Conflit</span>':""}${outside(sl)?'<span class="pill p-warn">Hors disponibilités</span>':""}${declared.has(t.teacher_id)?"":'<span class="pill p-warn">Professeur sans réponse</span>'}</div>
      ${att?'<p class="sub" style="margin:0">Ce cours a déjà été émargé : il ne peut plus être déplacé ni annulé.</p>':""}
      <div class="row" style="justify-content:flex-end;flex-wrap:wrap"><button class="btn" value="cancel" formnovalidate>Fermer</button>
        ${att?"":isCancel(sl)?`<button class="btn primary" value="restore">Rétablir</button>`:`${can?`<button class="btn danger" value="annul">Annuler le cours</button><button class="btn" value="report">Reporter</button>`:`<button class="btn danger" value="del">Supprimer</button>`}<button class="btn primary" value="edit">Modifier</button>`}</div>`,
    async(act)=>{if(act==="edit"){slotDialog(sl);return "keep"}if(act==="del"){delSlot(sl);return "keep"}if(act==="annul"){cancelSlot(sl);return "keep"}if(act==="report"){slotDialog(sl,true);return "keep"}if(act==="restore"){await restoreSlot(sl)}})});
  if(S.ttTab==="grille")enableTtDrag(v,{
    check:(id,d,a,b)=>{const sl=slots.find(x=>x.id===id),t=sl.teaching_assignments;
      const o=live.find(x=>x.id!==id&&x.day_of_week===d&&toMin(x.start_time)<b&&a<toMin(x.end_time)&&(x.teaching_assignments.teacher_id===t.teacher_id||x.teaching_assignments._g.some(g=>t._g.includes(g))||x.room_id===sl.room_id));
      return o?`Conflit avec ${o.teaching_assignments.courses.code}`:""},
    onDrop:async(id,d,a,b)=>{const sl=slots.find(x=>x.id===id),tid=sl.teaching_assignments.teacher_id;
      try{await q(sb.from("timetable_slots").update({day_of_week:d,start_time:a,end_time:b}).eq("id",id));
        const off=declared.has(tid)&&!avOf(tid).some(x=>x.day_of_week===d&&hm(x.start_time)<=a&&hm(x.end_time)>=b);
        toast(`${sl.teaching_assignments.courses.code} déplacé : ${DAYS[d]} ${a}–${b}`+(off?" · Attention : hors disponibilités du professeur":"")+(sl.published?" · visible par le professeur":""),off)}
      catch(e){toast(errMsg(e),true)}
      rerender()}});
}

/* ---------- export de la semaine : une page (PDF) ou une feuille (Excel) par groupe, professeur ou salle ---------- */
function ttExportWeek(fmt,by,ents,slots,c){
  const sc=S.sched||SCHED_DEFAULT,W=c.W;
  const BYL={group:"Groupe",teacher:"Professeur",room:"Salle"}[by];
  const label=s=>{const t=s.teaching_assignments;const parts=[t.courses.code,t.courses.name];
    if(by!=="group")parts.push(t.student_groups.code);if(by!=="teacher")parts.push(t.teachers.first_name+" "+t.teachers.last_name);if(by!=="room")parts.push("Salle "+s.rooms.code);
    let x=parts.join("\n");if(c.isCancel(s))x="ANNULÉ · "+x;else if(!s.published)x+="\n(brouillon)";return x};
  const std=slotsOf(sc).map(r=>r.split("–"));
  const head=["Horaire",...sc.days.map(d=>DAYS[d]+" "+addDays(W,d-1).toLocaleDateString("fr-FR",{day:"numeric",month:"short"}))];
  const build=list=>{const ranges=new Map();std.forEach(([a,b])=>ranges.set(a+"–"+b,[a,b]));list.forEach(s=>{const a=hm(s.start_time),b=hm(s.end_time);ranges.set(a+"–"+b,[a,b])});
    const rows=[...ranges.values()].sort((x,y)=>x[0].localeCompare(y[0])||x[1].localeCompare(y[1]));
    return rows.map(([a,b])=>[a+"–"+b,...sc.days.map(d=>list.filter(s=>s.day_of_week===d&&hm(s.start_time)===a&&hm(s.end_time)===b).map(label).join("\n\n"))])
      .filter((r,i)=>r.slice(1).some(Boolean)||std.some(([a,b])=>a+"–"+b===r[0]))};
  const wtxt="Semaine du "+weekRange(W)+(c.pub?"":" · non publiée");
  const file=slug("emploi-du-temps-"+iso(W)+"-"+(ents.length===1?ents[0][1]:BYL+"s"));
  if(fmt==="xlsx"){exportExcel(file,ents.map(([id,name])=>({name,title:"UCAB Touba · Emploi du temps · "+BYL+" "+name,subtitle:wtxt,head,rows:build(slots.filter(s=>c.MATCH(by,s,id)))})));return}
  try{
    if(!window.jspdf)throw new Error("Le module PDF n'a pas pu être chargé. Vérifiez la connexion et rechargez la page.");
    const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:"landscape"});
    const PW=doc.internal.pageSize.getWidth(),PH=doc.internal.pageSize.getHeight();
    const T=t=>{const [h,m]=String(t).slice(0,5).split(":").map(Number);return h*60+m};
    const F=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
    const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
    const tint=(c,k)=>c.map(v=>Math.round(v+(255-v)*k));
    const st=T(sc.start),en=T(sc.end),len=sc.len,lf=sc.lunchFrom?T(sc.lunchFrom):null,lt=sc.lunchTo?T(sc.lunchTo):null,hasL=lf!=null&&lt!=null&&lf>st&&lt<en;
    const starts=dayStarts(st,en,len,lf,lt);
    const days=sc.days;
    const year=S.year?"Année universitaire "+S.year:"";
    const dur=m=>{const h=Math.floor(m/60),r=m%60;return h+" h"+(r?" "+String(r).padStart(2,"0"):"")};
    const ML=12,MR=12,TC=20,GAP=1.6,TOP=46,BOT=PH-26,PB=hasL?7:0;
    const cw=(PW-ML-MR-TC)/days.length,x0=ML+TC;
    ents.forEach(([id,name],pi)=>{if(pi)doc.addPage();
      const list=slots.filter(s=>c.MATCH(by,s,id));
      /* l'échelle verticale couvre la journée (et s'élargit si un cours sort des horaires) ; la pause est une fine bande */
      let lo=st,hi=en;list.forEach(s=>{lo=Math.min(lo,T(s.start_time));hi=Math.max(hi,T(s.end_time))});
      const span=(hasL?(lf-lo)+(hi-lt):(hi-lo)),k=(BOT-TOP-PB)/span;
      const y=m=>!hasL||m<=lf?TOP+(m-lo)*k:(m>=lt?TOP+(lf-lo)*k+PB+(m-lt)*k:TOP+(lf-lo)*k+PB*(m-lf)/(lt-lf));
      const live=list.filter(s=>!c.isCancel(s)),tot=live.reduce((a,s)=>a+T(s.end_time)-T(s.start_time),0);
      /* en-tête */
      doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(70,80,92);
      doc.text("UCAB Touba"+(year?"  ·  "+year:"")+"  ·  Semaine du "+weekRange(W)+(c.pub?"":"  ·  brouillon, non publiée"),ML,15);
      doc.setFont("helvetica","bold");doc.setFontSize(24);doc.setTextColor(17,24,32);doc.text(String(name),ML,26);
      doc.setFont("helvetica","normal");doc.setFontSize(11);doc.setTextColor(70,80,92);doc.text(BYL+"  ·  "+dur(tot)+" cette semaine",PW-MR,26,{align:"right"});
      doc.setFillColor(11,110,91);doc.rect(ML,29,PW-ML-MR,0.9,"F");
      /* jours */
      doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(17,24,32);
      days.forEach((d,i)=>{const cx=x0+i*cw+cw/2;doc.text(DAYS[d].toUpperCase(),cx,37,{align:"center"});
        doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(93,104,121);doc.text(addDays(W,d-1).toLocaleDateString("fr-FR",{day:"numeric",month:"long"}),cx,41.5,{align:"center"});
        doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(17,24,32)});
      /* heures + cases vides */
      starts.forEach(t=>{const a=y(t),b=y(t+len);
        doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(17,24,32);doc.text(F(t),ML+TC-3,a+4,{align:"right"});
        doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(93,104,121);doc.text(F(t+len),ML+TC-3,a+8,{align:"right"});
        days.forEach((d,i)=>{doc.setDrawColor(205,212,210);doc.setLineWidth(0.25);doc.setFillColor(255,255,255);doc.roundedRect(x0+i*cw+GAP/2,a+GAP/2,cw-GAP,b-a-GAP,1.4,1.4,"FD")})});
      if(hasL){const py=y(lf)+PB/2;doc.setDrawColor(150,160,165);doc.setLineWidth(0.25);doc.setLineDashPattern([1,1],0);doc.line(x0,py,PW-MR,py);doc.setLineDashPattern([],0);
        doc.setFont("helvetica","bold");doc.setFontSize(8);doc.setTextColor(93,104,121);doc.text("PAUSE",ML+TC-3,py+1,{align:"right"})}
      /* cours */
      list.slice().sort((a,b)=>T(a.start_time)-T(b.start_time)).forEach(s=>{
        const i=days.indexOf(s.day_of_week);if(i<0)return;
        const t=s.teaching_assignments,a=y(T(s.start_time)),b=y(T(s.end_time)),x=x0+i*cw+GAP/2,w=cw-GAP,h=b-a-GAP,yy=a+GAP/2;
        const cancel=c.isCancel(s),col=cancel?[178,58,58]:hex(ttColor(t.courses.code));
        doc.setFillColor(...(cancel?[248,240,240]:tint(col,0.86)));doc.setDrawColor(...col);doc.setLineWidth(0.45);
        if(!s.published&&!cancel)doc.setLineDashPattern([1.2,0.8],0);
        doc.roundedRect(x,yy,w,h,1.4,1.4,"FD");doc.setLineDashPattern([],0);
        doc.setFillColor(...col);doc.rect(x+0.2,yy+0.6,1.3,h-1.2,"F");
        const tx=x+3.5,mw=w-6;let ty=yy+6;
        doc.setFont("helvetica","bold");doc.setFontSize(h>22?14:11.5);doc.setTextColor(17,24,32);
        doc.text(cancel?"ANNULÉ":t.courses.code,tx,ty);ty+=h>22?5:4.4;
        doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(40,48,58);
        const lines=[];
        if(cancel)lines.push(t.courses.code);
        lines.push(...doc.splitTextToSize(t.courses.name,mw).slice(0,h>30?2:1));
        if(by!=="teacher")lines.push(t.teachers.first_name+" "+t.teachers.last_name.toUpperCase());
        if(by!=="group")lines.push(t.student_groups.code);
        if(by!=="room")lines.push("salle : "+s.rooms.code);
        lines.forEach(l=>{if(ty<yy+h-5){doc.text(doc.splitTextToSize(String(l),mw)[0],tx,ty);ty+=4}});
        doc.setFont("helvetica","bold");doc.setFontSize(8.5);doc.setTextColor(17,24,32);doc.text(dur(T(s.end_time)-T(s.start_time))+(s.published||cancel?"":" · brouillon"),x+w-2.2,yy+h-2.2,{align:"right"});
      });
      /* légende : volume de la semaine par matière */
      const sum={};live.forEach(s=>{const k=s.teaching_assignments.courses.code;sum[k]=(sum[k]||0)+T(s.end_time)-T(s.start_time)});
      const leg=Object.entries(sum).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,m])=>k+" "+dur(m)).join("   ·   ");
      doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(40,48,58);doc.text(doc.splitTextToSize(leg||"Aucun cours cette semaine.",PW-ML-MR).slice(0,2),ML,BOT+7);
      doc.setDrawColor(205,212,210);doc.setLineWidth(0.3);doc.line(ML,PH-11,PW-MR,PH-11);
      doc.setFontSize(8);doc.setTextColor(93,104,121);doc.text("UCAB Touba  ·  édité le "+new Date().toLocaleDateString("fr-FR"),ML,PH-6.5);
      doc.text(`${pi+1} / ${ents.length}`,PW-MR,PH-6.5,{align:"right"});
    });
    doc.save(file+".pdf");
  }catch(e){toast(errMsg(e),true)}
}

      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Reprendre</button></div>`,
    async()=>{const sid=Number(cpSrc.value);const have=new Set(semA.map(a=>a.course_id+"_"+a.group_id));

/* ---------- professeur : son emploi du temps hebdomadaire (créneaux publiés) ---------- */
async function viewMyTimetable(v){
  const tid=S.teacher.id;
  if(!S.ttWeek)S.ttWeek=planDefaultWeek();
  const W=S.ttWeek,wk=iso(W);
  const [slots,assigns,avails,sess]=await Promise.all([
    q(sb.from("timetable_slots").select("id,assignment_id,day_of_week,start_time,end_time,published,room_id,rooms(code,name),teaching_assignments!inner(teacher_id,group_id,assignment_groups(group_id,student_groups(code)),courses(code,name),teachers(first_name,last_name),student_groups(code))").eq("published",true).eq("week_start",wk).eq("teaching_assignments.teacher_id",tid).order("start_time")),
    q(sb.from("teaching_assignments").select("id,group_id,planned_hours,assignment_groups(group_id,student_groups(code)),courses(code,name),student_groups(code),semesters(label,start_date,end_date)").eq("teacher_id",tid)),
    q(sb.from("teacher_availability").select("teacher_id,day_of_week,start_time,end_time").eq("teacher_id",tid).eq("week_start",wk)),
    q(sb.from("schedule_sessions").select("slot_id,status,note").eq("teacher_id",tid).gte("session_date",wk).lte("session_date",iso(addDays(W,6))))]);
  const mins=x=>{const t=s=>{const [h,m]=s.slice(0,5).split(":").map(Number);return h*60+m};return t(x.end_time)-t(x.start_time)};
  slots.forEach(x=>decorateTA(x.teaching_assignments));assigns.forEach(decorateTA);
  const sOf={};sess.forEach(x=>{if(x.slot_id)sOf[x.slot_id]=x});
  const cancelled=new Set(slots.filter(x=>sOf[x.id]?.status==="annulee").map(x=>x.id));
  const total=slots.filter(x=>!cancelled.has(x.id)).reduce((a,x)=>a+mins(x),0);
  const byA={};slots.forEach(x=>byA[x.assignment_id]=(byA[x.assignment_id]||0)+mins(x));
  const days=new Set(slots.map(x=>x.day_of_week)).size;
  v.innerHTML=`<h1>Mon emploi du temps</h1>

/* ---------- glisser-déposer dans la grille (souris : glisser ; tactile : appui long puis glisser) ---------- */
function enableTtDrag(root,opt){
  const tt=root.querySelector(".tt");if(!tt)return;
  const lo=Number(tt.dataset.lo),hi=Number(tt.dataset.hi),HH=Number(tt.dataset.hh);
  const F=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
  let st=null;
  const colAt=(x,y)=>{const el=document.elementFromPoint(x,y);return el&&el.closest?el.closest(".tt-col"):null};
  const begin=(ev,x,y)=>{const r=ev.getBoundingClientRect();const g=ev.cloneNode(true);g.classList.add("tt-ghost");g.style.width=r.width+"px";g.style.height=r.height+"px";g.style.left=r.left+"px";g.style.top=r.top+"px";
    document.body.appendChild(g);ev.classList.add("dragging");document.body.classList.add("ttdrag");st.g=g;st.dx=x-r.left;st.dy=y-r.top;st.w=r.width;st.on=true;move(x,y)};
  const move=(x,y)=>{if(!st||!st.on)return;st.g.style.left=(x-st.dx)+"px";st.g.style.top=(y-st.dy)+"px";
    const col=colAt(x,y);if(st.drop&&st.drop.parentNode!==col){st.drop.remove();st.drop=null}
    if(!col){st.target=null;return}
    const cr=col.getBoundingClientRect();let m=lo+Math.round(((y-st.dy)-cr.top)/HH*60/30)*30;m=Math.max(lo,Math.min(hi-st.len,m));
    st.target={day:Number(col.dataset.day),start:m};
    if(!st.drop){st.drop=document.createElement("div");st.drop.className="tt-drop";col.appendChild(st.drop)}
    st.drop.style.top=((m-lo)/60*HH)+"px";st.drop.style.height=(st.len/60*HH)+"px";st.drop.textContent=F(m)+"–"+F(m+st.len);const gt=st.g.querySelector(".tt-t");if(gt)gt.textContent=DAYS[st.target.day].slice(0,3)+". "+F(m)+"–"+F(m+st.len);
    const bad=opt.check?opt.check(st.id,st.target.day,m,m+st.len):false;st.drop.classList.toggle("bad",!!bad);st.drop.title=bad||""};
  const end=async(cancel)=>{if(!st)return;const s0=st;st=null;clearTimeout(s0.timer);
    s0.el.classList.remove("dragging","lift");document.body.classList.remove("ttdrag");if(s0.g)s0.g.remove();if(s0.drop)s0.drop.remove();
    if(!s0.on||cancel||!s0.target)return;
    s0.el.dataset.dragged="1";setTimeout(()=>{delete s0.el.dataset.dragged},350);
    if(s0.target.day===s0.day&&s0.target.start===s0.start)return;
    await opt.onDrop(s0.id,s0.target.day,F(s0.target.start),F(s0.target.start+s0.len))};
  const init=(el,x,y)=>{const T=t=>{const [h,m]=t.split(":").map(Number);return h*60+m};
    const [a,b]=el.querySelector(".tt-t").textContent.split("–");st={el,id:Number(el.dataset.sl),x0:x,y0:y,start:T(a),len:T(b)-T(a),day:Number(el.closest(".tt-col").dataset.day),on:false}};
  /* souris */
  tt.addEventListener("mousedown",e=>{const el=e.target.closest(".tt-ev");if(!el||e.button!==0)return;e.preventDefault();init(el,e.clientX,e.clientY)});
  window.__ttH={move:e=>{if(!st)return;if(!st.on&&Math.hypot(e.clientX-st.x0,e.clientY-st.y0)>6)begin(st.el,e.clientX,e.clientY);else move(e.clientX,e.clientY)},
    up:()=>{if(st)end(false)},key:e=>{if(e.key==="Escape"&&st)end(true)}};
  if(!window.__ttW){window.__ttW=1;window.addEventListener("mousemove",e=>window.__ttH.move(e));window.addEventListener("mouseup",e=>window.__ttH.up(e));window.addEventListener("keydown",e=>window.__ttH.key(e))}
  /* tactile : appui long 400 ms, sinon la page défile normalement */
  tt.addEventListener("touchstart",e=>{const el=e.target.closest(".tt-ev");if(!el||e.touches.length!==1)return;const t=e.touches[0];init(el,t.clientX,t.clientY);
    st.timer=setTimeout(()=>{if(!st)return;el.classList.add("lift");if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){};begin(el,st.x0,st.y0)},400)},{passive:true});
  tt.addEventListener("touchmove",e=>{if(!st)return;const t=e.touches[0];
    if(!st.on){if(Math.hypot(t.clientX-st.x0,t.clientY-st.y0)>8){clearTimeout(st.timer);st=null}return}
    e.preventDefault();move(t.clientX,t.clientY)},{passive:false});
  tt.addEventListener("touchend",e=>{if(!st)return;if(st.on){e.preventDefault();end(false)}else{clearTimeout(st.timer);st=null}});
  tt.addEventListener("touchcancel",()=>{if(st)end(true)});
  /* un glisser ne doit pas ouvrir la fiche du créneau */
  tt.addEventListener("click",e=>{const el=e.target.closest(".tt-ev");if(el&&el.dataset.dragged){e.stopImmediatePropagation();e.preventDefault()}},true);
}

/* ---------- grille hebdomadaire : jours en colonnes, heures en lignes ---------- */
function ttColor(code){let h=0;for(const c of String(code))h=(h*31+c.charCodeAt(0))>>>0;return TT_COLORS[h%TT_COLORS.length]}
const TT_COLORS=["#0b6e5b","#2563a8","#b06a00","#7a4fa3","#b23a5a","#3f7f2a","#0e7490","#9a5b2e"];
function timetableGrid(o){
  const T=t=>{const [h,m]=String(t).slice(0,5).split(":").map(Number);return h*60+m};
  const sc=S.sched||SCHED_DEFAULT;
  const days=[...new Set([...sc.days,...o.mine.map(x=>x.day_of_week)])].sort();
  const tid=Number(o.teacherId);
  const av=o.view==="teacher"?o.avOf(tid):[];
  let lo=Math.floor(T(sc.start)/60)*60,hi=Math.ceil(T(sc.end)/60)*60;
  o.mine.forEach(x=>{lo=Math.min(lo,Math.floor(T(x.start_time)/60)*60);hi=Math.max(hi,Math.ceil(T(x.end_time)/60)*60)});
  av.forEach(a=>{lo=Math.min(lo,Math.floor(T(a.start_time)/60)*60);hi=Math.max(hi,Math.ceil(T(a.end_time)/60)*60)});
  const HH=64,H=(hi-lo)/60*HH,y=m=>(m-lo)/60*HH;
  const hours=[];for(let m=lo;m<hi;m+=60)hours.push(m);
  const colorOf=ttColor;
  const now=new Date(),todayDow=o.week&&iso(o.week)!==iso(mondayOf(now))?-1:(now.getDay()||7),nowMin=now.getHours()*60+now.getMinutes();
  const lane=list=>{ /* répartit les créneaux qui se chevauchent côte à côte */
    const r=list.slice().sort((a,b)=>T(a.start_time)-T(b.start_time)||T(a.end_time)-T(b.end_time)),res=[];let grp=[],gEnd=-1;
    const flush=()=>{const cols=[];grp.forEach(x=>{let i=cols.findIndex(e=>e<=T(x.start_time));if(i<0){i=cols.length;cols.push(0)}cols[i]=T(x.end_time);x._l=i});grp.forEach(x=>{x._n=cols.length;res.push(x)});grp=[]};
    r.forEach(x=>{if(grp.length&&T(x.start_time)>=gEnd){flush();gEnd=-1}grp.push(x);gEnd=Math.max(gEnd,T(x.end_time))});flush();return res};
  const second=x=>{const t=x.teaching_assignments;return o.view==="teacher"?t.student_groups.code:o.view==="room"?t.student_groups.code:t.teachers.last_name};
  const third=x=>{const t=x.teaching_assignments;return o.view==="room"?t.teachers.last_name:x.rooms.code};
  const col=d=>{const list=lane(o.mine.filter(x=>x.day_of_week===d));
    return `<div class="tt-col ${d===todayDow?"today":""}" data-day="${d}" style="height:${H}px">
      ${sc.lunchFrom&&sc.lunchTo&&T(sc.lunchTo)>lo&&T(sc.lunchFrom)<hi?`<div class="tt-lunch" style="top:${y(Math.max(lo,T(sc.lunchFrom)))}px;height:${(Math.min(hi,T(sc.lunchTo))-Math.max(lo,T(sc.lunchFrom)))/60*HH}px" title="Pause"><span>Pause</span></div>`:""}
      ${av.filter(a=>a.day_of_week===d).map(a=>`<div class="tt-av" style="top:${y(T(a.start_time))}px;height:${(T(a.end_time)-T(a.start_time))/60*HH}px" title="Disponible ${hm(a.start_time)}–${hm(a.end_time)}"></div>`).join("")}
      ${d===todayDow&&nowMin>lo&&nowMin<hi?`<div class="tt-now" style="top:${y(nowMin)}px"></div>`:""}
      ${list.map(x=>{const c=colorOf(x.teaching_assignments.courses.code),dur=T(x.end_time)-T(x.start_time),w=100/x._n;
        return `<button type="button" class="tt-ev ${o.conf.has(x.id)?"conf":""} ${x.published?"":"draft"} ${o.cancelled&&o.cancelled.has(x.id)?"cancel":""} ${dur<=60?"short":""}" data-sl="${x.id}" style="--c:${c};top:${y(T(x.start_time))+1}px;height:${dur/60*HH-2}px;left:calc(${x._l*w}% + 2px);width:calc(${w}% - 4px)">
          <span class="tt-t">${hm(x.start_time)}–${hm(x.end_time)}</span><b>${esc(x.teaching_assignments.courses.code)}</b><span class="tt-n">${esc(x.teaching_assignments.courses.name)}</span>
          <span class="tt-m">${esc(second(x))} · ${esc(third(x))}</span>${o.outside(x)?'<i class="tt-w" title="Hors disponibilités du professeur">!</i>':""}</button>`}).join("")}</div>`};
  return `<div class="tt-wrap"><div class="tt" data-lo="${lo}" data-hi="${hi}" data-hh="${HH}" style="--n:${days.length}">
    <div class="tt-corner"></div>${days.map(d=>`<div class="tt-head ${d===todayDow?"today":""}">${DAYS[d]}${o.week?` <small>${dayDate(o.week,d)}</small>`:""}</div>`).join("")}
    <div class="tt-gut" style="height:${H}px">${hours.map(m=>`<span style="top:${y(m)}px">${String(m/60).padStart(2,"0")}:00</span>`).join("")}</div>
    ${days.map(col).join("")}</div></div>
  <div class="tt-leg">${o.readonly?"":'<span><i style="background:var(--accent)"></i>Publié</span><span><i class="dr"></i>Brouillon</span><span><i style="background:var(--bad)"></i>Conflit</span>'}${o.view==="teacher"&&av.length?'<span><i style="background:var(--ok-soft);border:1px solid var(--ok)"></i>Disponibilités</span>':""}<span class="sub">${o.readonly?"Touchez un créneau pour voir le détail.":"Touchez un créneau pour le modifier, ou faites-le glisser pour le déplacer (sur tablette : appui long puis glisser)."}</span></div>`;
}

/* ---------- générateur automatique d'emploi du temps (version simple) ---------- */
const GEN_DEFAULT={days:[1,2,3,4,5],start:"08:00",end:"18:00",len:120,lunchFrom:"12:00",lunchTo:"14:00",maxGroup:6,maxTeacher:6,maxDays:0,maxCourse:0,compact:true,useAvail:true};
function generateTimetable(o,D){
  const T=t=>{const [h,m]=String(t).slice(0,5).split(":").map(Number);return h*60+m};
  const F=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
  const ov=(a,b)=>a.s<b.e&&b.s<a.e;
  const busy={g:{},t:{},r:{}};
  const add=(k,id,day,s,e)=>{((busy[k][id]??={})[day]??=[]).push({s,e})};
  const free=(k,id,day,s,e)=>!(busy[k][id]?.[day]||[]).some(x=>ov(x,{s,e}));
  const load=(k,id,day)=>(busy[k][id]?.[day]||[]).reduce((a,x)=>a+x.e-x.s,0);
  const existing={};const aslots={};const asl=(id,d)=>((aslots[id]??={})[d]??=[]);const tdays={};const tday=id=>(tdays[id]??=new Set());
  const GS=a=>a._g||[a.group_id];
  D.slots.forEach(x=>{const a=x.teaching_assignments;GS(a).forEach(g=>add("g",g,x.day_of_week,T(x.start_time),T(x.end_time)));add("t",a.teacher_id,x.day_of_week,T(x.start_time),T(x.end_time));tday(a.teacher_id).add(x.day_of_week);asl(x.assignment_id,x.day_of_week).push({s:T(x.start_time),e:T(x.end_time)});if(x.room_id)add("r",x.room_id,x.day_of_week,T(x.start_time),T(x.end_time));
    existing[x.assignment_id]=(existing[x.assignment_id]||0)+T(x.end_time)-T(x.start_time)});
  const len=o.len,maxChain=Math.max(1,Math.floor(360/o.len)),start=T(o.start),end=T(o.end),lf=o.lunchFrom?T(o.lunchFrom):null,lt=o.lunchTo?T(o.lunchTo):null;
  const times=dayStarts(start,end,len,lf,lt);
  /* demi-journées sans cours : un créneau qui finit avant la pause (ou avant 13 h sans pause) est « matin », sinon « après-midi » */
  const off=new Set(o.off||[]);
  const blocked=(d,t)=>off.has(d+"|"+F(t));
  const rooms=[...D.rooms].sort((a,b)=>a.capacity-b.capacity);
  const gsize=Object.fromEntries(D.groups.map(g=>[g.id,g.size]));
  const av=tid=>D.avails.filter(a=>a.teacher_id===tid);
  /* heures restantes de chaque matière (déjà déduites de tous les créneaux programmés, y compris cette semaine) ; plafond par matière dans la semaine */
  const jobs=D.assigns.map(a=>{const rem=Math.max(0,D.remaining[a.id]||0);const cap=o.maxCourse?Math.max(0,Math.floor(o.maxCourse*60/len)-Math.round((existing[a.id]||0)/len)):1e9;
    return{a,n:Math.min(cap,Math.ceil(rem/len))}}).filter(j=>j.n>0);
  const restricted=()=>true;
  const availMin=a=>o.useAvail?av(a.teacher_id).reduce((s,y)=>s+T(y.end_time)-T(y.start_time),0):1e9;
  const tTotal={};jobs.forEach(j=>{tTotal[j.a.teacher_id]=(tTotal[j.a.teacher_id]||0)+j.n});
  jobs.sort((x,y)=>availMin(x.a)-availMin(y.a)||(tTotal[y.a.teacher_id]-tTotal[x.a.teacher_id])||(x.a.teacher_id-y.a.teacher_id)||y.n-x.n);
  /* rythme attendu : heures restantes réparties sur les semaines restantes du semestre (sert à signaler les retards, pas à limiter) */
  const wk0=D.week?new Date(D.week):null;
  jobs.forEach(j=>{const sem=j.a.semesters;let left=1;
    if(wk0&&sem?.end_date){left=Math.max(1,Math.ceil(((new Date(sem.end_date+"T12:00:00")-wk0)/864e5+1)/7))}
    j.pace=Math.min(j.n,Math.max(1,Math.ceil(Math.max(0,D.remaining[j.a.id]||0)/left/len)));j.done=0;j.why={};
    j.usedDays=new Set(D.slots.filter(x=>x.assignment_id===j.a.id).map(x=>x.day_of_week))});
  const placed=[];
  /* placement par tours : à chaque tour, chaque matière reçoit au plus un créneau ; on recommence tant qu'il reste de la place */
  const placeOne=j=>{const a=j.a,why=j.why,usedDays=j.usedDays;let best=null;
      for(const d of o.days)for(const t of times){const e=t+len;if(blocked(d,t))continue;
        const fail=r=>{why[r]=(why[r]||0)+1};
        const tav=av(a.teacher_id);
        if(o.useAvail&&!tav.some(x=>x.day_of_week===d&&T(x.start_time)<=t&&T(x.end_time)>=e)){fail(D.declared.has(a.teacher_id)?"hors disponibilités du professeur":"pas de réponse du professeur pour cette semaine");continue}
        if(!free("t",a.teacher_id,d,t,e)){fail("professeur déjà occupé");continue}
        if(!GS(a).every(g=>free("g",g,d,t,e))){fail(GS(a).length>1?"un des groupes réunis est déjà occupé":"groupe déjà occupé");continue}
        if(o.maxDays>0&&!tday(a.teacher_id).has(d)&&tday(a.teacher_id).size>=o.maxDays){fail("limite de jours de présence du professeur");continue}
        const same=asl(a.id,d);
        if(same.length){let run=1,cur=t,ch=true;while(ch){ch=false;for(const x of same){if(x.e===cur){run++;cur=x.s;ch=true;break}}}
          cur=e;ch=true;while(ch){ch=false;for(const x of same){if(x.s===cur){run++;cur=x.e;ch=true;break}}}
          if(run>maxChain){fail("trop d'heures de suite pour la même matière");continue}}
        if(GS(a).some(g=>load("g",g,d)+len>o.maxGroup*60)){fail("limite d'heures par jour du groupe");continue}
        if(load("t",a.teacher_id,d)+len>o.maxTeacher*60){fail("limite d'heures par jour du professeur");continue}
        const need=GS(a).reduce((s2,g)=>s2+(gsize[g]||0),0);const room=rooms.find(r=>r.capacity>=need&&free("r",r.id,d,t,e));
        if(!room){fail(rooms.some(r=>r.capacity>=need)?"aucune salle libre":"aucune salle assez grande");continue}
        const adj=(busy.t[a.teacher_id]?.[d]||[]).some(x=>x.e===t||x.s===e);
        const score=o.compact?((tday(a.teacher_id).has(d)?0:500)+(usedDays.has(d)?10:0)+(asl(a.id,d).some(x=>x.e===t||x.s===e)?60:0)+(adj&&!asl(a.id,d).some(x=>x.e===t||x.s===e)?-4:0)+Math.max(...GS(a).map(g=>load("g",g,d)))/6+times.indexOf(t)*0.5+d*0.01)
          :((usedDays.has(d)?1000:0)+Math.max(...GS(a).map(g=>load("g",g,d)))/6+load("t",a.teacher_id,d)/30+times.indexOf(t)*0.5+d*0.01);
        if(!best||score<best.score)best={score,d,t,e,room}}
      if(!best)return false;
      GS(a).forEach(g=>add("g",g,best.d,best.t,best.e));add("t",a.teacher_id,best.d,best.t,best.e);add("r",best.room.id,best.d,best.t,best.e);usedDays.add(best.d);tday(a.teacher_id).add(best.d);asl(a.id,best.d).push({s:best.t,e:best.e});j.done++;
      placed.push({assignment_id:a.id,a,day_of_week:best.d,start_time:F(best.t),end_time:F(best.e),room_id:best.room.id,room_code:best.room.code});return true};
  let active=jobs.slice();
  while(active.length){const next=[];for(const j of active){if(placeOne(j)&&j.done<j.n)next.push(j)}active=next}
  /* « non placé » = en retard sur le rythme du semestre (ce qui dépasse le rythme n'est pas un manque) */
  const unplaced=jobs.filter(j=>j.done<j.pace).map(j=>{const top=Object.entries(j.why).sort((x,y)=>y[1]-x[1])[0];return{a:j.a,missing:j.pace-j.done,reason:top?top[0]:"aucun créneau possible avec ces réglages"}});
  return{placed,unplaced,len,skipped:D.assigns.length-jobs.length,finished:D.assigns.filter(a=>(D.remaining[a.id]||0)<=0).length};
}
function genDialog(ctx){
  let cfg={...GEN_DEFAULT,...(S.sched||SCHED_DEFAULT)};
  try{const sv=JSON.parse(localStorage.getItem("ucab_gen")||"{}");["maxGroup","maxTeacher","maxDays","compact","useAvail"].forEach(k=>{if(sv[k]!=null)cfg[k]=sv[k]})}catch(e){}
  cfg.off=[];
  /* jours et créneaux de la semaine type (Référentiel > Jours et horaires) */
  const T2=t=>{const [h,m]=String(t).slice(0,5).split(":").map(Number);return h*60+m};
  const F2=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
  const SD=[...cfg.days].sort();
  const ST=(()=>{const out=[],lf=cfg.lunchFrom?T2(cfg.lunchFrom):null,lt=cfg.lunchTo?T2(cfg.lunchTo):null;
    dayStarts(T2(cfg.start),T2(cfg.end),cfg.len,lf,lt).forEach(t=>out.push(F2(t)));return out})();
  const drafts=ctx.slots.filter(x=>!x.published);
  if(cfg.replace==null)cfg.replace=!ctx.published&&drafts.length>0;
  /* base de travail : en mode « refaire », les brouillons de la semaine sont ignorés et leurs heures redeviennent à placer */
  const base=()=>{if(!cfg.replace||ctx.published)return{slots:ctx.slots,remaining:ctx.remaining};
    const rem={...ctx.remaining};drafts.forEach(x=>{rem[x.assignment_id]=(rem[x.assignment_id]||0)+toMin(x.end_time)-toMin(x.start_time)});
    return{slots:ctx.slots.filter(x=>x.published),remaining:rem}};
  const settings=()=>{
    openDialog(`<h3>Générer l'emploi du temps</h3>
      <p class="sub" style="margin:0">Le générateur place, dans cette semaine, les heures qui restent à faire pour chaque matière, avec les professeurs disponibles. Un professeur sans réponse n'est pas placé (vous pouvez saisir ses disponibilités depuis l'emploi du temps). Il respecte les conflits et les salles. Vous voyez le résultat avant de l'enregistrer.</p>
      <div class="panel" style="padding:10px 14px"><b>Semaine du ${weekRange(ctx.week)}</b><div class="sub">${ctx.assigns.length} matière(s) du semestre en cours · ${ctx.declared.size} professeur(s) ont donné leurs disponibilités</div></div>
      <div><div class="sub" style="margin-bottom:6px">Créneaux de cours cette semaine : touchez un créneau, un jour ou une heure pour le marquer <b>sans cours</b>. Les horaires viennent de Référentiel > Jours et horaires.</div>
        <div class="gtwrap"><table class="gt" id="gGrid"><thead><tr><th></th>${SD.map(d=>`<th><button type="button" data-gd="${d}">${DAYS[d].slice(0,3)}. ${dayDate(ctx.week,d)}</button></th>`).join("")}</tr></thead>
        <tbody>${ST.map(t=>`<tr><th><button type="button" data-gt="${t}">${t}–${F2(T2(t)+cfg.len)}</button></th>${SD.map(d=>`<td><button type="button" class="gc" data-gc="${d}|${t}" aria-pressed="${!cfg.off.includes(d+"|"+t)}" aria-label="${DAYS[d]} ${t}"></button></td>`).join("")}</tr>`).join("")}</tbody></table></div>
        <p class="sub" style="margin:6px 0 0" id="gOffTxt"></p></div>
      <div class="grid2">
        <label>Max d'heures par jour (professeur)<input id="gMaxT" type="number" min="1" max="12" step="0.5" value="${cfg.maxTeacher}"></label>
        <label>Jours de présence max par professeur<input id="gMaxD" type="number" min="0" max="6" step="1" value="${cfg.maxDays||0}"><small class="sub">0 = sans limite</small></label></div>
      ${!ctx.published&&drafts.length?`<div class="seg" role="radiogroup" aria-label="Brouillons existants" style="display:grid;grid-template-columns:1fr 1fr">
        <button type="button" data-rep="1" aria-pressed="${cfg.replace}">Refaire la semaine<br><small style="font-weight:500">remplace les ${drafts.length} cours en brouillon</small></button>
        <button type="button" data-rep="0" aria-pressed="${!cfg.replace}">Compléter<br><small style="font-weight:500">garde les ${drafts.length} cours déjà placés</small></button></div>`:""}
      ${ctx.published?`<div class="gpwarn">Semaine déjà publiée : le générateur ajoute seulement les heures qui manquent, sans toucher aux cours publiés.</div>`:""}
      <label style="flex-direction:row;align-items:center;gap:10px;font-size:14px;color:var(--ink)"><input type="checkbox" id="gCp" ${cfg.compact?"checked":""}>Regrouper les cours d'un professeur sur peu de jours, enchaînés</label>
      <label style="flex-direction:row;align-items:center;gap:10px;font-size:14px;color:var(--ink)"><input type="checkbox" id="gAv" ${cfg.useAvail?"checked":""}>Respecter les disponibilités de la semaine (décocher : tout le monde est considéré disponible)</label>
