      <label>Semestre source<select id="cpSrc">${src.map(x=>`<option value="${x.id}">${esc(x.academic_years.label)} · ${esc(x.label)} (${assigns.filter(a=>a.semester_id===x.id).length})</option>`).join("")}</select></label>
      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Reprendre</button></div>`,
    async()=>{const sid=Number(cpSrc.value);const have=new Set(semA.map(a=>a.course_id+"_"+a.group_id));
      const srcA=assigns.filter(a=>a.semester_id===sid&&!have.has(a.course_id+"_"+a.group_id));
      for(const a of srcA){const n=await q(sb.from("teaching_assignments").insert({semester_id:sem,course_id:a.course_id,group_id:a.group_id,teacher_id:a.teacher_id,planned_hours:a.planned_hours}).select("id").single());
        const ex=(a.assignment_groups||[]).map(x=>({assignment_id:n.id,group_id:x.group_id}));if(ex.length)await q(sb.from("assignment_groups").insert(ex))}
      const todo=srcA;
      toast(`${todo.length} affectation(s) reprise(s)`);rerender()})};
}

/* ---------- professeur : son emploi du temps hebdomadaire (créneaux publiés) ---------- */
async function viewMyTimetable(v){
  const tid=S.teacher.id;
  if(!S.ttWeek)S.ttWeek=planDefaultWeek();
  const W=S.ttWeek,wk=iso(W);
  const [slots,assigns,avails,sess]=await Promise.all([
    q(sb.from("timetable_slots").select("id,assignment_id,day_of_week,start_time,end_time,published,room_id,rooms(code,name),teaching_assignments!inner(teacher_id,group_id,assignment_groups(group_id,student_groups(code)),courses(code,name),teachers(first_name,last_name),student_groups!teaching_assignments_group_id_fkey(code))").eq("published",true).eq("week_start",wk).eq("teaching_assignments.teacher_id",tid).order("start_time")),
    q(sb.from("teaching_assignments").select("id,group_id,planned_hours,assignment_groups(group_id,student_groups(code)),courses(code,name),student_groups!teaching_assignments_group_id_fkey(code),semesters(label,start_date,end_date)").eq("teacher_id",tid)),
    q(sb.from("teacher_availability").select("teacher_id,day_of_week,start_time,end_time").eq("teacher_id",tid).eq("week_start",wk)),
    q(sb.from("schedule_sessions").select("slot_id,status,note").eq("teacher_id",tid).gte("session_date",wk).lte("session_date",iso(addDays(W,6))))]);
  const allSess=await q(sb.from("schedule_sessions").select("id,assignment_id,session_date,start_time,end_time,status,attendance_records(status,retained_minutes)").eq("teacher_id",tid));
  const mins=x=>{const t=s=>{const [h,m]=s.slice(0,5).split(":").map(Number);return h*60+m};return t(x.end_time)-t(x.start_time)};
  slots.forEach(x=>decorateTA(x.teaching_assignments));assigns.forEach(decorateTA);
  const sOf={};sess.forEach(x=>{if(x.slot_id)sOf[x.slot_id]=x});
  const cancelled=new Set(slots.filter(x=>sOf[x.id]?.status==="annulee").map(x=>x.id));
  const total=slots.filter(x=>!cancelled.has(x.id)).reduce((a,x)=>a+mins(x),0);
  const byA={};slots.forEach(x=>byA[x.assignment_id]=(byA[x.assignment_id]||0)+mins(x));
  const days=new Set(slots.map(x=>x.day_of_week)).size;
  v.innerHTML=`<h1>Mon emploi du temps</h1>
    <p class="lead">Vos cours de la semaine, tels qu'ils ont été publiés par le directeur des études ou sa secrétaire. Les heures payées restent celles que vous émargez et que le responsable valide.</p>
    ${weekNavHtml(W)}
    <div class="row" style="margin:0 0 12px;justify-content:space-between;align-items:center"><div class="seg" role="tablist" aria-label="Affichage"><button role="tab" data-myv="grille" aria-pressed="${S.myView!=="liste"}">Grille</button><button role="tab" data-myv="liste" aria-pressed="${S.myView==="liste"}">Liste et émargement</button></div></div>
    <div class="row" id="myTools" style="margin:0 0 12px"><button class="btn" id="myPdf" ${slots.length?"":"disabled"}>${DLI}Télécharger la semaine (PDF)</button><button class="btn" id="myIcs">Ajouter à mon calendrier</button></div>
    ${S.myView==="liste"?`<div id="myList"><p class="empty">Chargement…</p></div>`:slots.length?`<div class="stats"><div class="stat big"><b>${hrs(total)}</b><span>cette semaine</span></div><div class="stat"><b>${slots.length}</b><span>Créneaux</span></div><div class="stat"><b>${days}</b><span>Jours de cours</span></div></div>
      ${cancelled.size?`<div class="gpwarn" style="margin-bottom:10px">${cancelled.size} cours annulé(s) cette semaine : touchez-les pour voir le motif.</div>`:""}
      ${timetableGrid({mine:slots,conf:new Set(),cancelled,view:"teacher",avOf:()=>avails,outside:()=>false,teacherId:tid,week:W,readonly:1})}
`
    :`<div class="panel"><p class="empty">Aucun cours publié pour vous cette semaine.<br>L'emploi du temps apparaît ici dès que le directeur des études l'a publié.</p></div>`}
    <h2>Avancement de mes matières</h2>${progressHtml(assigns,allSess,byA)}`;
  v.querySelectorAll("[data-myv]").forEach(b=>b.onclick=()=>{S.myView=b.dataset.myv;rerender()});
  if(S.myView==="liste")await viewTeacher(document.getElementById("myList"),true);

/* avancement des matières d'un professeur : heures faites (séances passées non annulées), programmées à venir, reste à programmer */
function progressHtml(assigns,allSess,byWeek){
  const today=iso(new Date()),now=new Date();
  const cur=assigns.filter(a=>a.semesters&&a.semesters.end_date>=iso(addDays(now,-30))).sort((x,y)=>x.semesters.start_date.localeCompare(y.semesters.start_date)||x.courses.code.localeCompare(y.courses.code));

      <div class="pbar" title="Faites ${hrs(done)} · programmées ${hrs(plan)} · reste ${hrs(rest)}"><i style="width:${pc(done)}%"></i><i class="pl" style="width:${pc(plan)}%"></i></div>

/* ---------- glisser-déposer dans la grille (souris : glisser ; tactile : appui long puis glisser) ---------- */
function enableTtDrag(root,opt){
  const tt=root.querySelector(".tt");if(!tt)return;
  const lo=Number(tt.dataset.lo),hi=Number(tt.dataset.hi),HH=Number(tt.dataset.hh);
  const F=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
  let st=null;
  const colAt=(x,y)=>{const el=document.elementFromPoint(x,y);return el&&el.closest?el.closest(".tt-col"):null};
  const begin=(ev,x,y)=>{const r=ev.getBoundingClientRect();const g=ev.cloneNode(true);g.classList.add("tt-ghost");g.style.width=r.width+"px";g.style.height=r.height+"px";g.style.left=r.left+"px";g.style.top=r.top+"px";
    document.body.appendChild(g);ev.classList.add("dragging");document.body.classList.add("ttdrag");st.g=g;st.dx=x-r.left;st.dy=y-r.top;st.w=r.width;st.on=true;move(x,y)};
  const move=(x,y)=>{if(!st||!st.on)return;st.g.style.left=(x-st.dx)+"px";st.g.style.top=(y-st.dy)+"px";
    const col=colAt(x,y);if(st.drop&&st.drop.parentNode!==col){st.drop.remove();st.drop=null}
    if(!col){st.target=null;return}
    const cr=col.getBoundingClientRect();let m=lo+Math.round(((y-st.dy)-cr.top)/HH*60/30)*30;m=Math.max(lo,Math.min(hi-st.len,m));
    st.target={day:Number(col.dataset.day),start:m};
    if(!st.drop){st.drop=document.createElement("div");st.drop.className="tt-drop";col.appendChild(st.drop)}
    st.drop.style.top=((m-lo)/60*HH)+"px";st.drop.style.height=(st.len/60*HH)+"px";st.drop.textContent=F(m)+"–"+F(m+st.len);const gt=st.g.querySelector(".tt-t");if(gt)gt.textContent=DAYS[st.target.day].slice(0,3)+". "+F(m)+"–"+F(m+st.len);
    const bad=opt.check?opt.check(st.id,st.target.day,m,m+st.len):false;st.drop.classList.toggle("bad",!!bad);st.drop.title=bad||""};
  const end=async(cancel)=>{if(!st)return;const s0=st;st=null;clearTimeout(s0.timer);
    s0.el.classList.remove("dragging","lift");document.body.classList.remove("ttdrag");if(s0.g)s0.g.remove();if(s0.drop)s0.drop.remove();
    if(!s0.on||cancel||!s0.target)return;
    s0.el.dataset.dragged="1";setTimeout(()=>{delete s0.el.dataset.dragged},350);
    if(s0.target.day===s0.day&&s0.target.start===s0.start)return;
    await opt.onDrop(s0.id,s0.target.day,F(s0.target.start),F(s0.target.start+s0.len))};
  const init=(el,x,y)=>{const T=t=>{const [h,m]=t.split(":").map(Number);return h*60+m};
    const [a,b]=el.querySelector(".tt-t").textContent.split("–");st={el,id:Number(el.dataset.sl),x0:x,y0:y,start:T(a),len:T(b)-T(a),day:Number(el.closest(".tt-col").dataset.day),on:false}};
  /* souris */
  tt.addEventListener("mousedown",e=>{const el=e.target.closest(".tt-ev");if(!el||e.button!==0)return;e.preventDefault();init(el,e.clientX,e.clientY)});
  window.__ttH={move:e=>{if(!st)return;if(!st.on&&Math.hypot(e.clientX-st.x0,e.clientY-st.y0)>6)begin(st.el,e.clientX,e.clientY);else move(e.clientX,e.clientY)},
    up:()=>{if(st)end(false)},key:e=>{if(e.key==="Escape"&&st)end(true)}};
  if(!window.__ttW){window.__ttW=1;window.addEventListener("mousemove",e=>window.__ttH.move(e));window.addEventListener("mouseup",e=>window.__ttH.up(e));window.addEventListener("keydown",e=>window.__ttH.key(e))}
  /* tactile : appui long 400 ms, sinon la page défile normalement */
  tt.addEventListener("touchstart",e=>{const el=e.target.closest(".tt-ev");if(!el||e.touches.length!==1)return;const t=e.touches[0];init(el,t.clientX,t.clientY);
    st.timer=setTimeout(()=>{if(!st)return;el.classList.add("lift");if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){};begin(el,st.x0,st.y0)},400)},{passive:true});
  tt.addEventListener("touchmove",e=>{if(!st)return;const t=e.touches[0];
    if(!st.on){if(Math.hypot(t.clientX-st.x0,t.clientY-st.y0)>8){clearTimeout(st.timer);st=null}return}
    e.preventDefault();move(t.clientX,t.clientY)},{passive:false});
  tt.addEventListener("touchend",e=>{if(!st)return;if(st.on){e.preventDefault();end(false)}else{clearTimeout(st.timer);st=null}});
  tt.addEventListener("touchcancel",()=>{if(st)end(true)});
  /* un glisser ne doit pas ouvrir la fiche du créneau */
  tt.addEventListener("click",e=>{const el=e.target.closest(".tt-ev");if(el&&el.dataset.dragged){e.stopImmediatePropagation();e.preventDefault()}},true);
}

const TT_COLORS=["#0b6e5b","#2563a8","#b06a00","#7a4fa3","#b23a5a","#3f7f2a","#0e7490","#9a5b2e"];

      ${av.filter(a=>a.day_of_week===d).map(a=>`<div class="tt-av" style="top:${y(T(a.start_time))}px;height:${(T(a.end_time)-T(a.start_time))/60*HH}px" title="Disponible ${hm(a.start_time)}–${hm(a.end_time)}"></div>`).join("")}

/* ---------- générateur automatique d'emploi du temps (version simple) ---------- */
const GEN_DEFAULT={days:[1,2,3,4,5],start:"08:00",end:"18:00",len:120,lunchFrom:"12:00",lunchTo:"14:00",maxGroup:6,maxTeacher:6,maxDays:0,compact:true,useAvail:true};
function generateTimetable(o,D){
  const T=t=>{const [h,m]=String(t).slice(0,5).split(":").map(Number);return h*60+m};
  const F=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
  const ov=(a,b)=>a.s<b.e&&b.s<a.e;
  const busy={g:{},t:{},r:{}};
  const add=(k,id,day,s,e)=>{((busy[k][id]??={})[day]??=[]).push({s,e})};
  const free=(k,id,day,s,e)=>!(busy[k][id]?.[day]||[]).some(x=>ov(x,{s,e}));
  const load=(k,id,day)=>(busy[k][id]?.[day]||[]).reduce((a,x)=>a+x.e-x.s,0);
  const existing={};const aslots={};const asl=(id,d)=>((aslots[id]??={})[d]??=[]);const tdays={};const tday=id=>(tdays[id]??=new Set());
  const GS=a=>a._g||[a.group_id];
  D.slots.forEach(x=>{const a=x.teaching_assignments;GS(a).forEach(g=>add("g",g,x.day_of_week,T(x.start_time),T(x.end_time)));add("t",a.teacher_id,x.day_of_week,T(x.start_time),T(x.end_time));tday(a.teacher_id).add(x.day_of_week);asl(x.assignment_id,x.day_of_week).push({s:T(x.start_time),e:T(x.end_time)});if(x.room_id)add("r",x.room_id,x.day_of_week,T(x.start_time),T(x.end_time));
    existing[x.assignment_id]=(existing[x.assignment_id]||0)+T(x.end_time)-T(x.start_time)});
  const len=o.len,maxChain=Math.max(1,Math.floor(360/o.len)),start=T(o.start),end=T(o.end),lf=o.lunchFrom?T(o.lunchFrom):null,lt=o.lunchTo?T(o.lunchTo):null;
  const times=dayStarts(start,end,len,lf,lt);
  /* demi-journées sans cours : un créneau qui finit avant la pause (ou avant 13 h sans pause) est « matin », sinon « après-midi » */
  const off=new Set(o.off||[]);
  const blocked=(d,t)=>off.has(d+"|"+F(t));
  const rooms=[...D.rooms].sort((a,b)=>a.capacity-b.capacity);
  const gsize=Object.fromEntries(D.groups.map(g=>[g.id,g.size])),ghome=Object.fromEntries(D.groups.map(g=>[g.id,g.home_room_id]));
  const av=tid=>D.avails.filter(a=>a.teacher_id===tid);
  /* heures restantes de chaque matière (déjà déduites de tous les créneaux programmés, y compris cette semaine) */
  const jobs=D.assigns.map(a=>{const rem=Math.max(0,D.remaining[a.id]||0);const cap=1e9;
    return{a,n:Math.min(cap,Math.ceil(rem/len))}}).filter(j=>j.n>0);
  const availMin=a=>o.useAvail?av(a.teacher_id).reduce((s,y)=>s+T(y.end_time)-T(y.start_time),0):1e9;
  const tTotal={};jobs.forEach(j=>{tTotal[j.a.teacher_id]=(tTotal[j.a.teacher_id]||0)+j.n});
  jobs.sort((x,y)=>availMin(x.a)-availMin(y.a)||(tTotal[y.a.teacher_id]-tTotal[x.a.teacher_id])||(x.a.teacher_id-y.a.teacher_id)||y.n-x.n);
  /* rythme attendu : heures restantes réparties sur les semaines restantes du semestre (sert à signaler les retards, pas à limiter) */

    if(wk0&&sem?.end_date){left=Math.max(1,Math.ceil(openWeeks(D.week.slice(0,10),sem.end_date)))}
    j.pace=Math.min(j.n,Math.max(1,Math.ceil(Math.max(0,D.remaining[j.a.id]||0)/left/len)));j.done=0;j.why={};

  const placeOne=j=>{const a=j.a,why=j.why,usedDays=j.usedDays;let best=null;
      for(const d of o.days)for(const t of times){const e=t+len;if(blocked(d,t))continue;

        const tav=av(a.teacher_id);
        if(o.useAvail&&!tav.some(x=>x.day_of_week===d&&T(x.start_time)<=t&&T(x.end_time)>=e)){fail(D.declared.has(a.teacher_id)?"hors disponibilités du professeur":"pas de réponse du professeur pour cette semaine");continue}
        if(!free("t",a.teacher_id,d,t,e)){fail("professeur déjà occupé");continue}
        if(!GS(a).every(g=>free("g",g,d,t,e))){fail(GS(a).length>1?"un des groupes réunis est déjà occupé":"groupe déjà occupé");continue}
        if(o.maxDays>0&&!tday(a.teacher_id).has(d)&&tday(a.teacher_id).size>=o.maxDays){fail("limite de jours de présence du professeur");continue}
        const same=asl(a.id,d);
        if(same.length){let run=1,cur=t,ch=true;while(ch){ch=false;for(const x of same){if(x.e===cur){run++;cur=x.s;ch=true;break}}}
          cur=e;ch=true;while(ch){ch=false;for(const x of same){if(x.s===cur){run++;cur=x.e;ch=true;break}}}
          if(run>maxChain){fail("trop d'heures de suite pour la même matière");continue}}

        if(load("t",a.teacher_id,d)+len>o.maxTeacher*60){fail("limite d'heures par jour du professeur");continue}

        const home=GS(a).map(g=>ghome[g]).find(h=>h&&fit.some(r=>r.id===h&&free("r",r.id,d,t,e)));

        if(!room){fail(!fit.length?(rt?"aucune salle de type « "+(ROOM_TYPE[rt]||rt)+" » assez grande":"aucune salle assez grande"):"aucune salle libre");continue}
        const adj=(busy.t[a.teacher_id]?.[d]||[]).some(x=>x.e===t||x.s===e);
        const score=o.compact?((tday(a.teacher_id).has(d)?0:500)+(usedDays.has(d)?10:0)+(asl(a.id,d).some(x=>x.e===t||x.s===e)?60:0)+(adj&&!asl(a.id,d).some(x=>x.e===t||x.s===e)?-4:0)+Math.max(...GS(a).map(g=>load("g",g,d)))/6+times.indexOf(t)*0.5+d*0.01)
          :((usedDays.has(d)?1000:0)+Math.max(...GS(a).map(g=>load("g",g,d)))/6+load("t",a.teacher_id,d)/30+times.indexOf(t)*0.5+d*0.01);

      GS(a).forEach(g=>add("g",g,best.d,best.t,best.e));add("t",a.teacher_id,best.d,best.t,best.e);add("r",best.room.id,best.d,best.t,best.e);usedDays.add(best.d);tday(a.teacher_id).add(best.d);asl(a.id,best.d).push({s:best.t,e:best.e});j.done++;
      placed.push({assignment_id:a.id,a,day_of_week:best.d,start_time:F(best.t),end_time:F(best.e),room_id:best.room.id,room_code:best.room.code});return true};
  let active=jobs.slice();
  while(active.length){const next=[];for(const j of active){if(placeOne(j)&&j.done<j.n)next.push(j)}active=next}

}

/* ---------- exports Excel et PDF ---------- */
function slug(s){return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-|-$/g,"").toLowerCase()}
const nf=n=>Number(n).toLocaleString("fr-FR").replace(/[  ]/g," ");
const dh=min=>Math.round((min||0)/60*100)/100; /* minutes -> heures décimales (calculables dans Excel) */
const DLI=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>`;
function xbar(id){return `<div class="xbar" id="${id}"><button class="btn sm" type="button" data-x="xlsx" aria-label="Exporter en Excel">${DLI}Excel</button><button class="btn sm" type="button" data-x="pdf" aria-label="Exporter en PDF">${DLI}PDF</button></div>`}
function wireExport(id,build){
  const host=document.getElementById(id);if(!host)return;
  host.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{
    try{const d=await build();if(b.dataset.x==="xlsx")exportExcel(d.file,d.sheets);else exportPdf(d.file,d.title,d.subtitle,d.sheets,d.landscape)}
    catch(e){toast(errMsg(e),true)}});
}
function exportExcel(file,sheets){
  try{
    if(!window.XLSX)throw new Error("Le module Excel n'a pas pu être chargé. Vérifiez la connexion et rechargez la page.");
    const wb=XLSX.utils.book_new();
    sheets.forEach(s=>{
      const ws=XLSX.utils.aoa_to_sheet([[s.title||s.name],[s.subtitle||""],[],s.head,...s.rows]);
      ws["!cols"]=s.head.map((h,c)=>({wch:Math.min(42,Math.max(String(h).length,...s.rows.map(r=>String(r[c]??"").length))+2)}));
      XLSX.utils.book_append_sheet(wb,ws,String(s.name).replace(/[\\\/?*\[\]:]/g,"-").slice(0,31));
    });
    XLSX.writeFile(wb,file+".xlsx");
  }catch(e){toast(errMsg(e),true)}
}
function exportPdf(file,title,subtitle,sheets,landscape){
  try{
    if(!window.jspdf)throw new Error("Le module PDF n'a pas pu être chargé. Vérifiez la connexion et rechargez la page.");
    const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:landscape?"landscape":"portrait"});
    const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
    doc.setFillColor(11,110,91);doc.rect(0,0,W,3,"F");
    const LX=pdfLogo(doc,14,7,14)?31:14;

    if(pdfHead()){doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(93,104,121);doc.text(pdfHead(),LX,18)}
    doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(22,32,46);doc.text(title,14,25);
    doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(93,104,121);
    doc.text(subtitle+" · Édité le "+new Date().toLocaleDateString("fr-FR"),14,30.5);
    let y=36;
    sheets.forEach(s=>{
      if(!s.rows.length&&!s.keepEmpty)return;
      if(y>H-40){doc.addPage();y=18}
      if(s.title){doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(22,32,46);doc.text(s.title,14,y);y+=2}
      doc.autoTable({startY:y+2,head:[s.head],body:s.rows.map(r=>r.map(c=>typeof c==="number"?nf(c):String(c??""))),
        theme:"striped",margin:{left:14,right:14,bottom:16},styles:{font:"helvetica",fontSize:8,cellPadding:2,textColor:[22,32,46]},
        headStyles:{fillColor:[11,110,91],textColor:255,fontStyle:"bold"},alternateRowStyles:{fillColor:[243,246,244]}});

async function qAll(make){let all=[],from=0;for(;;){const d=await q(make().range(from,from+999));all=all.concat(d);if(d.length<1000)return all;from+=1000}}

const DPRESETS=[["semaine","Semaine"],["mois","Mois"],["semestre","Semestre"],["perso","Perso."]];
function trendChart(buckets){
  /* courbe : heures prévues (pointillés) et heures validées (aire) par semaine ou par jour */
  const wide=window.innerWidth>720,W=wide?1040:360,H=wide?250:210,L=wide?44:34,R=14,T=14,B=30,n=buckets.length;
  const maxH=Math.max(1,Math.ceil(Math.max(...buckets.map(b=>Math.max(b.prev,b.val)))/60));
  const X=i=>n===1?L+(W-L-R)/2:L+i*(W-L-R)/(n-1),Y=h=>T+(H-T-B)*(1-h/maxH);
  const pts=k=>buckets.map((b,i)=>`${X(i).toFixed(1)},${Y(b[k]/60).toFixed(1)}`).join(" ");
  const step=Math.ceil(n/(wide?10:4));
  const area=n>1?`<polygon points="${X(0).toFixed(1)},${Y(0)} ${pts("val")} ${X(n-1).toFixed(1)},${Y(0)}" fill="var(--accent)" fill-opacity=".14"/>`:"";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Heures prévues et validées par ${buckets[0]?.unit||"semaine"}" style="width:100%;height:auto;display:block">
    ${[0,.5,1].map(f=>{const h=maxH*f;return `<line x1="${L}" x2="${W-R}" y1="${Y(h)}" y2="${Y(h)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(h)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${Math.round(h)} h</text>`}).join("")}
    ${area}${n>1?`<polyline points="${pts("prev")}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/><polyline points="${pts("val")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`:""}
    ${buckets.map((b,i)=>`<circle cx="${X(i)}" cy="${Y(b.val/60)}" r="4" fill="var(--accent)"><title>${b.label} : ${hrs(b.val)} validées sur ${hrs(b.prev)} prévues</title></circle>${n===1?`<circle cx="${X(i)}" cy="${Y(b.prev/60)}" r="4" fill="none" stroke="var(--muted)"/>`:""}${i%step===0||i===n-1?`<text x="${X(i)}" y="${H-8}" text-anchor="${i===0&&n>1?"start":i===n-1&&n>1?"end":"middle"}" font-size="12" fill="var(--muted)">${b.label}</text>`:""}`).join("")}
  </svg>`;
}

function fieldHtml(f,val){
  if(f.hidden){const h=fieldHtml({...f,hidden:false},val);return h.replace(/^<label>/,'<label style="display:none">')}
  const id="f_"+f.k;
  if(f.t==="select")return `<label>${f.l}<select id="${id}" ${f.req?"required":""}>${f.req?"":'<option value="">—</option>'}${f.opt.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(val)?"selected":""}>${esc(l)}</option>`).join("")}</select></label>`;
  if(f.t==="bool")return `<label style="flex-direction:row;align-items:center;gap:8px;align-self:end"><input id="${id}" type="checkbox" ${val?"checked":""}> ${f.l}</label>`;
  if(f.t==="multi"){const set=new Set((val||[]).map(String));return `<div style="grid-column:1/-1"><div class="sub" style="margin-bottom:6px">${f.l}</div><div class="chips" id="${id}">${f.opt.map(([v,l])=>`<button type="button" data-v="${esc(v)}" aria-pressed="${set.has(String(v))}" onclick="this.setAttribute('aria-pressed',this.getAttribute('aria-pressed')!=='true')">${esc(l)}</button>`).join("")}</div>${f.hint?`<div class="sub" style="margin-top:4px">${f.hint}</div>`:""}</div>`}
  return `<label>${f.l}<input id="${id}" type="${f.t||"text"}" ${f.req?"required":""} ${f.min!=null?`min="${f.min}"`:""} ${f.step?`step="${f.step}"`:""} value="${esc(val??"")}"></label>`;
}
function readFields(fields){
  const o={};
  fields.forEach(f=>{const el=document.getElementById("f_"+f.k);let v;
    if(f.t==="bool")v=el.checked;
    else if(f.t==="multi")v=[...el.querySelectorAll("[aria-pressed=true]")].map(b=>Number(b.dataset.v));
    else{v=el.value.trim();
      if(f.t==="number")v=v===""?null:Number(v);
      else if(f.t==="select"&&f.num)v=v===""?null:Number(v);
      else if(v==="")v=null}
    o[f.k]=v});
  return o;
}

const TRASH=`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></svg>`;

  el.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>formDialog(def,null));

  el.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>deleteDialog(def,rows[b.dataset.d]));

const NEED={department_id:"Créez d'abord un département (onglet Structure).",program_id:"Créez d'abord une filière (onglet Structure).",academic_year_id:"Créez d'abord une année universitaire (onglet Années et semestres).",status_id:"Aucun statut d'enseignant : ajoutez-en un dans « Statuts des enseignants »."};
function formDialog(def,row){
  const vals=row||def.defaults||{};
  const missing=def.fields.filter(f=>f.t==="select"&&f.req&&!f.opt.length);
  openDialog(`<h3>${row?"Modifier":"Ajouter"} : ${esc(def.one)}</h3>
    ${missing.length?`<div class="gpwarn">${missing.map(f=>esc(NEED[f.k]||"Aucun choix disponible pour « "+f.l+" ».")).join(" ")}</div>`:""}
    <div class="grid2">${def.fields.map(f=>fieldHtml(f,f.get?f.get(vals):vals[f.k])).join("")}</div>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok" ${missing.length?"disabled":""}>Enregistrer</button></div>`,
  async()=>{
    let o=readFields(def.fields);
    if(def.normalize)o=def.normalize(o);
    if(def.check)def.check(o);
    if(def.before)await def.before(o,row);
    const virt={};def.fields.filter(f=>f.virtual).forEach(f=>{virt[f.k]=o[f.k];delete o[f.k]});
    let saved=row;
    if(row)await q(sb.from(def.table).update(o).eq("id",row.id));
    else if(def.after)saved=await q(sb.from(def.table).insert(o).select().single());
    else await q(sb.from(def.table).insert(o));
    if(def.after)await def.after(o,saved,virt,row);
    toast("Enregistré");rerender();
  });
}
function deleteDialog(def,row){
  const nm=(def.name||(r=>r.name||r.label||r.code||("n° "+r.id)))(row);
  openDialog(`<h3>Supprimer « ${esc(nm)} » ?</h3>
    <p style="margin:0">La suppression est définitive. Si cet élément est déjà utilisé (séances, affectations, bulletins), elle sera refusée.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn danger" value="ok">Supprimer</button></div>`,
  async()=>{const r=await q(sb.from(def.table).delete().eq("id",row.id).select());
    if(!r.length)throw new Error("Suppression refusée.");toast("Supprimé");rerender()});
}

      ${doneN===SETUP_STEPS.length?"":`<div class="su-steps">${SETUP_STEPS.map(([l,,sc],i)=>`<button type="button" class="su ${counts[i]?"done":""} ${i===nextIdx?"next":""}" data-su="${sc}"><span class="su-i">${counts[i]?"✓":i+1}</span><span class="su-l">${l}</span><span class="su-c">${counts[i]||""}</span></button>`).join("")}</div>`}</div>`:""}
    <div class="chips secnav">${allowed.length>1?allowed.map(k=>`<button data-sec="${k}" aria-pressed="${k===sec}">${SEC_LABEL[k]}</button>`).join(""):""}</div>

  v.querySelectorAll("[data-su]").forEach(b=>b.onclick=()=>{S[key]=b.dataset.su;rerender()});
  v.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{S[key]=b.dataset.sec;rerender()});
  const body=document.getElementById("refBody");
  if(sec==="comptes"){await viewAccounts(body);return}
  if(sec==="horaires"){await viewSchedule(body);return}
  if(sec==="fermetures"){await viewClosures(body);return}
  const defs=refDefs(await refLookups());

  await Promise.all(BLOCKS_BY_SEC[sec].map(k=>renderBlock(defs[k],document.getElementById("blk-"+k))));
}

function slotsOf(sc){const out=[];const len=sc.len,st=hmin(sc.start),en=hmin(sc.end),lf=sc.lunchFrom?hmin(sc.lunchFrom):null,lt=sc.lunchTo?hmin(sc.lunchTo):null;
  const F=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
  dayStarts(st,en,len,lf,lt).forEach(t=>out.push(F(t)+"–"+F(t+len)));return out}

async function viewClosures(el){
  const [list,sems0]=await Promise.all([q(sb.from("calendar_closures").select("*").order("date_from")),q(sb.from("semesters").select("label,start_date,end_date,faculty_id,academic_years(label,is_current)").order("start_date"))]);
  S.closures=list;const sems=sems0.filter(x=>!x.faculty_id||x.faculty_id===S.fac);
  const today=iso(new Date());S.clPast=!!S.clPast;
  /* la faculté choisie voit ses jours sans cours et ceux de toute l'université */
  const U=!!S._univ;
  const shown=list.filter(c=>(S.clPast||c.date_to>=today)&&(U?c.faculty_id==null:(c.faculty_id==null||c.faculty_id===S.fac)));

async function callUsers(body){

/* ---------- postes : un nom (modifiable par l'administrateur) posé sur une combinaison de droits ---------- */
const RIGHTS={professeur:"Enseigner (cours, disponibilités, émargement)",planificateur:"Référentiel, affectations et emplois du temps",responsable:"Validation des heures émargées",
  finance:"Paie, tarifs et paiements",direction:"Direction : doyen (visa de la paie) ou rectorat (consultation)",admin:"Administration des comptes",
  chef_departement:"Chef de département (son département : consultation et validation)",caissier:"Paiements seulement (sans calcul ni approbation de la paie)",lecteur:"Consultation sans modification"};

const OPT_DESC={chef_departement:"Voit l'emploi du temps et l'avancement des matières de son département, et valide les émargements de ce département.",

async function loadPostes(){try{S.postes=await q(sb.from("postes").select("id,name,roles,sort,scope").order("sort").order("name"))}catch(e){S.postes=S.postes||[]}return S.postes}

function wirePosteForm(){

/* appel d'une fonction de la base ; message clair si le script d'installation n'a pas encore été exécuté */
async function rpcOrScript(fn,args,script){try{return await q(sb.rpc(fn,args))}
  catch(e){if(/Could not find the function|PGRST202|does not exist/.test(e.message||""))throw new Error(`La base n'est pas à jour : le script « ${script||"admin_sauvegarde_annee.sql"} » doit être exécuté dans Supabase.`);throw e}}

/* ---------- direction générale : synthèse et avancement des programmes ---------- */
async function viewDgSynth(v){
  const now=new Date(),today=iso(now),m0=iso(new Date(now.getFullYear(),now.getMonth(),1)),m1=iso(new Date(now.getFullYear(),now.getMonth()+1,0));
  const cw=iso(mondayOf(now)),nw=iso(nextMonday());
  const [mSess,assigns,allSess,pubs,periods,year,abs]=await Promise.all([
    q(sb.from("schedule_sessions").select("id,session_date,start_time,end_time,status,attendance_records(status)").gte("session_date",m0).lte("session_date",m1)),
    q(sb.from("teaching_assignments").select("id,planned_hours,courses(code,name),teachers(first_name,last_name),semesters(label,start_date,end_date),student_groups!teaching_assignments_group_id_fkey(code,programs(id,code,name,level,departments(code,name))),assignment_groups(student_groups(code,programs(id,code,name,level,departments(code,name))))")),
    q(sb.from("schedule_sessions").select("assignment_id,session_date,start_time,end_time,status")),
    q(sb.from("published_weeks").select("week_start").in("week_start",[cw,nw]).eq("faculty_id",S.fac)),
    q(sb.from("pay_periods").select("id,name,status,end_date,visa_at").eq("faculty_id",S.fac).order("start_date",{ascending:false})),
    q(sb.from("academic_years").select("start_date,end_date").eq("is_current",true).maybeSingle()),
    q(sb.from("absence_requests").select("id").eq("status","en_attente")).catch(()=>[])]);
  /* séances du mois */
  const live=mSess.filter(x=>x.status!=="annulee"),done=live.filter(x=>sEnd(x)<=now),em=done.filter(x=>x.attendance_records),val=done.filter(x=>x.attendance_records?.status==="valide");
  const canc=mSess.filter(x=>x.status==="annulee").length;
  /* avancement : séances passées non annulées, par affectation du semestre en cours */
  const cur=assigns.filter(a=>a.semesters&&a.semesters.start_date<=today&&a.semesters.end_date>=today);
  const m=x=>toMin(hm(x.end_time))-toMin(hm(x.start_time));
  const dn={},pl={};allSess.forEach(x=>{if(x.status==="annulee")return;if(sEnd(x)<=now)dn[x.assignment_id]=(dn[x.assignment_id]||0)+m(x);else pl[x.assignment_id]=(pl[x.assignment_id]||0)+m(x)});
  const rows=cur.map(a=>{const P=a.planned_hours*60,d=dn[a.id]||0,r=semesterRisk(a,d,today);
    const progs=[a.student_groups?.programs,...(a.assignment_groups||[]).map(g=>g.student_groups?.programs)].filter(Boolean);
    return{a,P,d,pl:pl[a.id]||0,late:d<P&&r&&r.risk,miss:r?.missing,progs:[...new Map(progs.map(x=>[x.id,x])).values()]}});
  const totP=rows.reduce((t,x)=>t+x.P,0),totD=rows.reduce((t,x)=>t+Math.min(x.d,x.P),0),late=rows.filter(x=>x.late);
  /* attendu à date : part du semestre écoulée (sans les jours fermés) */
  const exp=rows.reduce((t,x)=>{const s=x.a.semesters,tw=openWeeks(s.start_date,s.end_date),lw=openWeeks(today,s.end_date);return t+x.P*(tw?Math.max(0,Math.min(1,(tw-lw)/tw)):0)},0);
  const byP={};rows.forEach(x=>x.progs.forEach(p=>{const o=byP[p.id]??={p,P:0,d:0,late:0,list:[]};o.P+=x.P;o.d+=Math.min(x.d,x.P);o.late+=x.late?1:0;o.list.push(x)}));
  const progs=Object.values(byP).sort((a,b)=>(a.p.departments?.code||"").localeCompare(b.p.departments?.code||"")||(a.p.level||"").localeCompare(b.p.level||"")||a.p.code.localeCompare(b.p.code));
  const pct=(a,b)=>b?Math.round(a*100/b):0;
  /* alertes */
  const A=[];const dow=now.getDay()||7;
  const visaWait=visaOn()?periods.filter(x=>["approuvee","payee"].includes(x.status)&&!x.visa_at):[];

/* constats sur les enseignements d'une période : annulations, demandes d'absence, émargements tardifs, corrigés, rejetés, par délégation */
async function suiviData(from,to){
  const now=new Date();
  const [ss,abs]=await Promise.all([
    q(sb.from("schedule_sessions").select("id,session_date,start_time,end_time,status,note,teacher_id,teachers(first_name,last_name,departments(code)),teaching_assignments(courses(code,name,departments(code))),student_groups(code),attendance_records(status,declared_minutes,retained_minutes,submitted_at,entered_for_teacher)").gte("session_date",from).lte("session_date",to).order("session_date")),
    q(sb.from("absence_requests").select("id,status,reason,session_id,teacher_id,schedule_sessions!inner(session_date)").gte("schedule_sessions.session_date",from).lte("schedule_sessions.session_date",to)).catch(()=>[])]);
  const T={},D={};const row=k=>({k,fin:0,ann:0,abs:0,tard:0,red:0,rej:0,cor:0,del:0,non:0});
  const add=(o,f)=>{f(o)};
  ss.forEach(x=>{const t=x.teacher_id,dep=x.teaching_assignments?.courses?.departments?.code||x.teachers?.departments?.code||"?";
    const ot=T[t]??=Object.assign(row(t),{name:(x.teachers?.first_name||"")+" "+(x.teachers?.last_name||""),dep}),od=D[dep]??=row(dep);
    [ot,od].forEach(o=>{if(x.status==="annulee"){o.ann++;return}if(sEnd(x)>now)return;o.fin++;const a=x.attendance_records;
      if(!a){o.non++;return}if((new Date(a.submitted_at)-sEnd(x))/864e5>7)o.tard++;if(a.status==="rejete")o.rej++;if(a.status==="correction_demandee")o.cor++;
      if(a.status==="valide"&&a.retained_minutes<a.declared_minutes)o.red++;if(a.entered_for_teacher)o.del++})});
  abs.forEach(r=>{const t=T[r.teacher_id];if(t){t.abs++;D[t.dep]&&D[t.dep].abs++}});
  const cancels=ss.filter(x=>x.status==="annulee").map(x=>({x,why:(x.note||"").replace(/^Annulé\s*:\s*/,"")||"motif non précisé"}));
  const motifs={};cancels.forEach(c=>{const k=c.why.replace(/\s*\(.*\)$/,"").trim().toLowerCase();motifs[k]=(motifs[k]||0)+1});
  return{T:Object.values(T).sort((a,b)=>a.name.localeCompare(b.name)),D:Object.values(D).sort((a,b)=>a.k.localeCompare(b.k)),cancels,motifs:Object.entries(motifs).sort((a,b)=>b[1]-a[1]),abs}
}

async function monthlyReport(M){

    q(sb.from("pay_periods").select("name,status,start_date,end_date,visa_at").eq("faculty_id",S.fac).lte("start_date",t).gte("end_date",f))]);
  const m=x=>toMin(hm(x.end_time))-toMin(hm(x.start_time));

async function viewAccounts(el){

    q(sb.from("profiles").select("id,full_name,email,active,must_change_password,poste_id,faculty_id").order("full_name")),

  const inf=id=>info.find(x=>x.id===id)||{};

  const tOf=id=>teachers.find(t=>t.profile_id===id);
  const fdt=d=>d?new Date(d).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"}):"jamais";

  const noRole=profiles.filter(u=>u.active!==false&&!rolesOf(u.id).length);
  const profNoT=profiles.filter(u=>rolesOf(u.id).some(r=>r.role==="professeur")&&!tOf(u.id));
  const tNoAcc=teachers.filter(t=>t.active!==false&&!t.profile_id);
  const neverIn=profiles.filter(u=>u.active!==false&&info.length&&!inf(u.id).last_sign_in_at);
  const pending=profiles.filter(u=>u.active!==false&&u.must_change_password);
  const actives=profiles.filter(u=>u.active!==false).length;
  S.accQ=S.accQ||"";S.accRole=S.accRole||"";if(S.accRole&&!["custom","_none",...(S.postes||[]).map(p=>"p"+p.id)].includes(S.accRole))S.accRole="";S.accState=S.accState||"";
  const ROLEF=[["","Tous les postes"],...visiblePostes().filter(p=>!isProfPoste(p)||S.accTab==="all").map(p=>["p"+p.id,p.name]),["custom","Sans poste enregistré"],["_none","Aucun droit"]];
  const pkeyU=(u,rs)=>!rs.length?"_none":posteById(u.poste_id)?"p"+u.poste_id:"custom";
  /* deux groupes : personnel administratif (tout poste autre que Professeur, ou sans poste) et professeurs */
  const isProfOnly=u=>{const p=posteById(u.poste_id);if(p)return isProfPoste(p);const rs=rolesOf(u.id);return rs.length>0&&rs.every(r=>r.role==="professeur")};
  const teaches=u=>rolesOf(u.id).some(r=>r.role==="professeur");
  const staff=profiles.filter(u=>!isProfOnly(u)),profs=profiles.filter(isProfOnly);
  S.accTab=S.accTab||"staff";S.accWithStaff=!!S.accWithStaff;

  const stateOf=(u,li)=>`${u.active===false?"off":"on"}${u.must_change_password?" tmp":""}${info.length&&!li?" never":""}`;
  const lienT=(u,t)=>t?esc(t.first_name+" "+t.last_name):teaches(u)?'<span class="pill p-bad">À lier</span>':'<span class="sub">—</span>';

  const nomCell=u=>`<td><button class="lnk" data-det="${u.id}" style="text-align:left">${esc(u.full_name)}</button><div class="sub mono">${esc(u.email)}</div>${(S.facs||[]).length>1||u.faculty_id==null?`<div class="sub">${u.faculty_id==null?"Université":esc(facCode(u.faculty_id))}</div>`:""}</td>`;
  const posteCell=(u,rs)=>`<td><div class="chips">${rs.length?`<span class="pill p-info" title="${esc(rs.map(r=>(RIGHTS[r.role]||r.role)+(["responsable","chef_departement"].includes(r.role)?" · "+(r.department_id?dcode(r.department_id):"tous"):"")).join(", "))}">${esc(posteLabelU(u,rs))}</span>`:'<span class="pill p-warn">Aucun poste</span>'}</div></td>`;
  el.innerHTML=`<div class="row" style="justify-content:flex-end"><div class="row" style="gap:8px">${P?`<button class="btn sm" id="bulkAcc" ${tNoAcc.length?"":"disabled"}>Créer les comptes des ${tNoAcc.length} enseignant(s) sans compte</button>`:""}<button class="btn sm primary" id="addAcc">${P?"Créer un compte professeur":"Créer un compte"}</button></div></div>
    <div class="seg" role="tablist" aria-label="Groupe" style="margin-bottom:12px">
      <button type="button" role="tab" data-acct="staff" aria-pressed="${!P&&!ALL}">Personnel administratif (${staff.length})</button>

        :`<label>Poste<select id="accRole">${ROLEF.map(([k,l])=>`<option value="${k}" ${k===S.accRole?"selected":""}>${esc(l)}</option>`).join("")}</select></label>`}

    ${list.map(u=>{const rs=rolesOf(u.id);const t=tOf(u.id);const li=inf(u.id).last_sign_in_at;const st=!isProfOnly(u);

    if(S.accBulk){S.accBulk=false;const b=document.getElementById("bulkAcc");if(b&&!b.disabled)b.click()}},0);

            catch(e){W2.push("Pensez à vérifier avec le directeur des études si des cours sont encore programmés pour ce professeur.")}}}
        openDialog(`<h3>${to?"Réactiver":"Désactiver"} le compte ?</h3><p style="margin:0">${to?"La personne pourra de nouveau se connecter.":"La personne ne pourra plus se connecter. Ses données et son historique sont conservés."}</p>

/* ---------- paie ---------- */
const PER={ouverte:["Ouverte","p-mute"],en_verification:["Calculée, à vérifier","p-warn"],approuvee:["Approuvée","p-info"],payee:["Payée","p-ok"]};
const SLIP={approuve:["À payer","p-warn"],partiellement_paye:["Partiellement payé","p-info"],paye:["Payé","p-ok"]};
const pct=(a,b)=>b?Math.round(a/b*100):0;
function ppill(map,st){const [l,c]=map[st]||[st,"p-mute"];return `<span class="pill ${c}">${l}</span>`}
function fcfa(n){return Math.round(n||0).toLocaleString("fr-FR").replace(/[  ]/g," ")+" FCFA"}
function fdl(s){if(!s)return "—";const [y,m,d]=String(s).slice(0,10).split("-");return `${d}/${m}/${y}`}
function canPay(){return has("finance")}
/* paie par faculté : visa du doyen réglé par chaque faculté ; seul le doyen de la faculté vise */
const visaOn=()=>{const f=facById(S.fac);return f?!!f.payroll_visa:!!(S.cfg&&S.cfg.payroll_visa)};
const isDoyen=()=>(S.roles||[]).some(r=>r.role==="direction"&&r.faculty_id&&r.faculty_id===S.fac);
function canRecordPay(){return has("finance")||has("caissier")}

async function viewPayroll(v){
  const periods=await q(sb.from("pay_periods").select("*").eq("faculty_id",S.fac).order("start_date",{ascending:false}));
  const totals=await q(sb.from("payslips").select("pay_period_id,net_fcfa,pay_periods!inner(faculty_id)").eq("pay_periods.faculty_id",S.fac));
  const items=await q(sb.from("payroll_items").select("pay_period_id,amount_fcfa,pay_periods!inner(faculty_id)").eq("pay_periods.faculty_id",S.fac));
  const sum=(arr,id)=>arr.filter(x=>x.pay_period_id===id).reduce((s,x)=>s+(x.net_fcfa??x.amount_fcfa),0);
  if(!periods.some(p=>p.id===S.periodId))S.periodId=(periods.find(p=>p.status==="ouverte"||p.status==="en_verification")||periods[0])?.id;
  const p=periods.find(x=>x.id===S.periodId);
  v.innerHTML=`<h1>Paie</h1>
    <p class="lead">Rémunération à l'heure, calculée uniquement sur les heures validées. Une fois la période approuvée, les bulletins sont figés.</p>
    <div class="sechead"><h2>Périodes de rémunération</h2>${canPay()?`<button class="btn sm primary" id="newP">+ Nouvelle période</button>`:""}</div>
    ${periods.length?`<div class="plist">${periods.map(x=>{const amt=x.status==="ouverte"?null:["approuvee","payee"].includes(x.status)?sum(totals,x.id):sum(items,x.id);
      return `<button type="button" class="pcard" data-p="${x.id}" aria-pressed="${x.id===S.periodId}"><span class="pc-top"><b>${esc(x.name)}</b><span>${visaOn()&&["approuvee","payee"].includes(x.status)?(x.visa_at?'<span class="pill p-ok">Visée</span> ':'<span class="pill p-warn">À viser</span> '):""}${ppill(PER,x.status)}</span></span>
      <span class="pc-dates">Du ${fdl(x.start_date)} au ${fdl(x.end_date)}</span>
      <span class="pc-bot"><span class="sub">${x.attendance_deadline?"Émargement avant le "+fdl(x.attendance_deadline):"Sans limite d'émargement"}</span><span class="pc-amt">${amt==null?"—":fcfa(amt)}</span></span></button>`}).join("")}</div>`:`<div class="panel"><p class="empty">Aucune période. Créez la première période de rémunération.</p></div>`}
    <div id="pDetail"></div>`;
  v.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{S.periodId=Number(b.dataset.p);rerender();setTimeout(()=>document.getElementById("pDetail")?.scrollIntoView({behavior:"smooth",block:"start"}),60)});
  if(canPay()&&document.getElementById("newP"))newP.onclick=()=>periodDialog(periods[0]);
  if(p)await periodDetail(document.getElementById("pDetail"),p);
}

function periodDialog(last){
  /* proposition : le mois qui suit la dernière période (ou le mois en cours) */
  const b=last?addDays(new Date(last.end_date+"T12:00:00"),1):new Date();const m0=new Date(b.getFullYear(),b.getMonth(),1),m1=new Date(b.getFullYear(),b.getMonth()+1,0);
  const nm=m0.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  openDialog(`<h3>Nouvelle période de rémunération</h3>
    <label>Nom<input id="nN" required placeholder="Ex. : Novembre 2026" value="${esc(nm.charAt(0).toUpperCase()+nm.slice(1))}"></label>
    <div class="row"><label>Du<input id="nS" type="date" required value="${iso(m0)}"></label><label>Au<input id="nE" type="date" required value="${iso(m1)}"></label></div>
    <div class="row"><label>Limite d'émargement<input id="nD" type="date"></label><label>Échéance de régularisation<input id="nR" type="date"></label></div>
    <p class="sub" style="margin:0">La période peut durer un mois, une quinzaine, un semestre ou toute autre durée.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Créer la période</button></div>`,
  async()=>{
    if(nE.value<nS.value)throw new Error("La date de fin doit être postérieure à la date de début.");
    const r=await q(sb.from("pay_periods").insert({faculty_id:S.fac,name:nN.value.trim(),start_date:nS.value,end_date:nE.value,attendance_deadline:nD.value||null,regularization_deadline:nR.value||null,manager_id:S.user.id}).select().single());
    S.periodId=r.id;toast("Période créée");rerender();
  });
}

async function periodDetail(el,p){
  const frozen=["approuvee","payee"].includes(p.status);
  if(!frozen){
    const [items,pending]=await Promise.all([
      q(sb.from("payroll_items").select("*,teachers(first_name,last_name,teacher_statuses(label))").eq("pay_period_id",p.id).order("session_date")),
      q(sb.from("attendance_records").select("id,status,schedule_sessions!inner(session_date)").in("status",["soumis","correction_demandee"]).gte("schedule_sessions.session_date",p.start_date).lte("schedule_sessions.session_date",p.end_date))]);
    const by=groupBy(items);
    const tot=items.reduce((s,i)=>s+i.amount_fcfa,0);
    /* état du contrôle des émargements sur la période */
    let ctl=null;try{const now=new Date(),ss=(await q(sb.from("schedule_sessions").select("id,session_date,start_time,end_time,status,attendance_records(status)").gte("session_date",p.start_date).lte("session_date",p.end_date))).filter(x=>x.status!=="annulee");
      const past=ss.filter(x=>sEnd(x)<=now);ctl={fut:ss.length-past.length,sub:past.filter(x=>x.attendance_records?.status==="soumis").length,cor:past.filter(x=>x.attendance_records?.status==="correction_demandee").length,non:past.filter(x=>!x.attendance_records).length}}catch(e){}
    const ready=ctl&&!ctl.fut&&!ctl.sub&&!ctl.cor&&!ctl.non;
    const VC=items.length?await payChecks(p,items,by,tot):[];
    el.innerHTML=`<div class="panel phead"><div class="ph-top"><div><div class="sub">Période sélectionnée</div><h2>${esc(p.name)}</h2><div class="sub">Du ${fdl(p.start_date)} au ${fdl(p.end_date)}</div></div>${ppill(PER,p.status)}</div>
      ${canPay()?`<div class="ph-act"><button class="btn ${p.status==="ouverte"?"primary":""}" id="calc">${p.status==="ouverte"?"Calculer la paie":"Recalculer"}</button>
        ${p.status==="en_verification"&&items.length?`<button class="btn primary" id="appr">Approuver et générer les bulletins</button>`:""}
        ${p.status==="ouverte"?`<button class="btn danger" id="delP">Supprimer</button>`:""}</div>`:""}
      ${items.length?`<div class="ph-x">${xbar("pX")}</div>`:""}</div>
      ${ctl?`<div class="panel hcard" style="margin-bottom:12px;border-color:${ready?"var(--ok)":"var(--warn)"}"><b style="color:${ready?"var(--ok)":"var(--warn)"}">${ready?"✓ Contrôle terminé : la période peut être calculée.":"Le contrôle des émargements n'est pas terminé"}</b>
        ${ready?"":`<ul class="chk" style="margin-top:8px">${ctl.fut?`<li class="info"><i>i</i><span>${ctl.fut} séance(s) de la période sont encore à venir.</span></li>`:""}${ctl.sub?`<li class="warn"><i>!</i><span>${ctl.sub} émargement(s) en attente de contrôle.</span></li>`:""}${ctl.cor?`<li class="warn"><i>!</i><span>${ctl.cor} correction(s) demandée(s), sans réponse du professeur.</span></li>`:""}${ctl.non?`<li class="bad"><i>✕</i><span>${ctl.non} séance(s) passée(s) non émargée(s).</span></li>`:""}</ul>
        <p class="sub" style="margin:6px 0 0">Vous pouvez calculer quand même : ce qui n'est pas validé ne sera pas payé dans cette période et passera dans une suivante. L'aide du responsable financier voit le détail dans Contrôle › Prêt pour la paie.</p>`}</div>`:pending.length?`<p class="pill p-warn" style="display:inline-block;margin:0 0 12px">${pending.length} émargement(s) de la période ne sont pas encore validés : ils ne seront pas payés dans cette période.</p>`:""}
      ${p.status==="en_verification"?`<p class="sub" style="margin:0 0 12px">Dernier calcul : ${new Date(p.calculated_at).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"})}. Recalculez si de nouveaux émargements ont été validés depuis.</p>`:""}

    if(canPay()){
      calc.onclick=async()=>{try{const r=await q(sb.rpc("calculate_payroll",{p_period:p.id}));

    wireExport("pX",()=>({file:"paie_"+slug(p.name)+"_provisoire",title:"Paie : "+p.name+" (calcul provisoire)",subtitle:"Du "+fdl(p.start_date)+" au "+fdl(p.end_date),landscape:true,sheets:[

  }
  const [slips,pays]=await Promise.all([

  el.innerHTML=`<div class="panel phead"><div class="ph-top"><div><div class="sub">Période sélectionnée</div><h2>${esc(p.name)}</h2><div class="sub">Du ${fdl(p.start_date)} au ${fdl(p.end_date)} · approuvée le ${new Date(p.approved_at).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})}</div></div>${ppill(PER,p.status)}</div>
      <div class="ph-prog"><div class="hbar"><i style="width:${pct(tp,tot)}%;background:${tot-tp?"var(--accent)":"var(--ok)"}"></i></div><div class="sub">${pct(tp,tot)} % réglé · ${slips.length} bulletin${slips.length>1?"s":""} figé${slips.length>1?"s":""}</div></div>
      ${slips.length?`<div class="ph-x">${xbar("pX")}</div>`:""}
      ${visaReq?`<div class="visa ${p.visa_at?"ok":""}">${p.visa_at?`<b>✓ Visée par le doyen</b> le ${new Date(p.visa_at).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})}${p.visa_note?` · « ${esc(p.visa_note)} »`:""}`
        :`<b>En attente du visa du doyen</b>${p.visa_note?`<div>Remarque du doyen : « ${esc(p.visa_note)} »</div>`:""}<div class="sub">${isDoyen()?"Vérifiez les bulletins, puis visez la paie : le service financier pourra alors enregistrer les paiements.":"Les paiements pourront être enregistrés après le visa."}</div>
          ${isDoyen()?`<div class="row" style="margin-top:8px"><button class="btn primary" id="visaOk">Viser la paie</button><button class="btn" id="visaNote">Faire une remarque</button></div>`:""}`}</div>`:""}
      ${canRecordPay()&&slips.length?`<div class="ph-act" style="margin-top:10px">${tot-tp>0&&payOk?`<button class="btn primary" id="payBulk">Payer en lot</button>`:""}${tot-tp>0?`<button class="btn" id="payOrder">${DLI}Ordre de paiement</button>`:""}<button class="btn" id="slipNot">Prévenir les professeurs</button></div>`:""}</div>
    <div class="stats"><div class="stat"><b>${fcfa(tot)}</b><span>Net à payer</span></div><div class="stat"><b>${fcfa(tp)}</b><span>Réglé</span></div>
      <div class="stat"><b style="color:${tot-tp?"var(--warn)":"var(--ok)"}">${fcfa(tot-tp)}</b><span>Reste dû</span></div></div>
    <div class="sechead"><h2>Bulletins</h2><span class="sub" id="sCount">${slips.length}</span></div>${searchBox("sSearch","Rechercher un enseignant ou un n° de bulletin…")}<div class="panel slips" id="sList"></div>
    ${pays.length?`<h2>Règlements enregistrés</h2><div class="panel tbl"><table><thead><tr><th>Date</th><th>Bulletin</th><th>Mode</th><th>Référence</th><th>Montant</th></tr></thead><tbody>
    ${pays.map(x=>`<tr><td class="mono">${fdl(x.paid_on)}</td><td class="mono">${esc(slips.find(s=>s.id===x.payslip_id)?.number)}</td><td>${esc(x.method)}</td><td class="mono">${esc(x.reference||"—")}</td><td class="num">${fcfa(x.amount_fcfa)}</td></tr>`).join("")}</tbody></table></div>`:""}`;
  const wireSlips=()=>{el.querySelectorAll("[data-pdf]").forEach(b=>b.onclick=()=>downloadSlip(slips.find(s=>s.id==b.dataset.pdf),pays));
  el.querySelectorAll("[data-sdet]").forEach(b=>b.onclick=()=>downloadSlip(slips.find(s=>s.id==b.dataset.sdet),pays,true));
  wireExport("pX",()=>({file:"paie_"+slug(p.name),title:"État de paie : "+p.name,subtitle:"Du "+fdl(p.start_date)+" au "+fdl(p.end_date)+" · approuvée le "+fdl(p.approved_at),landscape:true,sheets:[
    {name:"Bulletins",title:"Bulletins (FCFA)",head:["Bulletin","Enseignant","Statut","Heures","Net à payer (FCFA)","Réglé (FCFA)","Reste dû (FCFA)","État"],
     rows:slips.map(s=>[s.number,s.snapshot.enseignant.nom,s.snapshot.enseignant.statut||"",dh(s.total_minutes),s.net_fcfa,paid(s.id),s.net_fcfa-paid(s.id),s.status])
       .concat([["Total","","",dh(slips.reduce((a,s)=>a+s.total_minutes,0)),tot,tp,tot-tp,""]])},
    {name:"Règlements",title:"Règlements enregistrés",head:["Date","Bulletin","Mode","Référence","Montant (FCFA)"],
     rows:pays.map(x=>[fdl(x.paid_on),slips.find(s=>s.id===x.payslip_id)?.number||"",x.method,x.reference||"",x.amount_fcfa])}]}));
  el.querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>{const s=slips.find(x=>x.id==b.dataset.pay);const due=s.net_fcfa-paid(s.id);
    openDialog(`<h3>Enregistrer un paiement</h3>
      <dl class="kv"><dt>Bulletin</dt><dd class="mono">${esc(s.number)}</dd><dt>Enseignant</dt><dd>${esc(s.snapshot.enseignant.nom)}</dd><dt>Reste dû</dt><dd class="mono">${fcfa(due)}</dd></dl>
      <div class="row"><label>Montant (FCFA)<input id="pA" type="number" min="1" max="${due}" required value="${due}"></label><label>Date<input id="pD" type="date" required value="${iso(new Date())}"></label></div>
      <div class="row"><label>Mode<select id="pM"><option>virement</option><option>Wave</option><option>Orange Money</option><option>chèque</option><option>espèces</option></select></label><label>Référence<input id="pR" placeholder="N° de virement, de transaction…"></label></div>
      <p class="sub" style="margin:0">Le paiement est enregistré par le service financier. Il n'exécute aucun virement.</p>
      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Enregistrer</button></div>`,
    async()=>{const amt=Number(pA.value),d=pD.value,m=pM.value;await q(sb.rpc("record_payment",{p_payslip:s.id,p_amount:amt,p_paid_on:d,p_method:m,p_reference:pR.value.trim()||null}));toast("Paiement enregistré");rerender();
      const ts=await payTeachers([s]);offerNotify(()=>notifyDialog({title:"Prévenir le professeur",intro:"Le paiement est visible dans son espace « Heures et paiements ». Vous pouvez aussi le lui confirmer.",items:[{t:ts[0],msg:payMsg(ts[0],amt,d,m,p)}]}),"Prévenir le professeur ?")});
    const t0=tOfSlip(s);if(t0&&t0.pay_method){const o=[...pM.options].find(x=>x.value===t0.pay_method);if(o)pM.value=t0.pay_method}})};
  const tAll=await payTeachers(slips),tOfSlip=sl=>tAll.find(t=>t.id===sl.teacher_id);
  const pb=document.getElementById("payBulk");if(pb)pb.onclick=()=>bulkPayDialog(p,slips,paid,tAll);
  const po=document.getElementById("payOrder");if(po)po.onclick=()=>payOrderDialog(p,slips,paid,tAll);
  const sn=document.getElementById("slipNot");if(sn)sn.onclick=()=>slipNotify(p);
  const vo=document.getElementById("visaOk");if(vo)vo.onclick=()=>openDialog(`<h3>Viser la paie « ${esc(p.name)} » ?</h3>
      <p style="margin:0">${slips.length} bulletin(s), net total <b>${fcfa(tot)}</b>. Après votre visa, le service financier pourra enregistrer les paiements. Le visa est enregistré dans le journal.</p>
      <label>Commentaire (facultatif)<input id="vC" maxlength="200"></label>
      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Viser</button></div>`,
    async()=>{await q(sb.rpc("visa_payroll",{p_period:p.id,p_ok:true,p_note:vC.value.trim()||null}));toast("Paie visée");rerender()});
  const vn=document.getElementById("visaNote");if(vn)vn.onclick=()=>openDialog(`<h3>Remarque sur la paie « ${esc(p.name)} »</h3>

/* ---------- paie : paiements en lot, ordre de paiement, messages aux professeurs ---------- */
const PAY_METHODS=["virement","Wave","Orange Money","chèque","espèces"];
async function payTeachers(slips){const ids=[...new Set(slips.map(x=>x.teacher_id))];if(!ids.length)return[];
  return q(sb.from("teachers").select("id,first_name,last_name,phone,pay_method,pay_number").in("id",ids))}
function payMsg(t,amt,d,m,p){return `Bonjour ${t.first_name} ${t.last_name}, un paiement de ${fcfa(amt)} vous a été fait le ${fdl(d)} par ${m}, au titre de ${p.name}. Le détail est dans votre espace « Heures et paiements » : ${appUrl()}. Cordialement, ${sig()}.`}
async function slipNotify(p){
  const slips=await q(sb.from("payslips").select("id,teacher_id,net_fcfa,total_minutes,number").eq("pay_period_id",p.id));if(!slips.length)return;
  const ts=await payTeachers(slips);
  notifyDialog({title:"Bulletins disponibles",intro:"Chaque professeur peut télécharger son bulletin dans « Heures et paiements ». Vous pouvez le lui annoncer.",
    items:slips.map(sl=>{const t=ts.find(x=>x.id===sl.teacher_id)||{first_name:"",last_name:"",phone:null};return{t,msg:`Bonjour ${t.first_name} ${t.last_name}, votre bulletin de rémunération de ${p.name} est disponible : ${hrs(sl.total_minutes)}, net ${fcfa(sl.net_fcfa)} (bulletin ${sl.number}). Téléchargez-le dans votre espace « Heures et paiements » : ${appUrl()}. Cordialement, ${sig()}.`}})})}
function bulkPayDialog(p,slips,paid,ts){
  const due=slips.map(s=>({s,t:ts.find(x=>x.id===s.teacher_id)||{},du:s.net_fcfa-paid(s.id)})).filter(x=>x.du>0).sort((a,b)=>(a.t.last_name||"").localeCompare(b.t.last_name||""));
  openDialog(`<h3>Payer en lot · ${esc(p.name)}</h3>
    <p class="sub" style="margin:0">Cochez les bulletins réglés. Le montant proposé est le reste dû ; le mode vient de la fiche de l'enseignant s'il est connu. Rien n'est versé par l'application : elle enregistre les paiements que vous avez faits.</p>
    <div class="grid2"><label>Date de paiement<input id="bpD" type="date" required value="${iso(new Date())}"></label><label>Référence commune (facultatif)<input id="bpR" placeholder="N° de lot, de virement…"></label></div>
    <div class="panel tbl"><table><thead><tr><th><input type="checkbox" id="bpAll" checked aria-label="Tout cocher"></th><th>Enseignant</th><th>Mode</th><th>Montant (FCFA)</th></tr></thead><tbody>
      ${due.map((x,i)=>`<tr><td><input type="checkbox" data-bi="${i}" checked></td><td>${esc((x.t.first_name||"")+" "+(x.t.last_name||""))}<div class="sub mono">${esc(x.s.number)}${x.t.pay_number?" · "+esc(x.t.pay_number):""}</div></td>
        <td><select data-bm="${i}">${PAY_METHODS.map(m=>`<option ${m===(x.t.pay_method||"virement")?"selected":""}>${m}</option>`).join("")}</select></td>
        <td><input type="number" data-ba="${i}" min="1" max="${x.du}" value="${x.du}" style="width:120px"></td></tr>`).join("")}</tbody></table></div>
    <p class="sub" style="margin:0" id="bpSum"></p>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Enregistrer les paiements</button></div>`,
  async()=>{const sel=due.map((x,i)=>({...x,on:document.querySelector(`[data-bi="${i}"]`).checked,m:document.querySelector(`[data-bm="${i}"]`).value,a:Number(document.querySelector(`[data-ba="${i}"]`).value)})).filter(x=>x.on);
    if(!sel.length)throw new Error("Cochez au moins un bulletin.");
    if(sel.some(x=>!(x.a>0)||x.a>x.du))throw new Error("Un montant est vide ou dépasse le reste dû.");
    const d=bpD.value,ref=bpR.value.trim()||null,ok=[],errs=[];
    for(const x of sel){try{await q(sb.rpc("record_payment",{p_payslip:x.s.id,p_amount:x.a,p_paid_on:d,p_method:x.m,p_reference:ref}));ok.push(x)}catch(e){errs.push((x.t.last_name||"")+" : "+errMsg(e))}}
    toast(`${ok.length} paiement(s) enregistré(s)`+(errs.length?` · ${errs.length} refusé(s) : ${errs[0]}`:""),errs.length>0);rerender();
    if(ok.length)offerNotify(()=>notifyDialog({title:"Prévenir les professeurs payés",intro:"Chaque professeur voit le paiement dans son espace. Vous pouvez aussi le lui confirmer.",items:ok.map(x=>({t:x.t,msg:payMsg(x.t,x.a,d,x.m,p)}))}),"Prévenir les professeurs payés ?")});
  const sum=()=>{let n=0,t=0;due.forEach((x,i)=>{if(document.querySelector(`[data-bi="${i}"]`).checked){n++;t+=Number(document.querySelector(`[data-ba="${i}"]`).value)||0}});bpSum.textContent=`${n} paiement(s) · total ${fcfa(t)}`};
  document.querySelectorAll("#dlgForm [data-bi],#dlgForm [data-ba]").forEach(e=>e.oninput=e.onchange=sum);
  bpAll.onchange=()=>{document.querySelectorAll("#dlgForm [data-bi]").forEach(c=>c.checked=bpAll.checked);sum()};sum();
}
function payOrderDialog(p,slips,paid,ts){
  const due=slips.map(s=>({s,t:ts.find(x=>x.id===s.teacher_id)||{},du:s.net_fcfa-paid(s.id)})).filter(x=>x.du>0).sort((a,b)=>(a.t.pay_method||"").localeCompare(b.t.pay_method||"")||(a.t.last_name||"").localeCompare(b.t.last_name||""));
  openDialog(`<h3>Ordre de paiement · ${esc(p.name)}</h3>
    <p class="sub" style="margin:0">La liste des montants restant dus, avec le mode et le numéro de chaque enseignant, à remettre à la banque ou à utiliser pour les envois Wave / Orange Money. Complétez ici les modes et numéros manquants : ils sont enregistrés sur la fiche de l'enseignant.</p>
    <div class="panel tbl"><table><thead><tr><th>Enseignant</th><th>Mode</th><th>Numéro / compte</th><th>Montant</th></tr></thead><tbody>
      ${due.map((x,i)=>`<tr><td>${esc((x.t.first_name||"")+" "+(x.t.last_name||""))}<div class="sub">${esc(x.t.phone||"")}</div></td>
        <td><select data-om="${i}"><option value="">—</option>${PAY_METHODS.map(m=>`<option ${m===x.t.pay_method?"selected":""}>${m}</option>`).join("")}</select></td>
        <td><input data-on="${i}" value="${esc(x.t.pay_number||"")}" placeholder="${esc(x.t.phone||"")}" style="min-width:150px"></td><td class="num"><b>${fcfa(x.du)}</b></td></tr>`).join("")}</tbody></table></div>

  async(act)=>{const rows=due.map((x,i)=>({...x,m:document.querySelector(`[data-om="${i}"]`).value,n:document.querySelector(`[data-on="${i}"]`).value.trim()}));
    for(const r of rows)if((r.m||"")!==(r.t.pay_method||"")||(r.n||"")!==(r.t.pay_number||"")){try{await q(sb.rpc("set_teacher_payment",{p_teacher:r.t.id,p_method:r.m||null,p_number:r.n||null}));r.t.pay_method=r.m||null;r.t.pay_number=r.n||null}catch(e){toast(errMsg(e),true)}}
    const head=["Enseignant","Mode","Numéro / compte","Téléphone","Montant (FCFA)"];
    const body=rows.map(r=>[(r.t.last_name||"")+" "+(r.t.first_name||""),r.m||"à préciser",r.n||"",r.t.phone||"",r.du]).concat([["Total","","","",rows.reduce((t,r)=>t+r.du,0)]]);
    const sub="Du "+fdl(p.start_date)+" au "+fdl(p.end_date)+" · montants restant dus au "+fdl(iso(new Date()));
    if(act==="xlsx")exportExcel("ordre-paiement_"+slug(p.name),[{name:"Ordre de paiement",title:"Ordre de paiement : "+p.name,subtitle:sub,head,rows:body}]);
    else exportPdf("ordre-paiement_"+slug(p.name),"Ordre de paiement : "+p.name,sub,[{title:"",head,rows:body.map(r=>r.map((c,j)=>j===4?fcfa(c):c))}]);
    return "keep"});
}
/* vérifications avant d'approuver une paie : tarifs manquants, écarts avec la période précédente, heures inhabituelles */
async function payChecks(p,items,by,tot){
  const L=[];
  try{
    const ids=new Set(items.map(i=>i.attendance_id));
    const val=await q(sb.from("attendance_records").select("id,teacher_id,teachers(first_name,last_name),schedule_sessions!inner(session_date)").eq("status","valide").is("pay_period_id",null).lte("schedule_sessions.session_date",p.end_date));
    const miss=val.filter(a=>!ids.has(a.id)),mt=[...new Map(miss.map(a=>[a.teacher_id,a.teachers])).values()];
    L.push(miss.length?{k:"bad",t:`${miss.length} séance(s) validée(s) sans tarif, donc non payées : ${esc(mt.map(t=>t.first_name+" "+t.last_name).join(", "))}. Ajoutez un tarif (Tarifs) puis recalculez.`}:{k:"ok",t:"Chaque séance validée a un tarif."});
    const prevP=(await q(sb.from("pay_periods").select("id,name,start_date,status").eq("faculty_id",p.faculty_id).lt("start_date",p.start_date).in("status",["approuvee","payee"]).order("start_date",{ascending:false}).limit(1)))[0];
    if(prevP){const ps=await q(sb.from("payslips").select("teacher_id,net_fcfa,total_minutes").eq("pay_period_id",prevP.id));
      const pt=ps.reduce((a,x)=>a+x.net_fcfa,0),d=pt?Math.round((tot-pt)*100/pt):null;
      L.push({k:d!=null&&Math.abs(d)>50?"warn":"info",t:`Total : ${fcfa(tot)}, contre ${fcfa(pt)} pour « ${esc(prevP.name)} »${d!=null?` (${d>0?"+":""}${d} %)`:""}.`});
      const big=by.map(o=>{const x=ps.find(y=>y.teacher_id===o.id);return x&&x.net_fcfa?{o,prev:x.net_fcfa,d:Math.round((o.amt-x.net_fcfa)*100/x.net_fcfa)}:null}).filter(x=>x&&Math.abs(x.d)>50);
      L.push(big.length?{k:"warn",t:`Écart de plus de 50 % avec « ${esc(prevP.name)} » : ${big.map(x=>`${esc(x.o.t.first_name+" "+x.o.t.last_name)} ${fcfa(x.o.amt)} (avant ${fcfa(x.prev)}, ${x.d>0?"+":""}${x.d} %)`).join(" · ")}.`}:{k:"ok",t:"Aucun écart de plus de 50 % par enseignant avec la période précédente."});
      const fresh=by.filter(o=>!ps.some(y=>y.teacher_id===o.id));if(fresh.length)L.push({k:"info",t:`Payé(s) pour la première fois ou absent(s) de la période précédente : ${esc(fresh.map(o=>o.t.first_name+" "+o.t.last_name).join(", "))}.`})}
    else L.push({k:"info",t:"Pas de période précédente approuvée pour comparer."});
    const ms=by.map(o=>o.min).sort((a,b)=>a-b),med=ms.length?ms[Math.floor(ms.length/2)]:0;
    const hi=by.filter(o=>by.length>=3&&o.min>2*med&&o.min>=20*60);
    if(hi.length)L.push({k:"warn",t:`Nombre d'heures inhabituel (plus du double de la médiane, ${hrs(med)}) : ${esc(hi.map(o=>o.t.first_name+" "+o.t.last_name+" "+hrs(o.min)).join(", "))}.`});
  }catch(e){L.push({k:"info",t:"Vérifications indisponibles : "+esc(errMsg(e))})}
  return L}

/* ---------- budget des enseignements (responsable financier, direction générale) ---------- */
async function viewBudget(v){
  const years=await q(sb.from("academic_years").select("id,label,start_date,end_date,is_current").order("start_date",{ascending:false}));
  if(!years.length){v.innerHTML=`<h1>Budget</h1><p class="empty">Aucune année universitaire.</p>`;return}
  if(!years.some(y=>y.id===S.bgYear))S.bgYear=(years.find(y=>y.is_current)||years[0]).id;
  const Y=years.find(y=>y.id===S.bgYear),today=iso(new Date());
  const [items,slips,pays,assigns,att,teachers,rates,statuses]=await Promise.all([
    q(sb.from("payroll_items").select("pay_period_id,teacher_id,session_date,minutes,amount_fcfa,pay_periods!inner(status,faculty_id),teachers(department_id,departments(code),status_id,teacher_statuses(label))").eq("pay_periods.faculty_id",S.fac).gte("session_date",Y.start_date).lte("session_date",Y.end_date)),
    q(sb.from("payslips").select("id,net_fcfa,pay_period_id,pay_periods!inner(start_date,faculty_id)").eq("pay_periods.faculty_id",S.fac).gte("pay_periods.start_date",Y.start_date).lte("pay_periods.start_date",Y.end_date)),
    q(sb.from("payments").select("payslip_id,amount_fcfa")),
    q(sb.from("teaching_assignments").select("id,teacher_id,planned_hours,semesters!inner(academic_year_id,end_date,faculty_id)").eq("semesters.academic_year_id",Y.id).eq("semesters.faculty_id",S.fac)),
    q(sb.from("attendance_records").select("status,retained_minutes,declared_minutes,schedule_sessions!inner(assignment_id,session_date)").in("status",["valide","soumis","correction_demandee"]).gte("schedule_sessions.session_date",Y.start_date).lte("schedule_sessions.session_date",Y.end_date)),
    q(sb.from("teachers").select("id,first_name,last_name,status_id,department_id,departments!inner(code,faculty_id),teacher_statuses(label)").eq("departments.faculty_id",S.fac)),
    q(sb.from("hourly_rates").select("status_id,teacher_id,rate_fcfa,effective_from").eq("faculty_id",S.fac).lte("effective_from",today).order("effective_from",{ascending:false})),
    q(sb.from("teacher_statuses").select("id,label"))]);
  /* coûts réels : lignes de paie (bulletins approuvés ou en cours de calcul) */
  const fixed=items.filter(i=>["approuvee","payee"].includes(i.pay_periods?.status)),draft=items.filter(i=>!["approuvee","payee"].includes(i.pay_periods?.status));
  const sum=a=>a.reduce((t,x)=>t+x.amount_fcfa,0);
  const slipIds=new Set(slips.map(x=>x.id)),paid=pays.filter(x=>slipIds.has(x.payslip_id)).reduce((t,x)=>t+x.amount_fcfa,0),net=slips.reduce((t,x)=>t+x.net_fcfa,0);
  /* estimation : heures prévues non encore faites × tarif actuel de l'enseignant */
  const done={};att.forEach(a=>{const k=a.schedule_sessions.assignment_id;done[k]=(done[k]||0)+(a.status==="valide"?a.retained_minutes||0:a.declared_minutes||0)});
  const rateOf=tid=>{const t=teachers.find(x=>x.id===tid);const r=rates.find(x=>x.teacher_id===tid)||rates.find(x=>t&&x.status_id===t.status_id&&!x.teacher_id);return r?r.rate_fcfa:null};
  let estMin=0,est=0,noRate=0;const estBy={};
  assigns.forEach(a=>{const left=Math.max(0,a.planned_hours*60-(done[a.id]||0));if(!left)return;const r=rateOf(a.teacher_id);estMin+=left;if(r==null){noRate+=left;return}
    const c=Math.round(left*r/60);est+=c;const t=teachers.find(x=>x.id===a.teacher_id);const k=t?.departments?.code||"?";estBy[k]=(estBy[k]||0)+c});
  const real=sum(items);
  /* par mois, par département, par statut */
  const months=[];for(let d=new Date(Y.start_date+"T12:00:00");iso(d)<=Y.end_date;d=new Date(d.getFullYear(),d.getMonth()+1,1))months.push(iso(d).slice(0,7));
  const byM=Object.fromEntries(months.map(m=>[m,{f:0,d:0}]));items.forEach(i=>{const m=i.session_date.slice(0,7);if(byM[m])byM[m][fixed.includes(i)?"f":"d"]+=i.amount_fcfa});
  const mx=Math.max(1,...months.map(m=>byM[m].f+byM[m].d));
  const grp=(f)=>{const o={};items.forEach(i=>{const k=f(i)||"?";o[k]??={a:0,m:0};o[k].a+=i.amount_fcfa;o[k].m+=i.minutes});return Object.entries(o).sort((a,b)=>b[1].a-a[1].a)};
  const byD=grp(i=>i.teachers?.departments?.code),byS=grp(i=>i.teachers?.teacher_statuses?.label);
  const ml=m=>{const s=new Date(m+"-15").toLocaleDateString("fr-FR",{month:"short"});return s.charAt(0).toUpperCase()+s.slice(1)};
  const tbl=(rows,extra)=>`<div class="panel tbl"><table><thead><tr><th></th><th>Heures</th><th>Coût</th><th>Part</th>${extra?"<th>Estimation restante</th>":""}</tr></thead><tbody>${rows.map(([k,o])=>`<tr><td>${esc(k)}</td><td class="num">${hrs(o.m)}</td><td class="num"><b>${fcfa(o.a)}</b></td><td class="num">${real?Math.round(o.a*100/real):0} %</td>${extra?`<td class="num">${fcfa(estBy[k]||0)}</td>`:""}</tr>`).join("")||`<tr><td colspan="${extra?5:4}" class="empty">Aucune paie calculée sur cette année.</td></tr>`}</tbody></table></div>`;
  v.innerHTML=`<h1>Budget des enseignements</h1>
    <p class="lead">Ce que coûtent les enseignements sur l'année : les montants réels viennent de la paie ; l'estimation du reste à venir est calculée à partir des affectations.</p>
    <div class="row" style="margin-bottom:14px;align-items:flex-end"><label>Année universitaire<select id="bgY">${years.map(y=>`<option value="${y.id}" ${y.id===Y.id?"selected":""}>${esc(y.label)}</option>`).join("")}</select></label><span style="margin-left:auto">${xbar("bgX")}</span></div>
    <div class="stats"><div class="stat big"><b>${fcfa(sum(fixed))}</b><span>Engagé (bulletins approuvés)</span></div>
      <div class="stat"><b>${fcfa(paid)}</b><span>Déjà payé · reste ${fcfa(Math.max(0,net-paid))}</span></div>
      <div class="stat"><b>${fcfa(sum(draft))}</b><span>Paie en cours de calcul</span></div>
      <div class="stat"><b style="color:var(--muted)">≈ ${fcfa(est)}</b><span>Estimation du reste à venir (${hrs(estMin)})</span></div></div>
    <div class="panel hcard" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><b>Total de l'année, estimation comprise</b><b>≈ ${fcfa(real+est)}</b></div>
      <p class="sub" style="margin:6px 0 0"><b>Estimation</b> : heures prévues dans les affectations de l'année, moins les heures déjà émargées, multipliées par le tarif actuel de chaque enseignant. Elle change avec les affectations, les annulations et les tarifs${noRate?` · ${hrs(noRate)} sans tarif ne sont pas comptées`:""}.</p></div>
    <h2>Par mois</h2><div class="panel hcard"><div class="bgm">${months.map(m=>{const o=byM[m];return `<div class="bgc" title="${ml(m)} : ${fcfa(o.f+o.d)}"><div class="bgb"><i style="height:${o.f*100/mx}%"></i><i style="height:${o.d*100/mx}%" class="dr"></i></div><span>${ml(m)}</span><small>${o.f+o.d?Math.round((o.f+o.d)/1000)+" k":""}</small></div>`}).join("")}</div>
      <p class="sub" style="margin:8px 0 0"><span class="pleg"><i></i>approuvé <i class="pl"></i>en cours de calcul</span> · montants par mois de la séance, en milliers de FCFA</p></div>
    <h2>Par département</h2>${tbl(byD,true)}
    <h2>Par statut d'enseignant</h2>${tbl(byS)}`;
  bgY.onchange=()=>{S.bgYear=Number(bgY.value);rerender()};
  wireExport("bgX",()=>({file:"budget_"+slug(Y.label),title:"Budget des enseignements "+Y.label,subtitle:"Montants réels issus de la paie ; estimation calculée à partir des affectations",sheets:[
    {name:"Synthèse",title:"Synthèse",head:["Rubrique","Montant (FCFA)"],rows:[["Engagé (bulletins approuvés)",sum(fixed)],["Déjà payé",paid],["Paie en cours de calcul",sum(draft)],["Estimation du reste à venir",est],["Total estimé de l'année",real+est]]},
    {name:"Par mois",title:"Par mois",head:["Mois","Approuvé (FCFA)","En cours (FCFA)","Total (FCFA)"],rows:months.map(m=>[ml(m)+" "+m.slice(0,4),byM[m].f,byM[m].d,byM[m].f+byM[m].d])},
    {name:"Par département",title:"Par département",head:["Département","Heures","Coût (FCFA)","Estimation restante (FCFA)"],rows:byD.map(([k,o])=>[k,dh(o.m),o.a,estBy[k]||0])},
    {name:"Par statut",title:"Par statut",head:["Statut","Heures","Coût (FCFA)"],rows:byS.map(([k,o])=>[k,dh(o.m),o.a])}]}));
}
