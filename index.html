    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Enregistrer</button></div>`,
    async()=>{const tg=rTg.value,id=Number(tg.slice(1));
      await q(sb.from("hourly_rates").insert({faculty_id:S.fac,status_id:tg[0]==="s"?id:null,teacher_id:tg[0]==="t"?id:null,rate_fcfa:Number(rAmt.value),effective_from:rFrom.value,note:rNote.value.trim()||null}));
      toast("Tarif enregistré");rerender()});
  v.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{try{const r=await q(sb.from("hourly_rates").delete().eq("id",b.dataset.del).select());
    if(!r.length)throw new Error("Ce tarif a déjà servi au calcul d'une paie : il ne peut pas être supprimé.");toast("Tarif supprimé");rerender()}catch(e){toast(errMsg(e),true)}});
}

/* ---------- mes bulletins ---------- */
async function viewMyPayslips(v){
  const now=new Date();if(!S.payM)S.payM=new Date(now.getFullYear(),now.getMonth(),1);
  const M=S.payM,mFrom=iso(M),mTo=iso(new Date(M.getFullYear(),M.getMonth()+1,0));
  const [slips,pays,unpaid,att]=await Promise.all([
    q(sb.from("payslips").select("*").eq("teacher_id",S.teacher.id).order("generated_at",{ascending:false})),
    q(sb.from("payments").select("*")),
    q(sb.from("attendance_records").select("retained_minutes").eq("teacher_id",S.teacher.id).eq("status","valide").is("pay_period_id",null)),
    q(sb.from("schedule_sessions").select("id,session_date,start_time,end_time,status,attendance_records(status,declared_minutes,retained_minutes,pay_period_id)").eq("teacher_id",S.teacher.id).gte("session_date",mFrom).lte("session_date",mTo))]);
  const paid=id=>pays.filter(x=>x.payslip_id===id).reduce((s,x)=>s+x.amount_fcfa,0);
  const waiting=unpaid.reduce((s,a)=>s+a.retained_minutes,0);
  /* le mois choisi : heures par état ; paiements reçus ; et le total de tous les bulletins */
  const A=att.filter(x=>x.status!=="annulee"),mm=x=>toMin(hm(x.end_time))-toMin(hm(x.start_time));
  const sum=(f,g)=>A.filter(f).reduce((t,x)=>t+g(x),0),ar=x=>x.attendance_records;
  const mVal=sum(x=>ar(x)?.status==="valide",x=>ar(x).retained_minutes||0),mWait=sum(x=>ar(x)?.status==="soumis",x=>ar(x).declared_minutes||0),
    mFix=sum(x=>ar(x)?.status==="correction_demandee",x=>ar(x).declared_minutes||0),mTodo=sum(x=>!ar(x)&&sEnd(x)<=now,mm),mRej=A.filter(x=>ar(x)?.status==="rejete").length;
  const mine=new Set(slips.map(x=>x.id)),myPays=pays.filter(x=>mine.has(x.payslip_id));
  const mPaid=myPays.filter(x=>x.paid_on>=mFrom&&x.paid_on<=mTo).reduce((t,x)=>t+x.amount_fcfa,0);
  const totNet=slips.reduce((t,x)=>t+x.net_fcfa,0),totPaid=myPays.reduce((t,x)=>t+x.amount_fcfa,0);
  const ml=M.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  v.innerHTML=`<h1>Mes heures et paiements</h1>
    <p class="lead">Vos heures du mois, ce qui a été payé et vos bulletins. Les montants viennent uniquement des bulletins approuvés par le service financier.</p>
    <div class="weeknav"><button class="wbtn" id="mPrev" aria-label="Mois précédent"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="wmid"><small>Mois de</small><b>${ml.charAt(0).toUpperCase()+ml.slice(1)}</b></div>
      <button class="wbtn" id="mNext" aria-label="Mois suivant"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="wnow" id="mNow">Ce mois</button></div>
    <div class="stats"><div class="stat big"><b>${hrs(mVal)}</b><span>Heures validées ce mois</span></div>
      <div class="stat"><b>${hrs(mWait)}</b><span>En attente de contrôle</span></div>
      <div class="stat"><b style="color:${mFix||mTodo?"var(--warn)":"inherit"}">${hrs(mFix+mTodo)}</b><span>À émarger ou à corriger</span></div>
      <div class="stat"><b>${fcfa(mPaid)}</b><span>Reçu ce mois</span></div></div>
    ${mRej?`<p class="sub" style="margin:-8px 0 14px">${mRej} émargement(s) rejeté(s) ce mois : voir « Mon emploi du temps » › Liste et émargement.</p>`:""}
    <h2>Depuis le début</h2>
    <div class="stats"><div class="stat"><b>${fcfa(totNet)}</b><span>Total net des bulletins (${slips.length})</span></div>
      <div class="stat"><b>${fcfa(totPaid)}</b><span>Déjà payé</span></div>
      <div class="stat"><b style="color:${totNet-totPaid>0?"var(--warn)":"inherit"}">${fcfa(Math.max(0,totNet-totPaid))}</b><span>Reste à payer</span></div>
      <div class="stat"><b>${hrs(waiting)}</b><span>Heures validées pas encore dans un bulletin</span></div></div>
    <h2>Mes bulletins</h2>
    <div class="panel tbl">${slips.length?`<table><thead><tr><th>Bulletin</th><th>Période</th><th>Heures</th><th>Net à payer</th><th>Réglé</th><th>État</th><th></th></tr></thead><tbody>
    ${slips.map(s=>`<tr><td class="mono">${esc(s.number)}</td><td>${esc(s.snapshot.periode.nom)}<div class="sub mono">${fdl(s.snapshot.periode.debut)} au ${fdl(s.snapshot.periode.fin)}</div></td>
      <td class="num">${hrs(s.total_minutes)}</td><td class="num"><b>${fcfa(s.net_fcfa)}</b></td><td class="num">${fcfa(paid(s.id))}</td><td>${ppill(SLIP,s.status)}</td>
      <td><div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm primary" data-pdf="${s.id}">Bulletin (PDF)</button><button class="btn sm" data-det="${s.id}">Relevé détaillé</button></div></td></tr>`).join("")}</tbody></table>`:`<p class="empty">Aucun bulletin pour l'instant. Il apparaîtra ici dès que le service financier aura approuvé une période.</p>`}</div>`;
  v.querySelectorAll("[data-pdf]").forEach(b=>b.onclick=()=>downloadSlip(slips.find(s=>s.id==b.dataset.pdf),pays));
  v.querySelectorAll("[data-det]").forEach(b=>b.onclick=()=>downloadSlip(slips.find(s=>s.id==b.dataset.det),pays,true));
  mPrev.onclick=()=>{S.payM=new Date(M.getFullYear(),M.getMonth()-1,1);rerender()};
  mNext.onclick=()=>{S.payM=new Date(M.getFullYear(),M.getMonth()+1,1);rerender()};
  mNow.onclick=()=>{S.payM=null;rerender()};
}

/* ---------- journal ---------- */
/* phrases lisibles du journal (partagées par le journal et le tableau de bord de l'administrateur) */
function auditText(people){
  const nm=id=>people.find(p=>p.id===id)?.full_name||"Système";
  /* l'administrateur seul ne voit pas les montants de paie */
  const mask=has("admin")&&!has("finance")&&!has("direction");
  const money=n=>mask?"(montant masqué)":fcfa(n);
  const N=r=>r.new_data||{},O=r=>r.old_data||{},D=r=>({...O(r),...N(r)});
  const wkl=d=>d?"du "+weekRange(new Date(d+"T12:00:00")):"";
  const verb={INSERT:"a créé",UPDATE:"a modifié",DELETE:"a supprimé"};
  const thing={departments:"le département",programs:"la filière",student_groups:"le groupe",courses:"la matière",rooms:"la salle",teachers:"l'enseignant",teacher_statuses:"le statut",academic_years:"l'année",semesters:"le semestre",teaching_assignments:"une affectation",assignment_groups:"un regroupement (tronc commun)",course_programs:"les filières d'une matière",teacher_availability:"une plage de disponibilité",profiles:"le compte"};
  const label=x=>x.code||x.label||x.name||x.full_name||((x.first_name||"")+" "+(x.last_name||"")).trim()||"";
  const say=r=>{const d=D(r),n=N(r),o=O(r),a=r.action;
    switch(r.table_name){
      case "published_weeks":return a==="DELETE"?`a retiré la publication de la semaine ${wkl(o.week_start)}`:`a publié la semaine ${wkl(d.week_start)}`;
      case "timetable_slots":return `${a==="INSERT"?"a placé":a==="DELETE"?"a retiré":"a déplacé ou modifié"} un cours ${d.week_start?"(semaine "+wkl(d.week_start)+", "+(DAYS[d.day_of_week]||"").toLowerCase()+" "+hm(d.start_time)+")":""}`;
      case "schedule_sessions":return a==="UPDATE"&&o.status!==n.status?(n.status==="annulee"?`a annulé la séance du ${fdl(d.session_date)} à ${hm(d.start_time)}`:`a remis en place la séance du ${fdl(d.session_date)}`)+(n.note?` · ${n.note}`:""):`${verb[a]} la séance du ${fdl(d.session_date)} à ${hm(d.start_time)}`;
      case "attendance_records":if(a==="INSERT")return n.entered_for_teacher?"a émargé une séance pour un professeur (délégation)":"a émargé une séance";
        if(a==="UPDATE"&&o.status!==n.status)return {valide:"a validé un émargement",rejete:"a rejeté un émargement",correction_demandee:"a demandé une correction d'émargement",soumis:"a corrigé un émargement"}[n.status]||"a modifié un émargement";return `${verb[a]} un émargement`;
      case "availability_weeks":return a==="DELETE"?`a effacé une réponse de disponibilités (semaine ${wkl(o.week_start)})`:(d.by_planner?`a saisi les disponibilités d'un professeur (semaine ${wkl(d.week_start)})`:`a déclaré ses disponibilités (semaine ${wkl(d.week_start)})`);
      case "school_schedule":return "a modifié les jours et horaires de cours";
      case "user_roles":return `${a==="DELETE"?"a retiré":"a attribué"} le rôle « ${ROLE_LABEL[d.role]||d.role} » ${a==="DELETE"?"à":"à"} ${nm(d.user_id)}`;
      case "pay_periods":if(a==="UPDATE"&&o.status!==n.status)return ({en_verification:"a calculé la paie",approuvee:"a approuvé la paie",payee:"a soldé la paie"}[n.status]||"a modifié la paie")+` « ${d.name} »`;return `${verb[a]} la période de paie « ${d.name} »`;
      case "payslips":return `${verb[a]} le bulletin ${d.number||""}${mask?"":" · "+fcfa(d.net_fcfa)}`;
      case "payments":return `${a==="INSERT"?"a enregistré":verb[a]} un paiement de ${money(d.amount_fcfa)}`;
      case "payroll_items":return `${verb[a]} une ligne de paie`;
      case "hourly_rates":return `${a==="INSERT"?"a fixé":verb[a]} un tarif horaire de ${money(d.rate_fcfa)} à partir du ${fdl(d.effective_from)}`;
      default:return `${verb[a]||a} ${thing[r.table_name]||r.table_name} ${label(d)}`.trim()}};
  return {say,nm};
}

async function viewAudit(v){
  const today=iso(new Date());
  S.auF=S.auF||iso(addDays(new Date(),-30));S.auT=S.auT||today;S.auWho=S.auWho||"";S.auCat=S.auCat||"";S.auLim=S.auLim||300;
  const CAT={edt:["Emplois du temps",["timetable_slots","published_weeks","schedule_sessions","teacher_availability","availability_weeks","school_schedule"]],
    emarg:["Émargements et validations",["attendance_records"]],paie:["Paie et tarifs",["pay_periods","payslips","payments","payroll_items","hourly_rates"]],
    ref:["Référentiel et affectations",["departments","programs","student_groups","courses","course_programs","rooms","teachers","teacher_statuses","teaching_assignments","assignment_groups","academic_years","semesters"]],
    comptes:["Comptes et rôles",["profiles","user_roles"]]};
  let qy=sb.from("audit_logs").select("*").gte("occurred_at",S.auF+"T00:00:00").lte("occurred_at",S.auT+"T23:59:59").order("occurred_at",{ascending:false}).limit(S.auLim);
  if(S.auCat)qy=qy.in("table_name",CAT[S.auCat][1]);
  if(S.auWho)qy=qy.eq("actor",S.auWho);
  const [rows,people]=await Promise.all([q(qy),q(sb.from("profiles").select("id,full_name").order("full_name"))]);
  const {say,nm}=auditText(people);
  const dt=x=>new Date(x).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"});
  v.innerHTML=`<h1>Journal des opérations</h1><p class="lead">Chaque action sensible est enregistrée avec son auteur et l'heure. Le journal ne peut pas être modifié.</p>
    <div class="row" style="margin-bottom:12px;align-items:flex-end">
      <label>Du<input id="auF" type="date" value="${S.auF}"></label><label>Au<input id="auT" type="date" value="${S.auT}"></label>
      <label>Personne<select id="auWho"><option value="">Tout le monde</option>${people.map(p=>`<option value="${p.id}" ${p.id===S.auWho?"selected":""}>${esc(p.full_name)}</option>`).join("")}</select></label>
      <label>Domaine<select id="auCat"><option value="">Tous</option>${Object.entries(CAT).map(([k,[l]])=>`<option value="${k}" ${k===S.auCat?"selected":""}>${l}</option>`).join("")}</select></label>
      <button class="btn" id="auGo">Afficher</button>${xbar("auX")}</div>
    ${searchBox("auQ","Rechercher dans les résultats…")}
    <div class="panel tbl">${rows.length?`<table id="auTable"><thead><tr><th>Date</th><th>Qui</th><th>Action</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td class="mono" style="white-space:nowrap">${dt(r.occurred_at)}</td><td>${esc(nm(r.actor))}</td><td>${esc(say(r))}</td></tr>`).join("")}</tbody></table>`:`<p class="empty">Aucune opération sur cette période avec ces filtres.</p>`}</div>
    ${rows.length>=S.auLim?`<div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="auMore">Afficher plus</button></div>`:""}`;
  auGo.onclick=()=>{if(auT.value<auF.value){toast("La date de fin doit être après la date de début.",true);return}S.auF=auF.value;S.auT=auT.value;S.auWho=auWho.value;S.auCat=auCat.value;S.auLim=300;rerender()};
  const mo=document.getElementById("auMore");if(mo)mo.onclick=()=>{S.auLim+=300;rerender()};
  const aq=document.getElementById("auQ");if(aq)aq.oninput=()=>{const k=norm(aq.value.trim());document.querySelectorAll("#auTable tbody tr").forEach(tr=>tr.hidden=!!k&&!norm(tr.textContent).includes(k))};
  wireExport("auX",()=>({file:"journal-"+S.auF+"-"+S.auT,title:"Journal des opérations",subtitle:`Du ${fdl(S.auF)} au ${fdl(S.auT)}`,landscape:true,
    sheets:[{name:"Journal",title:"Journal des opérations",subtitle:`Du ${fdl(S.auF)} au ${fdl(S.auT)}`,head:["Date","Qui","Action"],rows:rows.map(r=>[dt(r.occurred_at),nm(r.actor),say(r)])}]}));
}

sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_OUT")renderLogin()});
boot();
</script>
