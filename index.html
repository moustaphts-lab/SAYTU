/* ---------- contrôle des émargements (responsable, aide du responsable financier) ---------- */
const RV_SEL="id,status,planned_minutes,declared_start,declared_end,declared_minutes,retained_minutes,teacher_comment,review_reason,submitted_at,submitted_by,entered_for_teacher,teacher_id,teachers(first_name,last_name,phone),schedule_sessions!inner(id,session_date,start_time,end_time,teaching_assignments(courses(code,name,department_id,departments(code))),student_groups(code),rooms(code))";
async function viewReview(v){
  const today=iso(new Date()),now=new Date();
  S.rvTab=S.rvTab||"ctrl";S.filter=S.filter&&S.filter!=="soumis"?S.filter:"valide";
  S.rvFrom=S.rvFrom||iso(addDays(now,-60));S.rvTo=S.rvTo||today;S.rvDep=S.rvDep||"";S.rvT=S.rvT||"";
  const [pend,hist,todo]=await Promise.all([
    q(sb.from("attendance_records").select(RV_SEL).in("status",["soumis","correction_demandee"]).order("submitted_at")),
    q(sb.from("attendance_records").select(RV_SEL).in("status",["valide","rejete"]).gte("schedule_sessions.session_date",S.rvFrom).lte("schedule_sessions.session_date",S.rvTo).order("submitted_at",{ascending:false}).limit(600)),
    q(sb.from("schedule_sessions").select("id,session_date,start_time,end_time,status,teacher_id,teachers(first_name,last_name,phone),teaching_assignments(courses(code,name,department_id,departments(code))),student_groups(code),attendance_records(id)").neq("status","annulee").gte("session_date",S.rvFrom).lte("session_date",today).order("session_date").order("start_time"))]);
  const all=[...pend,...hist];
  /* filtres : département de la matière, professeur */
  const depOf=x=>x.teaching_assignments?.courses?.departments?.code||"";
  const deps=[...new Set([...all.map(a=>depOf(a.schedule_sessions)),...todo.map(depOf)].filter(Boolean))].sort();
  const tMap=new Map();[...all.map(a=>[a.teacher_id,a.teachers]),...todo.map(x=>[x.teacher_id,x.teachers])].forEach(([id,t])=>{if(t)tMap.set(id,t)});
  const tList=[...tMap.entries()].sort((x,y)=>(x[1].last_name+x[1].first_name).localeCompare(y[1].last_name+y[1].first_name));
  const okA=a=>(!S.rvDep||depOf(a.schedule_sessions)===S.rvDep)&&(!S.rvT||a.teacher_id==S.rvT);
  const okS=x=>(!S.rvDep||depOf(x)===S.rvDep)&&(!S.rvT||x.teacher_id==S.rvT);
  /* signalements automatiques */
  const T=t=>toMin(hm(t));
  const flags=a=>{const s=a.schedule_sessions,F=[];
    const cl=closureAt(s.session_date,T(a.declared_start),T(a.declared_end));if(cl)F.push("jour sans cours : "+cl.label);
    if(all.some(b=>b.id!==a.id&&b.teacher_id===a.teacher_id&&b.schedule_sessions.session_date===s.session_date&&b.status!=="rejete"&&T(b.declared_start)<T(a.declared_end)&&T(a.declared_start)<T(b.declared_end)))F.push("chevauche un autre cours émargé le même jour");
    const late=(new Date(a.submitted_at)-sEnd(s))/864e5;if(late>7)F.push(`émargé ${Math.floor(late)} jours après la séance`);
    const d=a.declared_minutes-a.planned_minutes;if(d>=15)F.push(`${d} min de plus que prévu`);
    return F};
  const self=a=>S.teacher&&a.teacher_id===S.teacher.id,byMe=a=>a.submitted_by===S.user.id;
  const sub=pend.filter(a=>a.status==="soumis"&&okA(a)),corr=pend.filter(a=>a.status==="correction_demandee"&&okA(a));
  const blocked=sub.filter(a=>self(a)||byMe(a)),free=sub.filter(a=>!self(a)&&!byMe(a));
  const conf=free.filter(a=>a.declared_minutes===a.planned_minutes&&hm(a.declared_start)===hm(a.schedule_sessions.start_time)&&!a.teacher_comment&&!a.entered_for_teacher&&!flags(a).length);
  const exam=free.filter(a=>!conf.includes(a));
  const why=a=>{const W=flags(a).map(x=>["warn",x]);const d=a.declared_minutes-a.planned_minutes;
    if(d&&d<15)W.push(["info",(d>0?"+":"−")+Math.abs(d)+" min"]);else if(d<0)W.push(["info","−"+Math.abs(d)+" min"]);
    if(!d&&hm(a.declared_start)!==hm(a.schedule_sessions.start_time))W.push(["info","horaire décalé"]);
    if(a.teacher_comment)W.push(["info","commentaire"]);if(a.entered_for_teacher)W.push(["info","saisi par délégation"]);return W};
  const nonEm=todo.filter(x=>!x.attendance_records&&sEnd(x)<=now&&!(S.teacher&&x.teacher_id===S.teacher.id)&&okS(x));
  const byT=list=>{const m=new Map();list.forEach(x=>{const k=x.teacher_id;if(!m.has(k))m.set(k,[]);m.get(k).push(x)});return [...m.entries()].sort((x,y)=>y[1].length-x[1].length)};
  const tname=id=>{const t=tMap.get(Number(id))||tMap.get(id);return t?t.first_name+" "+t.last_name:"?"};
  const row=(a,btn)=>{const s=a.schedule_sessions;return `<div class="hrow"><div><b>${esc(a.teachers.first_name+" "+a.teachers.last_name)} · ${fdate(s.session_date)} ${hm(s.start_time)}–${hm(s.end_time)}</b>
    <div class="sub">${sessionLabel(s)} · ${esc(s.student_groups?.code||"")} · déclaré ${hm(a.declared_start)}–${hm(a.declared_end)}${a.teacher_comment?" · « "+esc(a.teacher_comment)+" »":""}</div>
    ${btn==="exam"?`<div class="chips" style="margin-top:4px">${why(a).map(([k,t])=>`<span class="pill ${k==="warn"?"p-warn":"p-info"}">${esc(t)}</span>`).join("")}</div>`:""}</div>
    ${btn==="exam"?`<button class="btn sm primary" data-rv="${a.id}">Contrôler</button>`:btn==="blocked"?`<span class="sub">${self(a)?"Vos heures":"Saisi par vous"} : à valider par un collègue</span>`:btn==="corr"?`<span class="sub">${a.review_reason?"Demandé : "+esc(a.review_reason):"En attente du professeur"}</span>`:""}</div>`};
  const grouped=(list,kind)=>S.rvGroup?byT(list).map(([tid,L])=>`<h3 class="rvh">${esc(tname(tid))} <span class="sub">· ${L.length}</span></h3><div class="hlist">${L.map(a=>row(a,kind)).join("")}</div>`).join(""):`<div class="hlist">${list.map(a=>row(a,kind)).join("")}</div>`;
  const TABS=[["ctrl","À contrôler",sub.length],["non","Non émargées",nonEm.length],["paie","Prêt pour la paie",""],["hist","Historique",""]];
  const filt=`<div class="row" style="margin-bottom:12px;align-items:flex-end">
      ${S.rvTab!=="paie"?`${S.rvTab!=="ctrl"?`<label>Du<input id="rvF" type="date" value="${S.rvFrom}"></label><label>Au<input id="rvTo" type="date" value="${S.rvTo}"></label>`:""}
      ${deps.length>1?`<label>Département<select id="rvD"><option value="">Tous</option>${deps.map(d=>`<option ${d===S.rvDep?"selected":""}>${esc(d)}</option>`).join("")}</select></label>`:""}
      <label>Professeur<select id="rvT"><option value="">Tous</option>${tList.map(([id,t])=>`<option value="${id}" ${id==S.rvT?"selected":""}>${esc(t.last_name+" "+t.first_name)}</option>`).join("")}</select></label>
      ${S.rvTab!=="hist"?`<label style="flex-direction:row;align-items:center;gap:8px;color:var(--ink);padding-bottom:10px"><input type="checkbox" id="rvG" ${S.rvGroup?"checked":""}> Regrouper par professeur</label>`:""}`:""}</div>`;
  let body="";
  if(S.rvTab==="ctrl")body=`
    <section class="panel hcard" style="margin-bottom:14px"><div class="row" style="justify-content:space-between;align-items:center"><div><h2 style="margin:0">Conformes · ${conf.length}</h2><div class="sub">Durée et horaire identiques au prévu, sans commentaire, émargés par le professeur, sans signalement.</div></div>
      ${conf.length?`<button class="btn primary" id="rvAll">${conf.length>1?`Valider les ${conf.length} émargements conformes`:"Valider l'émargement conforme"}</button>`:""}</div>
      ${conf.length?`<details style="margin-top:8px"><summary class="lnk" style="cursor:pointer">Voir la liste</summary>${grouped(conf,"conf")}</details>`:`<p class="sub" style="margin:8px 0 0">Aucun émargement conforme en attente.</p>`}</section>
    <section class="panel hcard" style="margin-bottom:14px"><h2 style="margin:0 0 4px">À examiner · ${exam.length}</h2><div class="sub">Écart de durée, horaire décalé, commentaire, saisie par délégation ou signalement : à contrôler un par un.</div>
      ${exam.length?grouped(exam,"exam"):`<p class="sub" style="margin:8px 0 0">✓ Rien à examiner.</p>`}</section>
    ${blocked.length?`<section class="panel hcard" style="margin-bottom:14px"><h2 style="margin:0 0 4px">À faire valider par un collègue · ${blocked.length}</h2><div class="sub">Vous ne pouvez pas valider vos propres heures ni celles que vous avez saisies.</div>${grouped(blocked,"blocked")}</section>`:""}
    ${corr.length?`<section class="panel hcard"><h2 style="margin:0 0 4px">Corrections demandées · ${corr.length}</h2><div class="sub">En attente de la réponse du professeur.</div>${grouped(corr,"corr")}</section>`:""}`;
  if(S.rvTab==="non"){const G=byT(nonEm);
    const msgOf=(t,L)=>`Bonjour ${t.first_name} ${t.last_name}, il vous reste ${L.length} séance(s) à émarger : ${L.slice(0,8).map(x=>fdl(x.session_date)+" "+hm(x.start_time)+" "+(x.teaching_assignments?.courses?.code||"")).join(", ")}${L.length>8?"…":""}. Merci de les émarger dans l'application (${appUrl()}) : « J'ai fait ce cours ». Cordialement.`;
    body=`<section class="panel hcard"><div class="row" style="justify-content:space-between;align-items:center"><div><h2 style="margin:0">Séances passées non émargées · ${nonEm.length}</h2><div class="sub">Du ${fdl(S.rvFrom)} à aujourd'hui, ${G.length} professeur(s).</div></div>
      ${G.length?`<div class="row" style="gap:8px"><button class="btn" id="rvDeleg">Émarger pour un professeur</button><button class="btn primary" id="rvRelAll">${G.length>1?`Relancer les ${G.length} professeurs`:"Relancer le professeur"}</button></div>`:""}</div>
      ${G.length?`<div class="hlist" style="margin-top:6px">${G.map(([tid,L])=>`<div class="hrow"><div><b>${esc(tname(tid))}</b> <span class="pill p-warn">${L.length}</span><div class="sub">${L.slice(0,6).map(x=>fdate(x.session_date)+" "+hm(x.start_time)+" "+esc(x.teaching_assignments?.courses?.code||"")).join(" · ")}${L.length>6?" …":""}</div></div>
        <div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm" data-dg="${tid}">Émarger pour lui</button><button class="btn sm primary" data-rl="${tid}">Relancer</button></div></div>`).join("")}</div>`:`<p class="sub" style="margin:8px 0 0">✓ Toutes les séances passées de la période sont émargées.</p>`}</section>`;
    S._rvMsg={G,msgOf}}
  if(S.rvTab==="hist"){const H=hist.filter(a=>okA(a)&&(S.filter==="tous"||a.status===S.filter));
    body=`<div class="chips" style="margin-bottom:12px">${[["valide","Validés"],["rejete","Rejetés"],["tous","Tous"]].map(([k,l])=>`<button data-f="${k}" aria-pressed="${S.filter===k}">${l}</button>`).join("")}</div>
      ${H.length?searchBox("rSearch","Rechercher un professeur, un cours ou un groupe…"):""}<div class="panel tbl" id="rList"></div>`;
    S._rvHist=H}
  v.innerHTML=`<h1>Contrôle des émargements</h1>
    <p class="lead">Vérifiez les déclarations des professeurs de vos départements. Seules les heures validées comptent pour la paie. Vous ne pouvez pas valider vos propres heures ni celles que vous avez saisies vous-même.</p>
    <div class="seg ttseg" role="tablist" aria-label="Contrôle" style="margin-bottom:14px">${TABS.map(([k,l,n])=>`<button role="tab" data-rt="${k}" aria-pressed="${S.rvTab===k}">${l}${n!==""?" · "+n:""}</button>`).join("")}</div>
    ${filt}<div id="rvBody">${S.rvTab==="paie"?'<p class="empty">Chargement…</p>':body}</div>`;
  v.querySelectorAll("[data-rt]").forEach(b=>b.onclick=()=>{S.rvTab=b.dataset.rt;rerender()});
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onchange=f};
  on("rvF",()=>{S.rvFrom=rvF.value||S.rvFrom;rerender()});on("rvTo",()=>{S.rvTo=rvTo.value||S.rvTo;rerender()});
  on("rvD",()=>{S.rvDep=rvD.value;rerender()});on("rvT",()=>{S.rvT=rvT.value;rerender()});on("rvG",()=>{S.rvGroup=rvG.checked;rerender()});
  const find=id=>all.find(a=>a.id==id);
  v.querySelectorAll("[data-rv]").forEach(b=>b.onclick=()=>reviewDialog(find(b.dataset.rv),flags(find(b.dataset.rv))));
  const ra=document.getElementById("rvAll");
  if(ra)ra.onclick=()=>openDialog(`<h3>Valider ${conf.length>1?conf.length+" émargements conformes":"l'émargement conforme"} ?</h3>
      <p style="margin:0">Chacun est validé pour la durée prévue (${hrs(conf.reduce((t,a)=>t+a.planned_minutes,0))} au total). Les émargements à examiner ne sont pas touchés.</p>
      <div class="rl">${conf.slice(0,40).map(a=>`<div class="rlrow"><b>${esc(a.teachers.last_name)} · ${fdate(a.schedule_sessions.session_date)} ${hm(a.schedule_sessions.start_time)}</b><span class="sub">${esc(a.schedule_sessions.teaching_assignments?.courses?.code||"")} · ${hrs(a.planned_minutes)}</span></div>`).join("")}${conf.length>40?`<p class="sub">… et ${conf.length-40} autre(s).</p>`:""}</div>
      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Valider</button></div>`,
    async()=>{let ok=0;const errs=[];for(const a of conf){try{await q(sb.rpc("review_attendance",{p_id:a.id,p_decision:"valide",p_retained_minutes:a.planned_minutes,p_reason:null}));ok++}catch(e){errs.push(errMsg(e))}}
      toast(`${ok} émargement(s) validé(s)`+(errs.length?` · ${errs.length} refusé(s) : ${errs[0]}`:""),errs.length>0);rerender()});
  if(S.rvTab==="non"){const {G,msgOf}=S._rvMsg;const tOf=tid=>({id:Number(tid),...(tMap.get(Number(tid))||{})});
    const L=tid=>G.find(([k])=>k==tid)[1];
    v.querySelectorAll("[data-rl]").forEach(b=>b.onclick=()=>{const t=tOf(b.dataset.rl);notifyDialog({title:"Relancer "+t.first_name+" "+t.last_name,intro:"Rappel des séances à émarger.",items:[{t,msg:msgOf(t,L(b.dataset.rl))}]})});
    v.querySelectorAll("[data-dg]").forEach(b=>b.onclick=()=>delegDialog(Number(b.dataset.dg)));
    const r2=document.getElementById("rvRelAll");if(r2)r2.onclick=()=>notifyDialog({title:"Relancer les professeurs",intro:"Chaque professeur reçoit la liste de ses séances à émarger.",items:G.map(([tid,L])=>{const t=tOf(tid);return{t,msg:msgOf(t,L)}})});
    const d2=document.getElementById("rvDeleg");if(d2)d2.onclick=()=>delegDialog()}
  if(S.rvTab==="hist"){const H=S._rvHist;let shown=H;
    const SL={soumis:"En attente",valide:"Validé",rejete:"Rejeté",correction_demandee:"Correction demandée"};
    const draw=()=>{rList.innerHTML=shown.length?`<table><thead><tr><th>Séance</th><th>Professeur</th><th>Prévu</th><th>Déclaré</th><th>État</th></tr></thead><tbody>${shown.map(a=>{const s=a.schedule_sessions;return `<tr><td>${fdate(s.session_date)}<div class="sub">${sessionLabel(s)} · ${esc(s.student_groups?.code||"")}</div></td><td>${esc(a.teachers.first_name+" "+a.teachers.last_name)}${a.entered_for_teacher?'<div class="sub">Saisi par délégation</div>':""}</td><td class="mono">${hm(s.start_time)}–${hm(s.end_time)}</td><td class="mono">${hm(a.declared_start)}–${hm(a.declared_end)}</td><td>${pill(a.status)}${a.retained_minutes!=null?`<div class="sub">retenu ${hrs(a.retained_minutes)}</div>`:""}${a.review_reason?`<div class="sub">${esc(a.review_reason)}</div>`:""}</td></tr>`}).join("")}</tbody></table>`:`<p class="empty">Aucun émargement avec ces filtres.</p>`};
    draw();v.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;rerender()});
    const rs=document.getElementById("rSearch");if(rs)rs.oninput=()=>{const k=norm(rs.value.trim());shown=!k?H:H.filter(a=>norm([a.teachers.first_name,a.teachers.last_name,a.schedule_sessions.teaching_assignments?.courses?.code,a.schedule_sessions.teaching_assignments?.courses?.name,a.schedule_sessions.student_groups?.code].join(" ")).includes(k));draw()};
    const xb=document.createElement("div");xb.className="row";xb.style.margin="10px 0 0";xb.innerHTML=xbar("rX");rList.after(xb);
    wireExport("rX",()=>({file:"emargements_"+S.rvFrom+"_"+S.rvTo,title:"Émargements contrôlés",subtitle:`Du ${fdl(S.rvFrom)} au ${fdl(S.rvTo)}`,landscape:true,sheets:[{name:"Émargements",title:"Émargements",keepEmpty:1,head:["Date","Enseignant","Cours","Groupe","Prévu","Déclaré","Écart (min)","État","Heures retenues","Délégation","Commentaire","Motif"],
      rows:shown.map(a=>{const s=a.schedule_sessions,c=s.teaching_assignments?.courses;return [fdl(s.session_date),a.teachers.last_name+" "+a.teachers.first_name,c?c.code+" "+c.name:"",s.student_groups?.code||"",hm(s.start_time)+"-"+hm(s.end_time),hm(a.declared_start)+"-"+hm(a.declared_end),a.declared_minutes-a.planned_minutes,SL[a.status]||a.status,a.retained_minutes!=null?dh(a.retained_minutes):"",a.entered_for_teacher?"Oui":"",a.teacher_comment||"",a.review_reason||""]})}]}))}
  if(S.rvTab==="paie")payReadyPane(document.getElementById("rvBody"),okS);
}
/* un mois est prêt pour la paie quand il ne reste ni émargement en attente, ni correction, ni séance passée non émargée */
async function payReadyPane(el,okS){
  const now=new Date();if(!S.rvM)S.rvM=new Date(now.getFullYear(),now.getMonth(),1);
  const M=S.rvM,f=iso(M),t=iso(new Date(M.getFullYear(),M.getMonth()+1,0)),ended=new Date(t+"T23:59:59")<now;
  const ss=(await q(sb.from("schedule_sessions").select("id,session_date,start_time,end_time,status,teacher_id,teaching_assignments(courses(code,department_id,departments(code))),attendance_records(status,retained_minutes,declared_minutes)").gte("session_date",f).lte("session_date",t))).filter(okS);
  const live=ss.filter(x=>x.status!=="annulee"),past=live.filter(x=>sEnd(x)<=now),fut=live.filter(x=>sEnd(x)>now);
  const ar=x=>x.attendance_records,c=st=>past.filter(x=>ar(x)?.status===st);
  const val=c("valide"),sub=c("soumis"),cor=c("correction_demandee"),rej=c("rejete"),non=past.filter(x=>!ar(x));
  const ready=ended&&!sub.length&&!cor.length&&!non.length;
  const ml=M.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  const li=(k,n,txt,tab)=>`<li class="${n?k:"ok"}"><i>${n?(k==="bad"?"✕":"!"):"✓"}</i><span style="flex:1">${txt}</span>${n&&tab?`<button class="btn sm" data-go="${tab}">Voir</button>`:""}</li>`;
  el.innerHTML=`<div class="weeknav"><button class="wbtn" id="pmP" aria-label="Mois précédent"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="wmid"><small>Mois de</small><b>${ml.charAt(0).toUpperCase()+ml.slice(1)}</b></div>
      <button class="wbtn" id="pmN" aria-label="Mois suivant"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button><button class="wnow" id="pmT">Ce mois</button></div>
    <div class="panel hcard" style="border-color:${ready?"var(--ok)":"var(--line)"}">
      <h2 style="margin:0 0 4px;color:${ready?"var(--ok)":"inherit"}">${ready?"✓ Mois prêt pour la paie":ended?"Pas encore prêt pour la paie":"Mois en cours"}</h2>
      <p class="sub" style="margin:0 0 10px">${ready?"Tous les émargements du mois sont contrôlés. Le responsable financier peut calculer la paie.":ended?"Il reste des points à régler avant le calcul de la paie.":`Le mois n'est pas terminé : ${fut.length} séance(s) restent à venir.`}</p>
      <div class="stats mini"><div class="stat"><b>${past.length}</b><span>séances passées</span></div><div class="stat"><b style="color:var(--ok)">${val.length}</b><span>validées · ${hrs(val.reduce((s,x)=>s+(ar(x).retained_minutes||0),0))}</span></div><div class="stat"><b>${ss.length-live.length}</b><span>annulées</span></div></div>
      <ul class="chk">${li("warn",sub.length,`${sub.length} émargement(s) en attente de contrôle`,"ctrl")}${li("warn",cor.length,`${cor.length} correction(s) demandée(s), sans réponse du professeur`,"ctrl")}${li("bad",non.length,`${non.length} séance(s) passée(s) non émargée(s)`,"non")}
        ${rej.length?`<li class="info"><i>i</i><span>${rej.length} émargement(s) rejeté(s) : non payés.</span></li>`:""}</ul></div>`;
  pmP.onclick=()=>{S.rvM=new Date(M.getFullYear(),M.getMonth()-1,1);rerender()};pmN.onclick=()=>{S.rvM=new Date(M.getFullYear(),M.getMonth()+1,1);rerender()};pmT.onclick=()=>{S.rvM=null;rerender()};
  el.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{S.rvTab=b.dataset.go;if(b.dataset.go==="non"){S.rvFrom=f;S.rvTo=iso(new Date())}rerender()});
}

async function delegDialog(onlyT){
  const from=new Date();from.setDate(from.getDate()-45);
  let list=await q(sb.from("schedule_sessions").select("id,session_date,start_time,end_time,teacher_id,teachers(first_name,last_name),teaching_assignments(courses(code,name)),student_groups(code),attendance_records(id)").neq("status","annulee").gte("session_date",iso(from)).lte("session_date",iso(new Date())).order("session_date",{ascending:false}).limit(500));
  const now=new Date();
  list=list.filter(s=>!s.attendance_records&&new Date(s.session_date+"T"+s.start_time)<=now&&!(S.teacher&&s.teacher_id===S.teacher.id)&&(!onlyT||s.teacher_id===onlyT));
  if(!list.length){toast("Aucune séance en attente d'émargement sur les 45 derniers jours.");return}
  const byId=Object.fromEntries(list.map(s=>[s.id,s]));
  openDialog(`<h3>Émarger pour un professeur</h3>
    <label>Séance<select id="dS">${list.map(s=>`<option value="${s.id}">${fdate(s.session_date)} ${hm(s.start_time)} · ${esc(s.teachers?.last_name)} ${esc(s.teachers?.first_name)} · ${esc(s.teaching_assignments?.courses?.code)} · ${esc(s.student_groups?.code)}</option>`).join("")}</select></label>
    <div class="row"><label>Début réel<input id="dStart" type="time" required></label><label>Fin réelle<input id="dEnd" type="time" required></label></div>
    <label>Source de la saisie (ex. fiche de cours n°…)<textarea id="dCom" required></textarea></label>
    <p class="sub" style="margin:0">L'émargement est enregistré à votre nom, marqué « saisi par délégation », et devra être validé par un autre responsable.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Enregistrer</button></div>`,
  async()=>{
    const s=byId[dS.value];
    if(toMin(dEnd.value)-toMin(dStart.value)<=0)throw new Error("L'heure de fin doit être après l'heure de début.");
    if(!dCom.value.trim())throw new Error("Indiquez la source de la saisie.");
    await q(sb.rpc("submit_attendance_for",{p_session_id:s.id,p_start:dStart.value,p_end:dEnd.value,p_comment:dCom.value.trim()}));
    toast("Émargement enregistré, en attente de validation");rerender();
  });
  const fill=()=>{const s=byId[dS.value];dStart.value=hm(s.start_time);dEnd.value=hm(s.end_time)};
  dS.onchange=fill;fill();
}

function reviewDialog(a,fl){
  const s=a.schedule_sessions;const def=Math.min(a.declared_minutes,a.planned_minutes);
  openDialog(`<h3>Contrôler l'émargement</h3>
    ${fl&&fl.length?`<ul class="chk">${fl.map(x=>`<li class="warn"><i>!</i><span>${esc(x)}</span></li>`).join("")}</ul>`:""}
    <dl class="kv"><dt>Professeur</dt><dd>${esc(a.teachers.first_name+" "+a.teachers.last_name)}</dd>
      <dt>Cours</dt><dd>${sessionLabel(s)}</dd><dt>Date</dt><dd>${fdate(s.session_date)}</dd>
      <dt>Prévu</dt><dd class="mono">${hm(s.start_time)}–${hm(s.end_time)} (${hrs(a.planned_minutes)})</dd>
      <dt>Déclaré</dt><dd class="mono">${hm(a.declared_start)}–${hm(a.declared_end)} (${hrs(a.declared_minutes)})</dd>
      ${a.teacher_comment?`<dt>Commentaire</dt><dd>${esc(a.teacher_comment)}</dd>`:""}</dl>
    <label>Durée retenue (minutes)<input id="rMin" type="number" min="0" max="${a.declared_minutes}" step="5" value="${def}"></label>
    <label>Motif (obligatoire pour un rejet, une correction ou une durée retenue supérieure au prévu)<textarea id="rWhy"></textarea></label>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" value="cancel" formnovalidate>Fermer</button>
      <button class="btn danger" value="rejete">Rejeter</button>
      <button class="btn" value="correction_demandee">Demander une correction</button>
      <button class="btn primary" value="valide">Valider</button></div>`,
  async(decision)=>{
    await q(sb.rpc("review_attendance",{p_id:a.id,p_decision:decision,p_retained_minutes:decision==="valide"?Number(rMin.value):null,p_reason:rWhy.value.trim()||null}));
    toast({valide:"Émargement validé",rejete:"Émargement rejeté",correction_demandee:"Correction demandée au professeur"}[decision]);rerender();
  });
}

/* ---------- disponibilités (professeur) ---------- */
/* ---------- semaines ---------- */
const nextMonday=()=>addDays(mondayOf(new Date()),7);
const planDefaultWeek=()=>{const d=new Date().getDay();return d===6||d===0?nextMonday():mondayOf(new Date())};
function weekRange(w){const sc=S.sched||SCHED_DEFAULT;const last=addDays(w,Math.max(...sc.days)-1);
  const o={day:"numeric",month:"long"};const a=w.toLocaleDateString("fr-FR",w.getMonth()===last.getMonth()?{day:"numeric"}:o);
  return `${a} au ${last.toLocaleDateString("fr-FR",o)}`}
function weekNavHtml(w,extra){
  const cur=mondayOf(new Date()),nx=nextMonday();
  const tag=iso(w)===iso(cur)?"Cette semaine":iso(w)===iso(nx)?"Semaine prochaine":"";
  return `<div class="weeknav">
    <button class="wbtn" data-wk="-7" aria-label="Semaine précédente"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="wmid"><small>${tag?tag+" · ":""}Semaine du</small><b>${weekRange(w)}</b>${extra?`<div style="margin-top:4px">${extra}</div>`:""}</div>
    <button class="wbtn" data-wk="7" aria-label="Semaine suivante"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <button class="wnow" data-wk="0">${iso(w)===iso(cur)?"Semaine prochaine":"Cette semaine"}</button></div>`}
function wireWeekNav(root,get,setW){root.querySelectorAll("[data-wk]").forEach(b=>b.onclick=()=>{const k=Number(b.dataset.wk);
  if(k)setW(addDays(get(),k));else setW(iso(get())===iso(mondayOf(new Date()))?nextMonday():mondayOf(new Date()));rerender()})}
const dayDate=(w,d)=>addDays(w,d-1).toLocaleDateString("fr-FR",{day:"numeric"});

/* ---------- disponibilités par semaine (professeur pour lui-même, ou directeur pour un professeur) ---------- */
async function viewAvailability(v,opt={}){
  const asPlanner=!!opt.teacherId;
  if(!S.avWeek)S.avWeek=nextMonday();
  let W=asPlanner&&opt.week?opt.week:S.avWeek;
  /* mode fixe : une seule grille par semestre, rangée sur la première semaine du semestre */
  const facP=asPlanner?S.fac:profFac(),FIXED=facMode(facP)==="fixe";let semL=null;
  if(FIXED){const sw=await semesterWeek(facP,asPlanner?W:new Date());if(sw){W=sw.week;semL=sw.sem.label}}
  const wk=iso(W),prevWk=iso(addDays(W,-7));
  const sch=S.sched||SCHED_DEFAULT,tid=asPlanner?opt.teacherId:S.teacher.id,H0=Math.floor(hmin(sch.start)/60),H1=Math.ceil(hmin(sch.end)/60),N=H1-H0,D=sch.days;
  const lf=sch.lunchFrom?hmin(sch.lunchFrom):null,lt=sch.lunchTo?hmin(sch.lunchTo):null;
  const pause=Array.from({length:N},(_,i)=>lf!=null&&lt!=null&&Math.min(lt,(H0+i+1)*60)-Math.max(lf,(H0+i)*60)>=30);
  const [rows,resp,prev,prevResp,pub,tch]=await Promise.all([
    q(sb.from("teacher_availability").select("day_of_week,start_time,end_time").eq("teacher_id",tid).eq("week_start",wk)),
    q(sb.from("availability_weeks").select("declared_at,by_planner").eq("teacher_id",tid).eq("week_start",wk).maybeSingle()),
    q(sb.from("teacher_availability").select("day_of_week,start_time,end_time").eq("teacher_id",tid).eq("week_start",prevWk)),
    q(sb.from("availability_weeks").select("teacher_id").eq("teacher_id",tid).eq("week_start",prevWk).maybeSingle()),
    q(sb.from("published_weeks").select("published_at").eq("week_start",wk).eq("faculty_id",facP).maybeSingle()),
    asPlanner?q(sb.from("teachers").select("first_name,last_name").eq("id",tid).single()):Promise.resolve(null)]);
  const locked=!!pub&&!asPlanner;
  const T=t=>{const [h,m]=String(t).slice(0,5).split(":").map(Number);return h*60+m};
  const F=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
  let declared=!!resp;
  const on={};
  const load=rs=>{D.forEach(d=>{on[d]=Array(N).fill(false)});D.forEach(d=>rs.filter(r=>r.day_of_week===d).forEach(r=>{for(let h=H0;h<H1;h++){const ov=Math.min(T(r.end_time),(h+1)*60)-Math.max(T(r.start_time),h*60);if(ov>=30&&!pause[h-H0])on[d][h-H0]=true}}))};
  load(rows);
  let tm=0,saving=Promise.resolve();
  const count=()=>D.reduce((a,d)=>a+on[d].filter(Boolean).length,0);
  const free=arr=>arr.every((x,i)=>x||pause[i]);
  const ranges=d=>{const out=[];let st=null;on[d].forEach((x,i)=>{if(x&&st==null)st=i;if((!x||i===N-1)&&st!=null){const en=x&&i===N-1?i+1:i;out.push([(H0+st)*60,(H0+en)*60]);st=null}});return out};
  const stateEl=()=>document.getElementById("avState");
  const args=x=>asPlanner?{...x,p_teacher:tid}:x;
  const flush=async()=>{
    const all=D.flatMap(d=>ranges(d).map(([x,y])=>({day:d,start:F(x),end:F(y)})));
    try{await q(sb.rpc("save_week_availability",args({p_week:wk,p_ranges:all})));declared=true;if(stateEl())stateEl().textContent="Enregistré ✓";draw()}
    catch(e){toast(/Could not find the function|PGRST202/.test(e.message||"")?"La base n'est pas à jour : le script « semaines_dispos.sql » doit être exécuté dans Supabase.":errMsg(e),true);rerender()}
  };
  const queue=()=>{if(stateEl())stateEl().textContent="Enregistrement…";clearTimeout(tm);tm=setTimeout(()=>{saving=saving.then(flush)},450)};
  const set=(d,h,val)=>{if(locked||pause[h]||on[d][h]===val)return;on[d][h]=val;queue()};
  const who=asPlanner?esc(tch.first_name+" "+tch.last_name):"Vous";
  const draw=()=>{
    const g=document.getElementById("avGrid"),n=count();
    g.innerHTML=`<div class="avg-c0"></div>${D.map(d=>`<button type="button" class="avg-h" data-day="${d}" ${locked?"disabled":""} aria-label="${DAYS[d]} : tout changer"><span class="full">${DAYS[d]}${FIXED?"":" "+dayDate(W,d)}</span><span class="abbr">${DAYS[d].slice(0,3)}.${FIXED?"":" "+dayDate(W,d)}</span></button>`).join("")}
      ${Array.from({length:N},(_,i)=>`<button type="button" class="avg-r" data-row="${i}" ${locked?"disabled":""} aria-label="${F((H0+i)*60)} : tout changer">${F((H0+i)*60)}</button>${D.map(d=>`<button type="button" class="avg-c ${pause[i]?"pause":on[d][i]?"on":"off"}" data-d="${d}" data-h="${i}" ${pause[i]||locked?"disabled":""} aria-pressed="${on[d][i]}" aria-label="${DAYS[d]} ${F((H0+i)*60)}–${F((H0+i+1)*60)}, ${pause[i]?"pause":on[d][i]?"disponible":"indisponible"}"></button>`).join("")}`).join("")}`;
    document.getElementById("avTotal").textContent=hrs(n*60);
    const nb=document.getElementById("avNote");nb.hidden=false;
    if(locked){nb.className="panel avnote";nb.innerHTML=`<b>L'emploi du temps ${FIXED?"du semestre":"de cette semaine"} est publié.</b> Vos disponibilités ne sont plus modifiables ici. Pour un changement, contactez le directeur des études.`}
    else if(!declared){nb.className="panel avnote";nb.innerHTML=`<b>${asPlanner?"Ce professeur n'a pas encore répondu pour cette semaine.":"Vous n'avez pas encore répondu pour cette semaine."}</b> Touchez les créneaux ${asPlanner?"où il est":"où vous êtes"} disponible, ou utilisez les boutons ci-dessous.`}
    else if(n===0){nb.className="panel avnote off";nb.innerHTML=`<b>${asPlanner?"Indiqué indisponible":"Vous avez indiqué être indisponible"} toute la semaine.</b> Aucun cours ne sera placé${asPlanner?" pour lui":" pour vous"} cette semaine.`}
    else nb.hidden=true;
    ["avAllOn","avAll","avCopy","avReset"].forEach(i=>{const b=document.getElementById(i);if(b)b.disabled=locked});
    if(!locked){document.getElementById("avAll").disabled=declared&&n===0;document.getElementById("avReset").disabled=!declared;const cp=document.getElementById("avCopy");if(cp)cp.disabled=!prevResp}
  };
  v.innerHTML=`${asPlanner?`<button class="btn sm" id="avBack" style="margin-bottom:10px">← Retour à l'emploi du temps</button>`:""}
    <h1>${asPlanner?"Disponibilités de "+who:"Mes disponibilités"}</h1>
    <p class="lead">${asPlanner?"Saisie par le directeur des études (par exemple pour des disponibilités données par téléphone).":FIXED?"Votre faculté a un emploi du temps fixe : indiquez une fois, pour tout le semestre, les créneaux où vous êtes disponible chaque semaine. Touchez un créneau, un jour (en haut) ou une heure (à gauche).":"Indiquez chaque semaine quand vous êtes disponible, avant la publication de l'emploi du temps. Touchez un créneau, un jour (en haut) ou une heure (à gauche)."}</p>
    ${FIXED?`<div class="panel" style="padding:10px 14px;margin-bottom:12px"><b>Disponibilités pour le semestre${semL?" "+esc(semL):""}</b> · valables chaque semaine${pub?' · <span class="pill p-ok">emploi du temps publié</span>':(!asPlanner?(declared?' · <span class="pill p-info">Réponse envoyée</span>':' · <span class="pill p-warn">Pas encore de réponse</span>'):"")}</div>`:asPlanner?"":weekNavHtml(W,pub?'<span class="pill p-ok">Emploi du temps publié</span>':(declared?'<span class="pill p-info">Réponse envoyée</span>':'<span class="pill p-warn">Pas encore de réponse</span>'))}
    ${asPlanner&&!FIXED?`<div class="panel" style="padding:10px 14px;margin-bottom:12px"><b>Semaine du ${weekRange(W)}</b>${pub?' · <span class="pill p-ok">publiée</span>':""}</div>`:""}
    <div class="panel avnote" id="avNote" hidden></div>
    <div class="avbar"><div class="stat"><b id="avTotal">—</b><span>disponible ${FIXED?"chaque semaine":"cette semaine"}</span></div><span class="sub" id="avState" aria-live="polite"></span>
      <div class="avbtns">${FIXED?"":`<button class="btn sm" id="avCopy" title="Reprendre la grille de la semaine précédente">Copier la semaine précédente</button>`}<button class="btn sm" id="avAllOn">Disponible toute la semaine</button><button class="btn sm" id="avAll">Indisponible toute la semaine</button><button class="btn sm" id="avReset">Effacer la réponse</button></div></div>
    <div class="avg-wrap"><div class="avg" id="avGrid" style="--n:${D.length}"></div></div>
    <div class="tt-leg"><span><i class="avl on"></i>Disponible</span><span><i class="avl off"></i>Indisponible</span><span class="sub">${asPlanner?"":"Vos disponibilités sont visibles par le directeur des études et la secrétaire."}</span></div>`;
  if(!asPlanner&&!FIXED)wireWeekNav(v,()=>S.avWeek,w=>{S.avWeek=w});
  if(asPlanner)avBack.onclick=()=>{S.avFor=null;rerender()};
  draw();
  const grid=document.getElementById("avGrid");
  let paint=null,swallow=false;
  const cellOf=e=>e.target.closest("[data-d]");
  grid.addEventListener("pointerdown",e=>{const c=cellOf(e);if(!c||e.pointerType!=="mouse"||locked)return;
    const d=Number(c.dataset.d),h=Number(c.dataset.h);paint=!on[d][h];swallow=true;set(d,h,paint);draw()});
  grid.addEventListener("pointerover",e=>{if(paint==null||e.buttons!==1)return;const c=cellOf(e);if(!c)return;
    const d=Number(c.dataset.d),h=Number(c.dataset.h);if(on[d][h]!==paint){set(d,h,paint);draw()}});
  window.addEventListener("pointerup",()=>{paint=null});
  grid.addEventListener("click",e=>{if(locked)return;
    if(swallow){swallow=false;if(cellOf(e))return}
    const c=cellOf(e);
    if(c){const d=Number(c.dataset.d),h=Number(c.dataset.h);set(d,h,!on[d][h]);draw();return}
    const hd=e.target.closest("[data-day]");
    if(hd){const d=Number(hd.dataset.day),val=!free(on[d]);on[d].forEach((_,i)=>set(d,i,val));draw();return}
    const rw=e.target.closest("[data-row]");
    if(rw){const i=Number(rw.dataset.row);if(pause[i])return;const val=!D.every(d=>on[d][i]);D.forEach(d=>set(d,i,val));draw()}});
  const now=async()=>{clearTimeout(tm);await (saving=saving.then(flush))};
  if(!FIXED)avCopy.onclick=async()=>{load(prev);draw();await now();toast("Grille de la semaine précédente reprise")};
  avAllOn.onclick=async()=>{D.forEach(d=>on[d]=on[d].map((_,i)=>!pause[i]));draw();await now()};
  avAll.onclick=()=>openDialog(`<h3>Indisponible toute la semaine ?</h3><p style="margin:0">Aucun cours ne sera placé ${asPlanner?"pour ce professeur":"pour vous"} la semaine du ${weekRange(W)}.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn danger" value="ok">Confirmer</button></div>`,
    async()=>{D.forEach(d=>on[d].fill(false));draw();await now()});
  avReset.onclick=()=>openDialog(`<h3>Effacer la réponse de cette semaine ?</h3><p style="margin:0">La semaine repassera en « pas encore de réponse ». ${asPlanner?"":"Le directeur des études décidera alors pour vous."}</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Effacer</button></div>`,
    async()=>{await q(sb.rpc("clear_week_availability",args({p_week:wk})));toast("Réponse effacée");rerender()});
}

/* ---------- emplois du temps ---------- */
async function viewPlanning(v){
  if(S.avFor){await viewAvailability(v,{teacherId:S.avFor,week:S.ttWeek});return}
  if(!S.ttWeek)S.ttWeek=planDefaultWeek();
  if(!S.ttTab)S.ttTab="grille";
  const W=S.ttWeek,wk=iso(W),wEnd=iso(addDays(W,6)),prevWk=iso(addDays(W,-7));
  const sc=S.sched||SCHED_DEFAULT;
  const SLOTSEL="id,week_start,assignment_id,day_of_week,start_time,end_time,published,room_id,rooms(code),teaching_assignments(teacher_id,group_id,assignment_groups(group_id,student_groups(code)),courses(code,name),teachers(first_name,last_name),student_groups!teaching_assignments_group_id_fkey(code))";
  /* mode fixe : les disponibilités de référence sont celles de la première semaine du semestre */
  const FIXED=facMode(S.fac)==="fixe";let avWk=wk;
  if(FIXED){const sw=await semesterWeek(S.fac,W);if(sw&&sw.sem.start_date<=wEnd)avWk=iso(sw.week)}
  const [slots,allSlots,cancelled,sessW,conf,groups,teachers,rooms,assignsAll,sems,avails,answers,pub]=await Promise.all([
    q(sb.from("timetable_slots").select(SLOTSEL).eq("week_start",wk).order("start_time")),
    q(sb.from("timetable_slots").select("assignment_id,start_time,end_time,week_start")),
    q(sb.from("schedule_sessions").select("assignment_id,start_time,end_time").in("status",["annulee","reportee"])),
    q(sb.from("schedule_sessions").select("id,slot_id,status,note,session_date,start_time,attendance_records(id,status)").gte("session_date",wk).lte("session_date",wEnd)),
    q(sb.from("slot_conflicts").select("*").eq("week_start",wk)),
    q(sb.from("student_groups").select("id,code,name,size,home_room_id,programs(code,department_id,departments(code,name))").order("code")),
    q(sb.from("teachers").select("id,first_name,last_name,active,phone").order("last_name")),
    q(sb.from("rooms").select("id,code,name,capacity,room_type").order("code")),
    q(sb.from("teaching_assignments").select("id,semester_id,teacher_id,course_id,group_id,planned_hours,assignment_groups(group_id,student_groups(code)),semesters(label,start_date,end_date),courses(code,name,room_type),teachers(first_name,last_name),student_groups!teaching_assignments_group_id_fkey(code)").order("id")),
    q(sb.from("semesters").select("id,label,start_date,end_date,faculty_id,academic_years(label)").order("start_date")),
    q(sb.from("teacher_availability").select("teacher_id,day_of_week,start_time,end_time").eq("week_start",avWk)),
    q(sb.from("availability_weeks").select("teacher_id,by_planner").eq("week_start",avWk)),
    q(sb.from("published_weeks").select("published_at").eq("week_start",wk).eq("faculty_id",S.fac).maybeSingle())]);
  const mins=x=>toMin(x.end_time)-toMin(x.start_time);
  slots.forEach(x=>decorateTA(x.teaching_assignments));assignsAll.forEach(decorateTA);
  const F=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
  const sessOf={};sessW.forEach(s=>{if(s.slot_id)sessOf[s.slot_id]=s});
  let absP=[];try{absP=await q(sb.from("absence_requests").select("session_id,reason,proposal").eq("status","en_attente"))}catch(e){}
  const absOf=sl=>{const s=sessOf[sl.id];return s?absP.find(r=>r.session_id===s.id):null};
  const isCancel=sl=>sessOf[sl.id]?.status==="annulee";
  const cancelIds=new Set(slots.filter(isCancel).map(s=>s.id));
  const live=slots.filter(s=>!isCancel(s));
  const semIds=new Set(sems.filter(x=>x.start_date<=wEnd&&x.end_date>=wk&&(!x.faculty_id||x.faculty_id===S.fac)).map(x=>x.id));
  const assigns=assignsAll.filter(a=>semIds.has(a.semester_id));
  const done={};allSlots.forEach(x=>{done[x.assignment_id]=(done[x.assignment_id]||0)+mins(x)});
  cancelled.forEach(x=>{done[x.assignment_id]=(done[x.assignment_id]||0)-mins(x)});
  const remaining={};assignsAll.forEach(a=>{remaining[a.id]=a.planned_hours*60-(done[a.id]||0)});
  const declared=new Set(answers.map(a=>a.teacher_id));
  const lists={group:groups.map(g=>[g.id,g.code]),teacher:teachers.map(t=>[t.id,t.first_name+" "+t.last_name]),room:rooms.map(r=>[r.id,r.code])};
  if(!S.planId||!lists[S.planView].some(x=>x[0]==S.planId))S.planId=lists[S.planView][0]?.[0];
  const KEY={group:s=>s.teaching_assignments.group_id,teacher:s=>s.teaching_assignments.teacher_id,room:s=>s.room_id};
  const MATCH=(by,s,id)=>by==="group"?s.teaching_assignments._g.includes(Number(id)):KEY[by](s)==id;
  const mine=slots.filter(s=>MATCH(S.planView,s,S.planId));
  const confIds=new Set(conf.flatMap(c=>[c.slot_a,c.slot_b]));
  const drafts=slots.filter(s=>!s.published).length;
  const avOf=tid=>avails.filter(a=>a.teacher_id===tid);
  const outside=s=>{const tid=s.teaching_assignments.teacher_id;if(!declared.has(tid)||isCancel(s))return false;
    return !avOf(tid).some(a=>a.day_of_week===s.day_of_week&&a.start_time<=s.start_time&&a.end_time>=s.end_time)};
  const outCount=slots.filter(outside).length;
  const weekMin=live.reduce((a,x)=>a+mins(x),0);
  const num=n=>Number(Number(n).toFixed(2));
  const tIds=[...new Set(assigns.filter(a=>remaining[a.id]>0).map(a=>a.teacher_id))];
  const tList=teachers.filter(t=>tIds.includes(t.id));
  const answered=tList.filter(t=>declared.has(t.id)).length;
  const finished=assigns.filter(a=>remaining[a.id]<=0).length;
  const pubDate=pub?new Date(pub.published_at).toLocaleDateString("fr-FR",{day:"numeric",month:"long"}):"";
  const dayLong=d=>{const s=addDays(W,d-1).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});return s.charAt(0).toUpperCase()+s.slice(1)};
  const today=iso(new Date());
  const risks=assigns.map(a=>({a,r:semesterRisk(a,Math.max(0,done[a.id]||0),today)})).filter(x=>x.r&&x.r.risk).sort((x,y)=>(y.r.missing??y.r.need)-(x.r.missing??x.r.need));
  const noAnsT=tList.filter(t=>!declared.has(t.id));
  const TABS=[["grille","Grille"],["ensemble","Vue d'ensemble"],["dispos",`Disponibilités · ${answered}/${tList.length}`],["salles","Salles"],["avancement",`Avancement${risks.length?" · "+risks.length+" en retard":""}`]];

  /* ----- contenu des onglets ----- */
  const tStatus=t=>{if(!declared.has(t.id))return '<span class="pill p-warn">Pas de réponse</span>';const m=avOf(t.id).reduce((a,x)=>a+mins(x),0);
    const by=answers.find(a=>a.teacher_id===t.id)?.by_planner;return (m?`<span class="pill p-ok">Disponible ${hrs(m)}</span>`:'<span class="pill p-mute">Indisponible</span>')+(by?' <span class="sub">saisi par le directeur</span>':"")};
  const tWeek=t=>{const m=live.filter(x=>x.teaching_assignments.teacher_id===t.id).reduce((a,x)=>a+mins(x),0);return m?hrs(m):"—"};
  const paneGrille=()=>`<div class="row" style="margin-bottom:12px">
      <label>Afficher par<select id="pView"><option value="group">Groupe</option><option value="teacher">Professeur</option><option value="room">Salle</option></select></label>
      <label>&nbsp;<select id="pId">${lists[S.planView].map(([id,l])=>`<option value="${id}" ${id==S.planId?"selected":""}>${esc(l)}</option>`).join("")}</select></label></div>
    ${S.planView==="teacher"&&!declared.has(Number(S.planId))?`<div class="gpwarn" style="margin-bottom:10px">Ce professeur n'a pas donné ses disponibilités pour cette semaine.</div>`:""}
    ${S.planView==="teacher"&&declared.has(Number(S.planId))&&!avOf(Number(S.planId)).length?`<div class="gpwarn" style="margin-bottom:10px">Ce professeur est <b>indisponible toute la semaine</b>.</div>`:""}
    ${timetableGrid({mine,conf:confIds,cancelled:cancelIds,view:S.planView,avOf,outside,teacherId:S.planId,week:W})}
    ${conf.length?`<h2>Conflits</h2><div class="panel tbl"><table><thead><tr><th>Jour</th><th>Type</th><th>Créneaux</th></tr></thead><tbody>${conf.map(c=>{const a=slots.find(s=>s.id===c.slot_a),b=slots.find(s=>s.id===c.slot_b);return `<tr><td>${DAYS[c.day_of_week]}</td><td><span class="pill p-bad">${esc(c.conflict_type)}</span></td><td>${esc(a?.teaching_assignments.courses.code)} ${hm(a?.start_time)} / ${esc(b?.teaching_assignments.courses.code)} ${hm(b?.start_time)}</td></tr>`}).join("")}</tbody></table></div>`:""}`;
  const deps=[...new Map(groups.filter(g=>g.programs?.departments).map(g=>[g.programs.department_id,g.programs.departments])).entries()];
  if(S.ovDep==null||(S.ovDep!=="all"&&!deps.some(([id])=>id==S.ovDep)))S.ovDep=deps[0]?.[0]??"all";
  const paneEnsemble=()=>{const gs=groups.filter(g=>S.ovDep==="all"||g.programs?.department_id==S.ovDep);
    const cell=(g,d)=>live.concat(slots.filter(isCancel)).filter(s=>s.teaching_assignments._g.includes(g.id)&&s.day_of_week===d).sort((a,b)=>a.start_time.localeCompare(b.start_time))
      .map(s=>`<button type="button" class="ovc ${isCancel(s)?"cancel":""} ${s.published?"":"draft"} ${confIds.has(s.id)?"conf":""}" data-sl="${s.id}" style="--c:${ttColor(s.teaching_assignments.courses.code)}"><span class="mono">${hm(s.start_time)}–${hm(s.end_time)}</span><b>${esc(s.teaching_assignments.courses.code)}</b><span>${esc(s.teaching_assignments.teachers.last_name)} · ${esc(s.rooms.code)}</span></button>`).join("")||'<span class="ovn">—</span>';
    return `<div class="row" style="margin-bottom:12px"><label>Département<select id="ovDep"><option value="all">Tous</option>${deps.map(([id,d])=>`<option value="${id}" ${id==S.ovDep?"selected":""}>${esc(d.name)}</option>`).join("")}</select></label></div>
    <div class="panel ovwrap"><table class="ov"><thead><tr><th>Groupe</th>${sc.days.map(d=>`<th>${DAYS[d]} <small>${dayDate(W,d)}</small></th>`).join("")}</tr></thead><tbody>
    ${gs.map(g=>{const m=live.filter(s=>s.teaching_assignments._g.includes(g.id)).reduce((a,x)=>a+mins(x),0);
      return `<tr><th><b>${esc(g.code)}</b><div class="sub">${m?hrs(m):"aucun cours"}</div></th>${sc.days.map(d=>`<td>${cell(g,d)}</td>`).join("")}</tr>`}).join("")||`<tr><td colspan="${sc.days.length+1}"><p class="empty">Aucun groupe.</p></td></tr>`}</tbody></table></div>
    <p class="sub">Touchez un cours pour le modifier, l'annuler ou le reporter. Cours barrés : annulés.</p>`};
  const paneDispos=()=>`${noAnsT.length?`<div class="row" style="margin-bottom:10px"><button class="btn primary" id="relBtn">Relancer les ${noAnsT.length} professeur(s) sans réponse</button></div>`:""}<div class="panel tbl">${tList.length?`<table><thead><tr><th>Professeur</th><th>Réponse pour la semaine</th><th>Placé</th><th></th></tr></thead><tbody>
      ${tList.map(t=>`<tr><td>${esc(t.first_name+" "+t.last_name)}</td><td>${tStatus(t)}</td><td class="num">${tWeek(t)}</td>
        <td style="white-space:nowrap"><button class="btn sm" data-avf="${t.id}">${declared.has(t.id)?"Voir / modifier":"Saisir"}</button>${declared.has(t.id)?"":` <button class="btn sm" data-avall="${t.id}">Disponible toute la semaine</button>`}</td></tr>`).join("")}</tbody></table>`:'<p class="empty">Aucun professeur n\'a de matière en cours.</p>'}</div>
      <p class="sub">Un professeur sans réponse n'est pas placé par le générateur. Si ses disponibilités vous ont été données en dehors de la plateforme, saisissez-les ici.</p>`;
  const paneAvancement=()=>`${risks.length?`<h2 style="margin-top:0">Risque de fin de semestre · ${risks.length}</h2>
      <p class="sub" style="margin:-4px 0 10px">Au rythme suivi jusqu'ici, ces matières n'atteindraient pas leur volume avant la fin du semestre.</p>
      <div class="panel tbl" style="margin-bottom:16px"><table><thead><tr><th>Matière</th><th>Groupe</th><th>Professeur</th><th>Reste</th><th>Projection</th><th>Rythme nécessaire</th></tr></thead><tbody>
      ${risks.map(({a,r})=>`<tr><td>${esc(a.courses.code)}<div class="sub">${esc(a.courses.name)}</div></td><td>${esc(a.student_groups.code)}</td><td>${esc(a.teachers.first_name+" "+a.teachers.last_name)}</td>
        <td class="num">${hrs(r.need)}</td><td>${r.missing!=null?`<span class="pill p-warn">il manquerait ~${hrs(Math.round(r.missing/30)*30)}</span>`:'<span class="pill p-mute">pas encore commencée</span>'}</td>
        <td class="num">${r.left>0.5?hrs(Math.round(r.pace/30)*30)+" / semaine · "+Math.round(r.left)+" sem. restantes":"semestre terminé"}</td></tr>`).join("")}</tbody></table></div>`:""}
    <h2 ${risks.length?"":'style="margin-top:0"'}>Toutes les matières</h2>
    ${assigns.length>8?searchBox("asgSearch","Rechercher une matière, un groupe, un professeur…"):""}
    <div class="panel tbl">${assigns.length?`<table id="asgTable"><thead><tr><th>Matière</th><th>Groupe</th><th>Professeur</th><th>Programmé / prévu</th><th>Cette semaine</th><th>État</th></tr></thead><tbody>
    ${assigns.map(a=>{const d=Math.max(0,done[a.id]||0),p=a.planned_hours*60,w=live.filter(x=>x.assignment_id===a.id).reduce((s,x)=>s+mins(x),0);
      const st=d>=p?'<span class="pill p-ok">Terminée</span>':d>0?'<span class="pill p-info">En cours</span>':'<span class="pill p-mute">Pas commencée</span>';
      return `<tr><td>${esc(a.courses.code)}<div class="sub">${esc(a.courses.name)}</div></td><td>${esc(a.student_groups.code)}</td><td>${esc(a.teachers.first_name+" "+a.teachers.last_name)}</td>
      <td class="num">${hrs(d)} / ${num(a.planned_hours)} h<div class="pbar"><i style="width:${Math.min(100,Math.round(d/p*100))}%"></i></div></td><td class="num">${w?hrs(w):"—"}</td><td>${st}</td></tr>`}).join("")}</tbody></table>`:`<p class="empty">Aucune affectation pour le semestre de cette semaine.</p>`}</div>
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn sm" id="goAsg">Gérer les affectations →</button></div>`;
  const paneSalles=()=>{const stds=dayStarts(toMin(sc.start),toMin(sc.end),sc.len,sc.lunchFrom?toMin(sc.lunchFrom):null,sc.lunchTo?toMin(sc.lunchTo):null);
    const cap=stds.length*sc.len;
    const occ=(r,d)=>live.filter(s=>s.room_id===r.id&&s.day_of_week===d);
    const freeOf=(r,d)=>stds.filter(t=>!occ(r,d).some(s=>toMin(s.start_time)<t+sc.len&&t<toMin(s.end_time))).map(t=>F(t));
    const rows=rooms.map(r=>{const tot=sc.days.reduce((a,d)=>a+occ(r,d).reduce((x,s)=>x+mins(s),0),0);return{r,tot,pct:Math.round(tot/(cap*sc.days.length||1)*100)}});
    return `<p class="sub" style="margin:0 0 10px">Occupation de chaque salle sur la semaine (cours non annulés) et créneaux encore libres, utiles pour placer un rattrapage.</p>
    <div class="panel ovwrap"><table class="ov"><thead><tr><th>Salle</th>${sc.days.map(d=>`<th>${DAYS[d]} <small>${dayDate(W,d)}</small></th>`).join("")}</tr></thead><tbody>
    ${rows.map(({r,pct})=>`<tr><th><b>${esc(r.code)}</b><div class="sub">${r.capacity} places · ${pct} %</div><div class="pbar"><i style="width:${Math.min(100,pct)}%"></i></div></th>${sc.days.map(d=>{const m=occ(r,d).reduce((x,s)=>x+mins(s),0),p=Math.round(m/(cap||1)*100),fr=freeOf(r,d);
      return `<td><div class="sub" style="margin-bottom:4px">${p} % occupée</div>${fr.length?fr.map(t=>`<span class="pill p-ok" style="margin:0 4px 4px 0">${t}</span>`).join(""):'<span class="pill p-mute">complète</span>'}</td>`}).join("")}</tr>`).join("")||`<tr><td><p class="empty">Aucune salle.</p></td></tr>`}</tbody></table></div>
    <p class="sub">Les créneaux en vert sont libres dans cette salle. Pour placer un cours, utilisez « Ajouter un cours » ou le glisser-déposer dans la grille.</p>`};
  const PANES={grille:paneGrille,ensemble:paneEnsemble,dispos:paneDispos,salles:paneSalles,avancement:paneAvancement};

  v.innerHTML=`<h1>Emplois du temps</h1>
    ${weekNavHtml(W,pub?`<span class="pill p-ok">Publiée le ${pubDate}</span>`:(slots.length?'<span class="pill p-warn">Brouillon, non publiée</span>':'<span class="pill p-mute">Vide</span>'))}
    <div class="stats mini"><div class="stat"><b>${live.length}</b><span>Cours · ${hrs(weekMin)}</span></div>
      <div class="stat"><b style="color:${answered<tList.length?"var(--warn)":"var(--ok)"}">${answered}/${tList.length}</b><span>Professeurs ayant répondu</span></div>
      <div class="stat"><b style="color:${conf.length?"var(--bad)":"var(--ok)"}">${conf.length}</b><span>Conflits</span></div>
      <div class="stat"><b style="color:${outCount?"var(--warn)":"inherit"}">${outCount}</b><span>Hors disponibilités</span></div>
      <div class="stat"><b>${finished}/${assigns.length}</b><span>Matières terminées</span></div></div>
    <div class="row" style="margin-bottom:12px">
      <button class="btn primary" id="addSlot" ${assigns.length?"":"disabled"}>Ajouter un cours</button>
      <button class="btn" id="autoGen" ${assigns.length&&rooms.length?"":"disabled"}>✨ Générer la semaine</button>
      <button class="btn" id="copyPrev" ${assigns.length?"":"disabled"}>Reprendre la semaine précédente</button>
      <button class="btn" id="ttExport" ${slots.length?"":"disabled"}>${DLI}Imprimer / exporter</button>
      ${pub?`<button class="btn" id="annBtn">Prévenir les professeurs</button><button class="btn danger" id="unpubBtn">Retirer la publication</button>`+(FIXED?`<button class="btn" id="applyFwd">Appliquer à partir de cette semaine</button>`:"")+(drafts?`<button class="btn primary" id="pubWeek">Publier ${drafts} cours en attente</button>`:""):FIXED?`<button class="btn primary" id="pubSem" ${slots.length?"":"disabled"}>Publier pour tout le semestre</button>`:`<button class="btn primary" id="pubWeek" ${slots.length?"":"disabled"}>Publier la semaine</button>`}
    </div>
    ${FIXED?`<div class="gpwarn" style="margin-bottom:10px;background:var(--accent-soft);border-color:var(--accent)"><b>Emploi du temps fixe pour le semestre.</b> Construisez une semaine, puis « Publier pour tout le semestre » : elle est recopiée sur les semaines suivantes, en sautant les jours sans cours. Pour un changement ponctuel, modifiez la semaine concernée ; pour un changement durable, modifiez une semaine puis « Appliquer à partir de cette semaine ». Les disponibilités affichées sont celles données pour le semestre.</div>`:""}
    ${pub?`<div class="gpwarn" style="margin-bottom:10px;background:var(--ok-soft);border-color:var(--ok)">Semaine publiée : toute modification est visible tout de suite par les professeurs. Pour un empêchement, touchez le cours puis « Annuler » ou « Reporter » : le professeur voit le motif.</div>`:""}
    ${!assigns.length?`<div class="gpwarn" style="margin-bottom:10px">Aucune matière d'un semestre en cours cette semaine. Vérifiez les dates des semestres et les affectations.</div>`:""}
    <div class="seg ttseg" role="tablist" aria-label="Affichage">${TABS.map(([k,l])=>`<button role="tab" data-tt="${k}" aria-pressed="${S.ttTab===k}">${l}</button>`).join("")}</div>
    <div id="ttPane" style="margin-top:14px">${PANES[S.ttTab]()}</div>`;

  wireWeekNav(v,()=>S.ttWeek,w=>{S.ttWeek=w});
  v.querySelectorAll("[data-tt]").forEach(b=>b.onclick=()=>{S.ttTab=b.dataset.tt;rerender()});
  const pv=document.getElementById("pView");
  if(pv){pv.value=S.planView;pv.onchange=()=>{S.planView=pv.value;S.planId=null;rerender()};pId.onchange=()=>{S.planId=pId.value;rerender()}}
  const od=document.getElementById("ovDep");if(od)od.onchange=()=>{S.ovDep=od.value==="all"?"all":Number(od.value);rerender()};
  const as=document.getElementById("asgSearch");
  if(as)as.oninput=()=>{const k=norm(as.value.trim());document.querySelectorAll("#asgTable tbody tr").forEach(r=>r.hidden=!!k&&!norm(r.textContent).includes(k))};
  const ga=document.getElementById("goAsg");if(ga)ga.onclick=()=>{S.tab="affect";try{history.replaceState(null,"","#affect")}catch(e){}renderShell()};
  v.querySelectorAll("[data-avf]").forEach(b=>b.onclick=()=>{S.avFor=Number(b.dataset.avf);rerender()});
  const rlb=document.getElementById("relBtn");if(rlb)rlb.onclick=()=>relanceDialog(W,noAnsT);
  v.querySelectorAll("[data-avall]").forEach(b=>b.onclick=async()=>{
    const r=[];sc.days.forEach(d=>{if(sc.lunchFrom&&sc.lunchTo){if(sc.lunchFrom>sc.start)r.push({day:d,start:sc.start,end:sc.lunchFrom});if(sc.end>sc.lunchTo)r.push({day:d,start:sc.lunchTo,end:sc.end})}else r.push({day:d,start:sc.start,end:sc.end})});
    try{await q(sb.rpc("save_week_availability",{p_week:wk,p_ranges:r,p_teacher:Number(b.dataset.avall)}));toast("Marqué disponible toute la semaine");rerender()}
    catch(e){toast(errMsg(e),true)}});

  /* ----- vérifications avant publication ----- */
  const checks=()=>{const L=[];
    L.push(conf.length?{k:"bad",t:`${conf.length} conflit(s) à corriger (bloquant)`}:{k:"ok",t:"Aucun conflit"});
    const noAns=[...new Set(live.map(s=>s.teaching_assignments.teacher_id))].filter(t=>!declared.has(t)).map(t=>teachers.find(x=>x.id===t)).filter(Boolean);
    L.push(noAns.length?{k:"warn",t:`Cours placés pour ${noAns.length} professeur(s) sans réponse : ${noAns.map(t=>t.last_name).join(", ")}`}:{k:"ok",t:"Tous les professeurs placés ont donné leurs disponibilités"});
    L.push(outCount?{k:"warn",t:`${outCount} cours hors des disponibilités déclarées`}:{k:"ok",t:"Tous les cours respectent les disponibilités"});
    const gIds=[...new Set(assigns.filter(a=>remaining[a.id]>0).flatMap(a=>a._g))];
    const gm=gIds.map(id=>({g:groups.find(x=>x.id===id),m:live.filter(s=>s.teaching_assignments._g.includes(id)).reduce((a,x)=>a+mins(x),0)})).filter(x=>x.g);
    const nz=gm.map(x=>x.m).filter(Boolean).sort((a,b)=>a-b),med=nz.length?nz[Math.floor(nz.length/2)]:0;
    const empty=gm.filter(x=>!x.m),low=gm.filter(x=>x.m&&x.m<med/2);
    L.push(empty.length?{k:"warn",t:`Groupe(s) sans aucun cours : ${empty.map(x=>x.g.code).join(", ")}`}:{k:"ok",t:"Chaque groupe a des cours cette semaine"});

  const ICON={ok:"✓",warn:"!",bad:"✕",info:"i"};

  /* ----- reprendre la semaine précédente : on recopie ce qui est encore possible, et on dit pourquoi le reste ne l'est pas ----- */

/* ---------- export de la semaine : une page (PDF) ou une feuille (Excel) par groupe, professeur ou salle ---------- */
function ttExportWeek(fmt,by,ents,slots,c){
  const sc=S.sched||SCHED_DEFAULT,W=c.W;
  const BYL={group:"Groupe",teacher:"Professeur",room:"Salle"}[by];
  const label=s=>{const t=s.teaching_assignments;const parts=[t.courses.code,t.courses.name];
    if(by!=="group")parts.push(t.student_groups.code);if(by!=="teacher")parts.push(t.teachers.first_name+" "+t.teachers.last_name);if(by!=="room")parts.push("Salle "+s.rooms.code);
    let x=parts.join("\n");if(c.isCancel(s))x="ANNULÉ · "+x;else if(!s.published)x+="\n(brouillon)";return x};
  const std=slotsOf(sc).map(r=>r.split("–"));
  const head=["Horaire",...sc.days.map(d=>DAYS[d]+" "+addDays(W,d-1).toLocaleDateString("fr-FR",{day:"numeric",month:"short"}))];
  const build=list=>{const ranges=new Map();std.forEach(([a,b])=>ranges.set(a+"–"+b,[a,b]));list.forEach(s=>{const a=hm(s.start_time),b=hm(s.end_time);ranges.set(a+"–"+b,[a,b])});
    const rows=[...ranges.values()].sort((x,y)=>x[0].localeCompare(y[0])||x[1].localeCompare(y[1]));
    return rows.map(([a,b])=>[a+"–"+b,...sc.days.map(d=>list.filter(s=>s.day_of_week===d&&hm(s.start_time)===a&&hm(s.end_time)===b).map(label).join("\n\n"))])
      .filter((r,i)=>r.slice(1).some(Boolean)||std.some(([a,b])=>a+"–"+b===r[0]))};
  const wtxt="Semaine du "+weekRange(W)+(c.pub?"":" · non publiée");
  const file=slug("emploi-du-temps-"+iso(W)+"-"+(ents.length===1?ents[0][1]:BYL+"s"));
  if(fmt==="xlsx"){exportExcel(file,ents.map(([id,name])=>({name,title:APPN()+" · Emploi du temps · "+BYL+" "+name,subtitle:wtxt,head,rows:build(slots.filter(s=>c.MATCH(by,s,id)))})));return}
  try{
    if(!window.jspdf)throw new Error("Le module PDF n'a pas pu être chargé. Vérifiez la connexion et rechargez la page.");
    const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:"landscape"});
    const PW=doc.internal.pageSize.getWidth(),PH=doc.internal.pageSize.getHeight();
    const T=t=>{const [h,m]=String(t).slice(0,5).split(":").map(Number);return h*60+m};
    const F=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
    const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
    const tint=(c,k)=>c.map(v=>Math.round(v+(255-v)*k));
    const st=T(sc.start),en=T(sc.end),len=sc.len,lf=sc.lunchFrom?T(sc.lunchFrom):null,lt=sc.lunchTo?T(sc.lunchTo):null,hasL=lf!=null&&lt!=null&&lf>st&&lt<en;
    const starts=dayStarts(st,en,len,lf,lt);
    const days=sc.days;
    const year=S.year?"Année universitaire "+S.year:"";
    const dur=m=>{const h=Math.floor(m/60),r=m%60;return h+" h"+(r?" "+String(r).padStart(2,"0"):"")};
    const ML=12,MR=12,TC=20,GAP=1.6,TOP=46,BOT=PH-26,PB=hasL?7:0;
    const cw=(PW-ML-MR-TC)/days.length,x0=ML+TC;
    ents.forEach(([id,name],pi)=>{if(pi)doc.addPage();
      const list=slots.filter(s=>c.MATCH(by,s,id));
      /* l'échelle verticale couvre la journée (et s'élargit si un cours sort des horaires) ; la pause est une fine bande */
      let lo=st,hi=en;list.forEach(s=>{lo=Math.min(lo,T(s.start_time));hi=Math.max(hi,T(s.end_time))});
      const span=(hasL?(lf-lo)+(hi-lt):(hi-lo)),k=(BOT-TOP-PB)/span;
      const y=m=>!hasL||m<=lf?TOP+(m-lo)*k:(m>=lt?TOP+(lf-lo)*k+PB+(m-lt)*k:TOP+(lf-lo)*k+PB*(m-lf)/(lt-lf));
      const live=list.filter(s=>!c.isCancel(s)),tot=live.reduce((a,s)=>a+T(s.end_time)-T(s.start_time),0);
      /* en-tête */
      doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(70,80,92);
      pdfLogo(doc,PW-MR-11,6,11);
      doc.text(APPN()+(pdfHead()?"  ·  "+pdfHead().replace(/ · /g,"  ·  "):"")+(year?"  ·  "+year:"")+"  ·  Semaine du "+weekRange(W)+(c.pub?"":"  ·  brouillon, non publiée"),ML,15);
      doc.setFont("helvetica","bold");doc.setFontSize(24);doc.setTextColor(17,24,32);doc.text(String(name),ML,26);
      doc.setFont("helvetica","normal");doc.setFontSize(11);doc.setTextColor(70,80,92);doc.text(BYL+"  ·  "+dur(tot)+" cette semaine",PW-MR,26,{align:"right"});
      doc.setFillColor(11,110,91);doc.rect(ML,29,PW-ML-MR,0.9,"F");
      /* jours */
      doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(17,24,32);
      days.forEach((d,i)=>{const cx=x0+i*cw+cw/2;doc.text(DAYS[d].toUpperCase(),cx,37,{align:"center"});
        doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(93,104,121);doc.text(addDays(W,d-1).toLocaleDateString("fr-FR",{day:"numeric",month:"long"}),cx,41.5,{align:"center"});
        doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(17,24,32)});
      /* heures + cases vides */
      starts.forEach(t=>{const a=y(t),b=y(t+len);
        doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(17,24,32);doc.text(F(t),ML+TC-3,a+4,{align:"right"});
        doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(93,104,121);doc.text(F(t+len),ML+TC-3,a+8,{align:"right"});
        days.forEach((d,i)=>{doc.setDrawColor(205,212,210);doc.setLineWidth(0.25);doc.setFillColor(255,255,255);doc.roundedRect(x0+i*cw+GAP/2,a+GAP/2,cw-GAP,b-a-GAP,1.4,1.4,"FD")})});
      if(hasL){const py=y(lf)+PB/2;doc.setDrawColor(150,160,165);doc.setLineWidth(0.25);doc.setLineDashPattern([1,1],0);doc.line(x0,py,PW-MR,py);doc.setLineDashPattern([],0);
        doc.setFont("helvetica","bold");doc.setFontSize(8);doc.setTextColor(93,104,121);doc.text("PAUSE",ML+TC-3,py+1,{align:"right"})}
      /* cours */
      list.slice().sort((a,b)=>T(a.start_time)-T(b.start_time)).forEach(s=>{
        const i=days.indexOf(s.day_of_week);if(i<0)return;
        const t=s.teaching_assignments,a=y(T(s.start_time)),b=y(T(s.end_time)),x=x0+i*cw+GAP/2,w=cw-GAP,h=b-a-GAP,yy=a+GAP/2;
        const cancel=c.isCancel(s),col=cancel?[178,58,58]:hex(ttColor(t.courses.code));
        doc.setFillColor(...(cancel?[248,240,240]:tint(col,0.86)));doc.setDrawColor(...col);doc.setLineWidth(0.45);
        if(!s.published&&!cancel)doc.setLineDashPattern([1.2,0.8],0);
        doc.roundedRect(x,yy,w,h,1.4,1.4,"FD");doc.setLineDashPattern([],0);
        doc.setFillColor(...col);doc.rect(x+0.2,yy+0.6,1.3,h-1.2,"F");
        const tx=x+3.5,mw=w-6;let ty=yy+6;
        doc.setFont("helvetica","bold");doc.setFontSize(h>22?14:11.5);doc.setTextColor(17,24,32);
        doc.text(cancel?"ANNULÉ":t.courses.code,tx,ty);ty+=h>22?5:4.4;
        doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(40,48,58);
        const lines=[];
        if(cancel)lines.push(t.courses.code);
        lines.push(...doc.splitTextToSize(t.courses.name,mw).slice(0,h>30?2:1));
        if(by!=="teacher")lines.push(t.teachers.first_name+" "+t.teachers.last_name.toUpperCase());
        if(by!=="group")lines.push(t.student_groups.code);
        if(by!=="room")lines.push("salle : "+s.rooms.code);
        lines.forEach(l=>{if(ty<yy+h-5){doc.text(doc.splitTextToSize(String(l),mw)[0],tx,ty);ty+=4}});
        doc.setFont("helvetica","bold");doc.setFontSize(8.5);doc.setTextColor(17,24,32);doc.text(dur(T(s.end_time)-T(s.start_time))+(s.published||cancel?"":" · brouillon"),x+w-2.2,yy+h-2.2,{align:"right"});
      });
      /* légende : volume de la semaine par matière */
      const sum={};live.forEach(s=>{const k=s.teaching_assignments.courses.code;sum[k]=(sum[k]||0)+T(s.end_time)-T(s.start_time)});
      const leg=Object.entries(sum).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,m])=>k+" "+dur(m)).join("   ·   ");
      doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(40,48,58);doc.text(doc.splitTextToSize(leg||"Aucun cours cette semaine.",PW-ML-MR).slice(0,2),ML,BOT+7);
      doc.setDrawColor(205,212,210);doc.setLineWidth(0.3);doc.line(ML,PH-11,PW-MR,PH-11);
      doc.setFontSize(8);doc.setTextColor(93,104,121);doc.text(APPN()+(pdfFooterText()?"  ·  "+pdfFooterText():"")+"  ·  édité le "+new Date().toLocaleDateString("fr-FR"),ML,PH-6.5);
      doc.text(`${pi+1} / ${ents.length}`,PW-MR,PH-6.5,{align:"right"});
    });
    doc.save(file+".pdf");
  }catch(e){toast(errMsg(e),true)}
}

/* projection : au rythme déjà suivi, la matière atteindra-t-elle son volume avant la fin du semestre ? */
function semesterRisk(a,doneMin,today){
  if(!a.semesters)return null;
  const s=new Date(a.semesters.start_date+"T12:00:00"),e=new Date(a.semesters.end_date+"T12:00:00"),t=new Date(today+"T12:00:00");
  /* semaines comptées sans les jours fermés du calendrier */
  const total=Math.max(1,openWeeks(a.semesters.start_date,a.semesters.end_date)),left=t>e?0:Math.min(total,openWeeks(t<s?a.semesters.start_date:today,a.semesters.end_date)),elapsed=Math.max(0,total-left);
  const need=a.planned_hours*60-doneMin;if(need<=0)return null;
  const rate=elapsed>=1&&doneMin>0?doneMin/elapsed:null;
  const missing=rate!=null?Math.max(0,a.planned_hours*60-(doneMin+rate*left)):null;
  const pace=left>0.5?need/left:need;
  return{need,left,rate,missing,pace,risk:left<=0.5||(missing!=null&&missing>=60)||(doneMin<=0&&elapsed>=2)};
}

      <div class="stat"><b>${wSlots.length}</b><span>cours · ${hrs(wMin)}</span></div>
      <div class="stat"><b style="color:${conf.length?"var(--bad)":"var(--ok)"}">${conf.length}</b><span>conflits</span></div>
      <div class="stat"><b style="color:${risks.length?"var(--warn)":"var(--ok)"}">${risks.length}</b><span>matières en retard</span></div></div>
    ${(()=>{const cs=(S.closures||[]).filter(c=>c.date_from<=wEnd&&c.date_to>=wk);return cs.length?`<div class="gpwarn" style="margin-bottom:10px">Sans cours cette semaine : ${cs.map(c=>esc(c.label)+" ("+(c.date_from===c.date_to?fdl(c.date_from):"du "+fdl(c.date_from)+" au "+fdl(c.date_to))+(c.part!=="jour"?", "+CLOSE_PART[c.part].toLowerCase():"")+")").join(" · ")}</div>`:""})()}

/* ---------- affectations : par groupe, avec la charge des professeurs ---------- */
async function viewAssign(v){
  const [sems,groups,courses,teachers,assigns,slotsAll,cancelled]=await Promise.all([

    q(sb.from("courses").select("id,code,name,total_hours,department_id,program_id,course_programs(program_id)").order("code")),
    q(sb.from("teachers").select("id,first_name,last_name,department_id,active,departments(code)").order("last_name")),
    q(sb.from("teaching_assignments").select("id,semester_id,teacher_id,course_id,group_id,planned_hours,assignment_groups(group_id)").order("id")),

  const semA=assigns.filter(a=>a.semester_id===sem);
  const gids=a=>[a.group_id,...(a.assignment_groups||[]).map(x=>x.group_id)];
  const gcode=id=>groups.find(g=>g.id===id)?.code||"?";
  const inProg=c=>c.program_id===G.program_id||(c.course_programs||[]).some(x=>x.program_id===G.program_id);
  const mineA=semA.filter(a=>gids(a).includes(G.id));
  /* lignes : matières de la filière du groupe + matières déjà affectées à ce groupe + matières ajoutées à la main */
  S.asgExtra=S.asgExtra||{};const extra=S.asgExtra[G.id]||[];
  const ids=[...new Set([...courses.filter(inProg).map(c=>c.id),...mineA.map(a=>a.course_id),...extra])];
  const rows=ids.map(cid=>{const c=courses.find(x=>x.id===cid);const ex=mineA.filter(a=>a.course_id===cid);
    /* même matière déjà affectée à un autre groupe ce semestre : on peut rejoindre ce cours (tronc commun) */
    const joinable=ex.length?[]:semA.filter(a=>a.course_id===cid&&!gids(a).includes(G.id));
    return{c,a:ex[0]||null,dup:ex.length>1,teacher:ex[0]?.teacher_id||null,hours:ex[0]?Number(ex[0].planned_hours):Number(c.total_hours)||0,
      shared:ex[0]?gids(ex[0]).filter(x=>x!==G.id):[],extraHere:ex[0]?ex[0].group_id!==G.id:false,joinable}});
  const tName=t=>t.first_name+" "+t.last_name;
  const act=teachers.filter(t=>t.active!==false);
  const own=act.filter(t=>t.department_id===dep),oth=act.filter(t=>t.department_id!==dep);
  const tOpts=sel=>`<option value="">— Non affectée —</option>${own.length?`<optgroup label="${esc(G.programs?.departments?.code||"Département")}">${own.map(t=>`<option value="${t.id}" ${t.id===sel?"selected":""}>${esc(tName(t))}</option>`).join("")}</optgroup>`:""}${oth.length?`<optgroup label="Autres départements">${oth.map(t=>`<option value="${t.id}" ${t.id===sel?"selected":""}>${esc(tName(t))}${t.departments?" ("+esc(t.departments.code)+")":""}</option>`).join("")}</optgroup>`:""}`;
  const assignedCount=rows.filter(r=>r.a).length;
  const others=courses.filter(c=>!ids.includes(c.id));
  const byDep={};groups.forEach(g=>{const k=g.programs?.departments?.name||"Sans département";(byDep[k]??=[]).push(g)});
  v.innerHTML=`<h1>Affectations</h1>
    <p class="lead">Choisissez un groupe : ses matières s'affichent avec leur volume prévu. Indiquez le professeur de chaque matière puis enregistrez. La charge de chaque professeur se met à jour pendant la saisie.</p>
    <div class="row" style="margin-bottom:12px;align-items:flex-end">
      <label>Semestre<select id="aSem">${sems.map(x=>`<option value="${x.id}" ${x.id===sem?"selected":""}>${esc(x.academic_years.label)} · ${esc(x.label)}</option>`).join("")}</select></label>
      <label>Groupe<select id="aGrp">${Object.entries(byDep).map(([k,gs])=>`<optgroup label="${esc(k)}">${gs.map(g=>`<option value="${g.id}" ${g.id===G.id?"selected":""}>${esc(g.code)} · ${esc(g.name)}</option>`).join("")}</optgroup>`).join("")}</select></label>
      <button class="btn" id="aCopy">Reprendre un autre semestre</button>
    </div>
    <div class="asg-layout">
      <div>

        ${!courses.some(inProg)?`<div class="gpwarn" style="margin-bottom:10px">Aucune matière n'est rattachée à la filière ${esc(G.programs?.code||"")}. Rattachez-les dans Référentiel > Matières (champ « Filières »), ou ajoutez-les ci-dessous.</div>`:""}

            ${r.joinable.length?`<div style="margin-top:6px">${r.joinable.map(a=>`<button class="btn sm" type="button" data-join="${a.id}">Rejoindre le cours de ${esc(gids(a).map(gcode).join(" + "))} (${esc(tName(teachers.find(t=>t.id===a.teacher_id)||{first_name:"",last_name:"?"}))})</button>`).join(" ")}</div>`:""}
            ${r.a?`<div><button class="lnk" type="button" data-grp="${r.a.id}">Groupes réunis…</button></div>`:""}</td>
          <td><select class="aT" data-i="${i}" aria-label="Professeur pour ${esc(r.c.code)}">${tOpts(r.teacher)}</select></td>
          <td><input class="aH" data-i="${i}" type="number" min="0.5" step="0.5" value="${r.hours}" style="width:84px" aria-label="Volume ${esc(r.c.code)}"></td>
          <td class="num">${r.a?`${hrs(d)}<div class="pbar"><i style="width:${Math.min(100,Math.round(d/(r.hours*60||1)*100))}%"></i></div>`:"—"}</td>
          <td class="aS" data-i="${i}">${r.a?'<span class="pill p-ok">Affectée</span>':'<span class="pill p-mute">Non affectée</span>'}</td></tr>`}).join("")}
        </tbody></table></div>
        <div class="row" style="margin-top:10px;justify-content:space-between">
          <label style="flex:1;min-width:220px">Ajouter une matière d'une autre filière<select id="aAdd"><option value="">Choisir…</option>${others.map(c=>`<option value="${c.id}">${esc(c.code)} · ${esc(c.name)}</option>`).join("")}</select></label>
          <span class="sub" id="aDirty"></span>
          <button class="btn primary" id="aSave">Enregistrer</button>
        </div>
      </div>
      <aside class="panel asg-load"><h3 style="margin:0 0 4px">Charge des professeurs</h3><p class="sub" style="margin:0 0 10px">Semestre choisi, tous groupes confondus.</p><div id="aLoad"></div></aside>
    </div>`;
  const cur=()=>rows.map((r,i)=>({...r,teacherNew:Number(v.querySelector(`.aT[data-i="${i}"]`).value)||null,hoursNew:Number(v.querySelector(`.aH[data-i="${i}"]`).value)||0}));
  const drawLoad=()=>{const c=cur(),m={};
    semA.filter(a=>!gids(a).includes(G.id)).forEach(a=>{(m[a.teacher_id]??={n:0,h:0});m[a.teacher_id].n++;m[a.teacher_id].h+=Number(a.planned_hours)});
    c.forEach(r=>{if(r.teacherNew){(m[r.teacherNew]??={n:0,h:0});m[r.teacherNew].n++;m[r.teacherNew].h+=r.hoursNew}});
    const list=act.filter(t=>m[t.id]||t.department_id===dep).sort((a,b)=>(m[b.id]?.h||0)-(m[a.id]?.h||0));
    const max=Math.max(1,...list.map(t=>m[t.id]?.h||0));
    document.getElementById("aLoad").innerHTML=list.length?list.map(t=>{const x=m[t.id]||{n:0,h:0};const here=c.filter(r=>r.teacherNew===t.id).length;
      return `<div class="ld"><div class="ld-t"><span>${esc(tName(t))}${here?` <span class="pill p-info">${here} ici</span>`:""}</span><b>${Number(x.h.toFixed(1))} h</b></div><div class="pbar"><i style="width:${Math.round(x.h/max*100)}%"></i></div><div class="sub">${x.n} matière(s)</div></div>`}).join(""):'<p class="sub">Aucun professeur.</p>';
    const ch=c.filter(r=>(r.a?(r.teacherNew!==r.a.teacher_id||r.hoursNew!==Number(r.a.planned_hours)):!!r.teacherNew)).length;

    c.forEach((r,i)=>{const td=v.querySelector(`.aS[data-i="${i}"]`);const changed=r.a?(r.teacherNew!==r.a.teacher_id||r.hoursNew!==Number(r.a.planned_hours)):!!r.teacherNew;
      td.innerHTML=changed?(r.a&&!r.teacherNew?'<span class="pill p-bad">À retirer</span>':'<span class="pill p-warn">Modifiée</span>'):(r.a?'<span class="pill p-ok">Affectée</span>':'<span class="pill p-mute">Non affectée</span>')})};

  v.querySelectorAll("[data-grp]").forEach(b=>b.onclick=()=>{const a=semA.find(x=>x.id==b.dataset.grp),cur0=new Set(gids(a)),c=courses.find(x=>x.id===a.course_id);
    const size=()=>[...document.querySelectorAll("#rgList input:checked")].reduce((s,i)=>s+(groups.find(g=>g.id==i.value)?.size||0),0);
    openDialog(`<h3>Groupes réunis · ${esc(c.code)}</h3>
      <p class="sub" style="margin:0">Les groupes cochés suivent ce cours <b>ensemble</b> : même professeur, même salle, même moment, même volume. Une seule séance est émargée et payée. Le groupe principal ne peut pas être retiré ici.</p>
      <div id="rgList" style="display:grid;gap:4px;max-height:44vh;overflow:auto">${Object.entries(byDep).map(([k,gs])=>`<div class="sub" style="margin-top:6px">${esc(k)}</div>`+gs.map(g=>`<label style="flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)"><input type="checkbox" value="${g.id}" ${cur0.has(g.id)?"checked":""} ${g.id===a.group_id?"disabled":""}> ${esc(g.code)} · ${esc(g.name)} <span class="sub">(${g.size})</span>${g.id===a.group_id?' <span class="pill p-mute">principal</span>':""}${(c.course_programs||[]).some(x=>x.program_id===g.program_id)?' <span class="pill p-info">filière de la matière</span>':""}</label>`).join("")).join("")}</div>
      <p class="sub" style="margin:0" id="rgSize"></p>
      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Enregistrer</button></div>`,
    async()=>{const want=new Set([...document.querySelectorAll("#rgList input:checked")].map(i=>Number(i.value)));want.delete(a.group_id);
      const had=new Set((a.assignment_groups||[]).map(x=>x.group_id));
      const add=[...want].filter(x=>!had.has(x)),del=[...had].filter(x=>!want.has(x));
      if(add.length)await q(sb.from("assignment_groups").insert(add.map(g=>({assignment_id:a.id,group_id:g}))));
      if(del.length)await q(sb.from("assignment_groups").delete().eq("assignment_id",a.id).in("group_id",del));
      toast("Groupes réunis enregistrés"+(add.length&&(done[a.id]||0)>0?" · vérifiez l'emploi du temps : les créneaux déjà placés doivent convenir à tous les groupes":""));rerender()});
    const upd=()=>{rgSize.textContent=`Effectif total : ${size()} étudiants — la salle devra être assez grande.`};upd();
    document.querySelectorAll("#rgList input").forEach(i=>i.onchange=upd)});
  aSem.onchange=()=>{S.asgSem=Number(aSem.value);rerender()};

  aCopy.onclick=()=>{const src=sems.filter(x=>x.id!==sem);
