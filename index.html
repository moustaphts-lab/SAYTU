<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">

<style>
/* Design : sobre, vert profond, grandes zones tactiles. Sur téléphone : navigation en bas, tableaux en cartes, fenêtres en feuille basse. */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --line:#e1e7e4; --ink:#14201b; --muted:#5f6e67;
  --accent:#0b6e5b; --accent-ink:#ffffff; --accent-soft:#dff1ec; --ochre:#b06a00;
  --ok:#1b7a47; --ok-soft:#e1f3e8; --warn:#92580a; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#fbe7e4;
  --r:14px; --shadow:0 1px 2px rgba(20,32,27,.05),0 4px 14px rgba(20,32,27,.04);
  --f-display:"Bricolage Grotesque", system-ui, sans-serif; --f-body:"Instrument Sans", system-ui, sans-serif; --f-mono:"Instrument Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1512; --surface:#151f1b; --line:#25332d; --ink:#e7efeb; --muted:#9bada5;
  --accent:#4fd1b0; --accent-ink:#06231c; --accent-soft:#143229; --ochre:#e3a94f;
  --ok:#5cc58c; --ok-soft:#163324; --warn:#e7b04f; --warn-soft:#3a2c12; --bad:#f0857c; --bad-soft:#3d1a18; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1512; --surface:#151f1b; --line:#25332d; --ink:#e7efeb; --muted:#9bada5;
  --accent:#4fd1b0; --accent-ink:#06231c; --accent-soft:#143229; --ochre:#e3a94f;
  --ok:#5cc58c; --ok-soft:#163324; --warn:#e7b04f; --warn-soft:#3a2c12; --bad:#f0857c; --bad-soft:#3d1a18; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top .bar{display:flex;align-items:center;gap:12px;padding-block:10px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;font:700 18px var(--f-display);letter-spacing:-.01em}
.brand i{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 17px var(--f-display);font-style:normal}
.brand small{display:block;font:400 12px var(--f-body);color:var(--muted);letter-spacing:0}
.burger{display:none;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);cursor:pointer;flex:0 0 auto;padding:0}
.scrim,nav.tabs .drawer-top{display:none}
.menu{margin-left:auto;position:relative}
.menu summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:5px 6px 5px 5px;border-radius:99px;border:1px solid var(--line)}
.menu summary::-webkit-details-marker{display:none}
.menu .av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 13px var(--f-body)}
.menu .nm{font-size:13px;font-weight:500;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px}
.menu .pop{position:absolute;right:0;top:calc(100% + 8px);width:min(280px,86vw);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 32px rgba(10,20,15,.18);padding:12px;display:flex;flex-direction:column;gap:8px;z-index:8}
.menu .pop p{margin:0 0 4px;font-size:13px;color:var(--muted)}
.menu .pop p b{display:block;color:var(--ink);font-size:14px;overflow-wrap:anywhere}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-radius:99px;padding:8px 14px;font:500 14px var(--f-body);color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button:hover{background:var(--bg)}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.tabs button{display:flex;align-items:center;gap:12px}
nav.tabs button svg{flex:none;opacity:.8}
.yr{display:none}
@media (min-width:721px){
  :root{--sbw:224px}
  #app{padding-left:var(--sbw)}
  nav.tabs{position:fixed;left:0;top:0;bottom:0;width:var(--sbw);flex-direction:column;overflow-y:auto;gap:3px;padding:18px 12px 24px;background:var(--surface);border-right:1px solid var(--line);z-index:6}
  nav.tabs .drawer-top{display:block;padding:2px 8px 16px;margin-bottom:10px;border-bottom:1px solid var(--line)}
  nav.tabs .drawer-top .brand{font-size:17px}
  nav.tabs .drawer-top p{margin:12px 0 0;font-size:12.5px;line-height:1.45;color:var(--muted);overflow-wrap:anywhere}
  nav.tabs button{width:100%;text-align:left;border-radius:12px;padding:11px 12px;font-size:14.5px;white-space:normal;position:relative}
  nav.tabs button[aria-selected="true"]::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
  header.top .bar>.brand{display:none}
  .yr{display:block;font-size:13.5px;color:var(--muted)}
  header.top .bar{min-height:56px}
  header.top .wrap:last-child{padding:0;height:0}
  main.wrap{padding-inline:max(24px,env(safe-area-inset-right,0px)) 24px}
}
@media (min-width:1025px){:root{--sbw:264px}nav.tabs{padding:22px 16px 28px}}
main{padding-block:26px 64px}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.02em;line-height:1.15;margin:0 0 6px;text-wrap:balance}
h2{font:600 17px var(--f-display);margin:28px 0 10px}
.lead{color:var(--muted);margin:0 0 20px;max-width:68ch}
.weeknav{display:flex;align-items:center;gap:10px;background:var(--surface,#fff);border:1px solid var(--line,#e3e8e6);border-radius:16px;padding:8px;margin:4px 0 18px}
.weeknav .wbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line,#e3e8e6);background:var(--bg,#f3f5f4);color:inherit;display:grid;place-items:center;cursor:pointer;flex:none}
.weeknav .wbtn:active{transform:scale(.95)}
.weeknav .wmid{flex:1;text-align:center;line-height:1.15;min-width:0}
.weeknav .wmid small{display:block;font-size:12px;opacity:.65}
.weeknav .wmid b{font-size:17px}
.weeknav .wnow{border:0;background:var(--accent-soft,#dcefe9);color:var(--accent);font:inherit;font-weight:600;font-size:13px;padding:10px 14px;border-radius:12px;cursor:pointer;white-space:nowrap;flex:none}
@media(max-width:720px){.weeknav{display:grid;grid-template-columns:44px 1fr 44px;gap:8px 10px}.weeknav .wnow{grid-column:1/-1;text-align:center}}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font:700 26px var(--f-display);letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;font-size:13px;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.num,.mono{font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:13px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--accent-soft);color:var(--accent)}
.p-mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.gap{color:var(--ochre);font-weight:600}
button.btn,.btn{font:600 14px var(--f-body);border-radius:10px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 11px;font-size:13px;min-height:34px}
.btn:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted)}
input,select,textarea{font:15px var(--f-body);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-height:42px;max-width:100%}
textarea{min-height:76px;resize:vertical}
input[type=checkbox]{min-height:0;width:18px;height:18px;padding:0;accent-color:var(--accent)}
.login{max-width:420px;margin:7vh auto 0}
.login .brand{margin-bottom:22px}
.login .panel{padding:24px;display:flex;flex-direction:column;gap:14px}
.demo{margin-top:18px;font-size:13px}
.demo summary{cursor:pointer;color:var(--muted);padding:6px 0}
.demo button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px;color:var(--ink);font:13px var(--f-body);cursor:pointer}
.demo button span{color:var(--muted);text-align:right}
.err{color:var(--bad);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;z-index:30;max-width:90vw}
.toast.bad{background:var(--bad);color:#fff}
dialog{border:0;border-radius:18px;background:var(--surface);color:var(--ink);padding:0;width:min(540px,94vw);max-height:90dvh;box-shadow:0 24px 60px rgba(10,20,15,.3)}
dialog::backdrop{background:rgba(8,16,12,.5)}
dialog form{padding:22px;display:flex;flex-direction:column;gap:14px}
dialog h3{margin:0;font:700 20px var(--f-display);letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.week{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:10px;overflow-x:auto}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-height:120px}
.day h4{margin:0;padding:10px 12px;font:600 13px var(--f-body);color:var(--muted);border-bottom:1px solid var(--line)}
.slot{margin:8px;padding:9px 10px;border-radius:10px;background:var(--accent-soft);font-size:13px}
.slot.conf{background:var(--bad-soft)}
.slot b{display:block}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:7px 14px;font:500 13.5px var(--f-body);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hero{display:flex;gap:28px;align-items:center;padding:22px 26px;margin-bottom:16px}
.ring{width:136px;height:136px;flex:0 0 auto}
.herotxt{flex:1;min-width:0}
.bigline{font:700 24px/1.2 var(--f-display);letter-spacing:-.01em;margin:2px 0 4px;text-wrap:balance}
.late{color:var(--bad);font-weight:600}
.mini{display:flex;gap:26px;flex-wrap:wrap;margin-top:14px}
.mini b{display:block;font:700 18px var(--f-display)}.mini span{font-size:13px;color:var(--muted)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:6px}
.act{padding:18px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.act .btn{margin-top:8px}
.actn{font:700 30px/1.1 var(--f-display);letter-spacing:-.02em}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.dash{background:none;border-top:2px dashed var(--muted);height:0;border-radius:0;width:16px;vertical-align:3px}
.drow{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.drow:nth-last-child(2){border-bottom:0}
.dname{font-weight:600;padding-top:1px}
.stack{display:flex;height:12px;border-radius:99px;background:var(--accent-soft);overflow:hidden;margin-bottom:5px}
.stack i{display:block;height:100%}
.rank{display:grid;grid-template-columns:minmax(0,1fr) minmax(90px,38%) 52px;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rpct{font-weight:700;text-align:right;white-space:nowrap}
.dtools{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--accent-soft);border-radius:14px;padding:4px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);font:600 14px var(--f-body);padding:9px 16px;border-radius:10px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(20,32,27,.14)}
.xbar .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 10px}.sechead h2{margin:0}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-bottom:22px}
.pcard{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px;font:inherit;color:inherit;cursor:pointer;box-shadow:var(--shadow)}
.pcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.pc-top b{font:700 17px var(--f-display)}
.pc-dates{font-size:14px;color:var(--muted)}
.pc-bot{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-top:4px;padding-top:10px;border-top:1px solid var(--line)}
.pc-bot .sub{font-size:12.5px}.pc-amt{font:700 18px var(--f-display);white-space:nowrap}
.phead{padding:18px 20px;margin-bottom:14px}.ph-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.phead h2{margin:2px 0 4px;font-size:22px}
.ph-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.ph-x{margin-top:14px}.ph-prog{margin-top:14px}.ph-prog .hbar{height:12px;margin-bottom:6px}
.stat.big b{color:var(--accent)}
.slips{padding:0}.slip{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 200px;gap:8px 20px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}.slip:last-child{border-bottom:0}
.sl-net{font:700 18px var(--f-display);margin-bottom:6px}.sl-amt .hbar{margin-bottom:5px}
.sl-act{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.searchbox{flex-direction:row;align-items:center;gap:10px;font-size:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-bottom:12px;color:var(--muted)}
.searchbox:focus-within{border-color:var(--accent)}.searchbox input{flex:1;border:0;background:none;outline:0;font:15px var(--f-body);color:var(--ink);padding:12px 0;min-width:0;min-height:46px;border-radius:0}
.searchbox svg{flex:none}
.gplist{max-height:36vh;overflow:auto;border:1px solid var(--line);border-radius:14px}
.gp{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}.gp:last-child{border-bottom:0}
.gp-t,.gp-c{display:flex;flex-direction:column;gap:2px}.gp-c .sub{font-size:12.5px}.gp-t .mono{font-size:13px;color:var(--muted)}
.gpwarn{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:6px;font-size:13.5px;line-height:1.4}
.setup{padding:18px 20px;margin-bottom:16px}.su-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.su-n{font:700 22px var(--f-display);color:var(--accent)}
.su-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.su{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 10px;font:inherit;font-size:13.5px;cursor:pointer;text-align:left;min-width:0}
.su-i{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--bg);color:var(--muted)}
.su.done .su-i{background:var(--ok-soft);color:var(--ok)}.su.next{border-color:var(--accent);background:var(--accent-soft)}.su.next .su-i{background:var(--accent);color:var(--accent-ink)}
.su-l{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.su-c{font-size:12px;color:var(--muted);white-space:nowrap}
.secnav{margin-bottom:18px}.cnt{font:600 13px var(--f-body);background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:2px 9px;vertical-align:2px;margin-left:4px}
.rlist{padding:0;margin-bottom:22px}.ritem{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr) auto;gap:8px 18px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.ritem:last-child{border-bottom:0}.ritem[hidden]{display:none}
.rmain{display:flex;flex-direction:column;gap:2px;min-width:0}.rmain b{overflow-wrap:anywhere}
.rmeta{display:flex;flex-wrap:wrap;gap:6px 22px}.rm{display:flex;flex-direction:column;font-size:14px;min-width:0}.rm small{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ract{display:flex;gap:8px;align-items:center}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--bad);display:grid;place-items:center;cursor:pointer}.iconbtn:hover{background:var(--bad-soft)}
.xbar{display:flex;gap:8px;flex-wrap:wrap}
.dhead{display:flex;align-items:center;gap:10px;margin:24px 0 8px}
.srow{display:grid;grid-template-columns:64px 1fr auto;gap:6px 16px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:start}
.srow:last-child{border-bottom:0}
.stime{font-weight:600;line-height:1.3}.stime span{display:block;color:var(--muted);font-weight:400}
.sact{align-self:center}
.avrow{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.avrow:last-child{border-bottom:0}
.avday{width:96px;font-weight:600;flex:0 0 auto}
.avchips{flex:1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.avchip{display:inline-flex;gap:8px;align-items:center;background:var(--accent-soft);color:var(--accent);padding:4px 4px 4px 12px;border-radius:99px;font-size:14px}

<script id="pdf-builder">
/* Bulletin PDF : construit uniquement à partir de la version figée (snapshot) du bulletin */
function makePayslipPdf(jsPDF, slip, payments){
  const sn=slip.snapshot, E=sn.enseignant, P=sn.periode;
  const money=n=>Math.round(n||0).toLocaleString("fr-FR").replace(/[  ]/g," ")+" FCFA";
  const d=s=>{const [y,m,j]=String(s).slice(0,10).split("-");return j+"/"+m+"/"+y};
  const h=m=>{const H=Math.floor(m/60),M=m%60;return H+" h"+(M?" "+String(M).padStart(2,"0"):"")};
  const ink=[22,32,46], muted=[93,104,121], accent=[11,110,91], line=[221,225,232];
  const doc=new jsPDF({unit:"mm",format:"a4"}); const W=210, L=16, R=W-16;

  doc.setFillColor(...accent); doc.rect(0,0,W,4,"F");
  doc.setFont("helvetica","bold"); doc.setFontSize(18); doc.setTextColor(...ink); doc.text("UCAB Touba",L,18);
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...muted);
  doc.text("Service financier",L,23.5);
  doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(...ink);
  doc.text("Bulletin de rémunération",R,16,{align:"right"});
  doc.setFont("courier","normal"); doc.setFontSize(10); doc.text(slip.number,R,22,{align:"right"});

  doc.setDrawColor(...line); doc.line(L,29,R,29);
  const block=(x,title,rows)=>{doc.setFont("helvetica","bold");doc.setFontSize(8);doc.setTextColor(...muted);doc.text(title.toUpperCase(),x,36);
    rows.forEach(([k,v],i)=>{const y=42+i*5.4;doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(...muted);doc.text(k,x,y);
      doc.setTextColor(...ink);doc.text(String(v||"-"),x+27,y)})};
  block(L,"Enseignant",[["Nom",E.nom],["Statut",E.statut],["Département",E.departement],["E-mail",E.email]]);
  block(112,"Période",[["Libellé",P.nom],["Du",d(P.debut)],["Au",d(P.fin)],["Approuvé le",d(sn.approuve_le)]]);

  const lines=sn.lignes.map(l=>[d(l.date)+(l.rattrapage?" (rattrapage)":""),l.cours,l.groupe,h(l.minutes),
    money(l.tarif)+(l.source==="individuel"?" *":""),money(l.montant)]);
  doc.autoTable({startY:68,head:[["Date","Cours","Groupe","Durée","Tarif horaire","Montant"]],body:lines,
    theme:"plain",margin:{left:L,right:16},
    styles:{font:"helvetica",fontSize:8.5,textColor:ink,cellPadding:{top:2,bottom:2,left:2,right:2},lineColor:line,lineWidth:{bottom:0.2}},
    headStyles:{fontStyle:"bold",textColor:muted,fontSize:7.5,lineWidth:{bottom:0.4},lineColor:ink},
    columnStyles:{0:{cellWidth:30},2:{cellWidth:22},3:{halign:"right",cellWidth:16},4:{halign:"right",cellWidth:30},5:{halign:"right",cellWidth:28}}});

  let y=doc.lastAutoTable.finalY+8;
  if(y>230){doc.addPage();y=20}
  const paid=(payments||[]).reduce((s,p)=>s+p.amount_fcfa,0);
  const tot=[["Heures payables",h(slip.total_minutes)],["Rémunération brute",money(slip.gross_fcfa)],["Primes",money(0)],
    ["Retenues et cotisations",money(slip.deductions_fcfa)]];
  const x0=112;
  tot.forEach(([k,v],i)=>{doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(...muted);doc.text(k,x0,y+i*6);doc.setTextColor(...ink);doc.text(v,R,y+i*6,{align:"right"})});
  y+=tot.length*6;
  doc.setFillColor(223,241,236); doc.rect(x0-3,y-4.5,R-x0+5,10,"F");
  doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(...accent);
  doc.text("Net à payer",x0,y+2); doc.text(money(slip.net_fcfa),R,y+2,{align:"right"});
  y+=13;
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...muted);
  doc.text("Réglé à ce jour",x0,y); doc.setTextColor(...ink); doc.text(money(paid),R,y,{align:"right"});
  doc.setTextColor(...muted); doc.text("Reste dû",x0,y+6); doc.setTextColor(...ink); doc.text(money(slip.net_fcfa-paid),R,y+6,{align:"right"});

  if((payments||[]).length){doc.setFontSize(8);doc.setTextColor(...muted);
    doc.text("Règlements : "+payments.map(p=>d(p.paid_on)+" "+p.method+" "+money(p.amount_fcfa)+(p.reference?" ("+p.reference+")":"")).join(" ; "),L,y+16,{maxWidth:R-L})}

  doc.setFontSize(7.5); doc.setTextColor(...muted);
  const foot=["Montant = durée retenue × tarif horaire en vigueur à la date de la séance. * Tarif individuel.",
    "Aucune retenue ni cotisation n'est appliquée selon les règles actuelles de l'établissement.",
    "Bulletin approuvé par "+(sn.approuve_par||"le service financier")+". Ce document ne vaut pas preuve de paiement.",
    "Édité le "+new Date().toLocaleDateString("fr-FR")+" · "+slip.number];
  foot.forEach((t,i)=>doc.text(t,L,282+i*3.6-(foot.length-1)*3.6));
  return doc;
}
</script>

const CONS={departments_code_key:"Ce code de département existe déjà.",programs_code_key:"Ce code de filière existe déjà.",student_groups_code_key:"Ce code de groupe existe déjà.",courses_code_key:"Ce code de matière existe déjà.",rooms_code_key:"Ce code de salle existe déjà.",
  academic_years_label_key:"Cette année universitaire existe déjà.",semesters_academic_year_id_label_key:"Ce semestre existe déjà pour cette année.",semesters_check:"La date de fin doit être après la date de début.",academic_years_check:"La date de fin doit être après la date de début.",

function errMsg(e){let m=e?.message||String(e);
  for(const k in CONS)if(m.includes(k))return CONS[k];
  if(m.includes("no_room_overlap"))m="Conflit : la salle est déjà occupée sur ce créneau.";

  if(m.includes("availability_time_order"))m="L'heure de fin doit être après l'heure de début.";
  if(m.includes("duplicate key"))m="Cet enregistrement existe déjà (même code, même adresse ou même affectation).";
  if(m.includes("foreign key"))m="Opération impossible : cet élément est utilisé ailleurs (séances, affectations, bulletins…).";
  if(m.includes("check constraint"))m="Valeurs invalides : vérifiez les dates, les durées et les montants.";
  if(m.includes("Failed to send a request to the Edge Function"))m="Le service de gestion des comptes est injoignable. Réessayez dans un instant.";
  return m}

  const {data:{session}}=await sb.auth.getSession();

  try{

/* Tableaux en cartes sur téléphone : chaque cellule reprend le titre de sa colonne */
function labelTables(root){root.querySelectorAll("table").forEach(tb=>{const hs=[...tb.querySelectorAll("thead th")].map(h=>h.textContent.trim());
  if(!hs.length)return;tb.querySelectorAll("tbody tr").forEach(tr=>[...tr.children].forEach((td,i)=>{if(hs[i]&&!td.dataset.label){td.dataset.label=hs[i];const w=document.createElement('div');w.className='cv';while(td.firstChild)w.appendChild(td.firstChild);td.appendChild(w)}}))})}
let _lt=0;new MutationObserver(()=>{cancelAnimationFrame(_lt);_lt=requestAnimationFrame(()=>labelTables(document))}).observe(document.body,{childList:true,subtree:true});

/* ---------- dialogue ---------- */
function openDialog(html,onSubmit){
  const dlg=document.getElementById("dlg"),f=document.getElementById("dlgForm");
  f.innerHTML=html+`<div class="err" id="dlgErr"></div>`;
  f.onsubmit=async ev=>{
    const btn=ev.submitter;if(btn&&btn.value==="cancel")return;
    ev.preventDefault();
    try{btn&&(btn.disabled=true);const r=await onSubmit(btn?btn.value:null,f);if(r!=="keep")dlg.close();}
    catch(e){document.getElementById("dlgErr").textContent=errMsg(e);btn&&(btn.disabled=false)}
  };
  if(!dlg.open)dlg.showModal();
}

/* ---------- générateur automatique d'emploi du temps (version simple) ---------- */
const GEN_DEFAULT={days:[1,2,3,4,5],start:"08:00",end:"18:00",len:120,lunchFrom:"12:00",lunchTo:"14:00",maxGroup:6,maxTeacher:6,useAvail:true,semester:null};
function generateTimetable(o,D){
  const T=t=>{const [h,m]=String(t).slice(0,5).split(":").map(Number);return h*60+m};
  const F=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
  const ov=(a,b)=>a.s<b.e&&b.s<a.e;
  const busy={g:{},t:{},r:{}};
  const add=(k,id,day,s,e)=>{((busy[k][id]??={})[day]??=[]).push({s,e})};
  const free=(k,id,day,s,e)=>!(busy[k][id]?.[day]||[]).some(x=>ov(x,{s,e}));
  const load=(k,id,day)=>(busy[k][id]?.[day]||[]).reduce((a,x)=>a+x.e-x.s,0);
  const existing={};
  D.slots.forEach(x=>{const a=x.teaching_assignments;add("g",a.group_id,x.day_of_week,T(x.start_time),T(x.end_time));add("t",a.teacher_id,x.day_of_week,T(x.start_time),T(x.end_time));if(x.room_id)add("r",x.room_id,x.day_of_week,T(x.start_time),T(x.end_time));
    existing[x.assignment_id]=(existing[x.assignment_id]||0)+T(x.end_time)-T(x.start_time)});
  const len=o.len,start=T(o.start),end=T(o.end),lf=o.lunchFrom?T(o.lunchFrom):null,lt=o.lunchTo?T(o.lunchTo):null;
  const times=[];for(let t=start;t+len<=end;t+=len){if(lf!=null&&lt!=null&&ov({s:t,e:t+len},{s:lf,e:lt}))continue;times.push(t)}
  const rooms=[...D.rooms].sort((a,b)=>a.capacity-b.capacity);
  const gsize=Object.fromEntries(D.groups.map(g=>[g.id,g.size]));
  const av=tid=>D.avails.filter(a=>a.teacher_id===tid);
  const jobs=D.assigns.map(a=>{const wk=D.weeksOf(a.semesters);const target=Math.max(1,Math.round(a.planned_hours*60/wk/len));
    const have=Math.round((existing[a.id]||0)/len);return{a,n:Math.max(0,target-have),target}}).filter(j=>j.n>0&&j.a.planned_hours>0);
  const availMin=a=>{const x=av(a.teacher_id);return x.length?x.reduce((s,y)=>s+T(y.end_time)-T(y.start_time),0):1e9};
  jobs.sort((x,y)=>availMin(x.a)-availMin(y.a)||y.n-x.n);
  const placed=[],unplaced=[];
  for(const j of jobs){const a=j.a;let done=0;const why={};const usedDays=new Set(D.slots.filter(x=>x.assignment_id===a.id).map(x=>x.day_of_week));
    for(let k=0;k<j.n;k++){let best=null;
      for(const d of o.days)for(const t of times){const e=t+len;
        const fail=r=>{why[r]=(why[r]||0)+1};
        const tav=av(a.teacher_id);
        if(o.useAvail&&tav.length&&!tav.some(x=>x.day_of_week===d&&T(x.start_time)<=t&&T(x.end_time)>=e)){fail("hors disponibilités du professeur");continue}
        if(!free("t",a.teacher_id,d,t,e)){fail("professeur déjà occupé");continue}
        if(!free("g",a.group_id,d,t,e)){fail("groupe déjà occupé");continue}
        if(load("g",a.group_id,d)+len>o.maxGroup*60){fail("limite d'heures par jour du groupe");continue}
        if(load("t",a.teacher_id,d)+len>o.maxTeacher*60){fail("limite d'heures par jour du professeur");continue}
        const need=gsize[a.group_id]||0;const room=rooms.find(r=>r.capacity>=need&&free("r",r.id,d,t,e));
        if(!room){fail(rooms.some(r=>r.capacity>=need)?"aucune salle libre":"aucune salle assez grande");continue}
        const score=(usedDays.has(d)?1000:0)+load("g",a.group_id,d)/6+load("t",a.teacher_id,d)/30+times.indexOf(t)*0.5+d*0.01;
        if(!best||score<best.score)best={score,d,t,e,room}}
      if(!best)break;
      add("g",a.group_id,best.d,best.t,best.e);add("t",a.teacher_id,best.d,best.t,best.e);add("r",best.room.id,best.d,best.t,best.e);usedDays.add(best.d);done++;
      placed.push({assignment_id:a.id,a,day_of_week:best.d,start_time:F(best.t),end_time:F(best.e),room_id:best.room.id,room_code:best.room.code})}
    if(done<j.n){const top=Object.entries(why).sort((x,y)=>y[1]-x[1])[0];unplaced.push({a,missing:j.n-done,reason:top?top[0]:"aucun créneau possible avec ces réglages"})}}
  return{placed,unplaced,len,skipped:D.assigns.length-jobs.length};
}
function genDialog(ctx){
  let cfg={...GEN_DEFAULT};
  try{cfg={...cfg,...JSON.parse(localStorage.getItem("ucab_gen")||"{}")}}catch(e){}
  const today=iso(new Date());
  if(!cfg.semester||!ctx.sems.some(x=>x.id==cfg.semester))cfg.semester=(ctx.sems.find(x=>x.start_date<=today&&x.end_date>=today)||ctx.sems[ctx.sems.length-1]||{}).id;
  const settings=()=>{
    openDialog(`<h3>Générer l'emploi du temps</h3>
      <p class="sub" style="margin:0">Le générateur place, dans la semaine, les cours qui n'ont pas encore assez de créneaux. Il respecte les conflits, les salles et les disponibilités. Vous voyez le résultat avant de l'enregistrer.</p>
      <label>Semestre<select id="gSem">${ctx.sems.map(x=>`<option value="${x.id}" ${x.id==cfg.semester?"selected":""}>${esc(x.academic_years.label)} · ${esc(x.label)}</option>`).join("")}</select></label>

        maxGroup:Number(gMaxG.value)||6,maxTeacher:Number(gMaxT.value)||6,useAvail:gAv.checked,semester:Number(gSem.value)};

      if(!!cfg.lunchFrom!==!!cfg.lunchTo||(cfg.lunchFrom&&cfg.lunchTo<=cfg.lunchFrom))throw new Error("Pause : indiquez une heure de début et une heure de fin (ou laissez les deux vides).");
      if(toMin(cfg.end)-toMin(cfg.start)<cfg.len)throw new Error("La journée est plus courte qu'un créneau.");
      try{localStorage.setItem("ucab_gen",JSON.stringify(cfg))}catch(e){}
      const res=generateTimetable(cfg,{assigns:ctx.assigns.filter(a=>a.semester_id===cfg.semester),slots:ctx.slots,rooms:ctx.rooms,groups:ctx.groups,avails:ctx.avails,weeksOf:ctx.weeksOf});

      ${P.length?`<div class="gplist">${P.map(x=>`<div class="gp"><span class="gp-t"><b>${DAYS[x.day_of_week]}</b><span class="mono">${x.start_time}–${x.end_time}</span></span><span class="gp-c"><span><b>${esc(x.a.courses.code)}</b> · ${esc(x.a.student_groups.code)}</span><span class="sub">${esc(x.a.teachers.last_name)} · salle ${esc(x.room_code)}</span></span></div>`).join("")}</div>
      <p class="sub" style="margin:0">Les créneaux sont enregistrés en <b>brouillon</b> : rien n'est publié tant que vous ne cliquez pas sur « Publier ». Vous pouvez ensuite modifier ou supprimer chaque créneau.</p>`:`<p class="empty">${res.skipped===ctx.assigns.length?"Toutes les affectations de ce semestre ont déjà leurs créneaux.":"Aucun créneau n'a pu être placé avec ces réglages."}</p>`}
      <div class="row" style="justify-content:flex-end"><button class="btn" value="back" formnovalidate>← Modifier les réglages</button>${P.length?`<button class="btn primary" value="save">Enregistrer ${P.length} brouillon${P.length>1?"s":""}</button>`:""}</div>`,
    async(act)=>{
      if(act==="back"){settings();return "keep"}
      const rows=P.map(x=>({assignment_id:x.assignment_id,day_of_week:x.day_of_week,start_time:x.start_time,end_time:x.end_time,room_id:x.room_id,published:false}));
      let ok=0,ko=0;
      try{await q(sb.from("timetable_slots").insert(rows));ok=rows.length}
      catch(e){for(const r of rows){try{await q(sb.from("timetable_slots").insert(r));ok++}catch(e2){ko++}}}
      toast(`${ok} créneau${ok>1?"x":""} enregistré${ok>1?"s":""} en brouillon`+(ko?` · ${ko} refusé${ko>1?"s":""} (conflit)`:""),ko>0);ctx.rerender()});
  };
  settings();
}

/* ---------- exports Excel et PDF ---------- */
function slug(s){return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-|-$/g,"").toLowerCase()}
const nf=n=>Number(n).toLocaleString("fr-FR").replace(/[  ]/g," ");
const dh=min=>Math.round((min||0)/60*100)/100; /* minutes -> heures décimales (calculables dans Excel) */
const DLI=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>`;
function xbar(id){return `<div class="xbar" id="${id}"><button class="btn sm" type="button" data-x="xlsx" aria-label="Exporter en Excel">${DLI}Excel</button><button class="btn sm" type="button" data-x="pdf" aria-label="Exporter en PDF">${DLI}PDF</button></div>`}
function wireExport(id,build){
  const host=document.getElementById(id);if(!host)return;
  host.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{
    try{const d=await build();if(b.dataset.x==="xlsx")exportExcel(d.file,d.sheets);else exportPdf(d.file,d.title,d.subtitle,d.sheets,d.landscape)}
    catch(e){toast(errMsg(e),true)}});
}
function exportExcel(file,sheets){
  try{
    if(!window.XLSX)throw new Error("Le module Excel n'a pas pu être chargé. Vérifiez la connexion et rechargez la page.");
    const wb=XLSX.utils.book_new();
    sheets.forEach(s=>{
      const ws=XLSX.utils.aoa_to_sheet([[s.title||s.name],[s.subtitle||""],[],s.head,...s.rows]);
      ws["!cols"]=s.head.map((h,c)=>({wch:Math.min(42,Math.max(String(h).length,...s.rows.map(r=>String(r[c]??"").length))+2)}));
      XLSX.utils.book_append_sheet(wb,ws,String(s.name).replace(/[\\\/?*\[\]:]/g,"-").slice(0,31));
    });
    XLSX.writeFile(wb,file+".xlsx");
  }catch(e){toast(errMsg(e),true)}
}
function exportPdf(file,title,subtitle,sheets,landscape){
  try{
    if(!window.jspdf)throw new Error("Le module PDF n'a pas pu être chargé. Vérifiez la connexion et rechargez la page.");
    const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:landscape?"landscape":"portrait"});
    const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
    doc.setFillColor(11,110,91);doc.rect(0,0,W,3,"F");
    doc.setFont("helvetica","bold");doc.setFontSize(16);doc.setTextColor(22,32,46);doc.text("UCAB Touba",14,16);
    doc.setFontSize(12);doc.text(title,14,23);
    doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(93,104,121);
    doc.text(subtitle+" · Édité le "+new Date().toLocaleDateString("fr-FR"),14,29);
    let y=36;
    sheets.forEach(s=>{
      if(!s.rows.length&&!s.keepEmpty)return;
      if(y>H-40){doc.addPage();y=18}
      if(s.title){doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(22,32,46);doc.text(s.title,14,y);y+=2}
      doc.autoTable({startY:y+2,head:[s.head],body:s.rows.map(r=>r.map(c=>typeof c==="number"?nf(c):String(c??""))),
        theme:"striped",margin:{left:14,right:14,bottom:16},styles:{font:"helvetica",fontSize:8,cellPadding:2,textColor:[22,32,46]},
        headStyles:{fillColor:[11,110,91],textColor:255,fontStyle:"bold"},alternateRowStyles:{fillColor:[243,246,244]}});
      y=doc.lastAutoTable.finalY+9;
    });
    const n=doc.internal.getNumberOfPages();
    for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(93,104,121);doc.text(`Page ${i} / ${n}`,W-14,H-8,{align:"right"})}
    doc.save(file+".pdf");
  }catch(e){toast(errMsg(e),true)}
}
async function qAll(make){let all=[],from=0;for(;;){const d=await q(make().range(from,from+999));all=all.concat(d);if(d.length<1000)return all;from+=1000}}

/* ---------- tableau de bord ---------- */
function rateClass(p){return p>=90?"p-ok":p>=70?"p-warn":"p-bad"}
const DPRESETS=[["semaine","Semaine"],["mois","Mois"],["semestre","Semestre"],["perso","Perso."]];
function trendChart(buckets){
  /* courbe : heures prévues (pointillés) et heures validées (aire) par semaine ou par jour */
  const wide=window.innerWidth>720,W=wide?1040:360,H=wide?250:210,L=wide?44:34,R=14,T=14,B=30,n=buckets.length;
  const maxH=Math.max(1,Math.ceil(Math.max(...buckets.map(b=>Math.max(b.prev,b.val)))/60));
  const X=i=>n===1?L+(W-L-R)/2:L+i*(W-L-R)/(n-1),Y=h=>T+(H-T-B)*(1-h/maxH);
  const pts=k=>buckets.map((b,i)=>`${X(i).toFixed(1)},${Y(b[k]/60).toFixed(1)}`).join(" ");
  const step=Math.ceil(n/(wide?10:4));
  const area=n>1?`<polygon points="${X(0).toFixed(1)},${Y(0)} ${pts("val")} ${X(n-1).toFixed(1)},${Y(0)}" fill="var(--accent)" fill-opacity=".14"/>`:"";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Heures prévues et validées par ${buckets[0]?.unit||"semaine"}" style="width:100%;height:auto;display:block">
    ${[0,.5,1].map(f=>{const h=maxH*f;return `<line x1="${L}" x2="${W-R}" y1="${Y(h)}" y2="${Y(h)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(h)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${Math.round(h)} h</text>`}).join("")}
    ${area}${n>1?`<polyline points="${pts("prev")}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/><polyline points="${pts("val")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`:""}
    ${buckets.map((b,i)=>`<circle cx="${X(i)}" cy="${Y(b.val/60)}" r="4" fill="var(--accent)"><title>${b.label} : ${hrs(b.val)} validées sur ${hrs(b.prev)} prévues</title></circle>${n===1?`<circle cx="${X(i)}" cy="${Y(b.prev/60)}" r="4" fill="none" stroke="var(--muted)"/>`:""}${i%step===0||i===n-1?`<text x="${X(i)}" y="${H-8}" text-anchor="${i===0&&n>1?"start":i===n-1&&n>1?"end":"middle"}" font-size="12" fill="var(--muted)">${b.label}</text>`:""}`).join("")}
  </svg>`;
}
async function viewDashboard(v){
  const today=iso(new Date()),now=new Date();
  let sems=[];try{sems=await q(sb.from("semesters").select("label,start_date,end_date").order("start_date"))}catch(e){}
  const sem=sems.find(s=>s.start_date<=today&&today<=s.end_date)||sems[sems.length-1];
  S.dPreset=S.dPreset||"mois";
  if(S.dPreset==="semestre"&&!sem)S.dPreset="mois";
  if(S.dPreset==="semaine"){S.dFrom=iso(mondayOf(now));S.dTo=iso(addDays(mondayOf(now),6))}
  else if(S.dPreset==="mois"){S.dFrom=iso(new Date(now.getFullYear(),now.getMonth(),1));S.dTo=iso(new Date(now.getFullYear(),now.getMonth()+1,0))}
  else if(S.dPreset==="semestre"){S.dFrom=sem.start_date;S.dTo=sem.end_date}

  v.innerHTML=`<h1>Tableau de bord</h1>
    <p class="lead">${fdl(S.dFrom)} au ${fdl(S.dTo)}${S.dPreset==="semestre"&&sem?" · "+esc(sem.label):""}</p>
    <div class="dtools" style="margin-bottom:${S.dPreset==="perso"?"10":"18"}px">
      <div class="seg" role="group" aria-label="Période">${presets.map(([k,l])=>`<button data-pre="${k}" aria-pressed="${S.dPreset===k}">${l}</button>`).join("")}</div>
      ${xbar("dX")}</div>
    ${S.dPreset==="perso"?`<div class="row" style="margin-bottom:18px"><label>Du<input id="dF" type="date" value="${S.dFrom}"></label><label>Au<input id="dT" type="date" value="${S.dTo}"></label><button class="btn" id="dOk">Afficher</button></div>`:""}
    <div id="dBody"><p class="empty">Chargement…</p></div>`;
  v.querySelectorAll("[data-pre]").forEach(b=>b.onclick=()=>{S.dPreset=b.dataset.pre;rerender()});
  if(S.dPreset==="perso")dOk.onclick=()=>{if(dT.value<dF.value){toast("La date de fin doit être après la date de début.",true);return}S.dFrom=dF.value;S.dTo=dT.value;rerender()};

  const sess=await qAll(()=>sb.from("schedule_sessions").select("id,session_date,start_time,end_time,status,teacher_id,teachers(first_name,last_name,departments(code)),teaching_assignments(courses(code,name,departments(code))),student_groups(code),attendance_records(status,retained_minutes,declared_minutes,entered_for_teacher)").gte("session_date",S.dFrom).lte("session_date",S.dTo).order("session_date"));
  const due=sess.filter(s=>s.status!=="annulee"&&s.session_date<=today);
  const K={prevues:due.length,annulees:sess.filter(s=>s.status==="annulee").length,emargees:0,valid:0,wait:0,corr:0,rej:0,deleg:0,minPrev:0,minVal:0,minWait:0};
  const dep={},tea={},sans=[],bk={};
  const span=(new Date(S.dTo)-new Date(S.dFrom))/864e5,byDay=span<=14;
  due.forEach(s=>{
    const a=s.attendance_records,pm=toMin(s.end_time)-toMin(s.start_time);
    const dc=s.teaching_assignments?.courses?.departments?.code||"—";
    const d=dep[dc]??={code:dc,prev:0,em:0,minPrev:0,minVal:0,minWait:0};
    const t=tea[s.teacher_id]??={name:s.teachers?(s.teachers.last_name+" "+s.teachers.first_name):"—",dep:s.teachers?.departments?.code||"—",prev:0,em:0,minVal:0,minWait:0};
    const key=byDay?s.session_date:iso(mondayOf(new Date(s.session_date+"T12:00:00")));
    const b=bk[key]??={key,prev:0,val:0};
    K.minPrev+=pm;d.prev++;d.minPrev+=pm;t.prev++;b.prev+=pm;
    if(!a){sans.push(s);return}
    K.emargees++;d.em++;t.em++;
    if(a.entered_for_teacher)K.deleg++;
    if(a.status==="valide"){const m=a.retained_minutes||0;K.valid++;K.minVal+=m;d.minVal+=m;t.minVal+=m;b.val+=m}
    else if(a.status==="soumis"){const m=a.declared_minutes||0;K.wait++;K.minWait+=m;d.minWait+=m;t.minWait+=m}
    else if(a.status==="correction_demandee")K.corr++;
    else if(a.status==="rejete")K.rej++;
  });
  const pct=(a,b)=>b?Math.round(a/b*100):0;
  const rate=pct(K.emargees,K.prevues);
  const deps=Object.values(dep).sort((a,b)=>b.minPrev-a.minPrev);
  const teas=Object.values(tea).sort((a,b)=>pct(a.em,a.prev)-pct(b.em,b.prev)||a.name.localeCompare(b.name));
  const sansSorted=sans.slice().sort((a,b)=>a.session_date.localeCompare(b.session_date));
  const buckets=Object.values(bk).sort((a,b)=>a.key.localeCompare(b.key)).map(b=>({...b,unit:byDay?"jour":"semaine",label:new Date(b.key+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}));
  let pay=null;
  if(has("finance")||has("direction")){
    try{
      const [slips,pays,open]=await Promise.all([qAll(()=>sb.from("payslips").select("id,net_fcfa")),qAll(()=>sb.from("payments").select("amount_fcfa")),
        qAll(()=>sb.from("attendance_records").select("retained_minutes").eq("status","valide").is("pay_period_id",null))]);
      const net=slips.reduce((s,x)=>s+x.net_fcfa,0),paid=pays.reduce((s,x)=>s+x.amount_fcfa,0);
      pay={net,paid,due:net-paid,openMin:open.reduce((s,x)=>s+(x.retained_minutes||0),0)};
    }catch(e){pay=null}
  }
  const ringColor=rate>=90?"var(--ok)":rate>=70?"var(--warn)":"var(--bad)",C=2*Math.PI*52;
  const late=sans.length;
  const headline=K.prevues?`${K.emargees} séance${K.emargees>1?"s":""} émargée${K.emargees>1?"s":""} sur ${K.prevues}`:"Aucune séance prévue sur cette période";
  const hero=`<div class="panel hero">
    <svg class="ring" viewBox="0 0 120 120" role="img" aria-label="Taux d'émargement : ${rate} %"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="12"/>
      <circle cx="60" cy="60" r="52" fill="none" stroke="${ringColor}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(C*rate/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 60 60)"/>
      <text x="60" y="68" text-anchor="middle" font-size="26" font-weight="700" fill="var(--ink)">${rate} %</text></svg>
    <div class="herotxt"><div class="sub">Taux d'émargement</div><div class="bigline">${headline}</div>
      <div class="${late?"late":"sub"}">${K.prevues?(late?`${late} séance${late>1?"s":""} sans émargement`:"Aucun retard : toutes les séances sont émargées"):""}</div>
      <div class="mini"><div><b>${hrs(K.minVal)}</b><span>validées</span></div><div><b>${hrs(K.minPrev)}</b><span>prévues</span></div><div><b>${hrs(K.minWait)}</b><span>à valider</span></div><div><b>${K.deleg}</b><span>par délégation</span></div></div></div></div>`;
  const cards={
    val:K.wait?`<div class="panel act"><div class="sub">À valider</div><div class="actn" style="color:var(--warn)">${K.wait}</div><div class="sub">émargement${K.wait>1?"s":""} en attente · ${hrs(K.minWait)}</div>${has("responsable")?`<button class="btn primary" id="goCtl">Valider maintenant</button>`:""}</div>`:"",
    sans:late?`<div class="panel act"><div class="sub">Sans émargement</div><div class="actn" style="color:var(--bad)">${late}</div><div class="sub">séance${late>1?"s":""} passée${late>1?"s":""} à relancer</div><button class="btn" id="goSans">Voir la liste</button></div>`:"",
    pay:pay?`<div class="panel act"><div class="sub">Reste dû sur les paies approuvées</div><div class="actn">${fcfa(pay.due)}</div>
      <div class="hbar" style="width:100%"><i style="width:${pct(pay.paid,pay.net)}%"></i></div><div class="sub">${fcfa(pay.paid)} réglés sur ${fcfa(pay.net)} · ${hrs(pay.openMin)} validées pas encore payées</div><button class="btn" id="goPay">Ouvrir la paie</button></div>`:""};
  const onlyFin=has("finance")&&!has("planificateur")&&!has("responsable"),onlyVal=has("responsable")&&!has("planificateur")&&!has("finance");
  const order=onlyFin?["pay","val","sans"]:onlyVal?["val","sans","pay"]:["sans","val","pay"];
  const acts=order.map(k=>cards[k]).filter(Boolean).join("");
  const seg=(d)=>{const p1=pct(d.minVal,d.minPrev),p2=pct(d.minWait,d.minPrev);return `<div class="stack" title="${hrs(d.minVal)} validées · ${hrs(d.minWait)} en attente · ${hrs(Math.max(0,d.minPrev-d.minVal-d.minWait))} manquantes"><i style="width:${p1}%;background:var(--accent)"></i><i style="width:${Math.min(p2,100-p1)}%;background:var(--ochre)"></i></div>`};
  const maxPrev=Math.max(1,...deps.map(d=>d.minPrev));
  document.getElementById("dBody").innerHTML=`${hero}
    ${acts?`<div class="acts">${acts}</div>`:""}

function fieldHtml(f,val){
  const id="f_"+f.k;
  if(f.t==="select")return `<label>${f.l}<select id="${id}" ${f.req?"required":""}>${f.req?"":'<option value="">—</option>'}${f.opt.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(val)?"selected":""}>${esc(l)}</option>`).join("")}</select></label>`;
  if(f.t==="bool")return `<label style="flex-direction:row;align-items:center;gap:8px;align-self:end"><input id="${id}" type="checkbox" ${val?"checked":""}> ${f.l}</label>`;
  return `<label>${f.l}<input id="${id}" type="${f.t||"text"}" ${f.req?"required":""} ${f.min!=null?`min="${f.min}"`:""} ${f.step?`step="${f.step}"`:""} value="${esc(val??"")}"></label>`;
}
function readFields(fields){
  const o={};
  fields.forEach(f=>{const el=document.getElementById("f_"+f.k);let v;
    if(f.t==="bool")v=el.checked;
    else{v=el.value.trim();
      if(f.t==="number")v=v===""?null:Number(v);
      else if(f.t==="select"&&f.num)v=v===""?null:Number(v);
      else if(v==="")v=null}
    o[f.k]=v});
  return o;
}

const TRASH=`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></svg>`;

const NEED={department_id:"Créez d'abord un département (onglet Structure).",program_id:"Créez d'abord une filière (onglet Structure).",academic_year_id:"Créez d'abord une année universitaire (onglet Années et semestres).",status_id:"Aucun statut d'enseignant : ajoutez-en un dans « Statuts des enseignants »."};
function formDialog(def,row){
  const vals=row||def.defaults||{};
  const missing=def.fields.filter(f=>f.t==="select"&&f.req&&!f.opt.length);
  openDialog(`<h3>${row?"Modifier":"Ajouter"} : ${esc(def.one)}</h3>
    ${missing.length?`<div class="gpwarn">${missing.map(f=>esc(NEED[f.k]||"Aucun choix disponible pour « "+f.l+" ».")).join(" ")}</div>`:""}
    <div class="grid2">${def.fields.map(f=>fieldHtml(f,vals[f.k])).join("")}</div>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok" ${missing.length?"disabled":""}>Enregistrer</button></div>`,
  async()=>{
    let o=readFields(def.fields);
    if(def.normalize)o=def.normalize(o);
    if(def.check)def.check(o);
    if(def.before)await def.before(o,row);
    let saved=row;
    if(row)await q(sb.from(def.table).update(o).eq("id",row.id));
    else if(def.after)saved=await q(sb.from(def.table).insert(o).select().single());
    else await q(sb.from(def.table).insert(o));
    if(def.after)await def.after(o,saved);
    toast("Enregistré");rerender();
  });
}
function deleteDialog(def,row){
  const nm=(def.name||(r=>r.name||r.label||r.code||("n° "+r.id)))(row);
  openDialog(`<h3>Supprimer « ${esc(nm)} » ?</h3>
    <p style="margin:0">La suppression est définitive. Si cet élément est déjà utilisé (séances, affectations, bulletins), elle sera refusée.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn danger" value="ok">Supprimer</button></div>`,
  async()=>{const r=await q(sb.from(def.table).delete().eq("id",row.id).select());
    if(!r.length)throw new Error("Suppression refusée.");toast("Supprimé");rerender()});
}

    ${counts?`<div class="panel setup"><div class="su-top"><div><b>Mise en place</b><div class="sub">${doneN===SETUP_STEPS.length?"Tout est renseigné.":"Suivez l'ordre : chaque étape dépend de la précédente."}</div></div><span class="su-n">${doneN}/${SETUP_STEPS.length}</span></div>
      <div class="hbar" style="width:100%;height:8px;margin:12px 0 ${doneN===SETUP_STEPS.length?0:12}px"><i style="width:${Math.round(doneN/SETUP_STEPS.length*100)}%"></i></div>
      ${doneN===SETUP_STEPS.length?"":`<div class="su-steps">${SETUP_STEPS.map(([l,,sc],i)=>`<button type="button" class="su ${counts[i]?"done":""} ${i===nextIdx?"next":""}" data-su="${sc}"><span class="su-i">${counts[i]?"✓":i+1}</span><span class="su-l">${l}</span><span class="su-c">${counts[i]||""}</span></button>`).join("")}</div>`}</div>`:""}
    <div class="chips secnav">${allowed.length>1?allowed.map(k=>`<button data-sec="${k}" aria-pressed="${k===sec}">${SEC_LABEL[k]}</button>`).join(""):""}</div>
    <div id="refBody"></div>`;
  v.querySelectorAll("[data-su]").forEach(b=>b.onclick=()=>{S.refSec=b.dataset.su;rerender()});
  v.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{S.refSec=b.dataset.sec;rerender()});
  const body=document.getElementById("refBody");
  if(sec==="comptes"){await viewAccounts(body);return}
  const defs=refDefs(await refLookups());
  body.innerHTML=BLOCKS_BY_SEC[sec].map(k=>`<div id="blk-${k}"></div>`).join("");
  await Promise.all(BLOCKS_BY_SEC[sec].map(k=>renderBlock(defs[k],document.getElementById("blk-"+k))));
}

/* ---------- comptes et rôles ---------- */
const SIMPLE_ROLES=["admin","planificateur","professeur","finance"];
async function callUsers(body){
  const {data,error}=await sb.functions.invoke("manage-users",{body});
  if(error){let m=error.message;try{const j=await error.context.json();if(j&&j.error)m=j.error}catch(e){}throw new Error(m)}
  if(data&&data.error)throw new Error(data.error);
  return data;
}
function roleBoxes(deps,current){
  const has_=(r,d)=>current.has(r+"|"+(d||""));
  const box=(r,d,l)=>`<label style="flex-direction:row;align-items:center;gap:8px;color:var(--ink)"><input type="checkbox" data-role="${r}" data-dep="${d||""}" ${has_(r,d)?"checked":""}> ${l}</label>`;
  return `<div style="display:grid;gap:6px"><span class="sub">Rôles</span>
    ${SIMPLE_ROLES.map(r=>box(r,"",ROLE_LABEL[r])).join("")}
    <span class="sub" style="margin-top:6px">Validation des heures : départements concernés</span>
    ${box("responsable","","Tous les départements")}${deps.map(d=>box("responsable",d.id,esc(d.code+" · "+d.name))).join("")}</div>`;
}
function readRoleBoxes(){
  const s=new Set();
  document.querySelectorAll("#dlgForm input[data-role]").forEach(c=>{if(c.checked)s.add(c.dataset.role+"|"+c.dataset.dep)});
  return s;
}
function showCredentials(title,email,pwd){
  const f=document.getElementById("dlgForm");
  f.innerHTML=`<h3>${esc(title)}</h3>
    <dl class="kv"><dt>Adresse</dt><dd class="mono">${esc(email)}</dd><dt>Mot de passe provisoire</dt><dd class="mono" id="tmpPwd" style="user-select:all">${esc(pwd)}</dd></dl>
    <p class="sub" style="margin:0">Transmettez-le à la personne. Il ne sera plus affiché. Elle pourra le changer depuis « Mon mot de passe ».</p>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="cpPwd">Copier</button><button class="btn primary" value="cancel">Fermer</button></div>`;
  document.getElementById("cpPwd").onclick=async()=>{try{await navigator.clipboard.writeText(pwd);toast("Copié")}catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById("tmpPwd"));const s=getSelection();s.removeAllRanges();s.addRange(r)}};
  document.getElementById("dlg").addEventListener("close",()=>rerender(),{once:true});
}

async function viewAccounts(el){
  const [profiles,roles,teachers,deps]=await Promise.all([
    q(sb.from("profiles").select("id,full_name,email,active").order("full_name")),
    q(sb.from("user_roles").select("id,user_id,role,department_id")),
    q(sb.from("teachers").select("id,profile_id,first_name,last_name,email")),
    q(sb.from("departments").select("id,code,name").order("code"))]);
  const dcode=id=>deps.find(d=>d.id===id)?.code;
  el.innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="margin-top:0">Comptes · ${profiles.length}</h2><button class="btn sm primary" id="addAcc">Créer un compte</button></div>
    <p class="sub" style="margin:0 0 10px">Un compte est lié automatiquement à l'enseignant qui a la même adresse e-mail. Le rôle « Professeur » donne accès à l'émargement.</p>
    <div class="panel tbl"><table><thead><tr><th>Nom</th><th>Rôles</th><th>Enseignant</th><th>État</th><th></th></tr></thead><tbody>
    ${profiles.map(u=>{const rs=roles.filter(r=>r.user_id===u.id);const t=teachers.find(t=>t.profile_id===u.id);
      return `<tr><td>${esc(u.full_name)}<div class="sub mono">${esc(u.email)}</div></td>
      <td><div class="chips">${rs.length?rs.map(r=>`<span class="pill p-info">${ROLE_LABEL[r.role]}${r.role==="responsable"?" · "+(r.department_id?esc(dcode(r.department_id)):"tous"):""}</span>`).join(""):'<span class="sub">Aucun rôle</span>'}</div></td>
      <td>${t?esc(t.first_name+" "+t.last_name):'<span class="sub">—</span>'}</td>
      <td>${u.active===false?'<span class="pill p-bad">Désactivé</span>':'<span class="pill p-ok">Actif</span>'}</td>
      <td><div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm" data-ro="${u.id}">Rôles</button><button class="btn sm" data-pw="${u.id}">Mot de passe</button>
        ${u.id!==S.user.id?`<button class="btn sm ${u.active===false?"":"danger"}" data-ac="${u.id}">${u.active===false?"Réactiver":"Désactiver"}</button>`:""}</div></td></tr>`}).join("")}
    </tbody></table></div>`;

  const saveRoles=async(userId,desired)=>{
    const mine=roles.filter(r=>r.user_id===userId);
    const key=r=>r.role+"|"+(r.department_id||"");
    const have=new Set(mine.map(key));
    if(userId===S.user.id&&mine.some(r=>r.role==="admin")&&!desired.has("admin|"))throw new Error("Vous ne pouvez pas retirer votre propre rôle d'administrateur.");
    for(const r of mine)if(!desired.has(key(r)))await q(sb.from("user_roles").delete().eq("id",r.id));
    for(const k of desired)if(!have.has(k)){const [role,dep]=k.split("|");await q(sb.from("user_roles").insert({user_id:userId,role,department_id:dep?Number(dep):null}))}
  };

  addAcc.onclick=()=>{
    const free=teachers.filter(t=>!t.profile_id);
    openDialog(`<h3>Créer un compte</h3>
      ${free.length?`<label>Enseignant sans compte (facultatif)<select id="aT"><option value="">—</option>${free.map(t=>`<option value="${t.id}">${esc(t.first_name+" "+t.last_name+" · "+t.email)}</option>`).join("")}</select></label>`:""}
      <div class="grid2"><label>Nom complet<input id="aN" required></label><label>Adresse e-mail<input id="aE" type="email" required></label></div>
      ${roleBoxes(deps,new Set())}
      <p class="sub" style="margin:0">Un mot de passe provisoire sera généré et affiché une seule fois.</p>
      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Créer le compte</button></div>`,
    async()=>{
      const desired=readRoleBoxes();
      const r=await callUsers({action:"create",email:aE.value,full_name:aN.value});
      try{await saveRoles(r.user_id,desired)}catch(e){toast("Compte créé, mais les rôles n'ont pas pu être enregistrés : "+errMsg(e),true)}
      showCredentials("Compte créé",r.email,r.temp_password);
      return "keep";
    });
    const sel=document.getElementById("aT");
    if(sel)sel.onchange=()=>{const t=free.find(x=>x.id==sel.value);if(!t)return;aN.value=t.first_name+" "+t.last_name;aE.value=t.email;
      const c=document.querySelector('#dlgForm input[data-role="professeur"]');if(c)c.checked=true};
  };
  el.querySelectorAll("[data-ro]").forEach(b=>b.onclick=()=>{
    const u=profiles.find(p=>p.id===b.dataset.ro);const cur=new Set(roles.filter(r=>r.user_id===u.id).map(r=>r.role+"|"+(r.department_id||"")));
    openDialog(`<h3>Rôles de ${esc(u.full_name)}</h3>${roleBoxes(deps,cur)}
      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Enregistrer</button></div>`,
    async()=>{await saveRoles(u.id,readRoleBoxes());toast("Rôles enregistrés");rerender()});
  });
  el.querySelectorAll("[data-pw]").forEach(b=>b.onclick=()=>{
    const u=profiles.find(p=>p.id===b.dataset.pw);
    openDialog(`<h3>Réinitialiser le mot de passe</h3><p style="margin:0">Un nouveau mot de passe provisoire sera créé pour <b>${esc(u.full_name)}</b>. L'ancien ne fonctionnera plus.</p>
      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Réinitialiser</button></div>`,
    async()=>{const r=await callUsers({action:"reset_password",user_id:u.id});showCredentials("Nouveau mot de passe",u.email,r.temp_password);return "keep"});
  });
  el.querySelectorAll("[data-ac]").forEach(b=>b.onclick=()=>{
    const u=profiles.find(p=>p.id===b.dataset.ac);const to=u.active===false;
    openDialog(`<h3>${to?"Réactiver":"Désactiver"} le compte ?</h3><p style="margin:0">${to?"La personne pourra de nouveau se connecter.":"La personne ne pourra plus se connecter. Ses données et son historique sont conservés."}</p>
      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn ${to?"primary":"danger"}" value="ok">${to?"Réactiver":"Désactiver"}</button></div>`,
    async()=>{await callUsers({action:"set_active",user_id:u.id,active:to});toast(to?"Compte réactivé":"Compte désactivé");rerender()});
  });
}

    <label>Confirmer<input id="pw2" type="password" minlength="8" required autocomplete="new-password"></label>
