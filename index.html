<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UCAB Enseignements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Literata:opsz,wght@7..72,600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<style>
/* Mise en page : barre d'en-tête, onglets selon le rôle, contenu en registre (tableaux denses, pastilles d'état) */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --line:#dde1e8; --ink:#16202e; --muted:#5d6879;
  --accent:#1d4f8c; --accent-soft:#e3ecf7; --ochre:#a8660c;
  --ok:#1f7a4a; --ok-soft:#e2f3ea; --warn:#9a5b00; --warn-soft:#fbf0dc; --bad:#b3261e; --bad-soft:#fbe6e4;
  --f-display:"Literata", Georgia, serif; --f-body:"IBM Plex Sans", system-ui, sans-serif; --f-mono:"IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e28; --line:#2a3443; --ink:#e6eaf0; --muted:#98a3b4;
  --accent:#7fb0ec; --accent-soft:#1c2b40; --ochre:#e0a24a;
  --ok:#5cc58c; --ok-soft:#163324; --warn:#e7b04f; --warn-soft:#3a2c12; --bad:#f0857c; --bad-soft:#3d1a18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e28; --line:#2a3443; --ink:#e6eaf0; --muted:#98a3b4;
  --accent:#7fb0ec; --accent-soft:#1c2b40; --ochre:#e0a24a;
  --ok:#5cc58c; --ok-soft:#163324; --warn:#e7b04f; --warn-soft:#3a2c12; --bad:#f0857c; --bad-soft:#3d1a18; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:.01em}
.brand small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400}
.who{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-top:1px solid var(--line)}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font:500 14px var(--f-body);color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
main{padding-block:24px 64px}
h1{font-family:var(--f-display);font-weight:600;font-size:26px;margin:0 0 4px;text-wrap:balance}
h2{font-size:16px;font-weight:600;margin:28px 0 10px}
.lead{color:var(--muted);margin:0 0 20px;max-width:70ch}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stat b{display:block;font:500 24px var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--accent-soft);color:var(--accent)}
.p-mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.gap{color:var(--ochre);font-weight:500}
button.btn,.btn{font:500 14px var(--f-body);border-radius:6px;padding:7px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input,select,textarea{font:14px var(--f-body);padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.login{max-width:440px;margin:8vh auto 0}
.login .panel{padding:24px;display:flex;flex-direction:column;gap:14px}
.demo{margin-top:16px;font-size:13px}
.demo button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 2px;color:var(--ink);font:13px var(--f-body);cursor:pointer}
.demo button span{color:var(--muted);float:right}
.err{color:var(--bad);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;z-index:20;max-width:90vw}
.toast.bad{background:var(--bad);color:var(--surface)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(520px,94vw)}
dialog::backdrop{background:rgba(10,15,25,.45)}
dialog form{padding:20px;display:flex;flex-direction:column;gap:12px}
dialog h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:19px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.week{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:8px;overflow-x:auto}
.day{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:120px}
.day h4{margin:0;padding:8px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line)}
.slot{margin:8px;padding:8px;border-radius:6px;background:var(--accent-soft);font-size:13px}
.slot.conf{background:var(--bad-soft)}
.slot b{display:block}
.empty{padding:28px;text-align:center;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:4px 11px;font:13px var(--f-body);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
@media (max-width:560px){h1{font-size:22px}.who .name{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script id="pdf-builder">
/* Bulletin PDF : construit uniquement à partir de la version figée (snapshot) du bulletin */
function makePayslipPdf(jsPDF, slip, payments){
  const sn=slip.snapshot, E=sn.enseignant, P=sn.periode;
  const money=n=>Math.round(n||0).toLocaleString("fr-FR").replace(/[  ]/g," ")+" FCFA";
  const d=s=>{const [y,m,j]=String(s).slice(0,10).split("-");return j+"/"+m+"/"+y};
  const h=m=>{const H=Math.floor(m/60),M=m%60;return H+" h"+(M?" "+String(M).padStart(2,"0"):"")};
  const ink=[22,32,46], muted=[93,104,121], accent=[29,79,140], line=[221,225,232];
  const doc=new jsPDF({unit:"mm",format:"a4"}); const W=210, L=16, R=W-16;

  doc.setFillColor(...accent); doc.rect(0,0,W,4,"F");
  doc.setFont("helvetica","bold"); doc.setFontSize(18); doc.setTextColor(...ink); doc.text("UCAB",L,18);
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...muted);
  doc.text("Université de démonstration · Service financier",L,23.5);
  doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(...ink);
  doc.text("Bulletin de rémunération",R,16,{align:"right"});
  doc.setFont("courier","normal"); doc.setFontSize(10); doc.text(slip.number,R,22,{align:"right"});

  doc.setDrawColor(...line); doc.line(L,29,R,29);
  const block=(x,title,rows)=>{doc.setFont("helvetica","bold");doc.setFontSize(8);doc.setTextColor(...muted);doc.text(title.toUpperCase(),x,36);
    rows.forEach(([k,v],i)=>{const y=42+i*5.4;doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(...muted);doc.text(k,x,y);
      doc.setTextColor(...ink);doc.text(String(v||"-"),x+27,y)})};
  block(L,"Enseignant",[["Nom",E.nom],["Statut",E.statut],["Département",E.departement],["E-mail",E.email]]);
  block(112,"Période",[["Libellé",P.nom],["Du",d(P.debut)],["Au",d(P.fin)],["Approuvé le",d(sn.approuve_le)]]);

  const lines=sn.lignes.map(l=>[d(l.date)+(l.rattrapage?" (rattrapage)":""),l.cours,l.groupe,h(l.minutes),
    money(l.tarif)+(l.source==="individuel"?" *":""),money(l.montant)]);
  doc.autoTable({startY:68,head:[["Date","Cours","Groupe","Durée","Tarif horaire","Montant"]],body:lines,
    theme:"plain",margin:{left:L,right:16},
    styles:{font:"helvetica",fontSize:8.5,textColor:ink,cellPadding:{top:2,bottom:2,left:2,right:2},lineColor:line,lineWidth:{bottom:0.2}},
    headStyles:{fontStyle:"bold",textColor:muted,fontSize:7.5,lineWidth:{bottom:0.4},lineColor:ink},
    columnStyles:{0:{cellWidth:30},2:{cellWidth:22},3:{halign:"right",cellWidth:16},4:{halign:"right",cellWidth:30},5:{halign:"right",cellWidth:28}}});

  let y=doc.lastAutoTable.finalY+8;
  if(y>230){doc.addPage();y=20}
  const paid=(payments||[]).reduce((s,p)=>s+p.amount_fcfa,0);
  const tot=[["Heures payables",h(slip.total_minutes)],["Rémunération brute",money(slip.gross_fcfa)],["Primes",money(0)],
    ["Retenues et cotisations",money(slip.deductions_fcfa)]];
  const x0=112;
  tot.forEach(([k,v],i)=>{doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(...muted);doc.text(k,x0,y+i*6);doc.setTextColor(...ink);doc.text(v,R,y+i*6,{align:"right"})});
  y+=tot.length*6;
  doc.setFillColor(227,236,247); doc.rect(x0-3,y-4.5,R-x0+5,10,"F");
  doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(...accent);
  doc.text("Net à payer",x0,y+2); doc.text(money(slip.net_fcfa),R,y+2,{align:"right"});
  y+=13;
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...muted);
  doc.text("Réglé à ce jour",x0,y); doc.setTextColor(...ink); doc.text(money(paid),R,y,{align:"right"});
  doc.setTextColor(...muted); doc.text("Reste dû",x0,y+6); doc.setTextColor(...ink); doc.text(money(slip.net_fcfa-paid),R,y+6,{align:"right"});

  if((payments||[]).length){doc.setFontSize(8);doc.setTextColor(...muted);
    doc.text("Règlements : "+payments.map(p=>d(p.paid_on)+" "+p.method+" "+money(p.amount_fcfa)+(p.reference?" ("+p.reference+")":"")).join(" ; "),L,y+16,{maxWidth:R-L})}

  doc.setFontSize(7.5); doc.setTextColor(...muted);
  const foot=["Montant = durée retenue × tarif horaire en vigueur à la date de la séance. * Tarif individuel.",
    "Aucune retenue ni cotisation n'est appliquée selon les règles actuelles de l'établissement.",
    "Bulletin approuvé par "+(sn.approuve_par||"le service financier")+". Ce document ne vaut pas preuve de paiement.",
    "Édité le "+new Date().toLocaleDateString("fr-FR")+" · "+slip.number];
  foot.forEach((t,i)=>doc.text(t,L,282+i*3.6-(foot.length-1)*3.6));
  return doc;
}
</script>

<script>
const SUPABASE_URL = "https://fkfuviwquoacpehmctsn.supabase.co";
const SUPABASE_KEY = "sb_publishable_R98wA_kmIeqPt2YTmCRLQQ_69QKmx4s";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DEMO = [
  ["awa.ndiaye@univdemo.test","Professeure (Informatique)"],
  ["resp.info@univdemo.test","Resp. Informatique + professeur"],
  ["resp.gd@univdemo.test","Resp. Gestion et Droit"],
  ["planif@univdemo.test","Emplois du temps"],
  ["finance@univdemo.test","Service financier"],
  ["direction@univdemo.test","Direction"],
  ["admin@univdemo.test","Administrateur"]];
const DAYS = ["","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const ROLE_LABEL = {admin:"Administrateur",planificateur:"Emplois du temps",professeur:"Professeur",responsable:"Responsable pédagogique",finance:"Service financier",direction:"Direction"};
const ATT = {
  soumis:["En attente","p-warn"], valide:["Validé","p-ok"], rejete:["Rejeté","p-bad"], correction_demandee:["Correction demandée","p-info"]};

const S = {user:null, roles:[], teacher:null, tab:null, week:mondayOf(new Date()), filter:"soumis", planView:"group", planId:null};
const $app = document.getElementById("app");

/* ---------- utilitaires ---------- */
function esc(v){return String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pad(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function fdate(s){const [y,m,d]=s.split("-").map(Number);const x=new Date(y,m-1,d);return x.toLocaleDateString("fr-FR",{weekday:"short",day:"2-digit",month:"short"})}
function hm(t){return (t||"").slice(0,5)}
function hrs(min){if(min==null)return "—";const h=Math.floor(min/60),m=min%60;return h+" h"+(m?" "+pad(m):"")}
function has(r){return S.roles.some(x=>x.role===r)}
function pill(st){const [l,c]=ATT[st]||["Non émargé","p-mute"];return `<span class="pill ${c}">${l}</span>`}
function toast(msg,bad){const t=document.createElement("div");t.className="toast"+(bad?" bad":"");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),bad?6000:3000)}
function errMsg(e){let m=e?.message||String(e);
  if(m.includes("no_room_overlap"))m="Conflit : la salle est déjà occupée sur ce créneau.";
  if(m.includes("no_teacher_overlap"))m="Conflit : le professeur a déjà un cours sur ce créneau.";
  if(m.includes("no_group_overlap"))m="Conflit : le groupe a déjà un cours sur ce créneau.";
  if(m.includes("Invalid login"))m="Adresse ou mot de passe incorrect.";
  return m}
async function q(p){const {data,error}=await p;if(error)throw error;return data}
function sessionLabel(s){const c=s.teaching_assignments?.courses;return `${esc(c?.code)} · ${esc(c?.name)}`}

/* ---------- connexion ---------- */
function renderLogin(msg){
  $app.innerHTML=`<div class="wrap"><div class="login">
    <h1>UCAB Enseignements</h1>
    <p class="lead">Emplois du temps, émargement des professeurs et contrôle des heures.</p>
    <form class="panel" id="loginForm">
      <label>Adresse e-mail<input id="lEmail" type="email" required autocomplete="username"></label>
      <label>Mot de passe<input id="lPass" type="password" required autocomplete="current-password"></label>
      ${msg?`<div class="err">${esc(msg)}</div>`:""}
      <button class="btn primary" type="submit">Se connecter</button>
    </form>
    <div class="demo"><p class="sub">Comptes de démonstration (mot de passe : <span class="mono">Demo-2026!</span>)</p>
      ${DEMO.map(([e,l])=>`<button type="button" data-email="${e}">${e}<span>${l}</span></button>`).join("")}
    </div></div></div>`;
  document.getElementById("loginForm").onsubmit=async ev=>{ev.preventDefault();
    const {error}=await sb.auth.signInWithPassword({email:lEmail.value.trim(),password:lPass.value});
    if(error)renderLogin(errMsg(error)); else boot()};
  $app.querySelectorAll(".demo button").forEach(b=>b.onclick=()=>{lEmail.value=b.dataset.email;lPass.value="Demo-2026!";lPass.focus()});
}

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){renderLogin();return}
  S.user=session.user;
  try{
    S.roles=await q(sb.rpc("my_roles"));
    const t=await q(sb.from("teachers").select("id,first_name,last_name").eq("profile_id",S.user.id).maybeSingle());
    S.teacher=t;
  }catch(e){toast(errMsg(e),true)}
  const tabs=availableTabs();
  if(!tabs.length){$app.innerHTML=`<div class="wrap"><p class="empty">Aucun rôle n'est attribué à ce compte. Contactez l'administrateur.</p></div>`;return}
  let h=location.hash.slice(1);
  S.tab=tabs.find(t=>t.id===h)?h:tabs[0].id;
  renderShell();
}

function availableTabs(){
  const t=[];
  if(S.teacher)t.push({id:"seances",label:"Mes séances",fn:viewTeacher});
  if(S.teacher)t.push({id:"bulletins",label:"Mes bulletins",fn:viewMyPayslips});
  if(has("responsable")||has("admin"))t.push({id:"controle",label:"Contrôle des émargements",fn:viewReview});
  if(has("planificateur")||has("admin"))t.push({id:"planning",label:"Emplois du temps",fn:viewPlanning});
  if(has("finance")||has("direction")||has("admin")){
    t.push({id:"paie",label:"Paie",fn:viewPayroll});
    t.push({id:"tarifs",label:"Tarifs horaires",fn:viewRates});
    t.push({id:"synthese",label:"Heures validées",fn:viewSummary});}
  if(has("admin"))t.push({id:"referentiel",label:"Référentiel",fn:viewRef});
  if(has("admin")||has("direction"))t.push({id:"journal",label:"Journal",fn:viewAudit});
  return t;
}

function renderShell(){
  const tabs=availableTabs();
  const name=S.user.user_metadata?.full_name||S.user.email;
  const roles=[...new Set(S.roles.map(r=>ROLE_LABEL[r.role]))].join(" · ");
  $app.innerHTML=`<header class="top"><div class="wrap">
      <div class="brand">UCAB<small>Année universitaire 2026-2027</small></div>
      <div class="who"><span class="name"><b style="color:var(--ink)">${esc(name)}</b> · ${esc(roles)}</span>
      <button class="btn sm" id="logout">Se déconnecter</button></div></div>
    <div class="wrap"><nav class="tabs" role="tablist">${tabs.map(t=>`<button role="tab" data-tab="${t.id}" aria-selected="${t.id===S.tab}">${t.label}</button>`).join("")}</nav></div>
  </header><main class="wrap" id="view"><p class="empty">Chargement…</p></main>`;
  logout.onclick=async()=>{await sb.auth.signOut();S.roles=[];S.teacher=null;renderLogin()};
  $app.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;try{history.replaceState(null,"","#"+S.tab)}catch(e){}renderShell()});
  const tab=tabs.find(t=>t.id===S.tab);
  tab.fn(document.getElementById("view")).catch(e=>{document.getElementById("view").innerHTML=`<p class="err">${esc(errMsg(e))}</p>`});
}
function rerender(){renderShell()}

/* ---------- dialogue ---------- */
function openDialog(html,onSubmit){
  const dlg=document.getElementById("dlg"),f=document.getElementById("dlgForm");
  f.innerHTML=html+`<div class="err" id="dlgErr"></div>`;
  f.onsubmit=async ev=>{
    const btn=ev.submitter;if(btn&&btn.value==="cancel")return;
    ev.preventDefault();
    try{btn&&(btn.disabled=true);await onSubmit(btn?btn.value:null,f);dlg.close();}
    catch(e){document.getElementById("dlgErr").textContent=errMsg(e);btn&&(btn.disabled=false)}
  };
  dlg.showModal();
}

/* ---------- professeur ---------- */
const SESSION_SEL="id,session_date,start_time,end_time,status,note,teaching_assignments(courses(code,name)),student_groups(code,name),rooms(code,name),attendance_records(id,status,declared_start,declared_end,declared_minutes,retained_minutes,planned_minutes,teacher_comment,review_reason,submitted_at)";

async function viewTeacher(v){
  const from=iso(S.week),to=iso(addDays(S.week,6));
  const [week,all]=await Promise.all([
    q(sb.from("schedule_sessions").select(SESSION_SEL).eq("teacher_id",S.teacher.id).gte("session_date",from).lte("session_date",to).order("session_date").order("start_time")),
    q(sb.from("attendance_records").select("status,retained_minutes,declared_minutes").eq("teacher_id",S.teacher.id))]);
  const pastNot=await q(sb.from("schedule_sessions").select("id,attendance_records(id)").eq("teacher_id",S.teacher.id).neq("status","annulee").lt("session_date",iso(new Date())));
  const missing=pastNot.filter(s=>!s.attendance_records).length;
  const val=all.filter(a=>a.status==="valide").reduce((s,a)=>s+a.retained_minutes,0);
  const wait=all.filter(a=>a.status==="soumis").reduce((s,a)=>s+a.declared_minutes,0);
  const toFix=all.filter(a=>a.status==="correction_demandee").length;
  const now=new Date();
  v.innerHTML=`<h1>Mes séances</h1>
    <p class="lead">${esc(S.teacher.first_name+" "+S.teacher.last_name)}. Émargez chaque séance après l'avoir dispensée. Seules les heures validées par le responsable comptent pour la rémunération.</p>
    <div class="stats">
      <div class="stat"><b>${hrs(val)}</b><span>Heures validées</span></div>
      <div class="stat"><b>${hrs(wait)}</b><span>En attente de contrôle</span></div>
      <div class="stat"><b style="color:${missing?"var(--warn)":"inherit"}">${missing}</b><span>Séances passées à émarger</span></div>
      <div class="stat"><b style="color:${toFix?"var(--accent)":"inherit"}">${toFix}</b><span>Corrections demandées</span></div>
    </div>
    <div class="row" style="margin-bottom:12px">
      <button class="btn" id="wPrev">← Semaine précédente</button>
      <b style="padding:7px 4px">Semaine du ${S.week.toLocaleDateString("fr-FR",{day:"numeric",month:"long"})}</b>
      <button class="btn" id="wNext">Semaine suivante →</button>
      <button class="btn" id="wNow">Cette semaine</button>
    </div>
    <div class="panel tbl">${week.length?`<table><thead><tr><th>Date</th><th>Horaire</th><th>Cours</th><th>Groupe · Salle</th><th>Émargement</th><th></th></tr></thead><tbody>
    ${week.map(s=>{const a=s.attendance_records;const started=new Date(s.session_date+"T"+s.start_time)<=now;
      let act="";
      if(s.status==="annulee")act=`<span class="pill p-mute">Annulée</span>`;
      else if(!a&&started)act=`<button class="btn primary sm" data-em="${s.id}">Émarger</button>`;
      else if(!a)act=`<span class="sub">À venir</span>`;
      else if(a.status==="soumis"||a.status==="correction_demandee")act=`<button class="btn sm" data-em="${s.id}">${a.status==="correction_demandee"?"Corriger":"Modifier"}</button>`;
      return `<tr><td>${fdate(s.session_date)}</td><td class="mono">${hm(s.start_time)}–${hm(s.end_time)}</td>
      <td>${sessionLabel(s)}${s.note?`<div class="sub">${esc(s.note)}</div>`:""}</td>
      <td>${esc(s.student_groups?.code)}<div class="sub">${esc(s.rooms?.code)}</div></td>
      <td>${s.status==="annulee"?"—":pill(a?.status)}${a?`<div class="sub mono">déclaré ${hm(a.declared_start)}–${hm(a.declared_end)}${a.retained_minutes!=null?" · retenu "+hrs(a.retained_minutes):""}</div>`:""}
        ${a?.review_reason?`<div class="sub">Motif : ${esc(a.review_reason)}</div>`:""}</td>
      <td>${act}</td></tr>`}).join("")}</tbody></table>`:`<p class="empty">Aucune séance cette semaine.</p>`}</div>`;
  wPrev.onclick=()=>{S.week=addDays(S.week,-7);rerender()};
  wNext.onclick=()=>{S.week=addDays(S.week,7);rerender()};
  wNow.onclick=()=>{S.week=mondayOf(new Date());rerender()};
  v.querySelectorAll("[data-em]").forEach(b=>b.onclick=()=>emargeDialog(week.find(s=>s.id==b.dataset.em)));
}

function emargeDialog(s){
  const a=s.attendance_records;
  openDialog(`<h3>Émarger la séance</h3>
    <dl class="kv"><dt>Cours</dt><dd>${sessionLabel(s)}</dd><dt>Date</dt><dd>${fdate(s.session_date)}</dd>
      <dt>Prévu</dt><dd class="mono">${hm(s.start_time)}–${hm(s.end_time)}</dd><dt>Groupe</dt><dd>${esc(s.student_groups?.name)}</dd></dl>
    ${a?.review_reason?`<p class="sub" style="margin:0">Demande du responsable : ${esc(a.review_reason)}</p>`:""}
    <div class="row"><label>Début réel<input id="eStart" type="time" required value="${hm(a?.declared_start||s.start_time)}"></label>
    <label>Fin réelle<input id="eEnd" type="time" required value="${hm(a?.declared_end||s.end_time)}"></label></div>
    <label>Commentaire (obligatoire si la durée diffère)<textarea id="eCom">${esc(a?.teacher_comment||"")}</textarea></label>
    <p class="sub" style="margin:0">Je confirme avoir dispensé ce cours. La déclaration est horodatée et conservée.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Soumettre l'émargement</button></div>`,
  async()=>{
    const st=eStart.value,en=eEnd.value,com=eCom.value.trim();
    const planned=(toMin(s.end_time)-toMin(s.start_time)),decl=toMin(en)-toMin(st);
    if(decl<=0)throw new Error("L'heure de fin doit être après l'heure de début.");
    if(decl!==planned&&!com)throw new Error("La durée déclarée diffère de la durée prévue : ajoutez un commentaire.");
    await q(sb.rpc("submit_attendance",{p_session_id:s.id,p_start:st,p_end:en,p_comment:com||null}));
    toast("Émargement soumis");rerender();
  });
}
function toMin(t){const [h,m]=t.split(":").map(Number);return h*60+m}

/* ---------- responsable ---------- */
async function viewReview(v){

  const rows=await q(qy);
  const counts=await q(sb.from("attendance_records").select("status"));
  const c=k=>counts.filter(x=>x.status===k).length;
  const F=[["soumis","En attente",c("soumis")],["correction_demandee","Correction demandée",c("correction_demandee")],["valide","Validés",c("valide")],["rejete","Rejetés",c("rejete")],["tous","Tous",counts.length]];
  v.innerHTML=`<h1>Contrôle des émargements</h1>
    <p class="lead">Vérifiez les déclarations des professeurs de vos départements. Les écarts entre durée prévue et durée déclarée sont signalés en orange. Vous ne pouvez pas valider vos propres heures.</p>

    <div class="panel tbl">${rows.length?`<table><thead><tr><th>Séance</th><th>Professeur</th><th>Prévu</th><th>Déclaré</th><th>Écart</th><th>État</th><th></th></tr></thead><tbody>
    ${rows.map(a=>{const s=a.schedule_sessions;const d=a.declared_minutes-a.planned_minutes;const self=S.teacher&&a.teacher_id===S.teacher.id;
      return `<tr><td>${fdate(s.session_date)}<div class="sub">${sessionLabel(s)} · ${esc(s.student_groups?.code)} · ${esc(s.rooms?.code)}</div></td>
      <td>${esc(a.teachers.first_name+" "+a.teachers.last_name)}</td>
      <td class="mono">${hm(s.start_time)}–${hm(s.end_time)}</td>
      <td class="mono">${hm(a.declared_start)}–${hm(a.declared_end)}${a.teacher_comment?`<div class="sub" style="font-family:var(--f-body)">« ${esc(a.teacher_comment)} »</div>`:""}</td>
      <td class="mono ${d?"gap":""}">${d?(d>0?"+":"−")+Math.abs(d)+" min":"—"}</td>
      <td>${pill(a.status)}${a.retained_minutes!=null?`<div class="sub">retenu ${hrs(a.retained_minutes)}</div>`:""}${a.review_reason?`<div class="sub">${esc(a.review_reason)}</div>`:""}</td>
      <td>${a.status==="soumis"?(self?`<span class="sub">Vos heures</span>`:`<button class="btn primary sm" data-rv="${a.id}">Contrôler</button>`):""}</td></tr>`}).join("")}
    </tbody></table>`:`<p class="empty">Aucun émargement dans cette catégorie.</p>`}</div>`;
  v.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;rerender()});
  v.querySelectorAll("[data-rv]").forEach(b=>b.onclick=()=>reviewDialog(rows.find(a=>a.id==b.dataset.rv)));

  openDialog(`<h3>Contrôler l'émargement</h3>
    <dl class="kv"><dt>Professeur</dt><dd>${esc(a.teachers.first_name+" "+a.teachers.last_name)}</dd>

      ${a.teacher_comment?`<dt>Commentaire</dt><dd>${esc(a.teacher_comment)}</dd>`:""}</dl>
    <label>Durée retenue (minutes)<input id="rMin" type="number" min="0" max="${a.declared_minutes}" step="5" value="${def}"></label>

    <div class="row" style="justify-content:flex-end">
      <button class="btn" value="cancel" formnovalidate>Fermer</button>
      <button class="btn danger" value="rejete">Rejeter</button>
      <button class="btn" value="correction_demandee">Demander une correction</button>
      <button class="btn primary" value="valide">Valider</button></div>`,
  async(decision)=>{
    await q(sb.rpc("review_attendance",{p_id:a.id,p_decision:decision,p_retained_minutes:decision==="valide"?Number(rMin.value):null,p_reason:rWhy.value.trim()||null}));

    q(sb.from("slot_conflicts").select("*")),
    q(sb.from("student_groups").select("id,code,name").order("code")),

      <span class="mono">${hm(s.start_time)}–${hm(s.end_time)}</span><b>${esc(s.teaching_assignments.courses.code)} ${esc(s.teaching_assignments.courses.name)}</b>
      <span class="sub">${esc(s.teaching_assignments.teachers.last_name)} · ${esc(s.teaching_assignments.student_groups.code)} · ${esc(s.rooms.code)}</span>
      ${s.published?"":`<div><span class="pill p-mute">Brouillon</span></div>`}</div>`).join("")}</div>`).join("")}</div>
    ${conf.length?`<h2>Conflits</h2><div class="panel tbl"><table><thead><tr><th>Jour</th><th>Type</th><th>Créneaux</th></tr></thead><tbody>${conf.map(c=>{const a=slots.find(s=>s.id===c.slot_a),b=slots.find(s=>s.id===c.slot_b);return `<tr><td>${DAYS[c.day_of_week]}</td><td><span class="pill p-bad">${esc(c.conflict_type)}</span></td><td>${esc(a?.teaching_assignments.courses.code)} ${hm(a?.start_time)} / ${esc(b?.teaching_assignments.courses.code)} ${hm(b?.start_time)}</td></tr>`}).join("")}</tbody></table></div>`:""}

/* ---------- synthèse ---------- */
async function viewSummary(v){
  const rows=await q(sb.from("attendance_records").select("status,retained_minutes,declared_minutes,teacher_id,teachers(first_name,last_name,teacher_statuses(label),departments(code))"));
  const by={};
  rows.forEach(a=>{const k=a.teacher_id;by[k]??={t:a.teachers,val:0,wait:0,n:0,rej:0};const o=by[k];o.n++;
    if(a.status==="valide")o.val+=a.retained_minutes; if(a.status==="soumis")o.wait+=a.declared_minutes; if(a.status==="rejete")o.rej++});
  const list=Object.values(by).sort((a,b)=>b.val-a.val);
  const tot=list.reduce((s,o)=>s+o.val,0),tw=list.reduce((s,o)=>s+o.wait,0);
  v.innerHTML=`<h1>Heures validées</h1>
    <p class="lead">Base du calcul de rémunération : seules les durées retenues des émargements validés sont payables.</p>
    <div class="stats"><div class="stat"><b>${hrs(tot)}</b><span>Total validé</span></div><div class="stat"><b>${hrs(tw)}</b><span>En attente</span></div>
      <div class="stat"><b>${rows.length}</b><span>Émargements</span></div></div>
    <div class="panel tbl"><table><thead><tr><th>Professeur</th><th>Département</th><th>Statut</th><th>Validé</th><th>En attente</th><th>Rejets</th></tr></thead><tbody>
    ${list.map(o=>`<tr><td>${esc(o.t.first_name+" "+o.t.last_name)}</td><td>${esc(o.t.departments?.code)}</td><td>${esc(o.t.teacher_statuses?.label)}</td>
      <td class="num">${hrs(o.val)}</td><td class="num">${hrs(o.wait)}</td><td class="num">${o.rej}</td></tr>`).join("")}</tbody></table></div>`;
}

function ppill(map,st){const [l,c]=map[st]||[st,"p-mute"];return `<span class="pill ${c}">${l}</span>`}
function fcfa(n){return Math.round(n||0).toLocaleString("fr-FR").replace(/[  ]/g," ")+" FCFA"}
function fdl(s){if(!s)return "—";const [y,m,d]=String(s).slice(0,10).split("-");return `${d}/${m}/${y}`}
function canPay(){return has("finance")||has("admin")}

async function viewPayroll(v){
  const periods=await q(sb.from("pay_periods").select("*").order("start_date",{ascending:false}));
  const totals=await q(sb.from("payslips").select("pay_period_id,net_fcfa"));
  const items=await q(sb.from("payroll_items").select("pay_period_id,amount_fcfa"));
  const sum=(arr,id)=>arr.filter(x=>x.pay_period_id===id).reduce((s,x)=>s+(x.net_fcfa??x.amount_fcfa),0);
  if(!periods.some(p=>p.id===S.periodId))S.periodId=(periods.find(p=>p.status==="ouverte"||p.status==="en_verification")||periods[0])?.id;
  const p=periods.find(x=>x.id===S.periodId);
  v.innerHTML=`<h1>Paie</h1>
    <p class="lead">Rémunération à l'heure, calculée uniquement sur les heures validées. Une fois la période approuvée, les bulletins sont figés et chaque séance payée ne peut plus être reprise dans une autre période.</p>
    <div class="row" style="justify-content:space-between"><h2 style="margin-top:0">Périodes de rémunération</h2>${canPay()?`<button class="btn sm" id="newP">Nouvelle période</button>`:""}</div>
    <div class="panel tbl">${periods.length?`<table><thead><tr><th>Période</th><th>Du</th><th>Au</th><th>Limite d'émargement</th><th>État</th><th>Montant</th><th></th></tr></thead><tbody>
    ${periods.map(x=>`<tr ${x.id===S.periodId?'style="background:var(--accent-soft)"':""}><td><b>${esc(x.name)}</b></td><td class="mono">${fdl(x.start_date)}</td><td class="mono">${fdl(x.end_date)}</td><td class="mono">${fdl(x.attendance_deadline)}</td>
      <td>${ppill(PER,x.status)}</td><td class="num">${x.status==="ouverte"?"—":fcfa(["approuvee","payee"].includes(x.status)?sum(totals,x.id):sum(items,x.id))}</td>
      <td><button class="btn sm" data-p="${x.id}">Ouvrir</button></td></tr>`).join("")}</tbody></table>`:`<p class="empty">Aucune période. Créez la première période de rémunération.</p>`}</div>
    <div id="pDetail"></div>`;
  v.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{S.periodId=Number(b.dataset.p);rerender()});
  if(canPay())newP.onclick=periodDialog;
  if(p)await periodDetail(document.getElementById("pDetail"),p);
}

function periodDialog(){
  openDialog(`<h3>Nouvelle période de rémunération</h3>
    <label>Nom<input id="nN" required placeholder="Ex. : Novembre 2026"></label>
    <div class="row"><label>Du<input id="nS" type="date" required></label><label>Au<input id="nE" type="date" required></label></div>
    <div class="row"><label>Limite d'émargement<input id="nD" type="date"></label><label>Échéance de régularisation<input id="nR" type="date"></label></div>
    <p class="sub" style="margin:0">La période peut durer un mois, une quinzaine, un semestre ou toute autre durée.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Créer la période</button></div>`,
  async()=>{
    if(nE.value<nS.value)throw new Error("La date de fin doit être postérieure à la date de début.");
    const r=await q(sb.from("pay_periods").insert({name:nN.value.trim(),start_date:nS.value,end_date:nE.value,attendance_deadline:nD.value||null,regularization_deadline:nR.value||null,manager_id:S.user.id}).select().single());
    S.periodId=r.id;toast("Période créée");rerender();
  });
}

async function periodDetail(el,p){
  const frozen=["approuvee","payee"].includes(p.status);
  if(!frozen){
    const [items,pending]=await Promise.all([
      q(sb.from("payroll_items").select("*,teachers(first_name,last_name,teacher_statuses(label))").eq("pay_period_id",p.id).order("session_date")),
      q(sb.from("attendance_records").select("id,status,schedule_sessions!inner(session_date)").in("status",["soumis","correction_demandee"]).gte("schedule_sessions.session_date",p.start_date).lte("schedule_sessions.session_date",p.end_date))]);
    const by=groupBy(items);
    const tot=items.reduce((s,i)=>s+i.amount_fcfa,0);
    el.innerHTML=`<h2>${esc(p.name)}</h2>
      ${pending.length?`<p class="pill p-warn" style="display:inline-block;margin:0 0 12px">${pending.length} émargement(s) de la période ne sont pas encore validés : ils ne seront pas payés dans cette période.</p>`:""}
      ${p.status==="en_verification"?`<p class="sub" style="margin:0 0 12px">Dernier calcul : ${new Date(p.calculated_at).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"})}. Recalculez si de nouveaux émargements ont été validés depuis.</p>`:""}
      ${canPay()?`<div class="row" style="margin-bottom:12px"><button class="btn ${p.status==="ouverte"?"primary":""}" id="calc">${p.status==="ouverte"?"Calculer la paie":"Recalculer"}</button>
        ${p.status==="en_verification"&&items.length?`<button class="btn primary" id="appr">Approuver et générer les bulletins</button>`:""}
        ${p.status==="ouverte"?`<button class="btn danger" id="delP">Supprimer la période</button>`:""}</div>`:""}
      ${items.length?`<div class="stats"><div class="stat"><b>${fcfa(tot)}</b><span>Total brut = net</span></div><div class="stat"><b>${by.length}</b><span>Enseignants</span></div><div class="stat"><b>${items.length}</b><span>Séances payables</span></div></div>
      ${teacherTable(by,false)}`:`<div class="panel"><p class="empty">${p.status==="ouverte"?"Lancez le calcul pour obtenir les montants de la période.":"Aucune heure validée payable dans cette période."}</p></div>`}`;
    if(canPay()){
      calc.onclick=async()=>{try{const r=await q(sb.rpc("calculate_payroll",{p_period:p.id}));
        toast(`${r.lignes} séance(s) payable(s) · ${fcfa(r.total_fcfa)}`+(r.sans_tarif?` · ${r.sans_tarif} sans tarif défini`:""),r.sans_tarif>0);rerender()}catch(e){toast(errMsg(e),true)}};
      document.getElementById("appr")&&(appr.onclick=()=>openDialog(`<h3>Approuver la période ?</h3>
        <p style="margin:0">${by.length} bulletin(s) pour un total de <b>${fcfa(tot)}</b> vont être générés. Après approbation, les montants sont figés et ces séances ne pourront plus être payées dans une autre période.</p>
        ${pending.length?`<p class="sub" style="margin:0">${pending.length} émargement(s) non validé(s) restent en dehors de cette paie.</p>`:""}
        <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Approuver</button></div>`,
        async()=>{const n=await q(sb.rpc("approve_payroll",{p_period:p.id}));toast(`${n} bulletin(s) générés`);rerender()}));
      document.getElementById("delP")&&(delP.onclick=()=>openDialog(`<h3>Supprimer « ${esc(p.name)} » ?</h3><p style="margin:0">La période n'a pas encore été approuvée. Aucune donnée d'émargement ne sera perdue.</p>
        <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn danger" value="ok">Supprimer</button></div>`,
        async()=>{await q(sb.from("pay_periods").delete().eq("id",p.id));S.periodId=null;toast("Période supprimée");rerender()}));
    }
    el.querySelectorAll("[data-dt]").forEach(b=>b.onclick=()=>linesDialog(by.find(o=>o.id==b.dataset.dt)));
    return;
  }
  const [slips,pays]=await Promise.all([
    q(sb.from("payslips").select("*").eq("pay_period_id",p.id).order("number")),
    q(sb.from("payments").select("*,payslips!inner(pay_period_id)").eq("payslips.pay_period_id",p.id).order("paid_on"))]);
  const paid=id=>pays.filter(x=>x.payslip_id===id).reduce((s,x)=>s+x.amount_fcfa,0);
  const tot=slips.reduce((s,x)=>s+x.net_fcfa,0),tp=slips.reduce((s,x)=>s+paid(x.id),0);
  el.innerHTML=`<h2>${esc(p.name)}</h2>
    <p class="sub" style="margin:0 0 12px">Approuvée le ${new Date(p.approved_at).toLocaleString("fr-FR",{dateStyle:"long",timeStyle:"short"})}. Les bulletins ci-dessous sont la version de référence.</p>
    <div class="stats"><div class="stat"><b>${fcfa(tot)}</b><span>Net à payer</span></div><div class="stat"><b>${fcfa(tp)}</b><span>Réglé</span></div>
      <div class="stat"><b style="color:${tot-tp?"var(--warn)":"var(--ok)"}">${fcfa(tot-tp)}</b><span>Reste dû</span></div></div>
    <div class="panel tbl"><table><thead><tr><th>Bulletin</th><th>Enseignant</th><th>Heures</th><th>Net</th><th>Réglé</th><th>État</th><th></th></tr></thead><tbody>
    ${slips.map(s=>`<tr><td class="mono">${esc(s.number)}</td><td>${esc(s.snapshot.enseignant.nom)}<div class="sub">${esc(s.snapshot.enseignant.statut)}</div></td>
      <td class="num">${hrs(s.total_minutes)}</td><td class="num">${fcfa(s.net_fcfa)}</td><td class="num">${fcfa(paid(s.id))}</td><td>${ppill(SLIP,s.status)}</td>
      <td><div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm" data-pdf="${s.id}">PDF</button>${canPay()&&s.status!=="paye"?`<button class="btn primary sm" data-pay="${s.id}">Paiement</button>`:""}</div></td></tr>`).join("")}
    </tbody></table></div>
    ${pays.length?`<h2>Règlements enregistrés</h2><div class="panel tbl"><table><thead><tr><th>Date</th><th>Bulletin</th><th>Mode</th><th>Référence</th><th>Montant</th></tr></thead><tbody>
    ${pays.map(x=>`<tr><td class="mono">${fdl(x.paid_on)}</td><td class="mono">${esc(slips.find(s=>s.id===x.payslip_id)?.number)}</td><td>${esc(x.method)}</td><td class="mono">${esc(x.reference||"—")}</td><td class="num">${fcfa(x.amount_fcfa)}</td></tr>`).join("")}</tbody></table></div>`:""}`;
  el.querySelectorAll("[data-pdf]").forEach(b=>b.onclick=()=>downloadSlip(slips.find(s=>s.id==b.dataset.pdf),pays));
  el.querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>{const s=slips.find(x=>x.id==b.dataset.pay);const due=s.net_fcfa-paid(s.id);
    openDialog(`<h3>Enregistrer un paiement</h3>
      <dl class="kv"><dt>Bulletin</dt><dd class="mono">${esc(s.number)}</dd><dt>Enseignant</dt><dd>${esc(s.snapshot.enseignant.nom)}</dd><dt>Reste dû</dt><dd class="mono">${fcfa(due)}</dd></dl>
      <div class="row"><label>Montant (FCFA)<input id="pA" type="number" min="1" max="${due}" required value="${due}"></label><label>Date<input id="pD" type="date" required value="${iso(new Date())}"></label></div>
      <div class="row"><label>Mode<select id="pM"><option>virement</option><option>Wave</option><option>Orange Money</option><option>chèque</option><option>espèces</option></select></label><label>Référence<input id="pR" placeholder="N° de virement, de transaction…"></label></div>
      <p class="sub" style="margin:0">Le paiement est enregistré par le service financier. Il n'exécute aucun virement.</p>
      <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Enregistrer</button></div>`,
    async()=>{await q(sb.rpc("record_payment",{p_payslip:s.id,p_amount:Number(pA.value),p_paid_on:pD.value,p_method:pM.value,p_reference:pR.value.trim()||null}));toast("Paiement enregistré");rerender()})});
}

function groupBy(items){
  const m={};items.forEach(i=>{m[i.teacher_id]??={id:i.teacher_id,t:i.teachers,lines:[],min:0,amt:0};const o=m[i.teacher_id];o.lines.push(i);o.min+=i.minutes;o.amt+=i.amount_fcfa});
  return Object.values(m).sort((a,b)=>a.t.last_name.localeCompare(b.t.last_name));
}
function teacherTable(by){
  return `<div class="panel tbl"><table><thead><tr><th>Enseignant</th><th>Statut</th><th>Séances</th><th>Heures</th><th>Tarif(s)</th><th>Montant</th><th></th></tr></thead><tbody>
  ${by.map(o=>{const rates=[...new Set(o.lines.map(l=>l.rate_fcfa+(l.rate_source==="individuel"?" (indiv.)":"")))];const catchUp=o.lines.some(l=>l.is_catch_up);
    return `<tr><td>${esc(o.t.first_name+" "+o.t.last_name)}${catchUp?`<div><span class="pill p-info">Rattrapage inclus</span></div>`:""}</td><td>${esc(o.t.teacher_statuses?.label)}</td>
    <td class="num">${o.lines.length}</td><td class="num">${hrs(o.min)}</td><td class="mono">${rates.map(esc).join(" / ")}</td><td class="num"><b>${fcfa(o.amt)}</b></td>
    <td><button class="btn sm" data-dt="${o.id}">Détail</button></td></tr>`}).join("")}</tbody></table></div>`;
}
function linesDialog(o){
  openDialog(`<h3>${esc(o.t.first_name+" "+o.t.last_name)}</h3>
    <div class="tbl"><table><thead><tr><th>Date</th><th>Cours</th><th>Durée</th><th>Tarif</th><th>Montant</th></tr></thead><tbody>
    ${o.lines.map(l=>`<tr><td class="mono">${fdl(l.session_date)}${l.is_catch_up?' <span class="pill p-info">rattrapage</span>':""}</td><td>${esc(l.course_label)}<div class="sub">${esc(l.group_code)}</div></td><td class="num">${hrs(l.minutes)}</td><td class="num">${l.rate_fcfa}${l.rate_source==="individuel"?"*":""}</td><td class="num">${fcfa(l.amount_fcfa)}</td></tr>`).join("")}
    </tbody></table></div><p class="sub" style="margin:0">Montant = durée retenue × tarif horaire en vigueur à la date de la séance. * tarif individuel.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Fermer</button></div>`,async()=>{});
}

function downloadSlip(slip,payments){
  try{
    if(!window.jspdf)throw new Error("Le module PDF n'a pas pu être chargé. Vérifiez la connexion et rechargez la page.");
    const doc=makePayslipPdf(window.jspdf.jsPDF,slip,payments.filter(p=>p.payslip_id===slip.id));
    doc.save(`${slip.number}_${slip.snapshot.enseignant.nom.replace(/\s+/g,"-")}.pdf`);
  }catch(e){toast(errMsg(e),true)}
}

/* ---------- tarifs ---------- */
async function viewRates(v){
  const [statuses,rates,teachers,used]=await Promise.all([
    q(sb.from("teacher_statuses").select("id,code,label").order("id")),
    q(sb.from("hourly_rates").select("*").order("effective_from",{ascending:false})),
    q(sb.from("teachers").select("id,first_name,last_name,status_id").order("last_name")),
    q(sb.from("payroll_items").select("rate_id"))]);
  const usedIds=new Set(used.map(u=>u.rate_id));
  const today=iso(new Date());
  const current=(list)=>list.filter(r=>r.effective_from<=today).sort((a,b)=>b.effective_from.localeCompare(a.effective_from))[0];
  const target=r=>r.status_id?statuses.find(s=>s.id===r.status_id)?.label:(()=>{const t=teachers.find(t=>t.id===r.teacher_id);return t?t.first_name+" "+t.last_name:"?"})();
  const indiv=teachers.filter(t=>rates.some(r=>r.teacher_id===t.id));
  v.innerHTML=`<h1>Tarifs horaires</h1>
    <p class="lead">Le tarif dépend du statut de l'enseignant. Une exception individuelle remplace le tarif du statut. Pour changer un tarif, ajoutez-en un nouveau avec sa date d'effet : l'ancien reste appliqué aux séances antérieures.</p>
    <div class="row" style="justify-content:space-between"><h2 style="margin-top:0">Tarifs en vigueur au ${fdl(today)}</h2>${canPay()?`<button class="btn sm primary" id="addRate">Nouveau tarif</button>`:""}</div>
    <div class="panel tbl"><table><thead><tr><th>Statut</th><th>Tarif horaire</th><th>Depuis le</th><th>Enseignants</th></tr></thead><tbody>
    ${statuses.map(s=>{const c=current(rates.filter(r=>r.status_id===s.id));const next=rates.filter(r=>r.status_id===s.id&&r.effective_from>today).at(-1);
      return `<tr><td>${esc(s.label)}</td><td class="num"><b>${c?fcfa(c.rate_fcfa):"Non défini"}</b>${next?`<div class="sub">${fcfa(next.rate_fcfa)} à partir du ${fdl(next.effective_from)}</div>`:""}</td><td class="mono">${c?fdl(c.effective_from):"—"}</td><td class="num">${teachers.filter(t=>t.status_id===s.id).length}</td></tr>`}).join("")}
    ${indiv.map(t=>{const c=current(rates.filter(r=>r.teacher_id===t.id));return `<tr><td>${esc(t.first_name+" "+t.last_name)} <span class="pill p-info">Individuel</span></td><td class="num"><b>${c?fcfa(c.rate_fcfa):"pas encore en vigueur"}</b></td><td class="mono">${c?fdl(c.effective_from):"—"}</td><td></td></tr>`}).join("")}
    </tbody></table></div>
    <h2>Historique</h2>
    <div class="panel tbl"><table><thead><tr><th>Date d'effet</th><th>S'applique à</th><th>Tarif</th><th>Note</th><th></th></tr></thead><tbody>
    ${rates.map(r=>`<tr><td class="mono">${fdl(r.effective_from)}</td><td>${esc(target(r))}${r.teacher_id?' <span class="pill p-info">Individuel</span>':""}</td><td class="num">${fcfa(r.rate_fcfa)}</td><td class="sub">${esc(r.note||"")}</td>
      <td>${usedIds.has(r.id)?`<span class="sub">Utilisé en paie</span>`:canPay()?`<button class="btn sm danger" data-del="${r.id}">Supprimer</button>`:""}</td></tr>`).join("")}</tbody></table></div>`;
  if(!canPay())return;
  addRate.onclick=()=>openDialog(`<h3>Nouveau tarif horaire</h3>
    <label>S'applique à<select id="rTg"><optgroup label="Statut">${statuses.map(s=>`<option value="s${s.id}">${esc(s.label)}</option>`).join("")}</optgroup>
      <optgroup label="Exception individuelle">${teachers.map(t=>`<option value="t${t.id}">${esc(t.first_name+" "+t.last_name)}</option>`).join("")}</optgroup></select></label>
    <div class="row"><label>Tarif horaire (FCFA)<input id="rAmt" type="number" min="1" step="500" required></label><label>Date d'effet<input id="rFrom" type="date" required value="${today}"></label></div>
    <label>Note<input id="rNote" placeholder="Ex. : décision du conseil du 12/10/2026"></label>
    <p class="sub" style="margin:0">Les séances déjà payées ne sont jamais recalculées.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Enregistrer</button></div>`,
    async()=>{const tg=rTg.value,id=Number(tg.slice(1));
      await q(sb.from("hourly_rates").insert({status_id:tg[0]==="s"?id:null,teacher_id:tg[0]==="t"?id:null,rate_fcfa:Number(rAmt.value),effective_from:rFrom.value,note:rNote.value.trim()||null}));
      toast("Tarif enregistré");rerender()});
  v.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{try{const r=await q(sb.from("hourly_rates").delete().eq("id",b.dataset.del).select());
    if(!r.length)throw new Error("Ce tarif a déjà servi au calcul d'une paie : il ne peut pas être supprimé.");toast("Tarif supprimé");rerender()}catch(e){toast(errMsg(e),true)}});
}

/* ---------- mes bulletins ---------- */
async function viewMyPayslips(v){
  const [slips,pays,unpaid]=await Promise.all([
    q(sb.from("payslips").select("*").eq("teacher_id",S.teacher.id).order("generated_at",{ascending:false})),
    q(sb.from("payments").select("*")),
    q(sb.from("attendance_records").select("retained_minutes").eq("teacher_id",S.teacher.id).eq("status","valide").is("pay_period_id",null))]);
  const paid=id=>pays.filter(x=>x.payslip_id===id).reduce((s,x)=>s+x.amount_fcfa,0);
  const waiting=unpaid.reduce((s,a)=>s+a.retained_minutes,0);
  v.innerHTML=`<h1>Mes bulletins</h1>
    <p class="lead">Vos bulletins de rémunération approuvés. Ils ne sont visibles que par vous et par le service financier.</p>
    <div class="stats"><div class="stat"><b>${slips.length}</b><span>Bulletins</span></div>
      <div class="stat"><b>${fcfa(slips.reduce((s,x)=>s+x.net_fcfa,0))}</b><span>Total net</span></div>
      <div class="stat"><b>${hrs(waiting)}</b><span>Heures validées pas encore payées</span></div></div>
    <div class="panel tbl">${slips.length?`<table><thead><tr><th>Bulletin</th><th>Période</th><th>Heures</th><th>Net à payer</th><th>Réglé</th><th>État</th><th></th></tr></thead><tbody>
    ${slips.map(s=>`<tr><td class="mono">${esc(s.number)}</td><td>${esc(s.snapshot.periode.nom)}<div class="sub mono">${fdl(s.snapshot.periode.debut)} au ${fdl(s.snapshot.periode.fin)}</div></td>
      <td class="num">${hrs(s.total_minutes)}</td><td class="num"><b>${fcfa(s.net_fcfa)}</b></td><td class="num">${fcfa(paid(s.id))}</td><td>${ppill(SLIP,s.status)}</td>
      <td><button class="btn sm primary" data-pdf="${s.id}">Télécharger le PDF</button></td></tr>`).join("")}</tbody></table>`:`<p class="empty">Aucun bulletin pour l'instant. Il apparaîtra ici dès que le service financier aura approuvé une période.</p>`}</div>`;
  v.querySelectorAll("[data-pdf]").forEach(b=>b.onclick=()=>downloadSlip(slips.find(s=>s.id==b.dataset.pdf),pays));
}

/* ---------- journal ---------- */
async function viewAudit(v){
  const rows=await q(sb.from("audit_logs").select("*").order("occurred_at",{ascending:false}).limit(200));
  const ids=[...new Set(rows.map(r=>r.actor).filter(Boolean))];
  const people=ids.length?await q(sb.from("profiles").select("id,full_name").in("id",ids)):[];
  const nm=id=>people.find(p=>p.id===id)?.full_name||"Système";
  const OP={INSERT:"Création",UPDATE:"Modification",DELETE:"Suppression"};
  const TB={attendance_records:"Émargement",schedule_sessions:"Séance",timetable_slots:"Créneau",teaching_assignments:"Affectation",user_roles:"Rôle",teachers:"Enseignant",profiles:"Profil",hourly_rates:"Tarif",pay_periods:"Période de paie",payslips:"Bulletin",payments:"Paiement",teacher_statuses:"Statut"};
  const detail=r=>{if(r.table_name==="attendance_records"&&r.new_data){const o=r.old_data?.status,n=r.new_data.status;return o&&o!==n?`${ATT[o]?.[0]||o} → ${ATT[n]?.[0]||n}`:(ATT[n]?.[0]||"")}
    if(r.table_name==="schedule_sessions"&&r.new_data)return `${r.new_data.session_date} ${hm(r.new_data.start_time)} · ${r.new_data.status}`;
    if(r.table_name==="pay_periods"&&r.new_data)return `${r.new_data.name} · ${PER[r.new_data.status]?.[0]||r.new_data.status}`;
    if(r.table_name==="payslips"&&r.new_data)return `${r.new_data.number} · ${fcfa(r.new_data.net_fcfa)}`;
    if(r.table_name==="payments"&&r.new_data)return `${fcfa(r.new_data.amount_fcfa)} · ${r.new_data.method}`;
    if(r.table_name==="hourly_rates"&&r.new_data)return `${fcfa(r.new_data.rate_fcfa)} dès le ${fdl(r.new_data.effective_from)}`;
    return ""};
  v.innerHTML=`<h1>Journal des opérations</h1><p class="lead">Chaque création, modification ou suppression sensible est enregistrée avec son auteur et l'heure.</p>
    <div class="panel tbl">${rows.length?`<table><thead><tr><th>Date</th><th>Auteur</th><th>Opération</th><th>Élément</th><th>Détail</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td class="mono">${new Date(r.occurred_at).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"})}</td><td>${esc(nm(r.actor))}</td><td>${OP[r.action]||r.action}</td><td>${TB[r.table_name]||r.table_name} <span class="sub mono">#${esc(r.record_id)}</span></td><td>${esc(detail(r))}</td></tr>`).join("")}
    </tbody></table>`:`<p class="empty">Aucune opération enregistrée pour l'instant. Les émargements et validations apparaîtront ici.</p>`}</div>`;
}

sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_OUT")renderLogin()});
boot();
</script>
</body>
</html>
